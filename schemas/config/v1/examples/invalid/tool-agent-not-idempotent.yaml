# ORCH-002, Area 4 amendment 2026-11-01: agent tools are idempotent by construction; idempotent: false is rejected.
schema: https://alphega.io/agentry/schemas/config/tool/v1.json
instance:
  kind: Tool
  version: 1
  schemaVersion: "0.1.0"
  id: ask_writer
  description: Ask the writer persona.
  input: { type: object, required: [q], properties: { q: { type: string } } }
  effect: mutating
  idempotent: false
  binding: { kind: agent, persona: writer@1 }
