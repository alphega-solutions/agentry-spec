# Area 4 amendment 2026-11-01: http bindings take no credentials (the deployment endpoint holds them).
schema: https://alphega.io/agentry/schemas/config/tool/v1.json
instance:
  kind: Tool
  version: 1
  schemaVersion: "0.1.0"
  id: get_weather
  description: Get the weather.
  input: { type: object, required: [q], properties: { q: { type: string } } }
  effect: read
  binding: { kind: http, endpoint: weather, operation: getForecast, credentials: { apiKey: "secret://vault/weather/api-key" } }
# The smallest change that makes the instance valid, so it fails only for the reason above.
repair:
  - { op: remove, path: "/binding/credentials" }
