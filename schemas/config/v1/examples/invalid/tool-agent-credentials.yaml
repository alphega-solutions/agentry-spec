# Area 4 amendment 2026-11-01: agent bindings take no credentials.
schema: https://alphega.io/agentry/schemas/config/tool/v1.json
instance:
  kind: Tool
  version: 1
  schemaVersion: "0.1.0"
  id: ask_writer
  description: Ask the writer persona.
  input: { type: object, required: [q], properties: { q: { type: string } } }
  effect: read
  binding: { kind: agent, persona: writer@1, credentials: { token: "secret://vault/writer/token" } }
