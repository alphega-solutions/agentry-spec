# CFG-010: unversioned references are rejected.
schema: https://alphega.io/agentry/schemas/config/persona/v1.json
instance:
  kind: Persona
  id: assistant
  version: 1
  schemaVersion: "0.1.0"
  instructions: "You are a test assistant."
  tools: []
  defaultProfile: default
  allowedProfiles: [default]
# The smallest change that makes the instance valid, so it fails only for the reason above.
repair:
  - { op: replace, path: "/defaultProfile", value: "default@1" }
  - { op: replace, path: "/allowedProfiles/0", value: "default@1" }
