# TOOL-011, CFG-061: binding credentials take only secret references.
schema: https://alphega.io/agentry/schemas/config/tool/v1.json
instance:
  kind: Tool
  id: search_tickets
  version: 1
  schemaVersion: "0.1.0"
  description: Search support tickets.
  input: { type: object, additionalProperties: false, required: [key], properties: { key: { type: string } } }
  effect: read
  binding: { kind: mcp, server: tickets, tool: search, credentials: { token: "tok-live-0123456789" } }
