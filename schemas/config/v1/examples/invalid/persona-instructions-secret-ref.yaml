# CFG-083: persona instructions contain no secret references.
schema: https://alphega.io/agentry/schemas/config/persona/v1.json
instance:
  kind: Persona
  id: assistant
  version: 1
  schemaVersion: "0.1.0"
  instructions: "Use the key secret://vault/api-key when asked."
  tools: []
  defaultProfile: default@1
  allowedProfiles: [default@1]
# The smallest change that makes the instance valid, so it fails only for the reason above.
repair:
  - { op: replace, path: "/instructions", value: "You are a test assistant." }
