# PROV-020: provider and name are set together.
schema: https://alphega.io/agentry/schemas/config/policy-bundle/v1.json
instance:
  kind: PolicyBundle
  id: org
  version: 1
  schemaVersion: "0.1.0"
  model: { provider: scripted-a }
# The smallest change that makes the instance valid, so it fails only for the reason above.
repair:
  - { op: add, path: "/model/name", value: "model-a" }
