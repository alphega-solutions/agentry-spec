# Area 4 amendment 2026-11-01: mcp bindings take no credentials (the deployment server holds them).
schema: https://alphega.io/agentry/schemas/config/tool/v1.json
instance:
  kind: Tool
  version: 1
  schemaVersion: "0.1.0"
  id: search_tickets
  description: Search support tickets.
  input: { type: object, required: [q], properties: { q: { type: string } } }
  effect: read
  binding: { kind: mcp, server: tickets, tool: search, credentials: { token: "secret://vault/mcp/tickets" } }
# The smallest change that makes the instance valid, so it fails only for the reason above.
repair:
  - { op: remove, path: "/binding/credentials" }
