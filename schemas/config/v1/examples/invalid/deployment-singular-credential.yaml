# CFG-110 as amended 2026-11-01: bindings take secrets only in a
# `credentials` map; the former singular `credential` field is not accepted.
schema: https://alphega.io/agentry/schemas/config/deployment/v1.json
instance:
  kind: Deployment
  id: d
  version: 1
  schemaVersion: "0.1.0"
  environment: prod
  policyBundles: []
  providers:
    - { id: vendor, adapter: vendor, endpoint: "https://api.vendor.example", region: r1, retainsData: false, credential: "secret://vault/vendor-key" }
  ports:
    eventLog: { adapter: memory, region: r1 }
    checkpointStore: { adapter: memory, region: r1 }
    idempotencyStore: { adapter: memory, region: r1 }
    snapshotStore: { adapter: memory, region: r1 }
    blobStore: { adapter: memory, region: r1 }
    auditLog: { adapter: memory, region: r1 }
    secrets: { adapter: memory, region: r1 }
  retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
# The smallest change that makes the instance valid, so it fails only for the reason above.
repair:
  - { op: remove, path: "/providers/0/credential" }
