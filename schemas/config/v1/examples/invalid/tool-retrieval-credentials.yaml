# Area 4 amendment 2026-11-01: retrieval bindings take no credentials.
schema: https://alphega.io/agentry/schemas/config/tool/v1.json
instance:
  kind: Tool
  version: 1
  schemaVersion: "0.1.0"
  id: search_docs
  description: Search the documentation.
  input: { type: object, additionalProperties: false, required: [query], properties: { query: { type: string } } }
  effect: read
  binding: { kind: retrieval, source: docs, credentials: { token: "secret://vault/docs/token" } }
# The smallest change that makes the instance valid, so it fails only for the reason above.
repair:
  - { op: remove, path: "/binding/credentials" }
