# Copy of conformance/shared/baseline/profile-default.yaml.
schema: https://alphega.io/agentry/schemas/config/harness-profile/v1.json
instance:
  kind: HarnessProfile
  id: default
  version: 1
  schemaVersion: "0.1.0"
  idleTtl: PT24H
  suspendedTtl: PT72H
  stepLimit: 8
  deliveryMode: buffered
  budget: { tokens: 100000 }
  timeouts: { run: PT5M, tool: PT30S }
  retry: { unavailable: 2 }
  outputRetryLimit: 2
  limits: { partSize: 1048576, sessionSize: 10485760 }
  defaultAttachmentLabels: []
