$schema: https://json-schema.org/draft/2020-12/schema
$id: https://alphega.io/agentry/schemas/core/event/v1.json
title: Event
description: >-
  Event envelope and payloads (Area 1 §9, as amended by Areas 6–9).
  The event catalog is closed (CORE-170).
type: object
unevaluatedProperties: false
required: [schemaVersion, eventId, sessionId, type, timestamp, tenantId, principalRef, snapshotHash, traceContext, payload]
properties:
  schemaVersion: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/contractVersion" }
  eventId: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/uuidv7" }
  sessionId: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/uuidv7" }
  runId: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/uuidv7" }
  seq: { type: integer, minimum: 1 }
  turn: { type: integer, minimum: 1 }
  step: { type: integer, minimum: 1 }
  type:
    enum:
      - session.created
      - session.closed
      - run.started
      - run.ended
      - turn.started
      - turn.completed
      - model.request
      - model.response
      - model.delta
      - tool.call
      - tool.result
      - hook.decision
      - policy.decision
      - checkpoint.saved
      - escalation.raised
      - escalation.resolved
      - error
      - context.retrieved
      - context.compacted
  timestamp: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/timestamp" }
  tenantId: { type: string, minLength: 1 }
  principalRef: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/principalRef" }
  snapshotHash: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/sha256" }
  traceContext: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/traceContext" }
  provenances:
    description: Union of provenances of content in the payload (CORE-151).
    $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/provenances"
  labels:
    description: Union of sensitivity labels of content in the payload (CORE-151).
    $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/labels"
  payload: { type: object }
  contentRef:
    description: >-
      Present when redaction changed the payload's content (CORE-154): the
      full, unredacted payload content in the BlobStore, from which context is
      reproduced (CTX-001, CTX-003). Tenant-scoped and subject to the same
      sensitivity policies as the content (Area 7 amendment 2026-11-01).
    $ref: "https://alphega.io/agentry/schemas/core/content/v1.json#/$defs/blobRef"
  extensions: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/extensions" }

allOf:
  # seq: required on every persisted event, absent on ephemeral deltas (CORE-160, CORE-162)
  - if: { properties: { type: { const: model.delta } } }
    then: { not: { required: [seq] } }
    else: { required: [seq] }
  # runId: absent only on session.created; on session.closed outside a run
  # (CORE-150, amended); and on the hook.decision and error events of
  # sessionEnd hooks when the session closes outside a run (HOOK-052, Area 5
  # amendment 2026-11-01). A hook.decision without runId is at sessionEnd.
  - if:
      properties: { type: { not: { enum: [session.created, session.closed, hook.decision, error] } } }
    then: { required: [runId] }
  - if:
      required: [type, payload]
      properties: { type: { const: hook.decision }, payload: { not: { properties: { point: { const: sessionEnd } }, required: [point] } } }
    then: { required: [runId] }
  - if: { properties: { type: { const: session.created } } }
    then: { not: { required: [runId] } }
  # position: turn on turn events; turn and step on model and tool events
  - if: { properties: { type: { enum: [turn.started, turn.completed] } } }
    then: { required: [turn] }
  - if: { properties: { type: { enum: [model.request, model.response, tool.call, tool.result] } } }
    then: { required: [turn, step] }
  # context events carry their position (Area 7 amendment 2026-11-01)
  - if: { properties: { type: { const: context.retrieved } } }
    then: { required: [turn] }
  - if: { properties: { type: { const: context.compacted } } }
    then: { required: [turn, step] }
  # events that carry content carry its provenance and labels (CORE-151)
  - if: { properties: { type: { enum: [model.response, tool.call, tool.result, escalation.raised, context.retrieved, context.compacted] } } }
    then: { required: [provenances, labels] }

  - if: { properties: { type: { const: session.created } } }
    then: { properties: { payload: { $ref: "#/$defs/sessionCreated" } } }
  - if: { properties: { type: { const: session.closed } } }
    then: { properties: { payload: { $ref: "#/$defs/sessionClosed" } } }
  - if: { properties: { type: { const: run.started } } }
    then: { properties: { payload: { $ref: "#/$defs/runStarted" } } }
  - if: { properties: { type: { const: run.ended } } }
    then: { properties: { payload: { $ref: "#/$defs/runEnded" } } }
  - if: { properties: { type: { enum: [turn.started, turn.completed] } } }
    then: { properties: { payload: { $ref: "#/$defs/empty" } } }
  - if: { properties: { type: { const: model.request } } }
    then: { properties: { payload: { $ref: "#/$defs/modelRequest" } } }
  - if: { properties: { type: { const: model.response } } }
    then: { properties: { payload: { $ref: "#/$defs/modelResponse" } } }
  - if: { properties: { type: { const: model.delta } } }
    then: { properties: { payload: { $ref: "#/$defs/modelDelta" } } }
  - if: { properties: { type: { const: tool.call } } }
    then: { properties: { payload: { $ref: "#/$defs/toolCall" } } }
  - if: { properties: { type: { const: tool.result } } }
    then: { properties: { payload: { $ref: "#/$defs/toolResultEvent" } } }
  - if: { properties: { type: { const: hook.decision } } }
    then: { properties: { payload: { $ref: "#/$defs/hookDecision" } } }
  - if: { properties: { type: { const: policy.decision } } }
    then: { properties: { payload: { $ref: "#/$defs/policyDecision" } } }
  - if: { properties: { type: { const: checkpoint.saved } } }
    then: { properties: { payload: { $ref: "#/$defs/checkpointSaved" } } }
  - if: { properties: { type: { const: escalation.raised } } }
    then: { properties: { payload: { $ref: "#/$defs/escalationRaised" } } }
  - if: { properties: { type: { const: escalation.resolved } } }
    then: { properties: { payload: { $ref: "#/$defs/escalationResolved" } } }
  - if: { properties: { type: { const: error } } }
    then: { properties: { payload: { $ref: "#/$defs/errorEvent" } } }
  - if: { properties: { type: { const: context.retrieved } } }
    then: { properties: { payload: { $ref: "#/$defs/contextRetrieved" } } }
  - if: { properties: { type: { const: context.compacted } } }
    then: { properties: { payload: { $ref: "#/$defs/contextCompacted" } } }

$defs:
  empty: { type: object, additionalProperties: false, properties: {} }

  sessionCreated:
    type: object
    additionalProperties: false
    required: [persona, profile]
    properties:
      persona: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/artifactRef" }
      profile: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/artifactRef" }
      overrides:
        description: Session-scoped values tightened by the session-creating run request (CFG-101, amended).
        type: object
      parent:
        description: Present for child sessions (ORCH-004).
        type: object
        additionalProperties: false
        required: [sessionId, runId, callId, tool, depth]
        properties:
          sessionId: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/uuidv7" }
          runId: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/uuidv7" }
          callId: { type: string, minLength: 1 }
          tool: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/toolId" }
          depth: { type: integer, minimum: 1 }

  sessionClosed:
    type: object
    additionalProperties: false
    required: [reason]
    properties:
      reason: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/closeReason" }

  runStarted:
    type: object
    additionalProperties: false
    required: [kind]
    properties:
      kind: { enum: [run, resume] }
      overrides:
        description: Run-request values that tightened the profile (CFG-102).
        type: object

  runEnded:
    type: object
    additionalProperties: false
    required: [reason]
    properties:
      reason: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/runEndReason" }
      error: { $ref: "https://alphega.io/agentry/schemas/core/error/v1.json" }
      unrecordedUsage:
        description: Usage of model calls in this run that no other event records, such as a summarizer call during which the budget ran out (CTX-084 as amended).
        $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/usage"
      unrecordedCost:
        description: Cost of the calls counted in `unrecordedUsage`, when priced (PROV-074 as amended).
        $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/cost"
    if: { properties: { reason: { const: failed } } }
    then: { required: [error] }

  modelRequest:
    type: object
    additionalProperties: false
    required: [provider, model, role]
    properties:
      provider: { type: string, minLength: 1 }
      model: { type: string, minLength: 1 }
      role: { enum: [primary, fallback] }
      fallbackReason: { enum: [routing, capability, failover] }
      context:
        description: Reference to the full assembled context, stored in the BlobStore (CORE-154).
        $ref: "https://alphega.io/agentry/schemas/core/content/v1.json#/$defs/blobRef"
    if: { properties: { role: { const: fallback } } }
    then: { required: [fallbackReason] }

  modelResponse:
    type: object
    additionalProperties: false
    required: [provider, model, message, usage]
    properties:
      provider: { type: string, minLength: 1 }
      model: { type: string, minLength: 1 }
      message:
        allOf:
          - $ref: "https://alphega.io/agentry/schemas/core/content/v1.json#/$defs/message"
          - properties: { role: { const: assistant } }
      usage: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/usage" }
      cost: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/cost" }

  modelDelta:
    type: object
    additionalProperties: false
    required: [text]
    properties:
      text: { type: string }

  toolCall:
    type: object
    additionalProperties: false
    required: [callId, tool, arguments]
    properties:
      callId: { type: string, minLength: 1 }
      tool: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/toolId" }
      arguments: { type: object }
      childSessionId:
        description: For agent-bound tools (ORCH-080).
        $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/uuidv7"

  toolResultEvent:
    type: object
    additionalProperties: false
    required: [callId, tool, result]
    properties:
      callId: { type: string, minLength: 1 }
      tool: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/toolId" }
      result: { $ref: "https://alphega.io/agentry/schemas/core/content/v1.json#/$defs/toolResult" }

  hookDecision:
    type: object
    additionalProperties: false
    required: [hook, point, result, inputHash]
    properties:
      hook: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/artifactRef" }
      point: { enum: [sessionStart, beforeModelCall, afterModelCall, beforeToolCall, afterToolCall, beforeResponse, onError, sessionEnd] }
      result: { enum: [annotate, rewrite, block, escalate] }
      reasonCode: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/errorCode" }
      labelsAdded: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/labels" }
      annotations:
        description: For `annotate`, the labels added per part index into the content the hook saw, from which later context assembly reapplies them (CTX-001, Area 7 amendment 2026-11-01).
        type: array
        items: { $ref: "https://alphega.io/agentry/schemas/core/hook/v1.json#/$defs/annotation" }
      inputHash: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/sha256" }
      usage: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/usage" }
      cost: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/cost" }
    dependentRequired: { cost: [usage] }
    allOf:
      - if: { properties: { result: { enum: [block, escalate] } } }
        then: { required: [reasonCode] }
      - if: { properties: { point: { enum: [onError, sessionEnd] } } }
        then: { properties: { result: { const: annotate } } }

  policyDecision:
    type: object
    additionalProperties: false
    required: [kind, outcome]
    properties:
      kind: { enum: [taint, assurance, scope, routing, depth, summarizer] }
      outcome: { enum: [allow, escalate, block, switch] }
      callId: { type: string }
      tool: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/toolId" }
      provenances: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/provenances" }
      reason:
        description: >-
          Why the decision was taken. Required for `scope` decisions (pipeline
          stage 1, TOOL-030 as amended 2026-11-01): `unknown` (no such tool in
          the catalog), `out_of_scope` (in the catalog but outside the
          session's visible set: not in the persona allowlist or the runtime
          scope), or `delegation` (outside a delegated session's visible set
          only because of the caller's visible tools, TOOL-022, ORCH-013). The
          model-facing error is identical in every case (TOOL-023).
        type: string
        minLength: 1
      details: { type: object }
    if: { properties: { kind: { const: scope } } }
    then:
      required: [reason]
      properties: { reason: { enum: [unknown, out_of_scope, delegation] } }

  checkpointSaved:
    type: object
    additionalProperties: false
    required: [version]
    properties:
      version: { type: integer, minimum: 1 }

  escalationRaised:
    description: The escalation record (HITL-010), as in `schemas/core/v1/hitl.yaml`.
    type: object
    additionalProperties: false
    required: [escalation]
    properties:
      escalation: { $ref: "https://alphega.io/agentry/schemas/core/hitl/v1.json#/$defs/escalation" }

  escalationResolved:
    type: object
    additionalProperties: false
    required: [escalationId, decisions]
    properties:
      escalationId: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/uuidv7" }
      decisions:
        description: Every decision ID recorded for the escalation, in recording order (HITL-072 as amended).
        type: array
        minItems: 1
        items: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/uuidv7" }

  errorEvent:
    type: object
    additionalProperties: false
    required: [error]
    properties:
      error: { $ref: "https://alphega.io/agentry/schemas/core/error/v1.json" }
      provider:
        description: For a failed model call, the provider and model called (PROV-065).
        type: string
        minLength: 1
      model: { type: string, minLength: 1 }
      usage:
        description: Usage of a failed model call that reported it (PROV-006, PROV-070).
        $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/usage"
      cost: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/cost" }
    dependentRequired: { model: [provider], provider: [model], usage: [provider], cost: [usage] }

  contextRetrieved:
    description: >-
      One automatic retrieval (CTX-032). Each result is one text part with
      provenance `retrieval:<source>`, stored in full in the BlobStore as its
      JSON (CTX-003), in the order the port returned it. `limit` is the
      effective `retrieval.limit`. An empty `results` still taints (CTX-040).
    type: object
    additionalProperties: false
    required: [source, query, limit, results]
    properties:
      source: { type: string, minLength: 1 }
      query: { type: string }
      limit: { type: integer, minimum: 1 }
      results:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [blob, labels]
          properties:
            blob: { $ref: "https://alphega.io/agentry/schemas/core/content/v1.json#/$defs/blobRef" }
            labels:
              description: The result's stored labels, or the profile's `retrieval.defaultLabels` when it had none (CTX-042).
              $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/labels"

  contextCompacted:
    description: >-
      One compaction (CTX-082). `units` are the droppable units removed or
      replaced, in drop order (CTX-061): an earlier turn `{turn}`, an earlier
      step of the current turn `{turn, step}`, or an earlier summary
      `{summary: <eventId of its context.compacted>}` (CTX-062). For
      `summarize`, `summary` references the summary part's JSON in the
      BlobStore and `usage` is the summarizer's. `fallback` is present when
      a `summarize` compaction fell back to truncation (CTX-085), naming why.
    type: object
    additionalProperties: false
    required: [mode, units, provenances, labels]
    properties:
      mode: { enum: [truncate, summarize] }
      units:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          oneOf:
            - required: [turn]
              not: { required: [summary] }
            - required: [summary]
              not: { anyOf: [{ required: [turn] }, { required: [step] }] }
          dependentRequired: { step: [turn] }
          properties:
            turn: { type: integer, minimum: 1 }
            step: { type: integer, minimum: 1 }
            summary: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/uuidv7" }
      summary: { $ref: "https://alphega.io/agentry/schemas/core/content/v1.json#/$defs/blobRef" }
      provenances: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/provenances" }
      labels: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/labels" }
      usage: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/usage" }
      fallback: { enum: [summarizer_failed, policy_denied] }
      cost: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/cost" }
    allOf:
      - if: { properties: { mode: { const: summarize } } }
        then: { required: [summary, usage], not: { required: [fallback] } }
      - if: { properties: { mode: { const: truncate } } }
        then: { not: { anyOf: [{ required: [summary] }, { required: [cost] }] } }
