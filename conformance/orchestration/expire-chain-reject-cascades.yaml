schemaVersion: "0.1.0"
id: orchestration.expire-chain-reject-cascades
title: When every level of a chain uses onExpiry `reject`, expiry at the chain's earliest suspendedTtl records the rejection on the root escalation, the chain stays suspended, and resume() cascades the rejection to the owning child
description: >-
  The root runs with profile root-reject (suspendedTtl PT72H, onExpiry
  reject); the child persona helper uses child-reject (suspendedTtl PT24H,
  onExpiry reject). The child's update_record is `approval: always`, so
  the child escalates and the root suspends with the mirrored action $act
  (ORCH-060). The strictest onExpiry in the chain is `reject`, and the
  earliest expiry is the child's: both levels' records carry `expiresAt`
  2026-01-02T00:00:00 (ORCH-065, Area 8 amendment 2026-11-02).


  One second before, the root's escalation is listed and $act is
  undecided. At exactly 2026-01-02T00:00:00Z the undecided action receives
  one expiry rejection (`type: reject`, `decidedBy: expiry`, no reviewer,
  stamped with the expiry time), recorded against the root's escalation —
  decisions exist only at the root (ORCH-063) — and audited once
  (HITL-082, HITL-044 as amended). Both sessions remain `suspended`, not
  closed; the root's escalation is no longer listed (HITL-100 as amended),
  and the reviewer view shows the action decided by expiry.


  At 01:00 resume() on the root with no new decisions is accepted. Both
  sessions start a new run at once, from the root down to the owner (Area
  8 amendment, ORCH-064 as settled in review), each emitting `run.started`
  and then `escalation.resolved` listing the expiry rejection; the
  rejection is applied in the owning child: h1 is not dispatched, and the
  child's model receives h1's result as a `policy` error
  `agentry.hitl.rejected` (HITL §7.3); the child responds and closes
  `completed`. The root, which has been waiting in its pending agent call,
  then receives ask_helper's `ok` result `{text}` (ORCH-050 as amended)
  and responds. The start order across sessions is not observable (known
  fixture limits); the return order is, through the shared provider.
  Scripted responses are shared and consumed in call order (commented
  below): 4.
requirements: [ORCH-065, HITL-082]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
      - kind: HarnessProfile
        id: root-reject
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        onExpiry: reject
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
      - kind: HarnessProfile
        id: child-reject
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT24H
        onExpiry: reject
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
      - kind: Persona
        id: helper
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You update records."
        tools: [update_record@1]
        defaultProfile: child-reject@1
        allowedProfiles: [child-reject@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Tool
        id: ask_helper
        version: 1
        schemaVersion: "0.1.0"
        description: Ask the helper persona to update a record.
        input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
        effect: mutating
        binding: { kind: agent, persona: helper@1 }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, ask_helper@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1, root-reject@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        # root, step 1
        - parts: [{ type: tool_call, callId: c1, tool: ask_helper, arguments: { task: "Set k1 to v1" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # child, step 1: escalates (approval always)
        - parts: [{ type: tool_call, callId: h1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # child, step 2 (resume run, after h1's rejection)
        - parts: [{ type: text, text: "The update was not approved." }]
          usage: { inputTokens: 30, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
        # root, step 2 (resume run, after ask_helper's result)
        - parts: [{ type: text, text: "The helper could not update k1." }]
          usage: { inputTokens: 40, outputTokens: 7, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    profile: root-reject@1
    input: [{ type: text, text: "Ask the helper to set k1 to v1" }]
    capture:
      - event: { type: tool.call, payload: { tool: ask_helper } }
        bind: { payload.childSessionId: $child }
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $esc, payload.escalation.pendingActions.0.id: $act }
    expect: { ok: true, endReason: escalated }
  - clock: { set: "2026-01-01T23:59:59Z" }
  - action: getReviewerView
    session: $s
    tenant: t1
    reviewer: r1
    expect:
      ok: true
      view:
        escalation: { id: $esc, expiresAt: { $regex: "^2026-01-02T00:00:00" } }
        actions: [{ pendingActionId: $act, decided: false, decisions: [] }]
  # Exactly the chain's earliest expiry (the child's suspendedTtl).
  - clock: { set: "2026-01-02T00:00:00Z" }
  - action: getReviewerView
    session: $s
    tenant: t1
    reviewer: r1
    expect:
      ok: true
      view:
        escalation: { id: $esc }
        actions:
          - pendingActionId: $act
            decided: true
            decisions:
              - { escalationId: $esc, pendingActionId: $act, type: reject, decidedBy: expiry, reviewer: { $absent: true }, timestamp: { $regex: "^2026-01-02T00:00:00" } }
  - action: listPendingEscalations
    tenant: t1
    expect: { ok: true, escalations: [] }
  - clock: { advance: PT1H }
  - action: resume
    session: $s
    reviewer: r1
    decisions: []
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.call, runId: $r1, payload: { callId: c1, tool: ask_helper, childSessionId: $child } }
          - type: escalation.raised
            runId: $r1
            payload:
              escalation:
                id: $esc
                expiresAt: { $regex: "^2026-01-02T00:00:00" }
                pendingActions: [{ id: $act, delegated: true, chain: [$child], source: approval }]
          - { type: run.ended, runId: $r1, payload: { reason: escalated } }
          - { type: run.started, runId: $r2, timestamp: { $regex: "^2026-01-02T01:00:00" }, payload: { kind: resume } }
          - { type: escalation.resolved, runId: $r2, payload: { escalationId: $esc, decisions: [$dExp] } }
          - { type: tool.result, runId: $r2, payload: { callId: c1, tool: ask_helper, result: { ok: { output: { text: "The update was not approved." } } } } }
          - { type: model.request, runId: $r2, step: 2 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: session.closed }
    $child:
      state: closed
      closeReason: completed
      events:
        mode: subsequence
        items:
          - type: escalation.raised
            runId: $cr1
            payload:
              escalation:
                sessionId: $child
                expiresAt: { $regex: "^2026-01-02T00:00:00" }
                pendingActions: [{ id: $act, delegated: { $absent: true }, callId: h1, tool: update_record }]
          - { type: run.ended, runId: $cr1, payload: { reason: escalated } }
          - { type: run.started, runId: { $all: [$cr2, { $not: $cr1 }] } }
          - { type: escalation.resolved, runId: $cr2, payload: { decisions: [$dExp] } }
          - { type: tool.result, runId: $cr2, payload: { callId: h1, tool: update_record, result: { error: { category: policy, code: agentry.hitl.rejected } } } }
          - { type: model.request, runId: $cr2, step: 2 }
          - { type: run.ended, runId: $cr2, payload: { reason: responded } }
          - { type: session.closed, payload: { reason: completed } }
      absentEvents:
        - { type: tool.call }
        - { type: session.closed, payload: { reason: expired } }
  ports:
    auditLog:
      t1:
        $all:
          - $count: { of: { type: decision }, equals: 1 }
          - $contains:
              - type: decision
                reviewer: { $absent: true }
                timestamp: { $regex: "^2026-01-02T00:00:00" }
                details: { id: $dExp, escalationId: $esc, pendingActionId: $act, type: reject, decidedBy: expiry }
  stubCalls:
    update_record: { count: 0 }
  providerRequests:
    scripted-a:
      - {}
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                - { type: tool_result, callId: h1, result: { error: { category: policy, code: agentry.hitl.rejected } } }
      - messages:
          $contains:
            - role: tool
              parts:
                - { type: tool_result, callId: c1, result: { ok: { output: { text: "The update was not approved." } } } }
