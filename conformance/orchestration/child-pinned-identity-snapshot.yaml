schemaVersion: "0.1.0"
id: orchestration.child-pinned-identity-snapshot
title: A child session is pinned to its parent's principal, tenant and snapshot, even when created after a configuration reload
description: >-
  Turn 1 of the parent (persona `coordinator`) responds without
  delegating. A new configuration is then loaded that replaces helper@1
  with a version whose model is scripted-b/model-b, producing snapshot
  $h2. In turn 2 the parent calls ask_helper, creating the child after the
  reload.


  The child is pinned to the parent's snapshot, not the newest one
  (ORCH-003 with CORE-012 and CFG-052: a new snapshot applies only to
  sessions created after it, and a child is not a new root — it takes its
  parent's snapshot): every child event carries the parent's snapshot hash
  $h, and the child runs helper@1 as that snapshot defines it, calling
  scripted-a/model-a. Every child event also carries the parent's tenant
  and principal reference, and the child's tool context names the parent's
  principal.


  Control: a root session of helper@1 created after the reload carries
  $h2 (≠ $h) and calls scripted-b/model-b.
requirements: [ORCH-003]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Persona
        id: helper
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You look things up."
        tools: [lookup@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Tool
        id: ask_helper
        version: 1
        schemaVersion: "0.1.0"
        description: Ask the helper persona to look something up.
        input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
        effect: read
        binding: { kind: agent, persona: helper@1 }
      - kind: Persona
        id: coordinator
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You coordinate helpers."
        tools: [ask_helper@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, roles: [clerk], assurance: multi_factor }
        - { id: p2, subject: user-2, assurance: multi_factor }
    - id: t2
      principals:
        - { id: q1, subject: user-1, assurance: multi_factor }
  providers:
    scripted-a:
      responses:
        # parent, turn 1 step 1
        - parts: [{ type: text, text: "Hello." }]
          usage: { inputTokens: 10, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
        # parent, turn 2 step 1
        - parts: [{ type: tool_call, callId: c1, tool: ask_helper, arguments: { task: "Find record a" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # child, step 1
        - parts: [{ type: tool_call, callId: h1, tool: lookup, arguments: { key: a } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # child, step 2
        - parts: [{ type: text, text: "Record a holds A." }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # parent, turn 2 step 2
        - parts: [{ type: text, text: "The helper says record a holds A." }]
          usage: { inputTokens: 40, outputTokens: 8, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b:
      responses:
        # control root helper session (new snapshot)
        - parts: [{ type: text, text: "Hello from the new helper." }]
          usage: { inputTokens: 10, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "A" } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: coordinator@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
  - load:
      artifacts:
        - kind: Persona
          id: helper
          version: 1
          schemaVersion: "0.1.0"
          instructions: "You look things up, new edition."
          tools: [lookup@1]
          defaultProfile: default@1
          allowedProfiles: [default@1]
          model: { provider: scripted-b, name: model-b }
    bind: $h2
    expect: { ok: true }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Ask the helper to find record a" }]
    capture:
      - event: { type: tool.call, payload: { callId: c1, tool: ask_helper } }
        bind: { payload.childSessionId: $child }
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $ctl
    tenant: t1
    principal: p1
    persona: helper@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: session.created, tenantId: t1, principalRef: { subject: user-1, tenant: t1 }, snapshotHash: { $all: [$h, { $not: $h2 }] } }
          - { type: tool.call, snapshotHash: $h, payload: { callId: c1, tool: ask_helper, childSessionId: $child } }
    $child:
      events:
        mode: subsequence
        items:
          - { type: session.created, tenantId: t1, principalRef: { subject: user-1, tenant: t1 }, snapshotHash: $h, payload: { persona: helper@1, parent: { sessionId: $s } } }
          - { type: model.request, snapshotHash: $h, payload: { provider: scripted-a, model: model-a } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: model.request, payload: { provider: scripted-b } }
    $ctl:
      events:
        mode: subsequence
        items:
          - { type: session.created, snapshotHash: $h2, payload: { persona: helper@1 } }
          - { type: model.request, snapshotHash: $h2, payload: { provider: scripted-b, model: model-b } }
  ports:
    eventLog:
      t1:
        $child:
          $all:
            - { $not: { $len: 0 } }
            - { $every: { tenantId: t1, principalRef: { subject: user-1, tenant: t1 }, snapshotHash: $h } }
      t2:
        $child: { $absent: true }
  stubCalls:
    lookup:
      - { arguments: { key: a }, context: { sessionId: $child, principal: { subject: user-1, roles: [clerk] } } }
  providerRequests:
    scripted-a: { count: 5 }
    scripted-b: { count: 1 }
