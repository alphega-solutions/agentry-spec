schemaVersion: "0.1.0"
id: orchestration.escalate-resume-cascade
title: Resuming the root applies the decision at the owner, resumes it, then each ancestor in turn, each recording `escalation.resolved`; a later child escalation propagates again
description: >-
  The depth-2 chain of orchestration.escalate-chain-mirrored (root →
  manager → clerk; file_record has `approval: always`). The bundle trusts
  file_record, so no session in the chain is ever tainted and the taint
  rule plays no part.

  Phase 1. The clerk's file_record call escalates; the manager and the root
  suspend with mirrored escalations. resume() on the root with r1's
  approval D1 is accepted and cascades (ORCH-064 as amended 2026-11-02):

  - the clerk (owner) starts a resume run whose first event after
    run.started is escalation.resolved for its own escalation listing
    [D1]; file_record is dispatched with the approved arguments; the clerk
    responds and is closed `completed`;
  - then the manager starts a resume run: escalation.resolved for its
    escalation listing [D1], ask_clerk's tool.result carrying the clerk's
    answer; it responds and is closed `completed`;
  - then the root's resume run: escalation.resolved for its escalation
    listing [D1], ask_manager's tool.result carrying the manager's answer,
    then a root model call.

  The order is observable through the shared scripted provider: after the
  resume, the first model request is the clerk's (it holds file_record's
  result), the next the manager's (it holds the clerk's answer), and only
  then the root's (it holds the manager's answer).

  Phase 2. The root's model now calls ask_manager again, creating a new
  manager and a new clerk; the new clerk's file_record call escalates, and
  the escalation propagates per ORCH-060: the new manager and the root
  suspend with mirrored escalations (new IDs; chain [new manager, new
  clerk] at the root), and the root's resume run ends `escalated`. A second
  resume() with approval D2 cascades the same way and the root responds.

  The new escalation in phase 2 is raised by a new child created after the
  root had resumed. A child that re-escalates during the cascade, before
  its parent has resumed, is not exercised: the spec does not say which
  run its ancestors' new escalations belong to (reported as an ambiguity).
requirements: [ORCH-064]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        trustedTools: [file_record@1]
        sensitivityPolicies:
          pii: { allowedProviders: [scripted-a, scripted-b], redaction: [{ mode: mask }] }
          phi: { allowedProviders: [scripted-a], redaction: [{ mode: mask }] }
      - kind: Tool
        id: file_record
        version: 1
        schemaVersion: "0.1.0"
        description: File a record.
        input: { type: object, additionalProperties: false, required: [key], properties: { key: { type: string } } }
        effect: mutating
        approval: always
        binding: { kind: native, handler: test.file_record }
      - kind: Persona
        id: clerk
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You file records."
        tools: [file_record@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Tool
        id: ask_clerk
        version: 1
        schemaVersion: "0.1.0"
        description: Ask the clerk to file a record.
        input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
        effect: mutating
        binding: { kind: agent, persona: clerk@1 }
      - kind: Persona
        id: manager
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You delegate filing to the clerk."
        tools: [ask_clerk@1, file_record@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Tool
        id: ask_manager
        version: 1
        schemaVersion: "0.1.0"
        description: Ask the manager to get a record filed.
        input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
        effect: mutating
        binding: { kind: agent, persona: manager@1 }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, ask_manager@1, ask_clerk@1, file_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model: { provider: scripted-a, name: model-a }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        # 1. root, step 1
        - parts: [{ type: tool_call, callId: c1, tool: ask_manager, arguments: { task: "File record k1" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # 2. manager 1, step 1
        - parts: [{ type: tool_call, callId: m1, tool: ask_clerk, arguments: { task: "File k1" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # 3. clerk 1, step 1 — escalates
        - parts: [{ type: tool_call, callId: g1, tool: file_record, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # --- resume D1 ---
        # 4. clerk 1, step 2 (resume run)
        - parts: [{ type: text, text: "Filed k1." }]
          usage: { inputTokens: 30, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
        # 5. manager 1, step 2 (resume run)
        - parts: [{ type: text, text: "The clerk filed k1." }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # 6. root, step 2 (resume run)
        - parts: [{ type: tool_call, callId: c2, tool: ask_manager, arguments: { task: "File record k2" } }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # 7. manager 2, step 1
        - parts: [{ type: tool_call, callId: m2, tool: ask_clerk, arguments: { task: "File k2" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # 8. clerk 2, step 1 — escalates
        - parts: [{ type: tool_call, callId: g2, tool: file_record, arguments: { key: k2 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # --- resume D2 ---
        # 9. clerk 2, step 2 (resume run)
        - parts: [{ type: text, text: "Filed k2." }]
          usage: { inputTokens: 30, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
        # 10. manager 2, step 2 (resume run)
        - parts: [{ type: text, text: "The clerk filed k2." }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # 11. root, step 3 (resume run)
        - parts: [{ type: text, text: "Records k1 and k2 are filed." }]
          usage: { inputTokens: 50, outputTokens: 7, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      file_record:
        - ok: { output: { filed: "k1" } }
        - ok: { output: { filed: "k2" } }
      lookup: []
      update_record: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Get records k1 and k2 filed" }]
    capture:
      - event: { type: tool.call, payload: { callId: c1 } }
        bind: { payload.childSessionId: $mgr1 }
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $escRoot1, payload.escalation.pendingActions.0.id: $act1 }
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000c41", pendingActionId: $act1, type: approve }
    capture:
      - event: { type: tool.call, payload: { callId: c2 } }
        bind: { payload.childSessionId: $mgr2 }
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $escRoot2, payload.escalation.pendingActions.0.id: $act2 }
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000c42", pendingActionId: $act2, type: approve }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: ask_manager, childSessionId: $mgr1 } }
          - { type: escalation.raised, payload: { escalation: { id: $escRoot1, pendingActions: [{ id: $act1, delegated: true, chain: [$mgr1, $clerk1] }] } } }
          - { type: run.ended, payload: { reason: escalated } }
          # phase 1 resume run
          - { type: run.started, runId: $rRoot2, payload: { kind: resume } }
          - { type: escalation.resolved, runId: $rRoot2, payload: { escalationId: $escRoot1, decisions: ["01900000-0000-7000-8000-000000000c41"] } }
          - type: tool.result
            runId: $rRoot2
            payload: { callId: c1, tool: ask_manager, result: { ok: { output: { text: "The clerk filed k1." } } } }
          - { type: model.request, runId: $rRoot2, step: 2 }
          - { type: tool.call, runId: $rRoot2, payload: { callId: c2, tool: ask_manager, childSessionId: $mgr2 } }
          - type: escalation.raised
            runId: $rRoot2
            payload:
              escalation:
                id: { $all: [$escRoot2, { $not: $escRoot1 }] }
                runId: $rRoot2
                pendingActions: [{ id: { $all: [$act2, { $not: $act1 }] }, callId: g2, delegated: true, chain: [$mgr2, $clerk2] }]
          - { type: run.ended, runId: $rRoot2, payload: { reason: escalated } }
          # phase 2 resume run
          - { type: run.started, runId: $rRoot3, payload: { kind: resume } }
          - { type: escalation.resolved, runId: $rRoot3, payload: { escalationId: $escRoot2, decisions: ["01900000-0000-7000-8000-000000000c42"] } }
          - type: tool.result
            runId: $rRoot3
            payload: { callId: c2, tool: ask_manager, result: { ok: { output: { text: "The clerk filed k2." } } } }
          - { type: run.ended, runId: $rRoot3, payload: { reason: responded } }
    $mgr1:
      state: closed
      closeReason: completed
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: m1, tool: ask_clerk, childSessionId: $clerk1 } }
          - { type: escalation.raised, payload: { escalation: { id: $escMgr1, pendingActions: [{ id: $act1, delegated: true, chain: [$clerk1] }] } } }
          - { type: run.ended, payload: { reason: escalated } }
          - { type: run.started, payload: { kind: resume } }
          - { type: escalation.resolved, payload: { escalationId: $escMgr1, decisions: ["01900000-0000-7000-8000-000000000c41"] } }
          - { type: tool.result, payload: { callId: m1, tool: ask_clerk, result: { ok: { output: { text: "Filed k1." } } } } }
          - { type: run.ended, payload: { reason: responded } }
          - { type: session.closed, payload: { reason: completed } }
    $clerk1:
      state: closed
      closeReason: completed
      events:
        mode: subsequence
        items:
          - { type: escalation.raised, payload: { escalation: { id: $escClerk1, pendingActions: [{ id: $act1, delegated: { $absent: true } }] } } }
          - { type: run.ended, payload: { reason: escalated } }
          - { type: run.started, payload: { kind: resume } }
          - { type: escalation.resolved, payload: { escalationId: $escClerk1, decisions: ["01900000-0000-7000-8000-000000000c41"] } }
          - { type: tool.call, payload: { callId: g1, tool: file_record, arguments: { key: k1 } } }
          - { type: tool.result, payload: { callId: g1, result: { ok: { output: { filed: "k1" } } } } }
          - { type: run.ended, payload: { reason: responded } }
          - { type: session.closed, payload: { reason: completed } }
    $mgr2:
      state: closed
      closeReason: completed
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: m2, tool: ask_clerk, childSessionId: $clerk2 } }
          - { type: escalation.raised, payload: { escalation: { id: $escMgr2, pendingActions: [{ id: $act2, delegated: true, chain: [$clerk2] }] } } }
          - { type: run.ended, payload: { reason: escalated } }
          - { type: run.started, payload: { kind: resume } }
          - { type: escalation.resolved, payload: { escalationId: $escMgr2, decisions: ["01900000-0000-7000-8000-000000000c42"] } }
          - { type: tool.result, payload: { callId: m2, tool: ask_clerk, result: { ok: { output: { text: "Filed k2." } } } } }
          - { type: run.ended, payload: { reason: responded } }
          - { type: session.closed, payload: { reason: completed } }
    $clerk2:
      state: closed
      closeReason: completed
      events:
        mode: subsequence
        items:
          - { type: escalation.raised, payload: { escalation: { id: $escClerk2, pendingActions: [{ id: $act2, delegated: { $absent: true } }] } } }
          - { type: run.ended, payload: { reason: escalated } }
          - { type: run.started, payload: { kind: resume } }
          - { type: escalation.resolved, payload: { escalationId: $escClerk2, decisions: ["01900000-0000-7000-8000-000000000c42"] } }
          - { type: tool.call, payload: { callId: g2, tool: file_record, arguments: { key: k2 } } }
          - { type: run.ended, payload: { reason: responded } }
          - { type: session.closed, payload: { reason: completed } }
  ports:
    eventLog:
      t1:
        # one escalation.resolved per level per resume
        $clerk1:
          $count: { of: { type: escalation.resolved }, equals: 1 }
        $mgr1:
          $count: { of: { type: escalation.resolved }, equals: 1 }
        $s:
          $all:
            - $count: { of: { type: escalation.resolved }, equals: 2 }
            - $count: { of: { type: run.started, payload: { kind: resume } }, equals: 2 }
            - $count: { of: { type: escalation.raised }, equals: 2 }
  stubCalls:
    file_record:
      - { arguments: { key: k1 }, context: { sessionId: $clerk1 } }
      - { arguments: { key: k2 }, context: { sessionId: $clerk2 } }
  providerRequests:
    scripted-a:
      - {}
      - {}
      - {}
      # 4: the clerk resumes first — its request holds file_record's result
      - messages:
          $contains:
            - role: tool
              parts: [{ type: tool_result, callId: g1, result: { ok: { output: { filed: "k1" } } } }]
      # 5: then the manager — its request holds the clerk's answer
      - messages:
          $contains:
            - role: tool
              parts: [{ type: tool_result, callId: m1, result: { ok: { output: { text: "Filed k1." } } } }]
      # 6: then the root — its request holds the manager's answer
      - messages:
          $contains:
            - role: tool
              parts: [{ type: tool_result, callId: c1, result: { ok: { output: { text: "The clerk filed k1." } } } }]
      - {}
      - {}
      - messages:
          $contains:
            - role: tool
              parts: [{ type: tool_result, callId: g2, result: { ok: { output: { filed: "k2" } } } }]
      - messages:
          $contains:
            - role: tool
              parts: [{ type: tool_result, callId: m2, result: { ok: { output: { text: "Filed k2." } } } }]
      - messages:
          $contains:
            - role: tool
              parts: [{ type: tool_result, callId: c2, result: { ok: { output: { text: "The clerk filed k2." } } } }]
