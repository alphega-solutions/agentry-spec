schemaVersion: "0.1.0"
id: orchestration.child-inherits-taint
title: A child of a tainted parent starts tainted with all of the parent's tainting provenances
description: >-
  ask_helper is a mutating agent tool (its child can reach update_record,
  ORCH-020) declared `onTainted: allow`, so the parent's taint rule lets the
  delegation through (ORCH-024) and the child's own governance is what is
  observed.


  Session 1 (tainted parent): the parent reads lookup (step 1) and chart
  (step 2), both untrusted, so its taint provenances are [tool:lookup,
  tool:chart]. In step 3 it calls ask_helper. The child's first model
  response asks to update_record: the child is tainted from the start
  (ORCH-012), so the call escalates at stage 5 with reason
  agentry.taint.mutating and is not dispatched. The taint decision, the
  escalation's `taintProvenances` and the child's checkpoint all list both
  of the parent's tainting provenances, in order of first entry
  (HOOK-126). This discriminates inheritance from the child merely being
  tainted by its first message, whose provenance is only the least-trusted
  tool:lookup (ORCH-011) and would give [tool:lookup] alone. The parent's
  mirrored escalation lists its own tainting provenances followed by the
  owner's, without duplicates: [tool:lookup, tool:chart] (Area 8
  amendment, "Further readings settled in review", ORCH-060/HITL-010).


  Session 2 (control, untainted parent): the parent calls ask_helper first;
  the child's identical update_record call passes the taint rule and is
  dispatched, and both runs respond.
requirements: [ORCH-012]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: chart
        version: 1
        schemaVersion: "0.1.0"
        description: Read a chart entry.
        input: { type: object, additionalProperties: false, required: [key], properties: { key: { type: string } } }
        effect: read
        binding: { kind: native, handler: test.chart }
      - kind: Persona
        id: helper
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You update records."
        tools: [update_record@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Tool
        id: ask_helper
        version: 1
        schemaVersion: "0.1.0"
        description: Ask the helper persona to update a record.
        input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
        effect: mutating
        onTainted: allow
        binding: { kind: agent, persona: helper@1 }
      - kind: Persona
        id: coordinator
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You coordinate helpers."
        tools: [lookup@1, chart@1, ask_helper@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # session 1: parent, step 1
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # session 1: parent, step 2
        - parts: [{ type: tool_call, callId: c2, tool: chart, arguments: { key: k1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # session 1: parent, step 3
        - parts: [{ type: tool_call, callId: c3, tool: ask_helper, arguments: { task: "Set k1 to v1" } }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # session 1: child, step 1 (escalates on taint)
        - parts: [{ type: tool_call, callId: h1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # session 2: parent, step 1
        - parts: [{ type: tool_call, callId: c1, tool: ask_helper, arguments: { task: "Set k1 to v1" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # session 2: child, step 1 (dispatched)
        - parts: [{ type: tool_call, callId: h1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # session 2: child, step 2
        - parts: [{ type: text, text: "Updated k1." }]
          usage: { inputTokens: 30, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
        # session 2: parent, step 2
        - parts: [{ type: text, text: "The helper updated k1." }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "SYN-LOOKUP-0001" } }
      chart:
        - ok: { output: { entry: "SYN-CHART-0001" } }
      update_record:
        # session 2 only
        - ok: { output: { updated: true } }
script:
  - action: run
    bind: $s1
    tenant: t1
    principal: p1
    persona: coordinator@1
    input: [{ type: text, text: "Read k1, then have the helper set it to v1" }]
    capture:
      - event: { type: tool.call, payload: { callId: c3, tool: ask_helper } }
        bind: { payload.childSessionId: $child1 }
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $s2
    tenant: t1
    principal: p1
    persona: coordinator@1
    input: [{ type: text, text: "Have the helper set k1 to v1" }]
    capture:
      - event: { type: tool.call, payload: { callId: c1, tool: ask_helper } }
        bind: { payload.childSessionId: $child2 }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s1:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c3, tool: ask_helper, childSessionId: $child1 } }
          - type: escalation.raised
            payload:
              escalation:
                sessionId: $s1
                taintProvenances: ["tool:lookup", "tool:chart"]
                pendingActions: [{ source: taint, callId: h1, delegated: true, chain: [$child1] }]
          - { type: run.ended, payload: { reason: escalated } }
    $child1:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: session.created, payload: { persona: helper@1, parent: { sessionId: $s1, callId: c3 } } }
          - { type: model.request, step: 1 }
          - { type: policy.decision, step: 1, payload: { kind: taint, outcome: escalate, callId: h1, tool: update_record, provenances: ["tool:lookup", "tool:chart"] } }
          - type: escalation.raised
            payload:
              escalation:
                sessionId: $child1
                sources: [taint]
                reasonCodes: [agentry.taint.mutating]
                taintProvenances: ["tool:lookup", "tool:chart"]
                pendingActions: [{ source: taint, reasonCode: agentry.taint.mutating, callId: h1, tool: update_record }]
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call, payload: { callId: h1 } }
      checkpoint:
        taint: { tainted: true, provenances: ["tool:lookup", "tool:chart"] }
    $s2:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1, tool: ask_helper, result: { ok: { $any: true } } } }
          - { type: run.ended, payload: { reason: responded } }
    $child2:
      events:
        mode: subsequence
        items:
          - { type: session.created, payload: { persona: helper@1, parent: { sessionId: $s2, callId: c1 } } }
          - { type: tool.call, payload: { callId: h1, tool: update_record } }
          - { type: tool.result, payload: { callId: h1, result: { ok: { output: { updated: true } } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: policy.decision, payload: { kind: taint } }
        - { type: escalation.raised }
  stubCalls:
    lookup: { count: 1 }
    chart: { count: 1 }
    update_record:
      - { arguments: { key: k1, value: v1 }, context: { sessionId: $child2 } }
  providerRequests:
    scripted-a: { count: 8 }
