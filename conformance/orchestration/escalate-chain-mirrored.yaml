schemaVersion: "0.1.0"
id: orchestration.escalate-chain-mirrored
title: An escalation raised two levels down suspends every ancestor with a mirrored escalation; only the root's is listed
description: >-
  A depth-2 chain: the root (assistant) calls ask_manager (persona
  manager), whose child calls ask_clerk (persona clerk), whose child calls
  file_record (`approval: always`). Each persona's allowlist includes the
  tools below it, so delegation narrows nothing (ORCH-013), and both agent
  tools are `mutating` because file_record is reachable (ORCH-020).

  The clerk (the owner, depth 2) raises an ordinary escalation: one
  `tool_call` action, source `approval`, reason `agentry.approval.always`,
  with no `delegated` or `chain`. The manager and the root each raise their
  own escalation (own `id`, `sessionId` and `runId`) holding the same
  action — the same action ID, call, tool and arguments — marked
  `delegated: true`, with `chain` the child session IDs from the nearest
  child down to the owner: [clerk] at the manager, [manager, clerk] at the
  root (ORCH-060 as amended 2026-11-02). Every session in the chain
  emits escalation.raised, checkpoint.saved and run.ended (`escalated`) in
  that order (HITL-003) and is left `suspended`; no agent call in the chain
  gets a tool.result and file_record is not dispatched.

  listPendingEscalations(t1) returns exactly one escalation, the root's
  (ORCH-063): the manager's and the clerk's are never listed.
requirements: [ORCH-060, ORCH-063]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: file_record
        version: 1
        schemaVersion: "0.1.0"
        description: File a record.
        input: { type: object, additionalProperties: false, required: [key], properties: { key: { type: string } } }
        effect: mutating
        approval: always
        binding: { kind: native, handler: test.file_record }
      - kind: Persona
        id: clerk
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You file records."
        tools: [file_record@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Tool
        id: ask_clerk
        version: 1
        schemaVersion: "0.1.0"
        description: Ask the clerk to file a record.
        input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
        effect: mutating
        binding: { kind: agent, persona: clerk@1 }
      - kind: Persona
        id: manager
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You delegate filing to the clerk."
        tools: [ask_clerk@1, file_record@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Tool
        id: ask_manager
        version: 1
        schemaVersion: "0.1.0"
        description: Ask the manager to get a record filed.
        input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
        effect: mutating
        binding: { kind: agent, persona: manager@1 }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, ask_manager@1, ask_clerk@1, file_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model: { provider: scripted-a, name: model-a }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
  providers:
    scripted-a:
      responses:
        # 1. root, step 1
        - parts: [{ type: tool_call, callId: c1, tool: ask_manager, arguments: { task: "File record k1" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # 2. manager (depth 1), step 1
        - parts: [{ type: tool_call, callId: m1, tool: ask_clerk, arguments: { task: "File k1" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # 3. clerk (depth 2), step 1 — escalates (approval: always)
        - parts: [{ type: tool_call, callId: g1, tool: file_record, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      file_record: []
      lookup: []
      update_record: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Get record k1 filed" }]
    capture:
      - event: { type: tool.call, payload: { tool: ask_manager } }
        bind: { payload.childSessionId: $mgr }
      - session: $mgr
        event: { type: tool.call, payload: { tool: ask_clerk } }
        bind: { payload.childSessionId: $clerk }
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $escRoot, payload.escalation.pendingActions.0.id: $act }
    expect: { ok: true, endReason: escalated }
  - action: listPendingEscalations
    tenant: t1
    expect:
      ok: true
      newEvents: 0
      escalations:
        - id: $escRoot
          sessionId: $s
          pendingActions:
            - { id: $act, delegated: true, chain: [$mgr, $clerk] }
expect:
  sessions:
    $s:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: tool.call, runId: $r, payload: { callId: c1, tool: ask_manager, childSessionId: $mgr } }
          - type: escalation.raised
            runId: $r
            payload:
              escalation:
                id: $escRoot
                sessionId: $s
                runId: $r
                sources: [approval]
                reasonCodes: [agentry.approval.always]
                pendingActions:
                  - id: $act
                    kind: tool_call
                    source: approval
                    reasonCode: agentry.approval.always
                    callId: g1
                    tool: file_record
                    arguments: { key: k1 }
                    delegated: true
                    chain: [$mgr, $clerk]
          - { type: checkpoint.saved, runId: $r }
          - { type: run.ended, runId: $r, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.result, payload: { callId: c1 } }
    $mgr:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: session.created, payload: { persona: manager@1, parent: { sessionId: $s, callId: c1, depth: 1 } } }
          - { type: tool.call, runId: $rMgr, payload: { callId: m1, tool: ask_clerk, childSessionId: $clerk } }
          - type: escalation.raised
            runId: $rMgr
            payload:
              escalation:
                id: { $all: [$escMgr, { $not: $escRoot }] }
                sessionId: $mgr
                runId: $rMgr
                pendingActions:
                  - { id: $act, kind: tool_call, source: approval, callId: g1, tool: file_record, arguments: { key: k1 }, delegated: true, chain: [$clerk] }
          - { type: checkpoint.saved, runId: $rMgr }
          - { type: run.ended, runId: $rMgr, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.result, payload: { callId: m1 } }
    $clerk:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: session.created, payload: { persona: clerk@1, parent: { sessionId: $mgr, callId: m1, depth: 2 } } }
          - type: escalation.raised
            runId: $rClerk
            payload:
              escalation:
                id: { $all: [{ $not: $escRoot }, { $not: $escMgr }] }
                sessionId: $clerk
                runId: { $all: [$rClerk, { $not: $rMgr }, { $not: $r }] }
                pendingActions:
                  - { id: $act, kind: tool_call, source: approval, callId: g1, tool: file_record, delegated: { $absent: true }, chain: { $absent: true } }
          - { type: checkpoint.saved, runId: $rClerk }
          - { type: run.ended, runId: $rClerk, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call, payload: { callId: g1 } }
        - { type: tool.result, payload: { callId: g1 } }
  stubCalls:
    file_record: { count: 0 }
  providerRequests:
    scripted-a: { count: 3 }
