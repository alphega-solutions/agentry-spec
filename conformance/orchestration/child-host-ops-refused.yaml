schemaVersion: "0.1.0"
id: orchestration.child-host-ops-refused
title: Every host operation on a child session is refused with conflict (agentry.delegation.child_session)
description: >-
  The parent calls ask_helper; the child calls update_record, whose
  `approval: always` escalates (source `approval`). The child suspends and
  the parent suspends with the mirrored action (ORCH-060), so the child is
  open — not closed — and CORE-022's closed-session conflict cannot be what
  answers.


  The host then calls, on the child session: `getReviewerView`, `run`,
  `decide`, `resume`, `close` and `cancel`. Each is refused with category
  `conflict` and code `agentry.delegation.child_session` (ORCH-006 as
  amended 2026-11-02) and persists nothing; the child stays suspended.


  Control: `getReviewerView` and `decide` on the root, with the same
  reviewer and the same pending action ID, are accepted.
requirements: [ORCH-006]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
      - kind: Persona
        id: helper
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You update records."
        tools: [update_record@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Tool
        id: ask_helper
        version: 1
        schemaVersion: "0.1.0"
        description: Ask the helper persona to update a record.
        input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
        effect: mutating
        binding: { kind: agent, persona: helper@1 }
      - kind: Persona
        id: coordinator
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You coordinate helpers."
        tools: [ask_helper@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, roles: [reviewer], assurance: multi_factor }
  providers:
    scripted-a:
      responses:
        # parent, step 1
        - parts: [{ type: tool_call, callId: c1, tool: ask_helper, arguments: { task: "Set k1 to v1" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # child, step 1 (escalates for approval)
        - parts: [{ type: tool_call, callId: h1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: coordinator@1
    input: [{ type: text, text: "Have the helper set k1 to v1" }]
    capture:
      - event: { type: tool.call, payload: { callId: c1, tool: ask_helper } }
        bind: { payload.childSessionId: $child }
      - event: { type: escalation.raised }
        bind: { payload.escalation.pendingActions.0.id: $act }
    expect: { ok: true, endReason: escalated }
  - action: getReviewerView
    session: $child
    tenant: t1
    reviewer: r1
    expect: { ok: false, error: { category: conflict, code: agentry.delegation.child_session }, newEvents: 0 }
  - action: run
    session: $child
    principal: p1
    input: [{ type: text, text: "Carry on" }]
    expect: { ok: false, error: { category: conflict, code: agentry.delegation.child_session }, newEvents: 0 }
  - action: decide
    session: $child
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-0000000000d1", pendingActionId: $act, type: approve }
    expect: { ok: false, error: { category: conflict, code: agentry.delegation.child_session }, newEvents: 0 }
  - action: resume
    session: $child
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-0000000000d2", pendingActionId: $act, type: approve }
    expect: { ok: false, error: { category: conflict, code: agentry.delegation.child_session }, newEvents: 0 }
  - action: close
    session: $child
    expect: { ok: false, error: { category: conflict, code: agentry.delegation.child_session }, newEvents: 0 }
  - action: cancel
    session: $child
    expect: { ok: false, error: { category: conflict, code: agentry.delegation.child_session }, newEvents: 0 }
  # controls on the root
  - action: getReviewerView
    session: $s
    tenant: t1
    reviewer: r1
    expect:
      ok: true
      view: { escalation: { sessionId: $s, pendingActions: [{ id: $act }] } }
  - action: decide
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-0000000000d3", pendingActionId: $act, type: approve }
    expect: { ok: true }
expect:
  sessions:
    $s:
      state: suspended
    $child:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: session.created, payload: { persona: helper@1, parent: { sessionId: $s, callId: c1 } } }
          - { type: escalation.raised, payload: { escalation: { sessionId: $child, pendingActions: [{ source: approval, callId: h1 }] } } }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: session.closed }
        - { type: escalation.resolved }
        - { type: run.started, payload: { kind: resume } }
        - { type: tool.call, payload: { callId: h1 } }
  ports:
    eventLog:
      t1:
        $child:
          $count: { of: { type: run.started }, equals: 1 }
  stubCalls:
    update_record: { count: 0 }
  providerRequests:
    scripted-a: { count: 2 }
