schemaVersion: "0.1.0"
id: orchestration.child-default-profile
title: A child session runs under its persona's default profile, not its parent's
description: >-
  helper@1 declares `defaultProfile: helper-profile@1` (stepLimit 1) and
  also allows default@1 (stepLimit 8). The parent `coordinator` runs under
  default@1, named explicitly in its run request. The child has no run
  request (CFG-100 does not apply) and so takes its persona's default
  profile, not the parent's or the one the host named (ORCH-005):

  - its `session.created` records profile helper-profile@1;
  - after its first step (a lookup, dispatched), a second step would
    exceed stepLimit 1, so it is not started and the child's run ends
    `step_limit` (CORE-083) — the parent receives ask_helper's result as
    `unavailable` `agentry.delegation.limit`.

  Control: the parent itself, under default@1, goes on to take three
  steps and responds.
requirements: [ORCH-005]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: HarnessProfile
        id: helper-profile
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 1
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        limits: { partSize: 1048576, sessionSize: 10485760 }
      - kind: Persona
        id: helper
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You look things up."
        tools: [lookup@1]
        defaultProfile: helper-profile@1
        allowedProfiles: [helper-profile@1, default@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Tool
        id: ask_helper
        version: 1
        schemaVersion: "0.1.0"
        description: Ask the helper persona to look something up.
        input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
        effect: read
        binding: { kind: agent, persona: helper@1 }
      - kind: Persona
        id: coordinator
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You coordinate helpers."
        tools: [lookup@1, ask_helper@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # parent, step 1
        - parts: [{ type: tool_call, callId: c1, tool: ask_helper, arguments: { task: "Find records a and b" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # child, step 1 (its only step under helper-profile@1)
        - parts: [{ type: tool_call, callId: h1, tool: lookup, arguments: { key: a } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # parent, step 2
        - parts: [{ type: tool_call, callId: c2, tool: lookup, arguments: { key: b } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # parent, step 3
        - parts: [{ type: text, text: "The helper ran out of steps; record b holds B." }]
          usage: { inputTokens: 40, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        # child h1
        - ok: { output: { value: "A" } }
        # parent c2
        - ok: { output: { value: "B" } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: coordinator@1
    profile: default@1
    input: [{ type: text, text: "Find records a and b" }]
    capture:
      - event: { type: tool.call, payload: { callId: c1, tool: ask_helper } }
        bind: { payload.childSessionId: $child }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: session.created, payload: { persona: coordinator@1, profile: default@1 } }
          - type: tool.result
            step: 1
            payload:
              callId: c1
              tool: ask_helper
              result: { error: { category: unavailable, code: agentry.delegation.limit, retryable: false } }
          - { type: model.request, step: 3 }
          - { type: run.ended, payload: { reason: responded } }
    $child:
      events:
        mode: subsequence
        items:
          - { type: session.created, payload: { persona: helper@1, profile: helper-profile@1 } }
          - { type: model.request, step: 1 }
          - { type: tool.result, step: 1, payload: { callId: h1, tool: lookup, result: { ok: { $any: true } } } }
          - { type: run.ended, payload: { reason: step_limit } }
      absentEvents:
        - { type: model.request, step: 2 }
  stubCalls:
    lookup:
      - { arguments: { key: a }, context: { sessionId: $child } }
      - { arguments: { key: b }, context: { sessionId: $s } }
  providerRequests:
    scripted-a: { count: 4 }
