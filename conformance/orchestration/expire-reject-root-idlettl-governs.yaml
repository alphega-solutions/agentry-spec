schemaVersion: "0.1.0"
id: orchestration.expire-reject-root-idlettl-governs
title: In a chain under onExpiry `reject`, the root's idleTtl governs the further wait after the expiry rejections; a child with a shorter idleTtl never expires on its own schedule
description: >-
  The root runs with profile root-rej (idleTtl PT48H, suspendedTtl PT72H,
  onExpiry reject); the child persona helper uses child-rej (idleTtl PT1H,
  suspendedTtl PT72H, onExpiry reject). The child's update_record is
  `approval: always`, so the child escalates and the root suspends with
  the mirrored action (ORCH-060). Both chains below start at
  2026-01-01T00:00:00Z, so each chain's escalation expires at
  2026-01-04T00:00:00Z with onExpiry `reject` (ORCH-065): the undecided
  action receives an expiry rejection and the chain stays `suspended`
  (HITL-082).

  The further wait after the expiry rejections is governed by the root's
  idleTtl (PT48H, ending 2026-01-06T00:00:00Z), not the child's (PT1H,
  which would end 2026-01-04T01:00:00Z): descendants never expire on their
  own schedule (Area 8 amendment, "Further readings settled in review",
  ORCH-065/HITL-082).

  - $sA: at 2026-01-05T23:00:00Z — 47 hours after the child's own idleTtl
    would have elapsed — resume() on the root with no new decisions is
    accepted. The child was never closed: its resume run starts then,
    applies the expiry rejection (h1 gets `policy`
    `agentry.hitl.rejected` and is not dispatched), responds and closes
    `completed`; the root receives ask_helper's `ok` result and responds.
  - $sB: no resume() arrives. One second before 2026-01-06T00:00:00Z the
    root's reviewer view is still served. At exactly that time the root
    expires: its child is first cancelled and closed `cancelled`, then the
    root closes `expired` (ORCH-070; amendment: a parent that expires on
    its own after `onExpiry: reject` and a further `idleTtl` cancels its
    descendants first), both stamped 2026-01-06T00:00:00. The child is
    never closed `expired` and nothing closes at 2026-01-04T01:00:00. A
    resume() at that time fails with `conflict`.

  Scripted responses (scripted-a, shared, in call order): 6 — 1 $sA root
  step 1; 2 $sA child step 1 (escalates); 3 $sB root step 1; 4 $sB child
  step 1 (escalates); 5 $sA child step 2 (resume run); 6 $sA root step 2.
  update_record is never dispatched (empty stub list).
requirements: [ORCH-065, ORCH-070]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
      - kind: HarnessProfile
        id: root-rej
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT48H
        suspendedTtl: PT72H
        onExpiry: reject
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
      - kind: HarnessProfile
        id: child-rej
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT1H
        suspendedTtl: PT72H
        onExpiry: reject
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
      - kind: Persona
        id: helper
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You update records."
        tools: [update_record@1]
        defaultProfile: child-rej@1
        allowedProfiles: [child-rej@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Tool
        id: ask_helper
        version: 1
        schemaVersion: "0.1.0"
        description: Ask the helper persona to update a record.
        input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
        effect: mutating
        binding: { kind: agent, persona: helper@1 }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, ask_helper@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1, root-rej@1]
        model: { provider: scripted-a, name: model-a }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        # 1. $sA root, step 1
        - parts: [{ type: tool_call, callId: c1, tool: ask_helper, arguments: { task: "Set k1 to v1" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # 2. $sA child, step 1: escalates (approval always)
        - parts: [{ type: tool_call, callId: h1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # 3. $sB root, step 1
        - parts: [{ type: tool_call, callId: c1, tool: ask_helper, arguments: { task: "Set k2 to v2" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # 4. $sB child, step 1: escalates (approval always)
        - parts: [{ type: tool_call, callId: h1, tool: update_record, arguments: { key: k2, value: v2 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # 5. $sA child, step 2 (resume run, after h1's rejection)
        - parts: [{ type: text, text: "The update was not approved." }]
          usage: { inputTokens: 30, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
        # 6. $sA root, step 2 (resume run)
        - parts: [{ type: text, text: "The helper could not update k1." }]
          usage: { inputTokens: 40, outputTokens: 7, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record: []
script:
  - action: run
    bind: $sA
    tenant: t1
    principal: p1
    persona: assistant@1
    profile: root-rej@1
    input: [{ type: text, text: "Ask the helper to set k1 to v1" }]
    capture:
      - event: { type: tool.call, payload: { tool: ask_helper } }
        bind: { payload.childSessionId: $childA }
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $sB
    tenant: t1
    principal: p1
    persona: assistant@1
    profile: root-rej@1
    input: [{ type: text, text: "Ask the helper to set k2 to v2" }]
    capture:
      - event: { type: tool.call, payload: { tool: ask_helper } }
        bind: { payload.childSessionId: $childB }
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $escB }
    expect: { ok: true, endReason: escalated }
  # Past the chains' expiry (rejections recorded) and past the child's own idleTtl.
  - clock: { set: "2026-01-04T01:00:00Z" }
  - action: getReviewerView
    session: $sB
    tenant: t1
    reviewer: r1
    expect: { ok: true, view: { escalation: { id: $escB }, actions: [{ decided: true, decisions: [{ type: reject, decidedBy: expiry }] }] } }
  # $sA: resume within the root's idleTtl is accepted.
  - clock: { set: "2026-01-05T23:00:00Z" }
  - action: resume
    session: $sA
    reviewer: r1
    decisions: []
    expect: { ok: true, endReason: responded }
  # $sB: one second before expiry + the root's idleTtl, still served.
  - clock: { set: "2026-01-05T23:59:59Z" }
  - action: getReviewerView
    session: $sB
    tenant: t1
    reviewer: r1
    expect: { ok: true, view: { escalation: { id: $escB } } }
  # Exactly expiry + the root's idleTtl: the root expires.
  - clock: { set: "2026-01-06T00:00:00Z" }
  - action: resume
    session: $sB
    reviewer: r1
    decisions: []
    expect: { ok: false, error: { category: conflict } }
expect:
  sessions:
    $sA:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: run.ended, payload: { reason: escalated } }
          - { type: run.started, timestamp: { $regex: "^2026-01-05T23:00:00" }, payload: { kind: resume } }
          - { type: tool.result, payload: { callId: c1, tool: ask_helper, result: { ok: { output: { text: "The update was not approved." } } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: session.closed }
    $childA:
      state: closed
      closeReason: completed
      events:
        mode: subsequence
        items:
          - { type: run.ended, payload: { reason: escalated } }
          - { type: run.started, timestamp: { $regex: "^2026-01-05T23:00:00" }, payload: { kind: resume } }
          - { type: tool.result, payload: { callId: h1, tool: update_record, result: { error: { category: policy, code: agentry.hitl.rejected } } } }
          - { type: run.ended, payload: { reason: responded } }
          - { type: session.closed, timestamp: { $regex: "^2026-01-05T23:00:00" }, payload: { reason: completed } }
      absentEvents:
        - { type: session.closed, payload: { reason: expired } }
        - { type: session.closed, payload: { reason: cancelled } }
    $sB:
      state: closed
      closeReason: expired
      events:
        mode: subsequence
        items:
          - { type: run.ended, payload: { reason: escalated } }
          - { type: session.closed, timestamp: { $regex: "^2026-01-06T00:00:00" }, payload: { reason: expired } }
      absentEvents:
        - { type: tool.result }
        - { type: run.started, payload: { kind: resume } }
    $childB:
      state: closed
      closeReason: cancelled
      events:
        mode: subsequence
        items:
          - { type: run.ended, payload: { reason: escalated } }
          - { type: session.closed, timestamp: { $regex: "^2026-01-06T00:00:00" }, payload: { reason: cancelled } }
      absentEvents:
        - { type: session.closed, payload: { reason: expired } }
        - { type: session.closed, timestamp: { $regex: "^2026-01-04" } }
        - { type: run.started, payload: { kind: resume } }
  stubCalls:
    update_record: { count: 0 }
  providerRequests:
    scripted-a: { count: 6 }
