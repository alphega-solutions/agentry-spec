schemaVersion: "0.1.0"
id: core.hook-annotate-labels-part
title: A hook annotate adds a label to one part only; until then the attachment carries the default labels
description: >-
  The profile's default attachment label is pii. The remote hook at
  sessionStart sees the principal's first input exactly as supplied: the
  text part (index 0, no labels) and the image (index 1, provenance
  attachment:upload, labels [pii]). It annotates part 1 alone with phi. The
  model receives the image labelled pii and phi, and the principal's text
  part still unlabelled.
requirements: [CORE-123, CORE-127]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        remoteHooks:
          - { id: scanner, endpoint: "memory://hook-scanner", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Hook
        id: scanner
        version: 1
        schemaVersion: "0.1.0"
        points: [sessionStart]
        results: [annotate]
        purpose: guardrail
        failureMode: failClosed
        timeoutMs: 1000
        source: { kind: remote, endpoint: "memory://hook-scanner" }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: [pii]
        requiredHooks: [scanner@1]
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { vision: true }
      responses:
        - parts: [{ type: text, text: "A chart." }]
          usage: { inputTokens: 100, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  ports:
    blobStore:
      t1:
        - id: blob-img-1
          hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7"
          mediaType: image/png
          size: 20
          data: "U1lOVEhFVElDLUlNQUdFLTAwMDE="
        - id: blob-file-1
          hash: "sha256:488b66a845535f2173fe026ad21ad4238ca6b733b00a24ba332adab6729a0a80"
          mediaType: text/plain
          size: 44
          data: "U1lOVEhFVElDLUZJTEUtMDAwMTogcXVhcnRlcmx5IHdpZGdldCByZXBvcnQ="
  stubs:
    remoteHooks:
      "memory://hook-scanner":
        - result: annotate
          labels:
            - { part: 1, labels: [phi] }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input:
      - { type: text, text: "What is this?" }
      - { type: image, mediaType: image/png, source: upload, blob: { id: blob-img-1, hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7", mediaType: image/png, size: 20 } }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - type: hook.decision
            payload: { hook: scanner@1, point: sessionStart, result: annotate, labelsAdded: [phi] }
          - { type: model.request }
  stubCalls:
    "memory://hook-scanner":
      - arguments:
          point: sessionStart
          content:
            - { type: text, text: "What is this?", provenance: principal, labels: [] }
            - { type: image, blob: { id: blob-img-1 }, provenance: "attachment:upload", labels: [pii], data: { $absent: true } }
  providerRequests:
    scripted-a:
      - messages:
          $contains:
            - role: principal
              parts:
                - { type: text, text: "What is this?", labels: [] }
                - type: image
                  blob: { id: blob-img-1 }
                  provenance: "attachment:upload"
                  labels: { $all: [{ $contains: [pii, phi] }, { $len: 2 }] }
