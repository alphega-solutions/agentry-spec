schemaVersion: "0.1.0"
id: core.hook-binary-in-place-edit-rejected
title: A hook rewrite that modifies binary content in place is rejected; the blob is unchanged
description: >-
  The fail-closed remote hook at sessionStart returns a rewrite whose image
  part is a well-formed blob reference with no inline data (so CORE-112
  holds), but keeps the original blob ID while claiming a different hash and
  size: an in-place modification of the binary content. Removing or
  replacing the part with a different blob would be allowed; this is not.
  The result is invalid, so the hook has failed and, being failClosed,
  blocks: no model call, no rewrite decision, the stored blob is unchanged,
  and the substituted hash is never persisted.
requirements: [CORE-126]
contract: ">=0.1.0 <1.0.0"
features: []
