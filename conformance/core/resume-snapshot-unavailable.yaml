schemaVersion: "0.1.0"
id: core.resume-snapshot-unavailable
title: resume() fails with `not_found` when the pinned snapshot is gone, without falling back to the current configuration
description: >-
  The session suspends, a different configuration becomes current, and the
  implementation restarts against port contents in which the snapshot store
  is empty. resume() must fail with `not_found`
  (agentry.config.snapshot_unavailable) and must not run the turn on the
  current configuration: no resume run starts and no model or tool is called.
requirements: [CORE-055]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - ok: { output: { updated: true } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $esc, payload.escalation.pendingActions.0.id: $act }
    expect: { ok: true, endReason: escalated }
  - load:
      artifacts:
        - kind: HarnessProfile
          id: extra
          version: 1
          schemaVersion: "0.1.0"
          idleTtl: PT1H
          suspendedTtl: PT1H
          stepLimit: 2
    expect: { ok: true }
  - restart:
      ports:
        snapshotStore: {}
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-0000000000d3", pendingActionId: $act, type: approve }
    expect: { ok: false, error: { category: not_found, code: agentry.config.snapshot_unavailable } }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: escalation.raised, payload: { escalation: { id: $esc, pendingActions: [{ id: $act }] } } }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: run.started, payload: { kind: resume } }
        - { type: tool.call }
  providerRequests:
    scripted-a: { count: 1 }
  stubCalls:
    update_record: { count: 0 }
