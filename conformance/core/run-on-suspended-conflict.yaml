schemaVersion: "0.1.0"
id: core.run-on-suspended-conflict
title: run() on a suspended session fails with `conflict` and leaves it suspended
requirements: [CORE-051]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Never mind" }]
    expect: { ok: false, error: { category: conflict } }
expect:
  sessions:
    $s:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: run.started, runId: $r1, payload: { kind: run } }
          - { type: run.ended, runId: $r1, payload: { reason: escalated } }
      absentEvents:
        - { type: turn.started, turn: 2 }
  providerRequests:
    scripted-a: { count: 1 }
