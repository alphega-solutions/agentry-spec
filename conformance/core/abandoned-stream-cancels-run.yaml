schemaVersion: "0.1.0"
id: core.abandoned-stream-cancels-run
title: Abandoning a run's event stream is treated as cancel()
description: >-
  Both runs use the streamed@1 profile, so the host consumes a live event
  stream. The abandon step arms the runner to stop consuming the event stream of the
  next run on $s after one event (run.started). The run's lookup call hangs
  unless cancelled, so the run cannot finish on its own. The run must end
  `cancelled` exactly as for cancel(): no further model call, a persisted
  checkpoint, and the session closed `cancelled`.
requirements: [CORE-070, CORE-071]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: text, text: "Hello." }]
          usage: { inputTokens: 20, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: a } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - { hang: true }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    profile: streamed@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
  - abandon: { session: $s, afterEvents: 1 }
  - action: run
    session: $s
    principal: p1
    profile: streamed@1
    input: [{ type: text, text: "Look up a" }]
    expect: { ok: true, endReason: cancelled }
expect:
  sessions:
    $s:
      state: closed
      closeReason: cancelled
      events:
        mode: subsequence
        items:
          - { type: run.started, runId: $r2, payload: { kind: run } }
          - { type: run.ended, runId: $r2, payload: { reason: cancelled } }
          - { type: session.closed, payload: { reason: cancelled } }
      absentEvents:
        - { type: model.request, turn: 2, step: 2 }
        - { type: turn.completed, turn: 2 }
      checkpoint: { state: closed }
