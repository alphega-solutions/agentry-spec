    expect: { ok: true, endReason: context_limit }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: turn.started, runId: $r1, turn: 1 }
          - { type: error, runId: $r1, payload: { error: { category: limit, code: agentry.context.overflow } } }
          - { type: run.ended, runId: $r1, payload: { reason: context_limit } }
          - { type: turn.started, runId: $r2, turn: 2 }
          - { type: model.request, runId: $r2, turn: 2, step: 1 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: model.request, turn: 1 }
        - { type: session.closed }
  providerRequests:
    scripted-a: { count: 1 }
    scripted-b: { count: 0 }
