schemaVersion: "0.1.0"
id: core.output-schema-retry-limit
title: When the output retry limit is reached, the run ends failed with agentry.output.schema_mismatch
description: >-
  outputRetryLimit is 2: the initial response and two corrections all fail
  validation, so no fourth call is made. The host's run() is accepted (ok),
  the run ends failed with error code agentry.output.schema_mismatch
  (category fatal) on run.ended, and the session closes (failed).
requirements: [CORE-133]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Persona
        id: extractor
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test extractor
        instructions: "Extract the order as JSON."
        tools: []
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
        outputSchema:
          type: object
          additionalProperties: false
          required: [item, quantity]
          properties:
            item: { type: string }
            quantity: { type: integer, minimum: 1 }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: text, text: "Two widgets." }]
          usage: { inputTokens: 20, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: structured, value: { item: widget, quantity: "two" } }]
          usage: { inputTokens: 20, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: structured, value: { item: widget, quantity: 0 } }]
          usage: { inputTokens: 20, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: extractor@1
    input: [{ type: text, text: "Two widgets, please" }]
    expect: { ok: true, endReason: failed }
expect:
  sessions:
    $s:
      state: closed
      closeReason: failed
      events:
        mode: subsequence
        items:
          - { type: model.request, step: 3 }
          - type: run.ended
            payload:
              reason: failed
              error: { code: agentry.output.schema_mismatch, category: fatal }
      absentEvents:
        - { type: model.request, step: 4 }
  providerRequests:
    scripted-a: { count: 3 }
