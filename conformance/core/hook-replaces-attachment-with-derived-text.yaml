schemaVersion: "0.1.0"
id: core.hook-replaces-attachment-with-derived-text
title: A hook receives an attachment as a blob reference and replaces it with extracted text that inherits its provenance and labels
description: >-
  The required remote hook at sessionStart sees the principal's first input:
  the text part and the file part as a blob reference (no bytes), with
  provenance attachment:upload and the default attachment label pii. It
  rewrites the input, replacing the file part with text extracted from it.
  The extracted text reaches the model with the file part's provenance
  (attachment:upload) and labels ([pii]), not principal, and no file part
  reaches the model.
requirements: [CORE-122, CORE-125, CORE-126]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        remoteHooks:
          - { id: scanner, endpoint: "memory://hook-scanner", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Hook
        id: scanner
        version: 1
        schemaVersion: "0.1.0"
        points: [sessionStart]
        results: [annotate, rewrite]
        purpose: guardrail
        failureMode: failClosed
        timeoutMs: 1000
        source: { kind: remote, endpoint: "memory://hook-scanner" }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: [pii]
        requiredHooks: [scanner@1]
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { documents: true }
      responses:
        - parts: [{ type: text, text: "It is a widget report." }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  ports:
    blobStore:
      t1:
        - id: blob-img-1
          hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7"
          mediaType: image/png
          size: 20
          data: "U1lOVEhFVElDLUlNQUdFLTAwMDE="
        - id: blob-file-1
          hash: "sha256:488b66a845535f2173fe026ad21ad4238ca6b733b00a24ba332adab6729a0a80"
          mediaType: text/plain
          size: 44
          data: "U1lOVEhFVElDLUZJTEUtMDAwMTogcXVhcnRlcmx5IHdpZGdldCByZXBvcnQ="
  stubs:
    remoteHooks:
      "memory://hook-scanner":
        - result: rewrite
          parts:
            - { type: text, text: "Summarise this" }
            - { type: text, text: "SYNTHETIC-FILE-0001: quarterly widget report" }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input:
      - { type: text, text: "Summarise this" }
      - { type: file, mediaType: text/plain, name: report.txt, source: upload, blob: { id: blob-file-1, hash: "sha256:488b66a845535f2173fe026ad21ad4238ca6b733b00a24ba332adab6729a0a80", mediaType: text/plain, size: 44 } }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: scanner@1, point: sessionStart, result: rewrite } }
          - { type: model.request }
  stubCalls:
    "memory://hook-scanner":
      - arguments:
          point: sessionStart
          content:
            - { type: text, text: "Summarise this", provenance: principal, labels: [] }
            - type: file
              mediaType: text/plain
              blob: { id: blob-file-1, hash: "sha256:488b66a845535f2173fe026ad21ad4238ca6b733b00a24ba332adab6729a0a80", mediaType: text/plain, size: 44 }
              provenance: "attachment:upload"
              labels: [pii]
              data: { $absent: true }
  providerRequests:
    scripted-a:
      - messages:
          $contains:
            - role: principal
              parts:
                - { type: text, text: "Summarise this" }
                - { type: text, text: "SYNTHETIC-FILE-0001: quarterly widget report", provenance: "attachment:upload", labels: [pii] }
  ports:
    blobStore:
      t1:
        $contains:
          - { id: blob-file-1, hash: "sha256:488b66a845535f2173fe026ad21ad4238ca6b733b00a24ba332adab6729a0a80", size: 44 }
