schemaVersion: "0.1.0"
id: core.error-message-no-sensitive-content
title: Error messages never contain labelled content, even when the content is the invalid value
description: >-
  The lookup tool labels its results pii and returns an owner value. The
  model then calls update_record with that labelled value as `key`, which
  must match ^k[0-9]+$. A typical schema validator would echo the offending
  value in its message ("'SYN-PII-OWNER-0190' does not match ..."). The
  harness's agentry.tool.invalid_arguments error must not: neither the
  persisted tool.result or error events nor the error delivered to the model
  in the next request may carry the value in an error message. (The value itself is legitimately kept in the
  checkpoint and in redacted event views, so noPersistedContent is not used.)
requirements: [CORE-190]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        sensitivity: [pii]
        binding: { kind: native, handler: test.lookup }
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties:
            key: { type: string, pattern: "^k[0-9]+$" }
            value: { type: string }
        effect: mutating
        idempotent: false
        binding: { kind: native, handler: test.update_record }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: update_record, arguments: { key: "SYN-PII-OWNER-0190", value: v1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "The update was invalid." }]
          usage: { inputTokens: 40, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { owner: "SYN-PII-OWNER-0190" } }
      update_record: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Use the owner of k1 as the key to update" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: contains
        items:
          - type: tool.result
            payload:
              callId: c2
              result:
                error:
                  category: invalid_input
                  code: agentry.tool.invalid_arguments
                  message: { $not: { $regex: "SYN-PII-OWNER" } }
      absentEvents:
        - { payload: { result: { error: { message: { $regex: "SYN-PII-OWNER" } } } } }
        - { payload: { error: { message: { $regex: "SYN-PII-OWNER" } } } }
  providerRequests:
    scripted-a:
      - {}
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                - type: tool_result
                  callId: c2
                  result:
                    error:
                      category: invalid_input
                      message: { $not: { $regex: "SYN-PII-OWNER" } }
  stubCalls:
    update_record: { count: 0 }
