schemaVersion: "0.1.0"
id: core.error-message-no-sensitive-content
title: Error messages never contain labelled content
description: >-
  The lookup tool labels its results `pii`. The model then calls update_record
  with arguments that echo the labelled value but fail validation (an
  unexpected property). The harness's invalid-arguments error must not repeat
  the value in any persisted error message.
requirements: [CORE-190]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        sensitivity: [pii]
        binding: { kind: native, ref: test.lookup }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: update_record, arguments: { key: k1, value: v1, owner: "SYN-PII-OWNER-0190" } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "The update was invalid." }]
          usage: { inputTokens: 40, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { owner: "SYN-PII-OWNER-0190" } }
      update_record: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Copy the owner of k1" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: contains
        items:
          - type: tool.result
            payload: { callId: c2, result: { error: { category: invalid_input, code: agentry.tool.invalid_arguments } } }
      absentEvents:
        - { payload: { result: { error: { message: { $regex: "SYN-PII-OWNER" } } } } }
        - { payload: { error: { message: { $regex: "SYN-PII-OWNER" } } } }
  stubCalls:
    update_record: { count: 0 }
