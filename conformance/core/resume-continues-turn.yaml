schemaVersion: "0.1.0"
id: core.resume-continues-turn
title: A resume continues the suspended turn and its step numbering without a new turn.started
requirements: [CORE-080, CORE-082]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Updated." }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - ok: { output: { updated: true } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $esc, payload.escalation.pendingActions.0.id: $act }
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000001", pendingActionId: $act, type: approve }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: run.started, runId: $r1, payload: { kind: run } }
          - { type: turn.started, runId: $r1, turn: 1 }
          - { type: model.request, runId: $r1, turn: 1, step: 1 }
          - { type: escalation.raised, runId: $r1, turn: 1, step: 1, payload: { escalation: { id: $esc, pendingActions: [{ id: $act, kind: tool_call }] } } }
          - { type: run.ended, runId: $r1, payload: { reason: escalated } }
          - { type: run.started, runId: $r2, payload: { kind: resume } }
          - { type: tool.call, runId: $r2, turn: 1, step: 1, payload: { callId: c1 } }
          - { type: tool.result, runId: $r2, turn: 1, step: 1, payload: { callId: c1 } }
          - { type: model.request, runId: $r2, turn: 1, step: 2 }
          - { type: turn.completed, runId: $r2, turn: 1 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: turn.started, runId: $r2 }
        - { type: turn.started, turn: 2 }
        - { type: turn.completed, runId: $r1 }
