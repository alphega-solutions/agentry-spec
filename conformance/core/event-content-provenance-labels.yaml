schemaVersion: "0.1.0"
id: core.event-content-provenance-labels
title: Events carrying content record that content's provenance and sensitivity labels
description: >-
  The lookup tool labels its results `pii`. The tool.result event carries the
  tool's provenance and the `pii` label; the model.response event carries the
  model's provenance.
requirements: [CORE-151]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        sensitivity: [pii]
        binding: { kind: native, handler: test.lookup }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Found it." }]
          usage: { inputTokens: 30, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "synthetic-value" } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: contains
        items:
          - type: tool.result
            payload: { callId: c1 }
            provenances: { $contains: ["tool:lookup"] }
            labels: { $contains: [pii] }
          - type: model.response
            step: 2
            provenances: { $contains: [model] }
            labels: { $any: true }
