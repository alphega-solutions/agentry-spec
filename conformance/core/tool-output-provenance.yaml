schemaVersion: "0.1.0"
id: core.tool-output-provenance
title: A tool-produced part has provenance `tool:<name>`, carries the tool's labels, and is untrusted
description: >-
  lookup declares sensitivity [pii] and is not in trustedTools. Its result
  reaches the model as provenance tool:lookup with label pii, and taints the
  session, so the following mutating call escalates.
requirements: [CORE-124]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        sensitivity: [pii]
        binding: { kind: native, ref: test.lookup }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: a } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: update_record, arguments: { key: a, value: v } }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "synthetic-value" } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up a, then update it" }]
    expect: { ok: true, endReason: escalated }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: tool.result, provenances: ["tool:lookup"], labels: [pii], payload: { callId: c1, tool: lookup } }
          - { type: policy.decision, payload: { kind: taint, outcome: escalate, callId: c2, provenances: { $contains: ["tool:lookup"] } } }
      absentEvents:
        - { type: tool.call, payload: { callId: c2 } }
  providerRequests:
    scripted-a:
      - { messages: { $any: true } }
      - messages:
          $contains:
            - role: tool
              parts: [{ type: tool_result, callId: c1, provenance: "tool:lookup", labels: [pii] }]
  stubCalls:
    update_record: { count: 0 }
