schemaVersion: "0.1.0"
id: core.suspended-expiry-reject-stays-suspended
title: With onExpiry reject, an expired suspended session stays suspended until resumed, then expires after idleTtl
description: >-
  Amended CORE-020 transition. Both sessions escalate at 2026-01-01T00:00Z and
  their suspendedTtl (PT72H) elapses at 2026-01-04T00:00Z. Neither closes then:
  $a is resumed without further decisions (every action was rejected by
  expiry), runs, and goes idle; $b receives no resume. Each closes
  `expired` only after a further idleTtl (PT24H), at 2026-01-05T00:00Z.
requirements: [CORE-020, CORE-041]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, ref: test.update_record }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        onExpiry: reject
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "The update was not approved." }]
          usage: { inputTokens: 30, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
script:
  - action: run
    bind: $a
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $b
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    expect: { ok: true, endReason: escalated }
  - clock: { advance: PT72H }
  - action: resume
    session: $a
    reviewer: r1
    decisions: []
    expect: { ok: true, endReason: responded }
  - clock: { advance: PT24H }
expect:
  sessions:
    $a:
      state: closed
      closeReason: expired
      events:
        mode: subsequence
        items:
          - { type: run.ended, runId: $a1, payload: { reason: escalated } }
          - { type: run.started, runId: $a2, timestamp: { $regex: "^2026-01-04T00:00:00" }, payload: { kind: resume } }
          - { type: run.ended, runId: $a2, payload: { reason: responded } }
          - { type: session.closed, timestamp: { $regex: "^2026-01-05T00:00:00" }, payload: { reason: expired } }
      absentEvents:
        - { type: tool.call }
    $b:
      state: closed
      closeReason: expired
      events:
        mode: subsequence
        items:
          - { type: run.ended, payload: { reason: escalated } }
          - { type: session.closed, timestamp: { $regex: "^2026-01-05T00:00:00" }, payload: { reason: expired } }
      absentEvents:
        - { type: session.closed, timestamp: { $regex: "^2026-01-04T" } }
  stubCalls:
    update_record: { count: 0 }
