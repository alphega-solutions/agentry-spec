schemaVersion: "0.1.0"
id: core.event-payload-no-secrets
title: A resolved secret used by a tool binding never appears in event payloads
description: >-
  The lookup binding takes its credential from a secret reference. The
  in-memory secrets provider resolves it to a synthetic value
  (setup.secrets), which must not appear in any
  persisted event (or checkpoint or audit record). The secret reference
  itself is not a secret value.
requirements: [CORE-153]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        credentialMode: service
        binding: { kind: native, handler: test.lookup, credentials: { apiKey: "secret://test/lookup-api-key" } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done." }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "synthetic-value" } }
  secrets:
    "secret://test/lookup-api-key": "SYN-SECRET-VALUE-0153-DO-NOT-PERSIST"
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1 } }
          - { type: tool.result, payload: { callId: c1 } }
  stubCalls:
    lookup: { count: 1 }
  noPersistedContent:
    - "SYN-SECRET-VALUE-0153-DO-NOT-PERSIST"
