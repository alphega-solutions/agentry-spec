schemaVersion: "0.1.0"
id: core.order-by-seq-not-timestamp
title: Events with identical timestamps are ordered by seq alone
description: >-
  The virtual clock is never advanced, so every event across two runs carries
  the same timestamp. Event order (and the second run's continuation) must
  follow seq only.
requirements: [CORE-003]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: text, text: "One." }]
          usage: { inputTokens: 20, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Two." }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "First" }]
    expect: { ok: true, endReason: responded }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Second" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: session.created, seq: 1, timestamp: $t }
          - { type: run.started, runId: $r1, timestamp: $t }
          - { type: turn.started, runId: $r1, turn: 1, timestamp: $t }
          - { type: run.ended, runId: $r1, timestamp: $t }
          - { type: run.started, runId: $r2, timestamp: $t }
          - { type: turn.started, runId: $r2, turn: 2, timestamp: $t }
          - { type: run.ended, runId: $r2, timestamp: $t }
  providerRequests:
    scripted-a: { count: 2 }
