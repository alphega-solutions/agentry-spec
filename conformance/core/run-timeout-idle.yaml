schemaVersion: "0.1.0"
id: core.run-timeout-idle
title: Reaching the run wall-clock limit ends the run `timeout` and leaves the session `idle`
description: >-
  The profile sets timeouts.run to PT1M and timeouts.tool to PT10M, so the
  tool timeout cannot fire first. The lookup stub takes two minutes on the
  virtual clock, so the run's wall-clock limit is reached while the call is
  in flight. The run ends timeout, no further model call is made in that
  turn, and the session is idle, so a later run() is accepted and responds.
requirements: [CORE-020, CORE-060, CORE-061]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT1M, tool: PT10M }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: a } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Hello again." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - { ok: { output: { value: "A" } }, delayMs: 120000 }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up a" }]
    expect: { ok: true, endReason: timeout }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.call, runId: $r1, turn: 1, step: 1, payload: { callId: c1 } }
          - { type: run.ended, runId: $r1, payload: { reason: timeout } }
          - { type: turn.started, runId: $r2, turn: 2 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: model.request, turn: 1, step: 2 }
        - { type: session.closed }
  providerRequests:
    scripted-a: { count: 2 }
