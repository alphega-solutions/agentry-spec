schemaVersion: "0.1.0"
id: core.attachment-untrusted
title: An attachment supplied by the principal is untrusted, so it taints the session and a mutating call escalates
description: >-
  The host supplies the file through the `upload` channel, so the part
  carries provenance attachment:upload. No policy bundle lists trusted
  attachment sources, so it is untrusted even though the principal supplied
  it, and the taint decision names that provenance. The same request without
  the attachment is covered by core.content-provenance-system-principal,
  where the mutating call proceeds.
requirements: [CORE-121]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { documents: true }
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  ports:
    blobStore:
      t1:
        - id: blob-file-1
          hash: "sha256:488b66a845535f2173fe026ad21ad4238ca6b733b00a24ba332adab6729a0a80"
          mediaType: text/plain
          size: 44
          data: "U1lOVEhFVElDLUZJTEUtMDAwMTogcXVhcnRlcmx5IHdpZGdldCByZXBvcnQ="
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input:
      - { type: text, text: "Apply the attached instructions" }
      - type: file
        mediaType: text/plain
        name: instructions.txt
        source: upload
        blob: { id: blob-file-1, hash: "sha256:488b66a845535f2173fe026ad21ad4238ca6b733b00a24ba332adab6729a0a80", mediaType: text/plain, size: 44 }
    expect: { ok: true, endReason: escalated }
expect:
  sessions:
    $s:
      state: suspended
      events:
        mode: subsequence
        items:
          - type: policy.decision
            payload:
              kind: taint
              outcome: escalate
              callId: c1
              provenances: { $contains: ["attachment:upload"] }
          - { type: escalation.raised }
      absentEvents:
        - { type: tool.call, payload: { callId: c1 } }
  providerRequests:
    scripted-a:
      - messages:
          $contains:
            - role: principal
              parts:
                $contains:
                  - { type: text, text: "Apply the attached instructions", provenance: principal }
                  - { type: file, blob: { id: blob-file-1 }, provenance: "attachment:upload" }
  stubCalls:
    update_record: { count: 0 }
