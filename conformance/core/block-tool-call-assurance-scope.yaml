schemaVersion: "0.1.0"
id: core.block-tool-call-assurance-scope
title: A failed assurance or scope check skips the tool and returns a `policy` error to the model; the turn continues
description: >-
  Session 1: update_record requires phishing_resistant assurance; the
  principal has multi_factor. Per the 2026-11-01 amendment to CORE-191, this
  produces `policy` (agentry.tool.assurance), never `unauthorized`. Session 2: the host's runtime scope omits
  lookup. In both, the tool is not called and the turn goes on to a second
  model call.
requirements: [CORE-180, CORE-191]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        minAssurance: phishing_resistant
        binding: { kind: native, handler: test.update_record }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Not permitted." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: lookup, arguments: { key: k2 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Not available." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record: []
      lookup: []
script:
  - action: run
    bind: $s1
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $s2
    tenant: t1
    principal: p1
    persona: assistant@1
    runtimeScope: [update_record@1]
    input: [{ type: text, text: "Look up k2" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s1:
      events:
        mode: subsequence
        items:
          - { type: policy.decision, payload: { kind: assurance, outcome: block, callId: c1 } }
          - { type: tool.result, payload: { callId: c1, result: { error: { category: policy, code: agentry.tool.assurance } } } }
          - { type: model.request, step: 2 }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.call }
        - { payload: { result: { error: { category: unauthorized } } } }
        - { type: error, payload: { error: { category: unauthorized } } }
    $s2:
      events:
        mode: subsequence
        items:
          - { type: policy.decision, payload: { kind: scope, outcome: block, callId: c2, reason: out_of_scope } }
          - { type: tool.result, payload: { callId: c2, result: { error: { category: policy } } } }
          - { type: model.request, step: 2 }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.call }
  stubCalls:
    update_record: { count: 0 }
    lookup: { count: 0 }
