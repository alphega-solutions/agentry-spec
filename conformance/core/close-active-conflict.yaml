schemaVersion: "0.1.0"
id: core.close-active-conflict
title: close() on an active session fails with `conflict` and leaves the active run unaffected
description: >-
  close() starts only once the run's tool.call has been persisted
  (startAfter), so the session is active when it arrives. It is refused with
  conflict and persists nothing; the run completes normally and the session
  is idle, not closed.
requirements: [CORE-020]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: text, text: "Hello." }]
          usage: { inputTokens: 20, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: a } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "A is 1." }]
          usage: { inputTokens: 40, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - { ok: { output: { value: "1" } }, delayMs: 1000 }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
  - concurrently:
      - action: run
        session: $s
        principal: p1
        input: [{ type: text, text: "Look up a" }]
        expect: { ok: true, endReason: responded }
      - action: close
        session: $s
        startAfter: { type: tool.call, turn: 2, payload: { callId: c1 } }
        expect: { ok: false, error: { category: conflict }, newEvents: 0 }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.call, runId: $r2, turn: 2, payload: { callId: c1 } }
          - { type: tool.result, runId: $r2, turn: 2, payload: { callId: c1, result: { ok: { output: { value: "1" } } } } }
          - { type: turn.completed, runId: $r2, turn: 2 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: session.closed }
  providerRequests:
    scripted-a: { count: 3 }
  delivered:
    $s: { text: "A is 1." }
