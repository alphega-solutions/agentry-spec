schemaVersion: "0.1.0"
id: core.part-external-url-rejected
title: A part that references an external URL for retrieval is rejected with `invalid_input` and nothing is fetched
description: >-
  The image part is otherwise valid: it carries a media type and a resolvable
  blob reference in the session's tenant, and no inline data. Its only defect
  is the additional external `url` field for retrieval, so the rejection can
  only come from CORE-114. No session is created, no model call is made, and
  the URL is never fetched: the deployment declares the URL's host as an
  HTTP endpoint whose stub records every request.
requirements: [CORE-114]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        httpEndpoints:
          - id: files
            endpoint: "https://files.example.test"
            region: test-region
            operations:
              getChart: { method: GET, path: "/chart.png" }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { vision: true, documents: true }
      responses: []
  ports:
    blobStore:
      t1:
        - id: blob-img-1
          hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7"
          mediaType: image/png
          size: 20
          data: "U1lOVEhFVElDLUlNQUdFLTAwMDE="
  stubs:
    httpEndpoints:
      files:
        getChart: []
script:
  - action: run
    tenant: t1
    principal: p1
    persona: assistant@1
    input:
      - { type: text, text: "Describe this" }
      - type: image
        mediaType: image/png
        source: upload
        blob: { id: blob-img-1, hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7", mediaType: image/png, size: 20 }
        url: "https://files.example.test/chart.png"
    expect: { ok: false, error: { category: invalid_input }, newEvents: 0 }
expect:
  providerRequests:
    scripted-a: { count: 0 }
  stubCalls:
    files/getChart: { count: 0 }
