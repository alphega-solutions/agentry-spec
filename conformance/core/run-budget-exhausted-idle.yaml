schemaVersion: "0.1.0"
id: core.run-budget-exhausted-idle
title: Reaching the token budget ends the run `budget_exhausted` and leaves the session `idle`
description: >-
  The profile's per-turn token budget is 60. Step 1 uses 40 tokens and
  requests a lookup; step 2 uses 50 more (90 in the turn) and requests
  another, so the budget is reached and no third model call is made. The run
  ends budget_exhausted and the session is idle, so a later run() is
  accepted: its new turn has a fresh budget and responds.
requirements: [CORE-020, CORE-060, CORE-061]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 60 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: a } }]
          usage: { inputTokens: 30, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: lookup, arguments: { key: b } }]
          usage: { inputTokens: 40, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Hello again." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "A" } }
        - ok: { output: { value: "B" } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Keep looking things up" }]
    expect: { ok: true, endReason: budget_exhausted }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.request, runId: $r1, turn: 1, step: 2 }
          - { type: run.ended, runId: $r1, payload: { reason: budget_exhausted } }
          - { type: run.started, runId: $r2, payload: { kind: run } }
          - { type: turn.started, runId: $r2, turn: 2 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: model.request, turn: 1, step: 3 }
        - { type: session.closed }
  providerRequests:
    scripted-a: { count: 3 }
