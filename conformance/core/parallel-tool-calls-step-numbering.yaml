schemaVersion: "0.1.0"
id: core.parallel-tool-calls-step-numbering
title: Parallel tool calls share one step; steps restart at 1 in each new turn
requirements: [CORE-081, CORE-082]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { parallelToolCalls: true }
      responses:
        - parts:
            - { type: tool_call, callId: c1, tool: lookup, arguments: { key: a } }
            - { type: tool_call, callId: c2, tool: lookup, arguments: { key: b } }
          usage: { inputTokens: 20, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Both found." }]
          usage: { inputTokens: 40, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Second turn." }]
          usage: { inputTokens: 50, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "A" } }
        - ok: { output: { value: "B" } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up a and b" }]
    expect: { ok: true, endReason: responded }
  - action: run
    session: $s
    tenant: t1
    principal: p1
    input: [{ type: text, text: "Thanks" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: contains
        items:
          - { type: turn.started, runId: $r1, turn: 1 }
          - { type: model.request, runId: $r1, turn: 1, step: 1 }
          - { type: model.response, runId: $r1, turn: 1, step: 1 }
          - { type: tool.call, runId: $r1, turn: 1, step: 1, payload: { callId: c1 } }
          - { type: tool.call, runId: $r1, turn: 1, step: 1, payload: { callId: c2 } }
          - { type: tool.result, runId: $r1, turn: 1, step: 1, payload: { callId: c1 } }
          - { type: tool.result, runId: $r1, turn: 1, step: 1, payload: { callId: c2 } }
          - { type: model.request, runId: $r1, turn: 1, step: 2 }
          - { type: turn.completed, runId: $r1, turn: 1 }
          - { type: turn.started, runId: $r2, turn: 2 }
          - { type: model.request, runId: $r2, turn: 2, step: 1 }
          - { type: turn.completed, runId: $r2, turn: 2 }
      absentEvents:
        - { type: tool.call, step: 2 }
        - { type: model.request, turn: 2, step: 2 }
  stubCalls:
    lookup: { count: 2 }
