schemaVersion: "0.1.0"
id: core.identity-pinned-across-resume
title: Principal, tenant, persona, and snapshot hash do not change across resume()
description: >-
  A new configuration is loaded while the session is suspended, and the
  resume is made by a reviewer. The resume run still carries the session's
  original principal, tenant, and snapshot hash, and the model is called with
  the pinned persona's model.
requirements: [CORE-012]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, ref: test.update_record }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done." }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - ok: { output: { updated: true } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    expect: { ok: true, endReason: escalated }
  - load:
      artifacts:
        - kind: HarnessProfile
          id: extra
          version: 1
          schemaVersion: "0.1.0"
          idleTtl: PT1H
          suspendedTtl: PT1H
          stepLimit: 2
    bind: $h2
    expect: { ok: true }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-0000000000d2", escalationId: $esc, actionId: $act, type: approve }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: session.created, tenantId: t1, principalRef: { subject: user-1, tenant: t1 }, snapshotHash: $h, payload: { persona: assistant@1 } }
          - { type: escalation.raised, payload: { escalation: { id: $esc, pendingActions: [{ id: $act }] } } }
          - { type: run.started, runId: $r2, tenantId: t1, principalRef: { subject: user-1, tenant: t1 }, snapshotHash: $h, payload: { kind: resume } }
          - { type: model.request, runId: $r2, snapshotHash: $h, principalRef: { subject: user-1, tenant: t1 }, payload: { provider: scripted-a, model: model-a } }
          - { type: run.ended, runId: $r2, tenantId: t1, principalRef: { subject: user-1, tenant: t1 }, snapshotHash: $h, payload: { reason: responded } }
      absentEvents:
        - { principalRef: { subject: reviewer-1 } }
