schemaVersion: "0.1.0"
id: core.block-provider-refusal
title: A provider safety refusal returned as an error ends the run `blocked` with the fallback
requirements: [CORE-180, CORE-181, PROV-081]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - error: { category: policy, code: agentry.provider.refused, retryable: false }
    scripted-b: { responses: [] }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: blocked }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.request, step: 1 }
          - { type: run.ended, payload: { reason: blocked } }
  providerRequests:
    scripted-a: { count: 1 }
    scripted-b: { count: 0 }
  delivered:
    $s: { text: "This request was blocked.", fallback: true }
