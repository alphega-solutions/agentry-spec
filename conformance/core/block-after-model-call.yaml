schemaVersion: "0.1.0"
id: core.block-after-model-call
title: A block at afterModelCall discards the model output and ends the run `blocked`
description: >-
  The model returns text and a tool call. The fallback message, not the
  model's text, is delivered (the fallback is not model-generated), and the
  tool call is never dispatched.
requirements: [CORE-180, CORE-181]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Hook
        id: guard-output
        version: 1
        schemaVersion: "0.1.0"
        points: [afterModelCall]
        results: [block]
        timeoutMs: 1000
        source: { kind: rule, when: "content.exists(p, p.type == 'tool_call') || content.exists(p, p.type == 'text' && p.text.contains('SYN-UNSAFE'))", then: { result: block, reasonCode: test.guard.blocked } }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [guard-output@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts:
            - { type: text, text: "SYN-UNSAFE-MODEL-OUTPUT-0180" }
            - { type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    expect: { ok: true, endReason: blocked }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: model.request, step: 1 }
          - { type: hook.decision, payload: { hook: guard-output@1, point: afterModelCall, result: block } }
          - { type: run.ended, payload: { reason: blocked } }
      absentEvents:
        - { type: tool.call }
        - { type: model.request, step: 2 }
  providerRequests:
    scripted-a: { count: 1 }
  stubCalls:
    update_record: { count: 0 }
  delivered:
    $s: { text: "This request was blocked.", fallback: true }
