schemaVersion: "0.1.0"
id: core.seq-gap-free-across-runs
title: Sequence numbers are unique, increasing, and gap-free within a session across runs and a resume
description: >-
  Three runs (run, resume, run) produce at least 21 persisted events. The
  first 21 sequence numbers must all be present, in log order, with no gap,
  so numbering neither restarts per run nor skips. Ephemeral events carry no
  seq, so none of them is matched here.
requirements: [CORE-160]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, ref: test.update_record }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Updated." }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "You're welcome." }]
          usage: { inputTokens: 40, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - ok: { output: { updated: true } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000160", escalationId: $esc, actionId: $act, type: approve }
    expect: { ok: true, endReason: responded }
  - action: run
    session: $s
    tenant: t1
    principal: p1
    input: [{ type: text, text: "Thanks" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { seq: 1, type: session.created }
          - { seq: 2 }
          - { seq: 3 }
          - { seq: 4 }
          - { seq: 5 }
          - { seq: 6 }
          - { seq: 7 }
          - { seq: 8 }
          - { seq: 9 }
          - { seq: 10 }
          - { seq: 11 }
          - { seq: 12 }
          - { seq: 13 }
          - { seq: 14 }
          - { seq: 15 }
          - { seq: 16 }
          - { seq: 17 }
          - { seq: 18 }
          - { seq: 19 }
          - { seq: 20 }
          - { seq: 21 }
      absentEvents:
        - { type: session.created, seq: { $absent: true } }
        - { type: run.started, seq: { $absent: true } }
        - { type: run.ended, seq: { $absent: true } }
        - { type: run.ended, runId: $r3, seq: 1 }
        - { type: run.started, payload: { kind: resume }, seq: 1 }
