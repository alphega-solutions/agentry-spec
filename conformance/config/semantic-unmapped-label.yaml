schemaVersion: "0.1.0"
id: cfg.semantic-unmapped-label
title: A sensitivity label with no sensitivity policy is a configuration error
description: >-
  The policy stack maps `pii` and `phi` only. A label `pci` is introduced
  by a tool's `sensitivity`, a profile's `defaultAttachmentLabels`, and an
  annotate rule hook's labels, one per load; each is rejected with category
  configuration. Using a mapped label in each of the same places loads, and
  once a policy bundle maps `pci`, the same tool loads too.
requirements: [CFG-042]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  stubs:
    tools:
      card_lookup: []
script:
  - load:
      artifacts:
        - { kind: Tool, id: card_lookup, version: 1, schemaVersion: "0.1.0", description: Look up a card record., input: { type: object, additionalProperties: false, required: [key], properties: { key: { type: string } } }, effect: read, sensitivity: [pci], binding: { kind: native, ref: test.card_lookup } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: HarnessProfile, id: default, version: 1, schemaVersion: "0.1.0", idleTtl: PT24H, suspendedTtl: PT72H, stepLimit: 8, defaultAttachmentLabels: [pci] }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: Hook, id: tag-card, version: 1, schemaVersion: "0.1.0", points: [afterToolCall], results: [annotate], timeoutMs: 1000, source: { kind: rule, when: "tool.id == 'lookup'", then: { result: annotate, labels: [pci] } } }
    expect: { ok: false, error: { category: configuration } }
  # Controls: mapped labels in the same places.
  - load:
      artifacts:
        - { kind: Tool, id: card_lookup, version: 1, schemaVersion: "0.1.0", description: Look up a card record., input: { type: object, additionalProperties: false, required: [key], properties: { key: { type: string } } }, effect: read, sensitivity: [pii], binding: { kind: native, ref: test.card_lookup } }
        - { kind: HarnessProfile, id: default, version: 1, schemaVersion: "0.1.0", idleTtl: PT24H, suspendedTtl: PT72H, stepLimit: 8, defaultAttachmentLabels: [phi] }
        - { kind: Hook, id: tag-card, version: 1, schemaVersion: "0.1.0", points: [afterToolCall], results: [annotate], timeoutMs: 1000, source: { kind: rule, when: "tool.id == 'lookup'", then: { result: annotate, labels: [pii] } } }
    expect: { ok: true }
  # Mapping the label makes it usable.
  - load:
      artifacts:
        - kind: PolicyBundle
          id: org
          version: 1
          schemaVersion: "0.1.0"
          instructions: "Follow organisational policy."
          defaultFallbackMessage: "I can't help with that request."
          sensitivityPolicies:
            pii: { allowedProviders: [scripted-a, scripted-b], redaction: [{ mode: mask }] }
            phi: { allowedProviders: [scripted-a], redaction: [{ mode: mask }] }
            pci: { allowedProviders: [scripted-a], redaction: [{ mode: remove }] }
        - { kind: Tool, id: card_lookup, version: 1, schemaVersion: "0.1.0", description: Look up a card record., input: { type: object, additionalProperties: false, required: [key], properties: { key: { type: string } } }, effect: read, sensitivity: [pci], binding: { kind: native, ref: test.card_lookup } }
    expect: { ok: true }
expect: {}
