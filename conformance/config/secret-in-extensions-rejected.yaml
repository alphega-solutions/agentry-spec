schemaVersion: "0.1.0"
id: cfg.secret-in-extensions-rejected
title: A binding's `extensions` must not carry secrets; a secret given there instead of in `credentials` is a configuration error
description: >-
  Provider, port, MCP-server and remote-hook bindings take secrets only in a
  `credentials` map of secret references, and `extensions` must not carry
  secret values (CFG-060; CFG-110 as amended 2026-11-01, "Secrets in
  bindings"). `extensions` is an open, adapter-defined object, so an
  implementation cannot tell an arbitrary literal there from an ordinary
  setting; that half of the rule is an authoring obligation no fixture can
  observe. What a loader can recognise is a value of the secret-reference
  form `secret://<provider>/<name>` (CFG-060), the same form
  `cfg.persona-instructions-secret-rejected` detects in instructions
  (CFG-083): a binding that carries one in `extensions` is taking a secret
  outside `credentials`. Each of these loads is rejected with a
  `configuration` error, and the previous snapshot stays in force:

  - a provider whose `extensions.apiKey` is a secret reference;
  - a port binding whose `extensions` nests a secret reference
    (`{auth: {password: secret://...}}`);
  - a remote hook whose `extensions.token` is a secret reference.

  The control load gives the same bindings their secrets in `credentials`
  and keeps ordinary, non-secret adapter settings in `extensions`; it
  loads.
requirements: [CFG-060, CFG-110]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
script:
  # A secret reference in a provider's extensions.
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false, extensions: { apiKey: "secret://test/provider-a-key" } }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
    expect: { ok: false, error: { category: configuration } }
  # A secret reference nested in a port binding's extensions.
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region, extensions: { auth: { password: "secret://test/event-log-key" } } }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
    expect: { ok: false, error: { category: configuration } }
  # A secret reference in a remote hook's extensions.
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
          remoteHooks:
            - { id: scanner, endpoint: "memory://hook-scanner", region: test-region, extensions: { token: "secret://test/hook-scanner-key" } }
    expect: { ok: false, error: { category: configuration } }
  # Control: secrets in credentials, ordinary settings in extensions.
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false, credentials: { apiKey: "secret://test/provider-a-key" }, extensions: { requestTag: "SYN-TAG-0001" } }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region, credentials: { password: "secret://test/event-log-key" }, extensions: { database: "syn-agentry" } }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
          remoteHooks:
            - { id: scanner, endpoint: "memory://hook-scanner", region: test-region, credentials: { token: "secret://test/hook-scanner-key" }, extensions: { profile: "syn-default" } }
    expect: { ok: true }
expect: {}
