schemaVersion: "0.1.0"
id: cfg.secret-literal-value-rejected
title: A secret field holding anything other than a `secret://` reference is a configuration error
description: >-
  Secret fields (`x-agentry-secret: true`) accept only a reference of the form
  secret://<provider>/<name>. A deployment whose provider credential is a
  literal value, one whose port credential is a reference of the wrong form,
  and a tool binding whose credential is a literal are each rejected. The same
  artifacts with well-formed references load.
requirements: [CFG-060, CFG-061]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
script:
  # Literal value in a provider credential.
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false, credential: "SYN-LITERAL-KEY-0060" }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
    expect: { ok: false, error: { category: configuration } }
  # Reference with no provider segment in a port credential.
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region, credential: "secret://event-log-key" }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
    expect: { ok: false, error: { category: configuration } }
  # Literal value in a tool binding credential.
  - load:
      artifacts:
        - kind: Tool
          id: lookup
          version: 1
          schemaVersion: "0.1.0"
          description: Look up a record by key.
          input:
            type: object
            additionalProperties: false
            required: [key]
            properties: { key: { type: string } }
          effect: read
          credentialMode: service
          binding: { kind: native, ref: test.lookup, credential: "SYN-LITERAL-KEY-0061" }
    expect: { ok: false, error: { category: configuration } }
  # Well-formed references in all three places load.
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false, credential: "secret://test/provider-a-key" }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region, credential: "secret://test/event-log-key" }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
        - kind: Tool
          id: lookup
          version: 1
          schemaVersion: "0.1.0"
          description: Look up a record by key.
          input:
            type: object
            additionalProperties: false
            required: [key]
            properties: { key: { type: string } }
          effect: read
          credentialMode: service
          binding: { kind: native, ref: test.lookup, credential: "secret://test/lookup-api-key" }
    expect: { ok: true }
expect: {}
