schemaVersion: "0.1.0"
id: cfg.semantic-model-provider-disallowed
title: A selected model whose provider is not in the effective allowedProviders is rejected
description: >-
  - The policy bundle allows only scripted-a; the baseline persona's
    fallback model is on scripted-b → rejected.
  - The bundle allows both; the persona narrows its own `allowedProviders`
    to scripted-a but selects scripted-b/model-b as its primary → rejected.
  - The bundle allows only scripted-a and a profile selects a model on
    scripted-b for a persona that sets none and allows only that profile →
    rejected. Every persona × allowed profile combination has a model, so
    the disallowed provider is the only error.
  - The bundle allows only scripted-a and the persona selects
    scripted-a/model-a without fallbacks → accepted.
requirements: [CFG-042]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
script:
  - load:
      artifacts:
        - kind: PolicyBundle
          id: org
          version: 1
          schemaVersion: "0.1.0"
          policyInstructions: "Follow organisational policy."
          defaultFallbackMessage: "I can't help with that request."
          allowedProviders: [scripted-a]
          sensitivityPolicies:
            pii: { allowedProviders: [scripted-a], redaction: [{ mode: mask }] }
            phi: { allowedProviders: [scripted-a], redaction: [{ mode: mask }] }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: Persona, id: assistant, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1, update_record@1], fallbackMessage: "This request was blocked.", defaultProfile: default@1, allowedProfiles: [default@1, streamed@1], allowedProviders: [scripted-a], model: { provider: scripted-b, name: model-b } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - kind: PolicyBundle
          id: org
          version: 1
          schemaVersion: "0.1.0"
          policyInstructions: "Follow organisational policy."
          defaultFallbackMessage: "I can't help with that request."
          allowedProviders: [scripted-a]
          sensitivityPolicies:
            pii: { allowedProviders: [scripted-a], redaction: [{ mode: mask }] }
            phi: { allowedProviders: [scripted-a], redaction: [{ mode: mask }] }
        - { kind: Persona, id: assistant, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1, update_record@1], fallbackMessage: "This request was blocked.", defaultProfile: default@1, allowedProfiles: [default@1] }
        - { kind: HarnessProfile, id: default, version: 1, schemaVersion: "0.1.0", idleTtl: PT24H, suspendedTtl: PT72H, stepLimit: 8, model: { provider: scripted-b, name: model-b } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - kind: PolicyBundle
          id: org
          version: 1
          schemaVersion: "0.1.0"
          policyInstructions: "Follow organisational policy."
          defaultFallbackMessage: "I can't help with that request."
          allowedProviders: [scripted-a]
          sensitivityPolicies:
            pii: { allowedProviders: [scripted-a], redaction: [{ mode: mask }] }
            phi: { allowedProviders: [scripted-a], redaction: [{ mode: mask }] }
        - { kind: Persona, id: assistant, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1, update_record@1], fallbackMessage: "This request was blocked.", defaultProfile: default@1, allowedProfiles: [default@1, streamed@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: true }
expect: {}
