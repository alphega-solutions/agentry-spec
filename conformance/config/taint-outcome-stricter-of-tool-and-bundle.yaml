schemaVersion: "0.1.0"
id: cfg.taint-outcome-stricter-of-tool-and-bundle
title: At run time a tool's taint outcome is the stricter of its own onTainted and the bundle's toolTaintDefaults entry
description: >-
  Both sessions are tainted by an untrusted lookup result before a mutating
  call.

  - `update_record` declares `onTainted: allow`; the bundle sets
    `escalate` for it. The effective outcome is escalate: the call is not
    dispatched and the run ends `escalated`.
  - `archive_record` declares `onTainted: block`; the bundle sets `allow`
    for it. The effective outcome is block: the call is stopped with a
    policy error to the model and the turn continues to a response.
requirements: [CFG-042, CFG-030, HOOK-123]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        onTainted: allow
        binding: { kind: native, handler: test.update_record }
      - kind: Tool
        id: archive_record
        version: 1
        schemaVersion: "0.1.0"
        description: Archive a record.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: mutating
        idempotent: true
        onTainted: block
        binding: { kind: native, handler: test.archive_record }
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        toolTaintDefaults: { update_record@1: escalate, archive_record@1: allow }
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, archive_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # Session 1
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: update_record, arguments: { key: k1, value: v2 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # Session 2
        - parts: [{ type: tool_call, callId: c3, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c4, tool: archive_record, arguments: { key: k1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "That record could not be archived." }]
          usage: { inputTokens: 40, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "synthetic-value" } }
        - ok: { output: { value: "synthetic-value" } }
      update_record: []
      archive_record: []
script:
  - action: run
    bind: $sEscalate
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1, then set it to v2" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $sBlock
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1, then archive it" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sEscalate:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: policy.decision, payload: { kind: taint, outcome: escalate, callId: c2, tool: update_record } }
          - { type: escalation.raised }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call, payload: { callId: c2 } }
    $sBlock:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: policy.decision, payload: { kind: taint, outcome: block, callId: c4, tool: archive_record } }
          - { type: tool.result, payload: { callId: c4, result: { error: { category: policy } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.call, payload: { callId: c4 } }
        - { type: escalation.raised }
  stubCalls:
    update_record: { count: 0 }
    archive_record: { count: 0 }
