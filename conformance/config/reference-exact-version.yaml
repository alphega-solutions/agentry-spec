schemaVersion: "0.1.0"
id: cfg.reference-exact-version
title: References must be exact id@version; unversioned and ranged references are rejected
description: >-
  A new persona `probe@1` references its tool, profile, and hook in turn
  without a version, with a range, or with a non-integer selector; a
  deployment names its policy bundle without a version. Each load fails with
  category configuration. The same persona with exact references loads.
requirements: [CFG-010]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
script:
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup], defaultProfile: default@1, allowedProfiles: [default@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: ["lookup@>=1"], defaultProfile: default@1, allowedProfiles: [default@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: ["lookup@1-2"], defaultProfile: default@1, allowedProfiles: [default@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: ["lookup@latest"], defaultProfile: default@1, allowedProfiles: [default@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: ["lookup@^1"], defaultProfile: default@1, allowedProfiles: [default@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1], defaultProfile: default, allowedProfiles: [default@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1], defaultProfile: default@1, allowedProfiles: ["default@*"], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
    expect: { ok: false, error: { category: configuration } }
  # Positive control: exact references.
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1], defaultProfile: default@1, allowedProfiles: [default@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: true }
expect: {}
