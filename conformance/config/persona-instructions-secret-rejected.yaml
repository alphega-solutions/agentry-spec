schemaVersion: "0.1.0"
id: cfg.persona-instructions-secret-rejected
title: Persona instructions containing a secret reference are rejected
description: >-
  Instructions are model context, so they must never carry secrets. A
  persona whose instructions embed a secret reference is rejected; the same
  instructions without it load.
requirements: [CFG-083]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
script:
  - load:
      artifacts:
        - kind: Persona
          id: assistant
          version: 1
          schemaVersion: "0.1.0"
          instructions: "You are a test assistant. Use the key secret://test/lookup-api-key when calling lookup."
          tools: [lookup@1, update_record@1]
          defaultProfile: default@1
          allowedProfiles: [default@1, streamed@1]
          model: { provider: scripted-a, name: model-a }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - kind: Persona
          id: assistant
          version: 1
          schemaVersion: "0.1.0"
          instructions: "You are a test assistant. Use the lookup tool when needed."
          tools: [lookup@1, update_record@1]
          defaultProfile: default@1
          allowedProfiles: [default@1, streamed@1]
          model: { provider: scripted-a, name: model-a }
    expect: { ok: true }
expect: {}
