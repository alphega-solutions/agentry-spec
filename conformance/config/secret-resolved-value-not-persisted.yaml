schemaVersion: "0.1.0"
id: cfg.secret-resolved-value-not-persisted
title: Resolved secret values never appear in events, errors, checkpoints, or audit records, including on failure
description: >-
  The scripted-a provider and the lookup binding both take credentials by
  secret reference; the in-memory secrets provider resolves them to synthetic
  values. The lookup succeeds, then the provider rejects the next call with a
  fatal credential error, so the run fails and an error is recorded and returned. Neither
  resolved value appears in anything persisted, including the run.ended error.
  The references themselves are not secret values and may appear.
requirements: [CFG-063]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false, credentials: { apiKey: "secret://test/provider-a-key" } }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Tool
        id: lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        credentialMode: service
        binding: { kind: native, handler: test.lookup, credentials: { apiKey: "secret://test/lookup-api-key" } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - error: { category: fatal, code: vendor.invalid_api_key, retryable: false }
    scripted-b: { responses: [] }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "synthetic-value" } }
  secrets:
    "secret://test/provider-a-key": "SYN-SECRET-PROVIDER-0063-DO-NOT-PERSIST"
    "secret://test/lookup-api-key": "SYN-SECRET-LOOKUP-0063-DO-NOT-PERSIST"
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: failed }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1 } }
          - type: run.ended
            payload:
              reason: failed
              error:
                category: fatal
                message: { $not: { $regex: "SYN-SECRET" } }
  stubCalls:
    lookup: { count: 1 }
  noPersistedContent:
    - "SYN-SECRET-PROVIDER-0063-DO-NOT-PERSIST"
    - "SYN-SECRET-LOOKUP-0063-DO-NOT-PERSIST"
