schemaVersion: "0.1.0"
id: cfg.secret-not-in-error-message
title: A tool error whose message echoes the binding's resolved secret is never persisted, returned to the host, or sent to the model with that value
description: >-
  lookup (`credentialMode: service`) takes its credential from
  `secret://test/lookup-api-key`, which the in-memory secrets provider
  resolves to a synthetic value. The binding fails each call with an error
  whose `message` quotes that resolved value, as a badly behaved backend
  might.

  - $sSoft: the error is `unauthorized` and not retryable, so it is returned
    to the model as the call's tool result and the turn continues to a
    response (CORE-180, TOOL-054).
  - $sFatal: the error is `fatal`, so the run ends `failed` and an error is
    recorded on `run.ended` and returned to the host (CORE-191).

  Resolved secret values must not appear in snapshots, events, traces,
  audit records, or error messages (CFG-063), so the implementation must
  keep the value out of every error it records or returns, whatever the
  binding put in its message. It appears nowhere persisted, in nothing a
  host operation returned, and, since credentials must not enter model
  context (TOOL-011), in no provider request: the tool result the model
  receives in $sSoft carries the error without it. The reference itself is
  not a secret value and may appear. How the value is kept out (dropping
  the message, or redacting the value within it) is not asserted. A
  scripted provider error carries no message, so the provider path is not
  exercised here; `cfg.secret-resolved-value-not-persisted` covers a
  provider credential failure.
requirements: [CFG-063, TOOL-011]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        credentialMode: service
        binding: { kind: native, handler: test.lookup, credentials: { apiKey: "secret://test/lookup-api-key" } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # $sSoft
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "The lookup was refused." }]
          usage: { inputTokens: 30, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sFatal
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k2 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
  stubs:
    tools:
      lookup:
        - error: { category: unauthorized, code: test.lookup.key_rejected, retryable: false, message: "Key SYN-SECRET-LOOKUP-0063-ECHOED was rejected." }
        - error: { category: fatal, code: test.lookup.backend_crashed, retryable: false, message: "Backend crashed while using key SYN-SECRET-LOOKUP-0063-ECHOED." }
  secrets:
    "secret://test/lookup-api-key": "SYN-SECRET-LOOKUP-0063-ECHOED"
script:
  - action: run
    bind: $sSoft
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sFatal
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k2" }]
    expect: { ok: true, endReason: failed }
expect:
  sessions:
    $sSoft:
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1, result: { error: { category: unauthorized } } } }
          - { type: run.ended, payload: { reason: responded } }
    $sFatal:
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1 } }
          - { type: run.ended, payload: { reason: failed, error: { category: fatal } } }
  stubCalls:
    lookup: { count: 2 }
  providerRequests:
    scripted-a: { count: 3 }
  noPersistedContent:
    - "SYN-SECRET-LOOKUP-0063-ECHOED"
  noReturnedContent:
    - "SYN-SECRET-LOOKUP-0063-ECHOED"
  noTransmittedContent:
    - "SYN-SECRET-LOOKUP-0063-ECHOED"
