schemaVersion: "0.1.0"
id: cfg.bundle-locked-fields
title: A lower bundle cannot change `defaultFallbackMessage` or `dataResidency` set above it, but may set them when unset
description: >-
  Both fields are locked. org@1 sets defaultFallbackMessage (baseline). A
  department bundle stacked below it that sets a different fallback is
  rejected. With dataResidency set by the organisation bundle, a department
  bundle setting different regions is rejected. A department bundle that sets
  dataResidency when the organisation bundle does not loads. The baseline
  persona declares its own fallbackMessage, so the bundle default is unused at
  run time here.
requirements: [CFG-070]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1, dept@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: PolicyBundle
        id: dept
        version: 1
        schemaVersion: "0.1.0"
        instructions: "Follow departmental policy."
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
script:
  # Lower bundle changes the locked fallback message.
  - load:
      artifacts:
        - kind: PolicyBundle
          id: dept
          version: 1
          schemaVersion: "0.1.0"
          defaultFallbackMessage: "SYN-DEPT-FALLBACK-0070"
    expect: { ok: false, error: { category: configuration } }
  # Lower bundle sets dataResidency where the organisation bundle does not: accepted.
  - load:
      artifacts:
        - kind: PolicyBundle
          id: dept
          version: 1
          schemaVersion: "0.1.0"
          dataResidency: [test-region]
    expect: { ok: true }
  # Organisation pins dataResidency; the department bundle names other regions.
  - load:
      artifacts:
        - kind: PolicyBundle
          id: org
          version: 1
          schemaVersion: "0.1.0"
          instructions: "Follow organisational policy."
          defaultFallbackMessage: "I can't help with that request."
          dataResidency: [test-region]
          sensitivityPolicies:
            pii:
              allowedProviders: [scripted-a, scripted-b]
              redaction: [{ mode: mask }]
            phi:
              allowedProviders: [scripted-a]
              redaction: [{ mode: mask }]
        - kind: PolicyBundle
          id: dept
          version: 1
          schemaVersion: "0.1.0"
          dataResidency: [test-region, other-region]
    expect: { ok: false, error: { category: configuration } }
expect: {}
