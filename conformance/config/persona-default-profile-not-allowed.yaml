schemaVersion: "0.1.0"
id: cfg.persona-default-profile-not-allowed
title: A persona whose `defaultProfile` is not in its `allowedProfiles` is rejected
description: >-
  streamed@1 exists in the snapshot, but the persona names it as default
  while allowing only default@1. Rejected. Adding it to allowedProfiles is accepted.
requirements: [CFG-081]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
script:
  - load:
      artifacts:
        - kind: Persona
          id: assistant
          version: 1
          schemaVersion: "0.1.0"
          instructions: "You are a test assistant."
          tools: [lookup@1, update_record@1]
          defaultProfile: streamed@1
          allowedProfiles: [default@1]
          model: { provider: scripted-a, name: model-a }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - kind: Persona
          id: assistant
          version: 1
          schemaVersion: "0.1.0"
          instructions: "You are a test assistant."
          tools: [lookup@1, update_record@1]
          defaultProfile: streamed@1
          allowedProfiles: [default@1, streamed@1]
          model: { provider: scripted-a, name: model-a }
    expect: { ok: true }
expect: {}
