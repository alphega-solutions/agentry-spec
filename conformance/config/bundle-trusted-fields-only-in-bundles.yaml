schemaVersion: "0.1.0"
id: cfg.bundle-trusted-fields-only-in-bundles
title: "`trustedTools` and `trustedAttachmentSources` are accepted only in policy bundles"
description: >-
  The two grant fields in a persona, a harness profile, or a deployment are
  each a configuration error. The same values in a policy bundle load.
requirements: [CFG-071]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
script:
  - load:
      artifacts:
        - kind: Persona
          id: assistant
          version: 1
          schemaVersion: "0.1.0"
          instructions: "You are a test assistant."
          tools: [lookup@1, update_record@1]
          fallbackMessage: "This request was blocked."
          defaultProfile: default@1
          allowedProfiles: [default@1, streamed@1]
          trustedTools: [lookup@1]
          model: { provider: scripted-a, name: model-a, fallbacks: [{ provider: scripted-b, name: model-b }] }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - kind: Persona
          id: assistant
          version: 1
          schemaVersion: "0.1.0"
          instructions: "You are a test assistant."
          tools: [lookup@1, update_record@1]
          fallbackMessage: "This request was blocked."
          defaultProfile: default@1
          allowedProfiles: [default@1, streamed@1]
          trustedAttachmentSources: [upload]
          model: { provider: scripted-a, name: model-a, fallbacks: [{ provider: scripted-b, name: model-b }] }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - kind: HarnessProfile
          id: default
          version: 1
          schemaVersion: "0.1.0"
          idleTtl: PT24H
          suspendedTtl: PT72H
          stepLimit: 8
          trustedTools: [lookup@1]
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - kind: HarnessProfile
          id: default
          version: 1
          schemaVersion: "0.1.0"
          idleTtl: PT24H
          suspendedTtl: PT72H
          stepLimit: 8
          trustedAttachmentSources: [upload]
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          trustedTools: [lookup@1]
          trustedAttachmentSources: [upload]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - kind: PolicyBundle
          id: org
          version: 1
          schemaVersion: "0.1.0"
          policyInstructions: "Follow organisational policy."
          defaultFallbackMessage: "I can't help with that request."
          trustedTools: [lookup@1]
          trustedAttachmentSources: [upload]
          sensitivityPolicies:
            pii:
              allowedProviders: [scripted-a, scripted-b]
              redaction: [{ mode: mask }]
            phi:
              allowedProviders: [scripted-a]
              redaction: [{ mode: mask }]
    expect: { ok: true }
expect: {}
