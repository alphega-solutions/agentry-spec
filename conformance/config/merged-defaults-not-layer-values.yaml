schemaVersion: "0.1.0"
id: cfg.merged-defaults-not-layer-values
title: A schema default of a merge-annotated field is not a layer value — a layer that leaves the field unset imposes nothing on lower layers
description: >-
  The deployment stacks two policy bundles, org@1 then lower@1 (CFG-070:
  each lower bundle can only tighten those above it). The snapshot leaves
  merge-annotated fields absent when their author did not set them; their
  defaults apply only to the merged view (CFG-050 as amended 2026-11-14).


  - approvalDefault (HOOK-133, `stricter`, order escalate → continue,
    default escalate). org@1 leaves it unset; lower@1 sets `continue`.
    `notify` is a read tool with `approval: policy`, and no approval rules
    are declared anywhere. $sCont: the effective approvalDefault is
    `continue`, because a default filled into org@1 is not a layer value,
    so the call is dispatched without escalation. A load then sets
    `approvalDefault: escalate` explicitly in org@1. $sEsc: the same call
    escalates (source `approval`, `agentry.approval.no_rules`), since an
    explicit value is a layer value and lower@1 cannot loosen it.

  - context.compaction.triggerPercent (`min`, default 90). org@1 declares
    `context.compaction` with only `mode: truncate`. A snapshot that
    filled defaults would give org@1 `triggerPercent: 90`, which would cap
    the profile. default@1 sets `context.compaction` to `{mode: truncate,
    triggerPercent: 95}`, so the effective trigger level is 95% of the
    available space. Both models declare contextLimit 120 and
    maxOutputTokens 20, so the space is 100. System content is 8 tokens.
    $sCtx: turn 1 is 20 + 20 = 40 words. Turn 2's text is 45 words: 8 +
    40 + 45 = 93, which is above 90 but not above 95. So no compaction
    happens, and turn 2's request still carries turn 1's principal
    message.
requirements: [CFG-050, HOOK-133]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1, lower@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
        context: { compaction: { mode: truncate } }
      - kind: PolicyBundle
        id: lower
        version: 1
        schemaVersion: "0.1.0"
        approvalDefault: continue
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { compaction: { mode: truncate, triggerPercent: 95 } }
      - kind: Tool
        id: notify
        version: 1
        schemaVersion: "0.1.0"
        description: Notify a team.
        input:
          type: object
          additionalProperties: false
          required: [text]
          properties: { text: { type: string } }
        effect: read
        approval: policy
        binding: { kind: native, handler: test.notify }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [notify@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      responses:
        # $sCont
        - parts: [{ type: tool_call, callId: c1, tool: notify, arguments: { text: "SYN-NOTE-0001" } }]
          usage: { inputTokens: 10, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Sent." }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sEsc
        - parts: [{ type: tool_call, callId: c1, tool: notify, arguments: { text: "SYN-NOTE-0002" } }]
          usage: { inputTokens: 10, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sCtx
        - parts: [{ type: text, text: "SYN-MR-01 SYN-MR-02 SYN-MR-03 SYN-MR-04 SYN-MR-05 SYN-MR-06 SYN-MR-07 SYN-MR-08 SYN-MR-09 SYN-MR-10 SYN-MR-11 SYN-MR-12 SYN-MR-13 SYN-MR-14 SYN-MR-15 SYN-MR-16 SYN-MR-17 SYN-MR-18 SYN-MR-19 SYN-MR-20" }]
          usage: { inputTokens: 28, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done." }]
          usage: { inputTokens: 93, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      responses: []
  stubs:
    tools:
      notify:
        - ok: { output: { sent: true } }
script:
  - action: run
    bind: $sCont
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Notify the team" }]
    expect: { ok: true, endReason: responded }
  - load:
      artifacts:
        - kind: PolicyBundle
          id: org
          version: 1
          schemaVersion: "0.1.0"
          policyInstructions: "Follow organisational policy."
          defaultFallbackMessage: "I can't help with that request."
          approvalDefault: escalate
          sensitivityPolicies:
            pii:
              allowedProviders: [scripted-a, scripted-b]
              redaction: [{ mode: mask }]
            phi:
              allowedProviders: [scripted-a]
              redaction: [{ mode: mask }]
          context: { compaction: { mode: truncate } }
    expect: { ok: true }
  - action: run
    bind: $sEsc
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Notify the team again" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $sCtx
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "SYN-MA-01 SYN-MA-02 SYN-MA-03 SYN-MA-04 SYN-MA-05 SYN-MA-06 SYN-MA-07 SYN-MA-08 SYN-MA-09 SYN-MA-10 SYN-MA-11 SYN-MA-12 SYN-MA-13 SYN-MA-14 SYN-MA-15 SYN-MA-16 SYN-MA-17 SYN-MA-18 SYN-MA-19 SYN-MA-20" }]
    expect: { ok: true, endReason: responded }
  - action: run
    session: $sCtx
    principal: p1
    input: [{ type: text, text: "SYN-MB-01 SYN-MB-02 SYN-MB-03 SYN-MB-04 SYN-MB-05 SYN-MB-06 SYN-MB-07 SYN-MB-08 SYN-MB-09 SYN-MB-10 SYN-MB-11 SYN-MB-12 SYN-MB-13 SYN-MB-14 SYN-MB-15 SYN-MB-16 SYN-MB-17 SYN-MB-18 SYN-MB-19 SYN-MB-20 SYN-MB-21 SYN-MB-22 SYN-MB-23 SYN-MB-24 SYN-MB-25 SYN-MB-26 SYN-MB-27 SYN-MB-28 SYN-MB-29 SYN-MB-30 SYN-MB-31 SYN-MB-32 SYN-MB-33 SYN-MB-34 SYN-MB-35 SYN-MB-36 SYN-MB-37 SYN-MB-38 SYN-MB-39 SYN-MB-40 SYN-MB-41 SYN-MB-42 SYN-MB-43 SYN-MB-44 SYN-MB-45" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sCont:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: notify } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: escalation.raised }
    $sEsc:
      state: suspended
      events:
        mode: subsequence
        items:
          - type: escalation.raised
            payload:
              escalation:
                sources: [approval]
                pendingActions: [{ kind: tool_call, source: approval, reasonCode: agentry.approval.no_rules, callId: c1, tool: notify }]
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call }
    $sCtx:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.request, turn: 2, step: 1 }
          - { type: run.ended, turn: 2, payload: { reason: responded } }
      absentEvents:
        - { type: context.compacted }
  providerRequests:
    scripted-a:
      - {}
      - {}
      - {}
      - {}
      - messages:
          $contains:
            - role: principal
              parts: [{ type: text, text: "SYN-MA-01 SYN-MA-02 SYN-MA-03 SYN-MA-04 SYN-MA-05 SYN-MA-06 SYN-MA-07 SYN-MA-08 SYN-MA-09 SYN-MA-10 SYN-MA-11 SYN-MA-12 SYN-MA-13 SYN-MA-14 SYN-MA-15 SYN-MA-16 SYN-MA-17 SYN-MA-18 SYN-MA-19 SYN-MA-20" }]
            - role: principal
              parts: [{ type: text, text: "SYN-MB-01 SYN-MB-02 SYN-MB-03 SYN-MB-04 SYN-MB-05 SYN-MB-06 SYN-MB-07 SYN-MB-08 SYN-MB-09 SYN-MB-10 SYN-MB-11 SYN-MB-12 SYN-MB-13 SYN-MB-14 SYN-MB-15 SYN-MB-16 SYN-MB-17 SYN-MB-18 SYN-MB-19 SYN-MB-20 SYN-MB-21 SYN-MB-22 SYN-MB-23 SYN-MB-24 SYN-MB-25 SYN-MB-26 SYN-MB-27 SYN-MB-28 SYN-MB-29 SYN-MB-30 SYN-MB-31 SYN-MB-32 SYN-MB-33 SYN-MB-34 SYN-MB-35 SYN-MB-36 SYN-MB-37 SYN-MB-38 SYN-MB-39 SYN-MB-40 SYN-MB-41 SYN-MB-42 SYN-MB-43 SYN-MB-44 SYN-MB-45" }]
    scripted-b: { count: 0 }
  stubCalls:
    notify: [{ arguments: { text: "SYN-NOTE-0001" } }]
