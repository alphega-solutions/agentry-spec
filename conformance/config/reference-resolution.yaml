schemaVersion: "0.1.0"
id: cfg.reference-resolution
title: References must resolve to an artifact of the expected kind; reference cycles are accepted
description: >-
  A persona that references a tool id that does not exist, or a version of
  `lookup` that does not exist, is rejected. References that resolve to an
  artifact of the wrong kind are rejected: a Tool as a profile, a profile as
  a tool, a profile as a hook, a persona as a policy bundle. Finally two
  personas that can delegate to each other through agent tools (a reference
  cycle) load successfully. Both agent tools declare `effect: read`, which
  matches their reachable tools (lookup only).
requirements: [CFG-011, CFG-012]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
script:
  # Unresolved: no artifact with this id; no artifact with this version.
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1, missing_tool@1], defaultProfile: default@1, allowedProfiles: [default@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@2], defaultProfile: default@1, allowedProfiles: [default@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1], defaultProfile: default@1, allowedProfiles: [default@1], requiredHooks: [missing-hook@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  # Wrong kind.
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1], defaultProfile: lookup@1, allowedProfiles: [lookup@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1, default@1], defaultProfile: default@1, allowedProfiles: [default@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - { kind: Persona, id: probe, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1], defaultProfile: default@1, allowedProfiles: [default@1], requiredHooks: [default@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: false, error: { category: configuration } }
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [assistant@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
    expect: { ok: false, error: { category: configuration } }
  # A delegation cycle: alpha -> beta -> alpha.
  - load:
      artifacts:
        - kind: Tool
          id: ask_beta
          version: 1
          schemaVersion: "0.1.0"
          description: Ask the beta persona.
          input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
          effect: read
          binding: { kind: agent, persona: beta@1 }
        - kind: Tool
          id: ask_alpha
          version: 1
          schemaVersion: "0.1.0"
          description: Ask the alpha persona.
          input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
          effect: read
          binding: { kind: agent, persona: alpha@1 }
        - { kind: Persona, id: alpha, version: 1, schemaVersion: "0.1.0", instructions: "You are the alpha test persona.", tools: [ask_beta@1, lookup@1], defaultProfile: default@1, allowedProfiles: [default@1], model: { provider: scripted-a, name: model-a } }
        - { kind: Persona, id: beta, version: 1, schemaVersion: "0.1.0", instructions: "You are the beta test persona.", tools: [ask_alpha@1, lookup@1], defaultProfile: default@1, allowedProfiles: [default@1], model: { provider: scripted-a, name: model-a } }
    expect: { ok: true }
expect: {}
