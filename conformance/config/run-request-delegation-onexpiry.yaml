schemaVersion: "0.1.0"
id: cfg.run-request-delegation-onexpiry
title: "`delegation.maxDepth` merges by `min` and `onExpiry` by `stricter` (close before reject) at the run-request layer"
description: >-
  strict@1 sets onExpiry reject and delegation.maxDepth 2. A run request may
  move onExpiry to the stricter `close` and lower maxDepth to 1; both are
  accepted and recorded on run.started. Raising maxDepth to 3 fails, as does
  setting onExpiry `reject` on default@1, whose onExpiry defaults to the
  stricter `close`.
requirements: [CFG-101, CFG-102]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: HarnessProfile
        id: strict
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        onExpiry: reject
        delegation: { maxDepth: 2 }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1, strict@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: text, text: "Hello." }]
          usage: { inputTokens: 20, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    profile: strict@1
    overrides: { onExpiry: close, delegation: { maxDepth: 1 } }
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $x1
    tenant: t1
    principal: p1
    persona: assistant@1
    profile: strict@1
    overrides: { delegation: { maxDepth: 3 } }
    input: [{ type: text, text: "Hi" }]
    expect: { ok: false, error: { category: invalid_input }, newEvents: 0 }
  - action: run
    bind: $x2
    tenant: t1
    principal: p1
    persona: assistant@1
    overrides: { onExpiry: reject }
    input: [{ type: text, text: "Hi" }]
    expect: { ok: false, error: { category: invalid_input }, newEvents: 0 }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: run.started, payload: { kind: run, overrides: { onExpiry: close, delegation: { maxDepth: 1 } } } }
  providerRequests:
    scripted-a: { count: 1 }
