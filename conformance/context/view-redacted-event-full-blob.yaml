schemaVersion: "0.1.0"
id: context.view-redacted-event-full-blob
title: Retrieved content labelled `pii` is redacted or absent in the event's inline view, yet reproduced in full from its blob in later provider requests
description: >-
  The baseline `pii` policy masks content and allows scripted-a. Automatic
  retrieval from `kb` is on, and the persona also has a retrieval tool
  `search_kb` on the same source. Both records the backend returns are
  stored with labels [pii].


  Turn 1: automatic retrieval returns kb-pii-1; its `context.retrieved`
  event carries only a blob reference (no inline text, by schema) and the
  blob is in the tenant's BlobStore as `application/json` (the part's
  JSON), with a size no smaller than the text (43 bytes), so it holds more
  than a mask. The model then calls search_kb, which returns kb-pii-2; the
  tool.result event is labelled pii and its inline view must not hold the
  raw text (CORE-154 redaction). Because redaction changed its payload,
  the event carries `contentRef`, a reference to the full payload content
  in the BlobStore (`application/json`, at least as large as the 44-byte
  text), and that blob is in the tenant's BlobStore (Area 7 amendment,
  readings settled with the fixtures). The step-2 request nevertheless
  carries both texts in full, with their labels.


  The implementation is then restarted (no crash; in-process state is
  lost). Turn 2's request must still carry both turn-1 texts in full: the
  events do not hold them, so they can only come from the BlobStore
  (CTX-003). The pii texts cannot be listed under noPersistedContent,
  since that check covers blobs, which must hold them.
requirements: [CTX-003]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
          vectorStore: { adapter: memory, region: test-region, sources: [kb] }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { retrieval: { auto: true, source: kb } }
      - kind: Tool
        id: search_kb
        version: 1
        schemaVersion: "0.1.0"
        description: Search the knowledge base.
        input:
          type: object
          additionalProperties: false
          required: [query]
          properties: { query: { type: string } }
        effect: read
        binding: { kind: retrieval, source: kb }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, search_kb@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: search_kb, arguments: { query: "contact for account A1" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Noted." }]
          usage: { inputTokens: 40, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "You are welcome." }]
          usage: { inputTokens: 50, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
  stubs:
    vectorStores:
      kb:
        # turn 1, automatic retrieval
        - results: [{ id: kb-pii-1, text: "SYN-PII-OWNER-JANE-ROE-0003 owns account A1", tenant: t1, labels: [pii] }]
        # turn 1, search_kb call
        - results: [{ id: kb-pii-2, text: "SYN-PII-PHONE-555-0103 is the contact number", tenant: t1, labels: [pii] }]
        # turn 2, automatic retrieval
        - results: []
  limits:
    inlinePayloadBytes: 65536
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Who owns account A1?" }]
    expect: { ok: true, endReason: responded }
  - restart: {}
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Thanks" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - type: context.retrieved
            labels: [pii]
            payload:
              source: kb
              query: "Who owns account A1?"
              results:
                - blob: { id: $b1, hash: { $regex: "^sha256:[0-9a-f]{64}$" }, mediaType: application/json, size: { $gte: 43 } }
                  labels: [pii]
          - type: tool.result
            turn: 1
            provenances: ["retrieval:kb"]
            labels: [pii]
            contentRef: { id: $b2, hash: { $regex: "^sha256:[0-9a-f]{64}$" }, mediaType: application/json, size: { $gte: 44 } }
            payload: { callId: c1, tool: search_kb }
          - { type: run.ended, turn: 1, payload: { reason: responded } }
          - { type: model.request, turn: 2, step: 1 }
      absentEvents:
        - type: tool.result
          payload: { result: { ok: { output: { results: { $contains: [{ text: "SYN-PII-PHONE-555-0103 is the contact number" }] } } } } }
  ports:
    blobStore:
      t1:
        $contains:
          - { id: $b1, mediaType: application/json, size: { $gte: 43 } }
          - { id: $b2, mediaType: application/json, size: { $gte: 44 } }
  providerRequests:
    scripted-a:
      - messages:
          $contains:
            - role: principal
              parts:
                - { type: text, text: "Who owns account A1?", provenance: principal, labels: [] }
                - { type: text, text: "SYN-PII-OWNER-JANE-ROE-0003 owns account A1", provenance: "retrieval:kb", labels: [pii] }
      - messages:
          $contains:
            - role: principal
              parts:
                - { type: text, text: "Who owns account A1?", provenance: principal, labels: [] }
                - { type: text, text: "SYN-PII-OWNER-JANE-ROE-0003 owns account A1", provenance: "retrieval:kb", labels: [pii] }
            - role: tool
              parts:
                - type: tool_result
                  callId: c1
                  provenance: "retrieval:kb"
                  labels: [pii]
                  result: { ok: { output: { results: [{ id: kb-pii-2, text: "SYN-PII-PHONE-555-0103 is the contact number" }] } } }
      # Turn 2, after the restart: rebuilt from events and blobs
      - messages:
          $contains:
            - role: principal
              parts:
                - { type: text, text: "Who owns account A1?", provenance: principal, labels: [] }
                - { type: text, text: "SYN-PII-OWNER-JANE-ROE-0003 owns account A1", provenance: "retrieval:kb", labels: [pii] }
            - role: tool
              parts:
                - type: tool_result
                  callId: c1
                  provenance: "retrieval:kb"
                  labels: [pii]
                  result: { ok: { output: { results: [{ id: kb-pii-2, text: "SYN-PII-PHONE-555-0103 is the contact number" }] } } }
            - role: principal
              parts: [{ type: text, text: "Thanks", provenance: principal }]
    scripted-b: { count: 0 }
  stubCalls:
    vectorStore/kb:
      - arguments: { tenant: t1, text: "Who owns account A1?", limit: 5 }
      - arguments: { tenant: t1, text: "contact for account A1", limit: 5 }
      - arguments: { tenant: t1, text: "Thanks", limit: 5 }
