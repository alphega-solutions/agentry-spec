schemaVersion: "0.1.0"
id: context.summary-recorded-reused
title: A summarize compaction is recorded in full, and after a restart the recorded summary is reused rather than regenerated
description: >-
  Both session models declare contextLimit 120 and maxOutputTokens 20:
  available space 100, compaction above 90 (default triggerPercent). The
  profile summarizes with scripted-sum/sum-1, which has exactly one
  scripted response: a second summarizer call would fail the fixture.


  System content is 8 tokens ("Follow organisational policy." 3 + "You
  are a test assistant." 5). Turn 1: principal 20 words, response 20.
  Turn 2: principal 45 words → 93 > 90; turn 1 is replaced by a 5-word
  summary → 8 + 5 + 45 = 58; the response is 5 words.

  - `context.compacted` records mode `summarize`, units `[{turn: 1}]`, a
    reference to the summary blob (held in the BlobStore as the summary
    part's JSON), provenances [principal, model], no labels, and the
    summarizer's usage exactly as scripted.
  - The implementation then restarts against the same ports, losing
    in-process state. Turn 3's principal text is 10 words: 8 + 5 + 45 + 5
    + 10 = 73, so nothing compacts. Its request carries the same summary
    text, rebuilt from the recorded event and blob (CTX-083), and the
    summarizer is not called again.

  Reading chosen: system content is matched by role only.
requirements: [CTX-082, CTX-083]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          - { id: scripted-sum, adapter: scripted, endpoint: "memory://scripted-sum", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { compaction: { mode: summarize, model: { provider: scripted-sum, name: sum-1 } } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      responses:
        - parts: [{ type: text, text: "SYN-AR-01 SYN-AR-02 SYN-AR-03 SYN-AR-04 SYN-AR-05 SYN-AR-06 SYN-AR-07 SYN-AR-08 SYN-AR-09 SYN-AR-10 SYN-AR-11 SYN-AR-12 SYN-AR-13 SYN-AR-14 SYN-AR-15 SYN-AR-16 SYN-AR-17 SYN-AR-18 SYN-AR-19 SYN-AR-20" }]
          usage: { inputTokens: 28, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "SYN-BR-01 SYN-BR-02 SYN-BR-03 SYN-BR-04 SYN-BR-05" }]
          usage: { inputTokens: 58, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done." }]
          usage: { inputTokens: 73, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      responses: []
    scripted-sum:
      responses:
        - parts: [{ type: text, text: "SYN-SUMMARY-0001 SYN-SUMMARY-0002 SYN-SUMMARY-0003 SYN-SUMMARY-0004 SYN-SUMMARY-0005" }]
          usage: { inputTokens: 41, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
