    session: $s
    principal: p1
    input: [{ type: text, text: "SYN-CP-01 SYN-CP-02 SYN-CP-03 SYN-CP-04 SYN-CP-05 SYN-CP-06 SYN-CP-07 SYN-CP-08 SYN-CP-09 SYN-CP-10" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: model.response, turn: 1, step: 1 }
          - type: context.compacted
            payload:
              mode: summarize
              units: [{ turn: 1 }]
              summary: { id: $sumBlob }
              provenances: [principal, model]
              labels: []
              usage: { inputTokens: 41, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
          - { type: model.request, turn: 2, step: 1 }
          - { type: run.ended, payload: { reason: responded } }
          - { type: model.request, turn: 3, step: 1 }
          - { type: run.ended, payload: { reason: responded } }
  ports:
    blobStore:
      t1:
        $contains:
          - { id: $sumBlob, mediaType: application/json }
  providerRequests:
    scripted-sum:
      - tools: []
    scripted-a:
      - {}
      - messages:
          $all:
            - $count: { of: { role: { $not: system } }, equals: 2 }
            - $contains:
