schemaVersion: "0.1.0"
id: context.view-reproducible-after-crash
title: A crash and restart mid-turn produce the same provider requests as an uninterrupted session with the same events, blobs and snapshot
description: >-
  Automatic retrieval from source `kb` is on, so each turn's principal
  message carries a retrieved part whose content lives only in the
  BlobStore (`context.retrieved` holds blob references, CTX-003). Context
  limits are the defaults (1,000,000 tokens), so nothing is compacted.


  $ctl (control) runs three turns uninterrupted: "Hello" (text answer);
  "Look up k1" (step 1 calls the read tool lookup, step 2 answers); "Thanks"
  (text answer). $s runs the same three turns with the same scripted
  responses, tool output and retrieval records, but the implementation is
  crashed at `after_dispatch` of the turn-2 lookup call, so in-process
  state is lost. After a restart and a clock advance past the run lease,
  run("Thanks") first recovers the orphaned run (HITL-091 as amended
  2026-11-01: the read call is re-dispatched and the run continues with
  step 2), then runs turn 3.


  The recovered turn-2 step-2 request and the turn-3 request, rebuilt
  after the restart from events, blobs and the snapshot, must be deep-equal
  to the control's (placeholders bind whole records). Retrieval is not
  repeated during recovery: the vector store is queried exactly six times
  (three turns per session) and its behaviour list has no spare entry, so a
  re-query would fail the test; the session has exactly one
  `context.retrieved` per turn.
requirements: [CTX-001]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
          vectorStore: { adapter: memory, region: test-region, sources: [kb] }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { retrieval: { auto: true, source: kb } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # $ctl turn 1, turn 2 (two steps), turn 3
        - parts: [{ type: text, text: "Hello there." }]
          usage: { inputTokens: 10, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "k1 is archived." }]
          usage: { inputTokens: 30, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "You are welcome." }]
          usage: { inputTokens: 40, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
        # $s turn 1, turn 2 (step 1; crash; step 2 after recovery), turn 3
        - parts: [{ type: text, text: "Hello there." }]
          usage: { inputTokens: 10, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "k1 is archived." }]
          usage: { inputTokens: 30, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "You are welcome." }]
          usage: { inputTokens: 40, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "SYN-VALUE-0001" } }
        # $s: dispatched, then the crash; the result never reaches the implementation
        - ok: { output: { value: "SYN-VALUE-0001" } }
        # $s: re-dispatched on recovery
        - ok: { output: { value: "SYN-VALUE-0001" } }
    vectorStores:
      kb:
        # $ctl turns 1-3
        - results: [{ id: kb-1, text: "SYN-KB-0001 greetings are answered politely", tenant: t1 }]
        - results: [{ id: kb-2, text: "SYN-KB-0002 record k1 is archived", tenant: t1 }]
        - results: []
        # $s turns 1-3 (no query during recovery)
        - results: [{ id: kb-1, text: "SYN-KB-0001 greetings are answered politely", tenant: t1 }]
        - results: [{ id: kb-2, text: "SYN-KB-0002 record k1 is archived", tenant: t1 }]
        - results: []
script:
  - action: run
    bind: $ctl
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hello" }]
    expect: { ok: true, endReason: responded }
  - action: run
    session: $ctl
    principal: p1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    session: $ctl
    principal: p1
    input: [{ type: text, text: "Thanks" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hello" }]
    expect: { ok: true, endReason: responded }
  - crash: { at: after_dispatch, session: $s }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Look up k1" }]
  - restart: {}
  - clock: { advance: PT1H }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Thanks" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $ctl:
      state: idle
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: turn.started, runId: $r2, turn: 2 }
          - { type: context.retrieved, runId: $r2, payload: { source: kb, query: "Look up k1", limit: 5, results: [{ labels: [] }] } }
          - { type: tool.call, runId: $r2, turn: 2, step: 1, payload: { callId: c1, tool: lookup } }
          - { type: tool.result, runId: $r2, turn: 2, step: 1, payload: { callId: c1, result: { ok: { output: { value: "SYN-VALUE-0001" } } } } }
          - { type: model.request, runId: $r2, turn: 2, step: 2 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
          - { type: turn.started, runId: { $all: [$r3, { $not: $r2 }] }, turn: 3 }
          - { type: model.request, runId: $r3, turn: 3, step: 1 }
          - { type: run.ended, runId: $r3, payload: { reason: responded } }
  providerRequests:
    scripted-a:
      # $ctl
      - $q1
      - $q2
      - $all:
          - $q3
          - messages:
              $contains:
                - role: principal
                  parts:
                    - { type: text, text: "Look up k1", provenance: principal }
                    - { type: text, text: "SYN-KB-0002 record k1 is archived", provenance: "retrieval:kb" }
                - role: tool
                  parts: [{ type: tool_result, callId: c1, result: { ok: { output: { value: "SYN-VALUE-0001" } } } }]
      - $all:
          - $q4
          - messages:
              $contains:
                - role: principal
                  parts:
                    - { type: text, text: "Hello", provenance: principal }
                    - { type: text, text: "SYN-KB-0001 greetings are answered politely", provenance: "retrieval:kb" }
                - role: assistant
                  parts: [{ type: text, text: "k1 is archived." }]
      # $s: identical, including the request rebuilt after the restart
      - $q1
      - $q2
      - $q3
      - $q4
    scripted-b: { count: 0 }
  stubCalls:
    vectorStore/kb: { count: 6 }
    lookup:
      - { completed: true }
      - { completed: false }
      - { completed: true }
  ports:
    eventLog:
      t1:
        $s:
          $all:
            - $count: { of: { type: context.retrieved }, equals: 3 }
            - $count: { of: { type: run.started }, equals: 3 }
