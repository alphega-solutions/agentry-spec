schemaVersion: "0.1.0"
id: context.summary-budget
title: Summarizer tokens count toward the turn budget, and exhausting it during summarization ends the run `budget_exhausted`
description: >-
  Both session models declare contextLimit 120 and maxOutputTokens 20:
  available space 100, compaction above 90 (default triggerPercent). The
  profile summarizes with scripted-sum/sum-1 and has a per-turn token
  budget of 100 (input + output tokens of every model call in the turn,
  summarization included: PROV-071).


  System content is 8 tokens ("Follow organisational policy." 3 + "You
  are a test assistant." 5). In both sessions turn 1 has a 20-word
  principal text and a 20-word response (48 tokens of usage, within its
  own turn's budget), and turn 2's principal text is 45 words → 93 > 90,
  so turn 2's first model call is preceded by a summary of turn 1 (4
  words → 57).

  - $sCounted: the summarizer uses 40 + 10 = 50; step 1 then uses 57 + 5
    = 62 and asks for a lookup. The turn has used 112, so the budget is
    reached: the step-1 call completes and its lookup is dispatched, and
    the check before step 2 ends the run `budget_exhausted` with no step-2
    call.
    Without the summarizer's 50 the turn would be at 62 and would continue.
    The summarizer's usage is recorded on `context.compacted`, so
    `run.ended` carries no `unrecordedUsage`.
  - $sDuring: the summarizer uses 90 + 15 = 105, which exhausts the budget
    during summarization: the run ends `budget_exhausted` and turn 2 makes
    no session model call. The compaction is not recorded (no
    `context.compacted`), and the summarizer's usage is recorded as
    `unrecordedUsage` on `run.ended` (CTX-084 as amended).

  Budget placement follows the Area 9 reading of PROV-071, PROV-074 and
  CFG-091 (amendment 2026-11-02, "Readings settled with the Area 9
  fixtures"): budgets are checked before each session model call and
  before each summarizer call; a session call that reaches the budget
  completes, including dispatching its tool calls; a summarizer call that
  reaches it ends the run at once, its usage (and cost, when priced) on
  `run.ended` as `unrecordedUsage` (`unrecordedCost`). No model here is
  priced, so `unrecordedCost` is not asserted.

  Every candidate (scripted-a, scripted-b) sets maxOutputTokens 20, so the
  default reserve is 20. Both sessions are idle afterwards.
requirements: [CTX-084, PROV-071]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          - { id: scripted-sum, adapter: scripted, endpoint: "memory://scripted-sum", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { compaction: { mode: summarize, model: { provider: scripted-sum, name: sum-1 } } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      responses:
        # $sCounted
        - parts: [{ type: text, text: "SYN-CR-01 SYN-CR-02 SYN-CR-03 SYN-CR-04 SYN-CR-05 SYN-CR-06 SYN-CR-07 SYN-CR-08 SYN-CR-09 SYN-CR-10 SYN-CR-11 SYN-CR-12 SYN-CR-13 SYN-CR-14 SYN-CR-15 SYN-CR-16 SYN-CR-17 SYN-CR-18 SYN-CR-19 SYN-CR-20" }]
          usage: { inputTokens: 28, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 57, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sDuring
        - parts: [{ type: text, text: "SYN-DR-01 SYN-DR-02 SYN-DR-03 SYN-DR-04 SYN-DR-05 SYN-DR-06 SYN-DR-07 SYN-DR-08 SYN-DR-09 SYN-DR-10 SYN-DR-11 SYN-DR-12 SYN-DR-13 SYN-DR-14 SYN-DR-15 SYN-DR-16 SYN-DR-17 SYN-DR-18 SYN-DR-19 SYN-DR-20" }]
          usage: { inputTokens: 28, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      responses: []
    scripted-sum:
      responses:
        # $sCounted
        - parts: [{ type: text, text: "SYN-SUMMARY-C-0001 SYN-SUMMARY-C-0002 SYN-SUMMARY-C-0003 SYN-SUMMARY-C-0004" }]
          usage: { inputTokens: 40, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sDuring
        - parts: [{ type: text, text: "SYN-SUMMARY-D-0001 SYN-SUMMARY-D-0002 SYN-SUMMARY-D-0003 SYN-SUMMARY-D-0004" }]
          usage: { inputTokens: 90, outputTokens: 15, cachedInputTokens: 0, reasoningTokens: 0 }
script:
  - action: run
    bind: $sCounted
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "SYN-CP-01 SYN-CP-02 SYN-CP-03 SYN-CP-04 SYN-CP-05 SYN-CP-06 SYN-CP-07 SYN-CP-08 SYN-CP-09 SYN-CP-10 SYN-CP-11 SYN-CP-12 SYN-CP-13 SYN-CP-14 SYN-CP-15 SYN-CP-16 SYN-CP-17 SYN-CP-18 SYN-CP-19 SYN-CP-20" }]
    expect: { ok: true, endReason: responded }
  - action: run
    session: $sCounted
    principal: p1
    input: [{ type: text, text: "SYN-CQ-01 SYN-CQ-02 SYN-CQ-03 SYN-CQ-04 SYN-CQ-05 SYN-CQ-06 SYN-CQ-07 SYN-CQ-08 SYN-CQ-09 SYN-CQ-10 SYN-CQ-11 SYN-CQ-12 SYN-CQ-13 SYN-CQ-14 SYN-CQ-15 SYN-CQ-16 SYN-CQ-17 SYN-CQ-18 SYN-CQ-19 SYN-CQ-20 SYN-CQ-21 SYN-CQ-22 SYN-CQ-23 SYN-CQ-24 SYN-CQ-25 SYN-CQ-26 SYN-CQ-27 SYN-CQ-28 SYN-CQ-29 SYN-CQ-30 SYN-CQ-31 SYN-CQ-32 SYN-CQ-33 SYN-CQ-34 SYN-CQ-35 SYN-CQ-36 SYN-CQ-37 SYN-CQ-38 SYN-CQ-39 SYN-CQ-40 SYN-CQ-41 SYN-CQ-42 SYN-CQ-43 SYN-CQ-44 SYN-CQ-45" }]
    expect: { ok: true, endReason: budget_exhausted }
  - action: run
    bind: $sDuring
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "SYN-DP-01 SYN-DP-02 SYN-DP-03 SYN-DP-04 SYN-DP-05 SYN-DP-06 SYN-DP-07 SYN-DP-08 SYN-DP-09 SYN-DP-10 SYN-DP-11 SYN-DP-12 SYN-DP-13 SYN-DP-14 SYN-DP-15 SYN-DP-16 SYN-DP-17 SYN-DP-18 SYN-DP-19 SYN-DP-20" }]
    expect: { ok: true, endReason: responded }
  - action: run
    session: $sDuring
    principal: p1
    input: [{ type: text, text: "SYN-DQ-01 SYN-DQ-02 SYN-DQ-03 SYN-DQ-04 SYN-DQ-05 SYN-DQ-06 SYN-DQ-07 SYN-DQ-08 SYN-DQ-09 SYN-DQ-10 SYN-DQ-11 SYN-DQ-12 SYN-DQ-13 SYN-DQ-14 SYN-DQ-15 SYN-DQ-16 SYN-DQ-17 SYN-DQ-18 SYN-DQ-19 SYN-DQ-20 SYN-DQ-21 SYN-DQ-22 SYN-DQ-23 SYN-DQ-24 SYN-DQ-25 SYN-DQ-26 SYN-DQ-27 SYN-DQ-28 SYN-DQ-29 SYN-DQ-30 SYN-DQ-31 SYN-DQ-32 SYN-DQ-33 SYN-DQ-34 SYN-DQ-35 SYN-DQ-36 SYN-DQ-37 SYN-DQ-38 SYN-DQ-39 SYN-DQ-40 SYN-DQ-41 SYN-DQ-42 SYN-DQ-43 SYN-DQ-44 SYN-DQ-45" }]
    expect: { ok: true, endReason: budget_exhausted }
expect:
  sessions:
    $sCounted:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: run.ended, payload: { reason: responded } }
          - { type: context.compacted, turn: 2, step: 1, payload: { mode: summarize, units: [{ turn: 1 }], usage: { inputTokens: 40, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 } } }
          - { type: model.request, turn: 2, step: 1 }
          - { type: model.response, turn: 2, step: 1 }
          - { type: run.ended, payload: { reason: budget_exhausted, unrecordedUsage: { $absent: true } } }
      absentEvents:
        - { type: model.request, turn: 2, step: 2 }
    $sDuring:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.response, turn: 1, step: 1 }
          - { type: run.ended, payload: { reason: responded } }
          - { type: turn.started, turn: 2 }
          - { type: run.ended, payload: { reason: budget_exhausted, unrecordedUsage: { inputTokens: 90, outputTokens: 15, cachedInputTokens: 0, reasoningTokens: 0 } } }
      absentEvents:
        - { type: model.request, turn: 2 }
        - { type: context.compacted }
  providerRequests:
    scripted-a: { count: 3 }
    scripted-sum: { count: 2 }
    scripted-b: { count: 0 }
  stubCalls:
    lookup: { count: 1 }
