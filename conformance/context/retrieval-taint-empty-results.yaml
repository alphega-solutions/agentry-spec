schemaVersion: "0.1.0"
id: context.retrieval-taint-empty-results
title: Automatic retrieval taints the session even when it returns no results and no labels
description: >-
  The bundle trusts `lookup@1` and `update_record@1`, so no tool result
  taints either session; taint is observed through the mutating
  `update_record` call (default `onTainted: escalate`) and the checkpoint.

  - $sEmpty runs on default@1, which enables automatic retrieval from
    `kb`. The backend returns no records: `context.retrieved` is emitted
    with empty `results`, and the principal message the model receives
    holds only the principal's part. The retrieval still taints the
    session (CTX-040, HOOK-120): the mutating call is stopped at stage 5
    with a taint decision naming exactly `retrieval:kb`, and the
    checkpoint records that provenance.
  - $sControl runs on plain@1, identical but without automatic retrieval:
    the same mutating call is dispatched with no taint decision and the
    session is not tainted.
requirements: [CTX-040, HOOK-120]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
          vectorStore: { adapter: memory, region: test-region, sources: [kb] }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        trustedTools: [lookup@1, update_record@1]
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { retrieval: { auto: true, source: kb } }
      - kind: HarnessProfile
        id: plain
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1, plain@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # $sEmpty
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sControl
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v2 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Updated." }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    vectorStores:
      kb:
        - results: []
    tools:
      update_record:
        - ok: { output: { updated: true } }
script:
  - action: run
    bind: $sEmpty
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $sControl
    tenant: t1
    principal: p1
    persona: assistant@1
    profile: plain@1
    input: [{ type: text, text: "Set k1 to v2" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sEmpty:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: context.retrieved, payload: { source: kb, query: "Set k1 to v1", results: [] } }
          - { type: model.request, step: 1 }
          - { type: policy.decision, payload: { kind: taint, outcome: escalate, callId: c1, tool: update_record, provenances: ["retrieval:kb"] } }
          - { type: escalation.raised, payload: { escalation: { sources: [taint], pendingActions: [{ callId: c1, source: taint }] } } }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call }
      checkpoint:
        taint: { tainted: true, provenances: ["retrieval:kb"] }
    $sControl:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: update_record } }
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { updated: true } } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: context.retrieved }
        - { type: policy.decision, payload: { kind: taint } }
        - { type: escalation.raised }
      checkpoint:
        taint: { tainted: false }
  providerRequests:
    scripted-a:
      - messages:
          $contains:
            - role: principal
              parts: [{ type: text, text: "Set k1 to v1", provenance: principal, labels: [] }]
      - {}
      - {}
  stubCalls:
    vectorStore/kb: [{ arguments: { tenant: t1, text: "Set k1 to v1", limit: 5 } }]
    update_record: [{ arguments: { key: k1, value: v2 } }]
