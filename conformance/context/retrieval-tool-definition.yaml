schemaVersion: "0.1.0"
id: context.retrieval-tool-definition
title: A retrieval tool must be `read`, declare a required string `query` (and at most an integer `limit` besides), and name a declared vector store source
description: >-
  The deployment declares the vector store source `kb`. Each failing load
  adds one `kb_search` tool bound `{ kind: retrieval }` that breaks one
  rule, and is rejected with category configuration:

  - `effect: mutating` (CTX-020: a retrieval tool MUST have `effect: read`);
  - an `input` with no `query` property (Area 7 amendment 2026-11-01: the
    input declares a required string `query`);
  - `query` declared as an integer;
  - `query` declared but not listed in `required`;
  - an optional `limit` declared as a string (it may only be an integer);
  - an `input` declaring a property beyond `query` and `limit` (here
    `filter`): the input declares nothing else (Area 7 amendment
    2026-11-01; `schemas/config/v1/tool.yaml`);
  - a binding naming the source `archive`, which the deployment's
    `ports.vectorStore.sources` does not declare: a configuration error
    for a retrieval tool as for `retrieval.source` (CTX-101 as amended,
    readings settled with the fixtures), and an unresolved binding
    (TOOL-010).

  The tools are not referenced by any persona: every binding in the
  snapshot must resolve. The final load adds a valid retrieval tool
  (`effect: read`, required string `query`, optional integer `limit`,
  source `kb`) and succeeds.
requirements: [CTX-020, CTX-101, TOOL-010]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
          vectorStore: { adapter: memory, region: test-region, sources: [kb] }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
script:
  # Mutating retrieval tool.
  - load:
      artifacts:
        - { kind: Tool, id: kb_search, version: 1, schemaVersion: "0.1.0", description: Search the knowledge base., input: { type: object, additionalProperties: false, required: [query], properties: { query: { type: string } } }, effect: mutating, idempotent: true, binding: { kind: retrieval, source: kb } }
    expect: { ok: false, error: { category: configuration } }
  # No `query` property.
  - load:
      artifacts:
        - { kind: Tool, id: kb_search, version: 1, schemaVersion: "0.1.0", description: Search the knowledge base., input: { type: object, additionalProperties: false, required: [q], properties: { q: { type: string } } }, effect: read, binding: { kind: retrieval, source: kb } }
    expect: { ok: false, error: { category: configuration } }
  # `query` not a string.
  - load:
      artifacts:
        - { kind: Tool, id: kb_search, version: 1, schemaVersion: "0.1.0", description: Search the knowledge base., input: { type: object, additionalProperties: false, required: [query], properties: { query: { type: integer } } }, effect: read, binding: { kind: retrieval, source: kb } }
    expect: { ok: false, error: { category: configuration } }
  # `query` not required.
  - load:
      artifacts:
        - { kind: Tool, id: kb_search, version: 1, schemaVersion: "0.1.0", description: Search the knowledge base., input: { type: object, additionalProperties: false, properties: { query: { type: string } } }, effect: read, binding: { kind: retrieval, source: kb } }
    expect: { ok: false, error: { category: configuration } }
  # `limit` not an integer.
  - load:
      artifacts:
        - { kind: Tool, id: kb_search, version: 1, schemaVersion: "0.1.0", description: Search the knowledge base., input: { type: object, additionalProperties: false, required: [query], properties: { query: { type: string }, limit: { type: string } } }, effect: read, binding: { kind: retrieval, source: kb } }
    expect: { ok: false, error: { category: configuration } }
  # A property beyond `query` and `limit`.
  - load:
      artifacts:
        - { kind: Tool, id: kb_search, version: 1, schemaVersion: "0.1.0", description: Search the knowledge base., input: { type: object, additionalProperties: false, required: [query], properties: { query: { type: string }, limit: { type: integer }, filter: { type: string } } }, effect: read, binding: { kind: retrieval, source: kb } }
    expect: { ok: false, error: { category: configuration } }
  # Source not declared in the deployment.
  - load:
      artifacts:
        - { kind: Tool, id: kb_search, version: 1, schemaVersion: "0.1.0", description: Search the knowledge base., input: { type: object, additionalProperties: false, required: [query], properties: { query: { type: string } } }, effect: read, binding: { kind: retrieval, source: archive } }
    expect: { ok: false, error: { category: configuration } }
  # Control: a valid retrieval tool.
  - load:
      artifacts:
        - { kind: Tool, id: kb_search, version: 1, schemaVersion: "0.1.0", description: Search the knowledge base., input: { type: object, additionalProperties: false, required: [query], properties: { query: { type: string }, limit: { type: integer, minimum: 1 } } }, effect: read, binding: { kind: retrieval, source: kb } }
    expect: { ok: true }
expect: {}
