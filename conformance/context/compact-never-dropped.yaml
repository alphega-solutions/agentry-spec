schemaVersion: "0.1.0"
id: context.compact-never-dropped
title: Compaction never drops system content, the current principal message with its attachments and retrieved parts, the current step, or its reasoning
description: >-
  Both scripted models declare contextLimit 120 and maxOutputTokens 20:
  available space 100, compaction above 90 (default triggerPercent). The
  profile truncates and enables automatic retrieval from source `kb` (the
  Deployment is the baseline's plus a memory vector store with source
  `kb`). Turn 1's retrieval returns nothing; turn 2's returns one record
  stored without labels (`retrieval.defaultLabels` is empty). Turn 2's
  principal message has a text part and an uploaded image (10 tokens, the
  default non-text cost). In turn 2, step 1 answers with a reasoning part
  and a lookup call (10 + 10) and the lookup result is 10, so at the step-2
  call the current step is step 1: its response (reasoning included,
  produced by scripted-a, which continues) and its result.


  System content is 8 tokens ("Follow organisational policy." 3 + "You
  are a test assistant." 5).

  - $sFits: turn 1 principal 20 words, response 30. Turn 2 text 10 words,
    retrieved text 12 words. Step 1: 8 + 50 + 10 + 10 + 12 = 90, not above
    90, no compaction. Step 2: 90 + 30 = 120 > 90. The only droppable unit
    is turn 1; without it, 70. The step-2 request holds exactly the
    principal message (text, image, retrieved part, in that order), the
    step-1 assistant message (reasoning, tool call) and the tool message.
  - $sOverflow: turn 1 principal 5 words, response 5. Turn 2 text 20,
    retrieved text 40. Step 1: 8 + 10 + 20 + 10 + 40 = 88, no compaction.
    Step 2: 88 + 30 = 118; dropping turn 1 leaves 108, above both 90 and
    the space of 100. What remains may not be dropped, so the context
    cannot fit: no step-2 model call, `error` (limit,
    agentry.context.overflow), run ended `context_limit`. Dropping the
    retrieved part, the image, or step 1 would have made it fit, so a
    second request would show that protected content was dropped.

  Reading chosen: system content is matched by role only (its message
  layout is not specified).
requirements: [CTX-060]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
          vectorStore: { adapter: memory, region: test-region, sources: [kb] }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { compaction: { mode: truncate }, retrieval: { auto: true, source: kb } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      responses:
        # $sFits
        - parts: [{ type: text, text: "SYN-FR-01 SYN-FR-02 SYN-FR-03 SYN-FR-04 SYN-FR-05 SYN-FR-06 SYN-FR-07 SYN-FR-08 SYN-FR-09 SYN-FR-10 SYN-FR-11 SYN-FR-12 SYN-FR-13 SYN-FR-14 SYN-FR-15 SYN-FR-16 SYN-FR-17 SYN-FR-18 SYN-FR-19 SYN-FR-20 SYN-FR-21 SYN-FR-22 SYN-FR-23 SYN-FR-24 SYN-FR-25 SYN-FR-26 SYN-FR-27 SYN-FR-28 SYN-FR-29 SYN-FR-30" }]
          usage: { inputTokens: 28, outputTokens: 30, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts:
            - { type: reasoning, provider: scripted-a, data: "SYNTHETIC-REASONING-F-0001", opaque: true }
            - { type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }
          usage: { inputTokens: 90, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done." }]
          usage: { inputTokens: 70, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sOverflow
        - parts: [{ type: text, text: "SYN-VR-01 SYN-VR-02 SYN-VR-03 SYN-VR-04 SYN-VR-05" }]
          usage: { inputTokens: 13, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts:
            - { type: reasoning, provider: scripted-a, data: "SYNTHETIC-REASONING-V-0001", opaque: true }
            - { type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }
          usage: { inputTokens: 88, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      responses: []
  ports:
    blobStore:
      t1:
        - id: blob-img-1
          hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7"
          mediaType: image/png
          size: 20
          data: "U1lOVEhFVElDLUlNQUdFLTAwMDE="
  stubs:
    vectorStores:
      kb:
        - results: []
        - results: [{ id: doc-f1, text: "SYN-FK-01 SYN-FK-02 SYN-FK-03 SYN-FK-04 SYN-FK-05 SYN-FK-06 SYN-FK-07 SYN-FK-08 SYN-FK-09 SYN-FK-10 SYN-FK-11 SYN-FK-12", tenant: t1 }]
        - results: []
        - results: [{ id: doc-v1, text: "SYN-VK-01 SYN-VK-02 SYN-VK-03 SYN-VK-04 SYN-VK-05 SYN-VK-06 SYN-VK-07 SYN-VK-08 SYN-VK-09 SYN-VK-10 SYN-VK-11 SYN-VK-12 SYN-VK-13 SYN-VK-14 SYN-VK-15 SYN-VK-16 SYN-VK-17 SYN-VK-18 SYN-VK-19 SYN-VK-20 SYN-VK-21 SYN-VK-22 SYN-VK-23 SYN-VK-24 SYN-VK-25 SYN-VK-26 SYN-VK-27 SYN-VK-28 SYN-VK-29 SYN-VK-30 SYN-VK-31 SYN-VK-32 SYN-VK-33 SYN-VK-34 SYN-VK-35 SYN-VK-36 SYN-VK-37 SYN-VK-38 SYN-VK-39 SYN-VK-40", tenant: t1 }]
    tools:
      lookup:
        - ok: { output: { value: "SYN-LOOKUP-F-0001" } }
        - ok: { output: { value: "SYN-LOOKUP-V-0001" } }
script:
  - action: run
    bind: $sFits
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "SYN-FP-01 SYN-FP-02 SYN-FP-03 SYN-FP-04 SYN-FP-05 SYN-FP-06 SYN-FP-07 SYN-FP-08 SYN-FP-09 SYN-FP-10 SYN-FP-11 SYN-FP-12 SYN-FP-13 SYN-FP-14 SYN-FP-15 SYN-FP-16 SYN-FP-17 SYN-FP-18 SYN-FP-19 SYN-FP-20" }]
    expect: { ok: true, endReason: responded }
  - action: run
    session: $sFits
    principal: p1
    input:
      - { type: text, text: "SYN-FQ-01 SYN-FQ-02 SYN-FQ-03 SYN-FQ-04 SYN-FQ-05 SYN-FQ-06 SYN-FQ-07 SYN-FQ-08 SYN-FQ-09 SYN-FQ-10" }
      - type: image
        mediaType: image/png
        source: upload
        blob: { id: blob-img-1, hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7", mediaType: image/png, size: 20 }
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sOverflow
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "SYN-VP-01 SYN-VP-02 SYN-VP-03 SYN-VP-04 SYN-VP-05" }]
    expect: { ok: true, endReason: responded }
  - action: run
    session: $sOverflow
    principal: p1
    input:
      - { type: text, text: "SYN-VQ-01 SYN-VQ-02 SYN-VQ-03 SYN-VQ-04 SYN-VQ-05 SYN-VQ-06 SYN-VQ-07 SYN-VQ-08 SYN-VQ-09 SYN-VQ-10 SYN-VQ-11 SYN-VQ-12 SYN-VQ-13 SYN-VQ-14 SYN-VQ-15 SYN-VQ-16 SYN-VQ-17 SYN-VQ-18 SYN-VQ-19 SYN-VQ-20" }
      - type: image
        mediaType: image/png
        source: upload
        blob: { id: blob-img-1, hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7", mediaType: image/png, size: 20 }
    expect: { ok: true, endReason: context_limit }
expect:
  sessions:
    $sFits:
      events:
        mode: subsequence
        items:
          - { type: model.response, turn: 2, step: 1 }
          - { type: tool.result, turn: 2, payload: { callId: c1, tool: lookup } }
          - { type: context.compacted, payload: { mode: truncate, units: [{ turn: 1 }] } }
          - { type: model.request, turn: 2, step: 2 }
          - { type: run.ended, payload: { reason: responded } }
    $sOverflow:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.response, turn: 2, step: 1 }
          - { type: tool.result, turn: 2, payload: { callId: c1, tool: lookup } }
          - { type: error, payload: { error: { category: limit, code: agentry.context.overflow } } }
          - { type: run.ended, payload: { reason: context_limit } }
      absentEvents:
        - { type: model.request, turn: 2, step: 2 }
  providerRequests:
    scripted-a:
      # $sFits: turn 1; turn 2 step 1; turn 2 step 2 (after compaction)
      - {}
      - {}
      - messages:
          $all:
            - $count: { of: { role: { $not: system } }, equals: 3 }
            - $count: { of: { role: system }, gte: 1 }
            - $contains:
                - role: principal
                  parts:
                    - { type: text, text: "SYN-FQ-01 SYN-FQ-02 SYN-FQ-03 SYN-FQ-04 SYN-FQ-05 SYN-FQ-06 SYN-FQ-07 SYN-FQ-08 SYN-FQ-09 SYN-FQ-10", provenance: principal, labels: [] }
                    - { type: image, blob: { id: blob-img-1 }, provenance: "attachment:upload", labels: [] }
                    - { type: text, text: "SYN-FK-01 SYN-FK-02 SYN-FK-03 SYN-FK-04 SYN-FK-05 SYN-FK-06 SYN-FK-07 SYN-FK-08 SYN-FK-09 SYN-FK-10 SYN-FK-11 SYN-FK-12", provenance: "retrieval:kb", labels: [] }
                - role: assistant
                  parts:
                    - { type: reasoning, provider: scripted-a, data: "SYNTHETIC-REASONING-F-0001" }
                    - { type: tool_call, callId: c1, tool: lookup, provenance: model }
                - role: tool
                  parts: [{ type: tool_result, callId: c1, provenance: "tool:lookup" }]
      # $sOverflow: turn 1; turn 2 step 1 only
      - {}
      - {}
    scripted-b: { count: 0 }
  stubCalls:
    vectorStore/kb:
      - { arguments: { tenant: t1, text: "SYN-FP-01 SYN-FP-02 SYN-FP-03 SYN-FP-04 SYN-FP-05 SYN-FP-06 SYN-FP-07 SYN-FP-08 SYN-FP-09 SYN-FP-10 SYN-FP-11 SYN-FP-12 SYN-FP-13 SYN-FP-14 SYN-FP-15 SYN-FP-16 SYN-FP-17 SYN-FP-18 SYN-FP-19 SYN-FP-20", limit: 5 } }
      - { arguments: { tenant: t1, text: "SYN-FQ-01 SYN-FQ-02 SYN-FQ-03 SYN-FQ-04 SYN-FQ-05 SYN-FQ-06 SYN-FQ-07 SYN-FQ-08 SYN-FQ-09 SYN-FQ-10", limit: 5 } }
      - { arguments: { tenant: t1, text: "SYN-VP-01 SYN-VP-02 SYN-VP-03 SYN-VP-04 SYN-VP-05", limit: 5 } }
      - { arguments: { tenant: t1, text: "SYN-VQ-01 SYN-VQ-02 SYN-VQ-03 SYN-VQ-04 SYN-VQ-05 SYN-VQ-06 SYN-VQ-07 SYN-VQ-08 SYN-VQ-09 SYN-VQ-10 SYN-VQ-11 SYN-VQ-12 SYN-VQ-13 SYN-VQ-14 SYN-VQ-15 SYN-VQ-16 SYN-VQ-17 SYN-VQ-18 SYN-VQ-19 SYN-VQ-20", limit: 5 } }
