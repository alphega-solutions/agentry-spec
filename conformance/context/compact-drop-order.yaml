            - { type: tool_call, callId: c2, tool: lookup, arguments: { key: k2 } }
          usage: { inputTokens: 80, outputTokens: 70, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done." }]
