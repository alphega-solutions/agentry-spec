schemaVersion: "0.1.0"
id: context.compact-drop-order
title: Compaction drops earlier turns oldest first, then earlier steps of the current turn oldest first
description: >-
  Both scripted models declare contextLimit 120 and maxOutputTokens 20:
  available space 100, compaction above 90 (default triggerPercent). The
  profile truncates. System content is 8 tokens ("Follow organisational
  policy." 3 + "You are a test assistant." 5).


  Turns 1 and 2 each have a 10-word principal text and a 10-word response
  (20 tokens per turn). Turn 3's principal text is 2 words. In turn 3,
  step 1 answers with a 10-word text and a lookup call (10 + 10) whose
  result is 10 tokens: 30. Step 2 answers with a 60-word text and a lookup
  call, result 10: 80. Step 3 answers with text.

  - Step 1 request: 8 + 40 + 2 = 50. Step 2 request: 50 + 30 = 80. Neither
    exceeds 90.
  - Step 3 request: 80 + 80 = 160 > 90. Step 2 is the current step and
    cannot be dropped. Dropping in order: turn 1 → 140; turn 2 → 120,
    still above the space of 100; step 1 of turn 3 → 90, which fits.
    So one compaction covers both phases, and `units` is exactly
    `[{turn: 1}, {turn: 2}, {turn: 3, step: 1}]` in that order (old turns
    oldest first, then earlier steps of the current turn).
  - The step-3 request holds exactly the turn-3 principal message, step 2's
    assistant message and step 2's tool message.

  A different drop order would list the units differently. The
  compaction is recorded with the turn and step of the call it prepared
  (turn 3, step 3). The step-3 request is asserted exactly, starting with
  the one `system` message (one text part per instruction source).
  Summaries as the first droppable units are shown in
  context.summary-fold.
requirements: [CTX-061]
contract: ">=0.1.0 <1.0.0"
features: []
