schemaVersion: "0.1.0"
id: context.retrieval-labels-stored-default
title: Automatically retrieved content carries its stored labels; content stored without labels carries `retrieval.defaultLabels`
description: >-
  The profile enables automatic retrieval from `kb` and sets
  `retrieval.defaultLabels: [example.test:kb-default]`. The bundle gives
  both custom labels sensitivity policies allowing both scripted
  providers, with no redaction. The backend returns r1, stored with label
  example.test:kb-stored, then r2, stored without labels (PORT-081).

  - r1 carries exactly its stored label; the default is not added to
    content that has stored labels.
  - r2 carries exactly the default label (CTX-042).

  This holds in `context.retrieved` (each result's `labels`, and the
  event's `labels` as their union) and in the parts the model receives.
  The retrieval tool's labels are covered by
  context.retrieval-tool-result.
requirements: [CTX-042, PORT-081]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
          vectorStore: { adapter: memory, region: test-region, sources: [kb] }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
          "example.test:kb-stored":
            allowedProviders: [scripted-a, scripted-b]
          "example.test:kb-default":
            allowedProviders: [scripted-a, scripted-b]
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { retrieval: { auto: true, source: kb, defaultLabels: ["example.test:kb-default"] } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: text, text: "Here is the summary." }]
          usage: { inputTokens: 30, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    vectorStores:
      kb:
        - results:
            - { id: r1, text: "SYN-KB-0042-A stored with a label", tenant: t1, labels: ["example.test:kb-stored"] }
            - { id: r2, text: "SYN-KB-0042-B stored without labels", tenant: t1 }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Summarise the stored notes" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - type: context.retrieved
            provenances: ["retrieval:kb"]
            labels: { $all: [{ $len: 2 }, { $contains: ["example.test:kb-stored", "example.test:kb-default"] }] }
            payload:
              source: kb
              results:
                - { blob: { $any: true }, labels: ["example.test:kb-stored"] }
                - { blob: { $any: true }, labels: ["example.test:kb-default"] }
  providerRequests:
    scripted-a:
      - messages:
          $contains:
            - role: principal
              parts:
                - { type: text, text: "Summarise the stored notes", provenance: principal, labels: [] }
                - { type: text, text: "SYN-KB-0042-A stored with a label", provenance: "retrieval:kb", labels: ["example.test:kb-stored"] }
                - { type: text, text: "SYN-KB-0042-B stored without labels", provenance: "retrieval:kb", labels: ["example.test:kb-default"] }
  stubCalls:
    vectorStore/kb: { count: 1 }
