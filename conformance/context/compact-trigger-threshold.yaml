          - { type: context.compacted, turn: 2, step: 1, payload: { mode: truncate, units: [{ turn: 1 }] } }
          - { type: model.request, turn: 2, step: 1, payload: { provider: scripted-a } }
          - { type: run.ended, payload: { reason: responded } }
    $sAt:
