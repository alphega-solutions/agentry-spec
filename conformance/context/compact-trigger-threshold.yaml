schemaVersion: "0.1.0"
id: context.compact-trigger-threshold
title: Compaction runs only when assembled context exceeds the configured fill level of the smallest candidate's space
description: >-
  The profile sets `compaction.mode: truncate` and `triggerPercent: 80`.
  The primary scripted-a declares contextLimit 1000 and the fallback
  scripted-b contextLimit 120; both set maxOutputTokens 20 explicitly, so
  the default reserveOutputTokens (the largest maxOutputTokens among the
  candidates) is 20. Available space is the smallest contextLimit among
  the candidates (PROV-044) minus the reserve: 120 − 20 = 100, and
  compaction triggers when context exceeds 80% of it, 80 tokens. Measured
  against the primary alone (1000 − 20 = 980, trigger 784) nothing here
  would ever compact. Both scripted adapters count tokens the same way
  (PROV-045), so every candidate's count is the one below.


  Token count (one per word of a text part): system content is
  "Follow organisational policy." (3) + "You are a test assistant." (5) = 8.
  Turn 1 in every session: principal text 30 words, response text 20
  words; its request is 8 + 30 = 38 (no compaction). Turn 2's request is
  8 + 30 + 20 + P2, where P2 is the turn-2 principal text:

  - $sOver: P2 = 23 → 81 > 80 → compacts. The only droppable unit is
    turn 1; without it the context is 8 + 23 = 31. `context.compacted`
    (turn 2, step 1) lists `{turn: 1}` and the request holds only system
    content and the turn-2 principal message.
  - $sAt: P2 = 22 → 80, not above 80 → no compaction; the request holds
    turn 1 in full.
  - $sBelow: P2 = 21 → 79 → no compaction.

  Every call goes to scripted-a; scripted-b is never called. Turn-2
  requests are asserted exactly: one `system` message with one text part
  per instruction source (bundle, then persona), then the rest.
requirements: [CTX-050, PROV-044, PROV-045]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { compaction: { mode: truncate, triggerPercent: 80 } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { contextLimit: 1000, maxOutputTokens: 20 }
      responses:
        # $sOver
        - parts: [{ type: text, text: "SYN-OR-01 SYN-OR-02 SYN-OR-03 SYN-OR-04 SYN-OR-05 SYN-OR-06 SYN-OR-07 SYN-OR-08 SYN-OR-09 SYN-OR-10 SYN-OR-11 SYN-OR-12 SYN-OR-13 SYN-OR-14 SYN-OR-15 SYN-OR-16 SYN-OR-17 SYN-OR-18 SYN-OR-19 SYN-OR-20" }]
          usage: { inputTokens: 38, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done." }]
          usage: { inputTokens: 31, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sAt
        - parts: [{ type: text, text: "SYN-AR-01 SYN-AR-02 SYN-AR-03 SYN-AR-04 SYN-AR-05 SYN-AR-06 SYN-AR-07 SYN-AR-08 SYN-AR-09 SYN-AR-10 SYN-AR-11 SYN-AR-12 SYN-AR-13 SYN-AR-14 SYN-AR-15 SYN-AR-16 SYN-AR-17 SYN-AR-18 SYN-AR-19 SYN-AR-20" }]
          usage: { inputTokens: 38, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done." }]
          usage: { inputTokens: 80, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sBelow
        - parts: [{ type: text, text: "SYN-BR-01 SYN-BR-02 SYN-BR-03 SYN-BR-04 SYN-BR-05 SYN-BR-06 SYN-BR-07 SYN-BR-08 SYN-BR-09 SYN-BR-10 SYN-BR-11 SYN-BR-12 SYN-BR-13 SYN-BR-14 SYN-BR-15 SYN-BR-16 SYN-BR-17 SYN-BR-18 SYN-BR-19 SYN-BR-20" }]
          usage: { inputTokens: 38, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done." }]
          usage: { inputTokens: 79, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      responses: []
