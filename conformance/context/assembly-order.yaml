schemaVersion: "0.1.0"
id: context.assembly-order
title: "Context is assembled in order: bundle instructions in stack order, persona instructions, summaries, history, then the current turn with retrieved parts appended to the principal message"
description: >-
  The deployment stacks org@1 then dept@1; the persona has its own
  instructions. Automatic retrieval from `kb` is on; the profile compacts
  by summarize with its own summarizer provider scripted-sum. Both session
  models declare contextLimit 200 and maxOutputTokens 20: space 180,
  compaction above 90% of it, i.e. above 162 tokens. Token counts (one
  per word of a text part, 10 per other part): system content 12
  ("Follow organisational policy." 3 + "Follow SYN-DEPT-0010 departmental
  policy." 4 + "You are a test assistant." 5).

  - Turn 1: input 130 words, retrieval returns nothing; context 12 + 130 =
    142 ≤ 162. Answer 2 words; turn 1 costs 132.
  - Turn 2: input 5 words, nothing retrieved; context 12 + 132 + 5 = 149 ≤
    162. Answer 2 words; turn 2 costs 7.
  - Turn 3: input 4 words + a file attachment (10) + one retrieved record
    (4 words) = 18; context 12 + 132 + 7 + 18 = 169 > 162, so the oldest
    unit, turn 1, is summarized (6-word summary): 12 + 6 + 7 + 18 = 43 ≤
    162. Step 1 calls lookup; step 2 adds a tool_call and a tool_result
    (10 each): 63 ≤ 162, no further compaction.

  The turn-3 requests are asserted exactly (arrays match exactly). Reading
  chosen for the system content, which the spec orders but does not lay
  out: one `system`-role message whose parts are each instruction text, in
  order (bundle stack order, then persona), unchanged. The summary is one
  `assistant`-role message with one text part (Area 7 amendment
  2026-11-01) whose provenance is the least-trusted of turn 1's
  (principal, model → model). The retrieved part follows the principal's
  input and attachment, in the same message; this turn's assistant tool
  call and its tool message follow, in event order.
requirements: [CTX-010]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: PolicyBundle
        id: dept
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow SYN-DEPT-0010 departmental policy."
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1, dept@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          - { id: scripted-sum, adapter: scripted, endpoint: "memory://scripted-sum", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
          vectorStore: { adapter: memory, region: test-region, sources: [kb] }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context:
          compaction: { mode: summarize, model: { provider: scripted-sum, name: sum-1 } }
          retrieval: { auto: true, source: kb }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { contextLimit: 200, maxOutputTokens: 20 }
      responses:
        - parts: [{ type: text, text: "First answer." }]
          usage: { inputTokens: 142, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Second answer." }]
          usage: { inputTokens: 149, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k3 } }]
          usage: { inputTokens: 43, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Report summarised." }]
          usage: { inputTokens: 63, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b:
      capabilities: { contextLimit: 200, maxOutputTokens: 20 }
      responses: []
    scripted-sum:
      responses:
        - parts: [{ type: text, text: "SYN-SUMMARY-0001 the principal sent filler text" }]
          usage: { inputTokens: 132, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "SYN-VALUE-0003" } }
    vectorStores:
      kb:
        - results: []
        - results: []
        - results: [{ id: kb-3, text: "SYN-KB-0003 widgets ship Mondays", tenant: t1 }]
  ports:
    blobStore:
      t1:
        - id: blob-file-1
          hash: "sha256:488b66a845535f2173fe026ad21ad4238ca6b733b00a24ba332adab6729a0a80"
          mediaType: text/plain
          size: 44
          data: "U1lOVEhFVElDLUZJTEUtMDAwMTogcXVhcnRlcmx5IHdpZGdldCByZXBvcnQ="
