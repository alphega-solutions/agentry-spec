expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: turn.started, turn: 3 }
          - { type: context.retrieved, payload: { source: kb, query: "Summarise the attached report" } }
          - { type: context.compacted, payload: { mode: summarize, units: [{ turn: 1 }] } }
          - { type: model.request, turn: 3, step: 1 }
          - { type: tool.result, turn: 3, step: 1, payload: { callId: c1 } }
          - { type: model.request, turn: 3, step: 2 }
      absentEvents:
        - { type: model.request, payload: { provider: scripted-sum } }
  providerRequests:
    scripted-sum: { count: 1 }
    scripted-b: { count: 0 }
    scripted-a:
