              - { type: file, mediaType: text/plain, blob: { id: blob-file-1 }, provenance: "attachment:upload", labels: [] }
              - { type: text, text: "SYN-KB-0003 widgets ship Mondays", provenance: "retrieval:kb", labels: [] }
      # Turn 3, step 2
