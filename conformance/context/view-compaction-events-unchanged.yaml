schemaVersion: "0.1.0"
id: context.view-compaction-events-unchanged
title: A truncate compaction leaves every earlier event in the log unchanged and in order
description: >-
  Both scripted models declare contextLimit 100 and maxOutputTokens 20, so
  the space available is 100 − 20 = 80 tokens and compaction triggers above
  90% of it, i.e. above 72 tokens; mode truncate. Token counts (one per word
  of a text part): system content 8 ("Follow organisational policy." 3 +
  "You are a test assistant." 5).

  - Turn 1: input 30 words; context 8 + 30 = 38 ≤ 72. Answer 10 words, so
    turn 1 costs 40.
  - Turn 2: input 10 words; context 8 + 40 + 10 = 58 ≤ 72. Answer 4
    words; turn 2 costs 14.
  - Turn 3: input 15 words; context 8 + 40 + 14 + 15 = 77 > 72, so turn 1
    is dropped: 8 + 14 + 15 = 37 ≤ 72.

  Each turn-1 and turn-2 run captures, as its events are persisted, the
  eventId and seq of its turn.started, model.request, model.response and
  run.ended, and the full payloads of its model.request and model.response
  (and the response's timestamp, provenances and labels). After the
  turn-3 compaction the event log must still hold every captured event with
  the same eventId, seq and deep-equal payload, in the same order. Because
  seq is gap-free (CORE-160), unchanged seq values for the last event of
  each earlier run mean no earlier event was removed or inserted; the
  counts of turn.started, model.request and model.response (three each)
  confirm nothing was duplicated. The turn-3 request shows the compaction
  took effect: no turn-1 content, turn 2 kept.
requirements: [CTX-002]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { compaction: { mode: truncate } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { contextLimit: 100, maxOutputTokens: 20 }
      responses:
        - parts: [{ type: text, text: "Turn one answer with exactly ten words in this reply." }]
          usage: { inputTokens: 38, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Second answer is here." }]
          usage: { inputTokens: 58, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done." }]
          usage: { inputTokens: 37, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b:
      capabilities: { contextLimit: 100, maxOutputTokens: 20 }
      responses: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "SYNTHETIC-FILLER-0000 SYNTHETIC-FILLER-0001 SYNTHETIC-FILLER-0002 SYNTHETIC-FILLER-0003 SYNTHETIC-FILLER-0004 SYNTHETIC-FILLER-0005 SYNTHETIC-FILLER-0006 SYNTHETIC-FILLER-0007 SYNTHETIC-FILLER-0008 SYNTHETIC-FILLER-0009 SYNTHETIC-FILLER-0010 SYNTHETIC-FILLER-0011 SYNTHETIC-FILLER-0012 SYNTHETIC-FILLER-0013 SYNTHETIC-FILLER-0014 SYNTHETIC-FILLER-0015 SYNTHETIC-FILLER-0016 SYNTHETIC-FILLER-0017 SYNTHETIC-FILLER-0018 SYNTHETIC-FILLER-0019 SYNTHETIC-FILLER-0020 SYNTHETIC-FILLER-0021 SYNTHETIC-FILLER-0022 SYNTHETIC-FILLER-0023 SYNTHETIC-FILLER-0024 SYNTHETIC-FILLER-0025 SYNTHETIC-FILLER-0026 SYNTHETIC-FILLER-0027 SYNTHETIC-FILLER-0028 SYNTHETIC-FILLER-0029" }]
    capture:
      - event: { type: turn.started }
        bind: { eventId: $t1StartId, seq: $t1StartSeq }
      - event: { type: model.request }
        bind: { eventId: $t1ReqId, seq: $t1ReqSeq, payload: $t1ReqPayload }
      - event: { type: model.response }
        bind: { eventId: $t1RespId, seq: $t1RespSeq, timestamp: $t1RespTs, payload: $t1RespPayload, provenances: $t1RespProv, labels: $t1RespLabels }
      - event: { type: run.ended }
        bind: { eventId: $t1EndId, seq: $t1EndSeq }
    expect: { ok: true, endReason: responded }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Second question with ten words to keep the history short." }]
    capture:
      - event: { type: turn.started }
        bind: { eventId: $t2StartId, seq: $t2StartSeq }
      - event: { type: model.request }
        bind: { eventId: $t2ReqId, seq: $t2ReqSeq, payload: $t2ReqPayload }
      - event: { type: model.response }
        bind: { eventId: $t2RespId, seq: $t2RespSeq, timestamp: $t2RespTs, payload: $t2RespPayload, provenances: $t2RespProv, labels: $t2RespLabels }
      - event: { type: run.ended }
        bind: { eventId: $t2EndId, seq: $t2EndSeq }
    expect: { ok: true, endReason: responded }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Third question carries fifteen words so that the assembled context crosses the trigger level now." }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { eventId: $t1StartId, seq: $t1StartSeq, type: turn.started, turn: 1 }
          - { eventId: $t1ReqId, seq: $t1ReqSeq, type: model.request, turn: 1, step: 1, payload: $t1ReqPayload }
          - { eventId: $t1RespId, seq: $t1RespSeq, type: model.response, turn: 1, step: 1, timestamp: $t1RespTs, payload: $t1RespPayload, provenances: $t1RespProv, labels: $t1RespLabels }
          - { eventId: $t1EndId, seq: $t1EndSeq, type: run.ended }
          - { eventId: $t2StartId, seq: $t2StartSeq, type: turn.started, turn: 2 }
          - { eventId: $t2ReqId, seq: $t2ReqSeq, type: model.request, turn: 2, step: 1, payload: $t2ReqPayload }
          - { eventId: $t2RespId, seq: $t2RespSeq, type: model.response, turn: 2, step: 1, timestamp: $t2RespTs, payload: $t2RespPayload, provenances: $t2RespProv, labels: $t2RespLabels }
          - { eventId: $t2EndId, seq: $t2EndSeq, type: run.ended }
          - { type: turn.started, turn: 3 }
          - { type: context.compacted, payload: { mode: truncate, units: [{ turn: 1 }] } }
          - { type: model.request, turn: 3, step: 1 }
          - { type: run.ended, payload: { reason: responded } }
  ports:
    eventLog:
      t1:
        $s:
          $all:
            - $count: { of: { type: turn.started }, equals: 3 }
            - $count: { of: { type: model.request }, equals: 3 }
            - $count: { of: { type: model.response }, equals: 3 }
            - $count: { of: { type: context.compacted }, equals: 1 }
  providerRequests:
    scripted-a:
      - {}
      - {}
      - messages:
          $all:
            - $count: { of: { parts: { $contains: [{ type: text, text: { $regex: "SYNTHETIC-FILLER" } }] } }, equals: 0 }
            - $count: { of: { parts: { $contains: [{ type: text, text: "Turn one answer with exactly ten words in this reply." }] } }, equals: 0 }
            - $contains:
                - role: principal
                  parts: [{ type: text, text: "Second question with ten words to keep the history short." }]
                - role: assistant
                  parts: [{ type: text, text: "Second answer is here." }]
    scripted-b: { count: 0 }
