            - $count: { of: { parts: { $contains: [{ text: "SYN-CP-01 SYN-CP-02 SYN-CP-03 SYN-CP-04 SYN-CP-05 SYN-CP-06 SYN-CP-07 SYN-CP-08 SYN-CP-09 SYN-CP-10 SYN-CP-11 SYN-CP-12 SYN-CP-13 SYN-CP-14 SYN-CP-15 SYN-CP-16 SYN-CP-17 SYN-CP-18 SYN-CP-19 SYN-CP-20 SYN-CP-21 SYN-CP-22 SYN-CP-23 SYN-CP-24 SYN-CP-25 SYN-CP-26 SYN-CP-27 SYN-CP-28 SYN-CP-29 SYN-CP-30 SYN-CP-31 SYN-CP-32 SYN-CP-33 SYN-CP-34 SYN-CP-35 SYN-CP-36 SYN-CP-37 SYN-CP-38 SYN-CP-39 SYN-CP-40 SYN-CP-41 SYN-CP-42 SYN-CP-43 SYN-CP-44 SYN-CP-45" }] } }, equals: 0 }
            - $count: { of: { parts: { $contains: [{ text: "SYN-DP-01 SYN-DP-02 SYN-DP-03 SYN-DP-04 SYN-DP-05 SYN-DP-06 SYN-DP-07 SYN-DP-08 SYN-DP-09 SYN-DP-10 SYN-DP-11 SYN-DP-12 SYN-DP-13 SYN-DP-14 SYN-DP-15 SYN-DP-16 SYN-DP-17 SYN-DP-18 SYN-DP-19 SYN-DP-20" }] } }, equals: 0 }
    scripted-a:
