schemaVersion: "0.1.0"
id: context.retrieval-auto-resume-no-requery
title: A resumed turn reuses its recorded retrieval and does not query the vector store again
description: >-
  The profile enables automatic retrieval from `kb` (limit default 5). The
  vector store stub has exactly one behaviour, so a second query fails the
  test.

  Run $r1: the port is queried once and its one result is appended to the
  principal message. The retrieved content taints the session, so the
  model's mutating `update_record` call escalates at stage 5 and the run
  ends `escalated`.

  Run $r2: a reviewer approves and `resume()` continues the same turn
  (CTX-031): the call is dispatched and the model is called again. No
  second `context.retrieved` is emitted and the port is not queried
  again, yet the model still receives the retrieved part in the principal
  message, reproduced from the recorded `context.retrieved` (CTX-001).
requirements: [CTX-031]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
          vectorStore: { adapter: memory, region: test-region, sources: [kb] }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { retrieval: { auto: true, source: kb } }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # After resume
        - parts: [{ type: text, text: "Updated." }]
          usage: { inputTokens: 40, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    vectorStores:
      kb:
        - results:
            - { id: r1, text: "SYN-KB-0031-R k1 holds the plan tier", tenant: t1 }
    tools:
      update_record:
        - ok: { output: { updated: true } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.pendingActions.0.id: $act }
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000001", pendingActionId: $act, type: approve }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: run.started, runId: $r1 }
          - { type: context.retrieved, runId: $r1, payload: { source: kb, query: "Set k1 to v1", limit: 5, results: { $len: 1 } } }
          - { type: model.request, runId: $r1, turn: 1, step: 1 }
          - { type: policy.decision, runId: $r1, payload: { kind: taint, outcome: escalate, callId: c1, provenances: ["retrieval:kb"] } }
          - { type: run.ended, runId: $r1, payload: { reason: escalated } }
          - { type: run.started, runId: $r2, payload: { kind: resume } }
          - { type: tool.call, runId: $r2, payload: { callId: c1, tool: update_record } }
          - { type: model.request, runId: $r2, turn: 1, step: 2 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: context.retrieved, runId: $r2 }
  stubCalls:
    vectorStore/kb:
      - arguments: { tenant: t1, text: "Set k1 to v1", limit: 5 }
    update_record: [{ arguments: { key: k1, value: v1 } }]
  providerRequests:
    scripted-a:
      - messages:
          $contains:
            - role: principal
              parts:
                - { type: text, text: "Set k1 to v1", provenance: principal, labels: [] }
                - { type: text, text: "SYN-KB-0031-R k1 holds the plan tier", provenance: "retrieval:kb", labels: [] }
      - messages:
          $contains:
            - role: principal
              parts:
                - { type: text, text: "Set k1 to v1", provenance: principal, labels: [] }
                - { type: text, text: "SYN-KB-0031-R k1 holds the plan tier", provenance: "retrieval:kb", labels: [] }
