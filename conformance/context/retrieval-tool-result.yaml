schemaVersion: "0.1.0"
id: context.retrieval-tool-result
title: A retrieval tool's results carry provenance `retrieval:<source>` and their labels, are filtered by the port, and taint the session
description: >-
  `kb_search` is a retrieval tool on source `kb`, visible to the persona.
  The profile sets `retrieval.defaultLabels: [example.test:kb-default]`
  and leaves automatic retrieval off. Both custom labels have sensitivity
  policies allowing both scripted providers and no redaction, so content
  is asserted unmasked.

  The model calls `kb_search` with `{query: "refund policy", limit: 2}`.
  The port is queried with tenant t1, that text and limit 2. The backend
  returns, in rank order, a record of tenant t2 (SYN-OTHER-TENANT-0020),
  d1 (stored label example.test:kb-stored), d2 (no stored labels) and d3
  (SYN-BEYOND-LIMIT-0020). The port drops the other tenant's record and
  applies the limit after filtering, so the result is d1, d2.

  - The `ok` output is `{results: [{id, text}]}` in the port's order.
  - The `tool.result` event and the `tool_result` part sent to the model
    carry provenance `retrieval:kb`, not `tool:kb_search` (CTX-021), and
    the union of the results' labels: d1's stored label and, for d2,
    which was stored without labels, the default label (CTX-042, Area 7
    amendment 2026-11-01).
  - The content is untrusted (CTX-040): the following mutating
    `update_record` call is stopped at stage 5 by the taint rule, whose
    decision names exactly `retrieval:kb`, and the checkpoint records it.
  - A retrieval tool call is not automatic retrieval: no
    `context.retrieved` is emitted.
  - Neither the other tenant's record nor the record cut by the limit is
    persisted or sent anywhere (CTX-041).

  Token use is far below the scripted default limits; no compaction.
requirements: [CTX-020, CTX-021, CTX-040, CTX-041, CTX-042]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
          vectorStore: { adapter: memory, region: test-region, sources: [kb] }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
          "example.test:kb-stored":
            allowedProviders: [scripted-a, scripted-b]
          "example.test:kb-default":
            allowedProviders: [scripted-a, scripted-b]
      - kind: Tool
        id: kb_search
        version: 1
        schemaVersion: "0.1.0"
        description: Search the knowledge base.
        input:
          type: object
          additionalProperties: false
          required: [query]
          properties: { query: { type: string }, limit: { type: integer, minimum: 1 } }
        effect: read
        binding: { kind: retrieval, source: kb }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, kb_search@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { retrieval: { defaultLabels: ["example.test:kb-default"] } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: kb_search, arguments: { query: "refund policy", limit: 2 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    vectorStores:
      kb:
        - results:
            - { id: x1, text: "SYN-OTHER-TENANT-0020", tenant: t2 }
            - { id: d1, text: "SYN-KB-0020-A refunds within thirty days", tenant: t1, labels: ["example.test:kb-stored"] }
            - { id: d2, text: "SYN-KB-0020-B refunds need a receipt", tenant: t1 }
            - { id: d3, text: "SYN-BEYOND-LIMIT-0020", tenant: t1 }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Check the refund policy, then set k1 to v1" }]
    expect: { ok: true, endReason: escalated }
expect:
  sessions:
    $s:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: kb_search, arguments: { query: "refund policy", limit: 2 } } }
          - type: tool.result
            provenances: ["retrieval:kb"]
            labels: { $all: [{ $len: 2 }, { $contains: ["example.test:kb-stored", "example.test:kb-default"] }] }
            payload:
              callId: c1
              tool: kb_search
              result:
                ok:
                  output:
                    results:
                      - { id: d1, text: "SYN-KB-0020-A refunds within thirty days" }
                      - { id: d2, text: "SYN-KB-0020-B refunds need a receipt" }
          - { type: policy.decision, payload: { kind: taint, outcome: escalate, callId: c2, tool: update_record, provenances: ["retrieval:kb"] } }
          - { type: escalation.raised, payload: { escalation: { sources: [taint] } } }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call, payload: { callId: c2 } }
        - { type: context.retrieved }
      checkpoint:
        taint: { tainted: true, provenances: ["retrieval:kb"] }
  providerRequests:
    scripted-a:
      - tools: { $contains: [{ name: kb_search }] }
      - messages:
          $contains:
            - role: tool
              parts:
                - type: tool_result
                  callId: c1
                  provenance: "retrieval:kb"
                  labels: { $all: [{ $len: 2 }, { $contains: ["example.test:kb-stored", "example.test:kb-default"] }] }
                  result:
                    ok:
                      output:
                        results:
                          - { id: d1, text: "SYN-KB-0020-A refunds within thirty days" }
                          - { id: d2, text: "SYN-KB-0020-B refunds need a receipt" }
  stubCalls:
    vectorStore/kb:
      - arguments: { tenant: t1, text: "refund policy", limit: 2 }
    update_record: { count: 0 }
  noPersistedContent: ["SYN-OTHER-TENANT-0020", "SYN-BEYOND-LIMIT-0020"]
  noTransmittedContent: ["SYN-OTHER-TENANT-0020", "SYN-BEYOND-LIMIT-0020"]
