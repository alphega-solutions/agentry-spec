schemaVersion: "0.1.0"
id: context.retrieval-auto-after-session-start
title: Automatic retrieval queries once per turn, after `sessionStart` rewrites, with the effective limit
description: >-
  The profile enables automatic retrieval from `kb` with `retrieval.limit:
  2`. The remote sessionStart hook `rewrite-input` rewrites the first
  turn's input.

  Turn 1: the principal sends "SYN-ORIGINAL-0031 refunds?". The hook sees
  only that part (retrieval has not happened yet) and rewrites it into two
  text parts, "SYN-REWRITTEN-0031 refund policy" and "for annual plans"
  (both provenance principal, HOOK-021). The port is then queried once,
  with the text parts of the rewritten message joined by a newline (Area 7
  amendment 2026-11-01) and limit 2. The backend returns three records;
  the first two are appended to the principal message as text parts with
  provenance `retrieval:kb`, in the port's order, and the third is never
  used. `context.retrieved` records the rewritten query and the limit,
  before the turn's first model call. The turn has two steps (a lookup,
  then an answer); the retrieved parts stay in the principal message in
  step 2 and the port is not queried again.

  Turn 2: no sessionStart hook runs. The port is queried once more, with
  turn 2's input as typed, and its one result is appended to turn 2's
  principal message.

  Retrieved records carry no stored labels and the profile sets no
  defaultLabels, so retrieved parts have no labels. Token use is far
  below the scripted default limits; no compaction.
requirements: [CTX-030, CTX-031]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        remoteHooks:
          - { id: rewrite-input, endpoint: "memory://hook-rewrite-input", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
          vectorStore: { adapter: memory, region: test-region, sources: [kb] }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Hook
        id: rewrite-input
        version: 1
        schemaVersion: "0.1.0"
        points: [sessionStart]
        results: [rewrite]
        timeoutMs: 1000
        source: { kind: remote, endpoint: rewrite-input }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [rewrite-input@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { retrieval: { auto: true, source: kb, limit: 2 } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # Turn 1
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Answer one." }]
          usage: { inputTokens: 40, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        # Turn 2
        - parts: [{ type: text, text: "Answer two." }]
          usage: { inputTokens: 50, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    remoteHooks:
      rewrite-input:
        - result: rewrite
          parts:
            - { type: text, text: "SYN-REWRITTEN-0031 refund policy" }
            - { type: text, text: "for annual plans" }
    vectorStores:
      kb:
        - results:
            - { id: r1, text: "SYN-KB-0031-A annual plans are refundable pro rata", tenant: t1 }
            - { id: r2, text: "SYN-KB-0031-B refunds take five days", tenant: t1 }
            - { id: r3, text: "SYN-KB-0031-C beyond the limit", tenant: t1 }
        - results:
            - { id: r4, text: "SYN-KB-0031-D monthly plans are not refundable", tenant: t1 }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "SYN-ORIGINAL-0031 refunds?" }]
    expect: { ok: true, endReason: responded }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "What about monthly plans?" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: turn.started, turn: 1 }
          - { type: hook.decision, payload: { hook: rewrite-input@1, point: sessionStart, result: rewrite } }
          - type: context.retrieved
            provenances: ["retrieval:kb"]
            payload:
              source: kb
              query: "SYN-REWRITTEN-0031 refund policy\nfor annual plans"
              limit: 2
              results: { $len: 2 }
          - { type: model.request, turn: 1, step: 1 }
          - { type: model.request, turn: 1, step: 2 }
          - { type: turn.started, turn: 2 }
          - type: context.retrieved
            payload:
              source: kb
              query: "What about monthly plans?"
              limit: 2
              results: { $len: 1 }
          - { type: model.request, turn: 2, step: 1 }
          - { type: run.ended, payload: { reason: responded } }
  stubCalls:
    rewrite-input:
      - arguments:
          point: sessionStart
          content: [{ type: text, text: "SYN-ORIGINAL-0031 refunds?", provenance: principal, labels: [] }]
    vectorStore/kb:
      - arguments: { tenant: t1, text: "SYN-REWRITTEN-0031 refund policy\nfor annual plans", limit: 2 }
      - arguments: { tenant: t1, text: "What about monthly plans?", limit: 2 }
  providerRequests:
    scripted-a:
      - messages:
          $contains:
            - role: principal
              parts:
                - { type: text, text: "SYN-REWRITTEN-0031 refund policy", provenance: principal, labels: [] }
                - { type: text, text: "for annual plans", provenance: principal, labels: [] }
                - { type: text, text: "SYN-KB-0031-A annual plans are refundable pro rata", provenance: "retrieval:kb", labels: [] }
                - { type: text, text: "SYN-KB-0031-B refunds take five days", provenance: "retrieval:kb", labels: [] }
      - messages:
          $contains:
            - role: principal
              parts:
                - { type: text, text: "SYN-REWRITTEN-0031 refund policy", provenance: principal, labels: [] }
                - { type: text, text: "for annual plans", provenance: principal, labels: [] }
                - { type: text, text: "SYN-KB-0031-A annual plans are refundable pro rata", provenance: "retrieval:kb", labels: [] }
                - { type: text, text: "SYN-KB-0031-B refunds take five days", provenance: "retrieval:kb", labels: [] }
      - messages:
          $contains:
            - role: principal
              parts:
                - { type: text, text: "What about monthly plans?", provenance: principal, labels: [] }
                - { type: text, text: "SYN-KB-0031-D monthly plans are not refundable", provenance: "retrieval:kb", labels: [] }
  noPersistedContent: ["SYN-KB-0031-C"]
  noTransmittedContent: ["SYN-KB-0031-C"]
