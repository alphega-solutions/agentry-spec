expect:
  sessions:
    $sFail:
      events:
        mode: subsequence
        items:
          - { type: error, payload: { error: { source: provider } } }
          - { type: context.compacted, turn: 2, step: 1, payload: { mode: truncate, fallback: summarizer_failed, units: [{ turn: 1 }], summary: { $absent: true } } }
          - { type: model.request, turn: 2, step: 1 }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: context.compacted, payload: { mode: summarize } }
        - { type: policy.decision, payload: { kind: summarizer } }
    $sDenied:
      events:
        mode: subsequence
        items:
          - { type: policy.decision, payload: { kind: summarizer, outcome: block } }
          - { type: context.compacted, turn: 2, step: 1, payload: { mode: truncate, fallback: policy_denied, units: [{ turn: 1 }], summary: { $absent: true } } }
          - { type: model.request, turn: 2, step: 1 }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: context.compacted, payload: { mode: summarize } }
  providerRequests:
    scripted-sum:
      - messages:
          $contains:
            - role: principal
              parts: [{ type: text, text: "SYN-FP-01 SYN-FP-02 SYN-FP-03 SYN-FP-04 SYN-FP-05 SYN-FP-06 SYN-FP-07 SYN-FP-08 SYN-FP-09 SYN-FP-10 SYN-FP-11 SYN-FP-12 SYN-FP-13 SYN-FP-14 SYN-FP-15 SYN-FP-16 SYN-FP-17 SYN-FP-18 SYN-FP-19 SYN-FP-20" }]
