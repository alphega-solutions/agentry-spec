schemaVersion: "0.1.0"
id: context.compact-minimum-units
title: Truncation and summarization remove only as many units as needed to fit
description: >-
  Both scripted models declare contextLimit 120 and maxOutputTokens 20:
  available space 100, compaction above 90 (default triggerPercent).
  System content is 8 tokens ("Follow organisational policy." 3 + "You
  are a test assistant." 5). Turns 1–3 each have a 10-word principal text
  and a 10-word response (20 tokens per turn); their requests are 18, 38
  and 58 tokens, so nothing compacts before turn 4.

  - $sTrunc (profile default@1, truncate): turn 4's text is 60 words → 8 +
    60 + 60 = 128 > 90. Without turn 1: 108, above the space of 100, so
    one unit is not enough; without turns 1 and 2: 88, which fits. Turn 3
    is kept: `units` is exactly `[{turn: 1}, {turn: 2}]` and the request
    holds turn 3 and turn 4's principal message.
  - $sSum (profile summarizing@1, summarize with scripted-sum): turn 4's
    text is 55 words → 123 > 90. Replacing turn 1 alone leaves at least
    103 (106 with the 3-word summary), above 100; replacing turns 1 and 2
    leaves 83 + 3 = 86, which fits. `units` is exactly `[{turn: 1}, {turn:
    2}]`; the request holds the summary, turn 3 and turn 4's principal
    message.

  Under the settled readings, context fits at or below the trigger level
  (90), and `summarize` picks the smallest prefix of droppable units whose
  removal fits without counting the summary (turn 1 alone: 103 > 90;
  turns 1–2: 83), calls the summarizer once, then applies the fit rule
  with the summary counted (86 ≤ 90). The figures also give the same unit
  count if "fits" were read as within the space (100). Every candidate
  sets maxOutputTokens 20, so the default reserve is 20. Turn-4 requests
  are asserted exactly, starting with the one `system` message (one text
  part per instruction source).
requirements: [CTX-070]
contract: ">=0.1.0 <1.0.0"
