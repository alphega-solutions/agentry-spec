schemaVersion: "0.1.0"
id: context.retrieval-vector-store-error
title: A vector store failure during automatic retrieval is retried as the profile allows; a final failure emits an error event, records no retrieval, and the turn continues untainted
description: >-
  Profile default@1 enables automatic retrieval from `kb` and sets
  `retry.unavailable: 0`, so the failing query of $s is not retried (one
  vector store behaviour for it). The bundle trusts
  `update_record@1`, so its own result does not taint the session.

  $s's query fails with category `unavailable`. Per the Area 7 amendment
  2026-11-01 (Retrieval), an `error` event with `source: port` is
  emitted, no `context.retrieved` is emitted, and the turn continues
  without retrieved content: the model receives only the principal's
  part. Nothing entered context, so the session is not tainted
  (HOOK-120): the mutating `update_record` call is dispatched with no
  taint decision, the run ends `responded`, and the checkpoint is not
  tainted.

  As settled (Area 7 amendment, readings settled with the fixtures), a
  failing vector store is retried as the profile's `retry.unavailable`
  allows, and if it still fails this error handling applies and the turn
  continues, notwithstanding CORE-191's `fatal` handling of exhausted
  retries.

  $sRetry uses profile retrying@1 (`retry.unavailable: 1`). Its first
  query fails with category `unavailable` (retryable); the retry returns
  one record, so retrieval succeeds: `context.retrieved` with one result,
  the retrieved part in the request, and no `error` event, since only a
  final failure emits one. The vector store records two queries for it.
requirements: [CTX-031, HOOK-120]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
          vectorStore: { adapter: memory, region: test-region, sources: [kb] }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        trustedTools: [lookup@1, update_record@1]
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 0 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { retrieval: { auto: true, source: kb } }
      - kind: HarnessProfile
        id: retrying
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 1 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { retrieval: { auto: true, source: kb } }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1, retrying@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Updated." }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sRetry
        - parts: [{ type: text, text: "Widgets ship Mondays." }]
          usage: { inputTokens: 20, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    vectorStores:
      kb:
        # $s
        - error: { category: unavailable }
        # $sRetry: one retryable failure, then results
        - error: { category: unavailable, retryable: true }
        - results: [{ id: kb-r1, text: "SYN-KB-RETRY-0001 widgets ship Mondays", tenant: t1 }]
    tools:
      update_record:
        - ok: { output: { updated: true } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sRetry
    tenant: t1
    principal: p1
    persona: assistant@1
    profile: retrying@1
    input: [{ type: text, text: "When do widgets ship?" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: turn.started, turn: 1 }
          - { type: error, payload: { error: { category: unavailable, source: port } } }
          - { type: model.request, turn: 1, step: 1 }
          - { type: tool.call, payload: { callId: c1, tool: update_record } }
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { updated: true } } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: context.retrieved }
        - { type: policy.decision, payload: { kind: taint } }
        - { type: escalation.raised }
      checkpoint:
        taint: { tainted: false }
    $sRetry:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: turn.started, turn: 1 }
          - { type: context.retrieved, turn: 1, payload: { source: kb, query: "When do widgets ship?", results: { $len: 1 } } }
          - { type: model.request, turn: 1, step: 1 }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: error }
  providerRequests:
    scripted-a:
      - messages:
          $all:
            - $contains:
                - role: principal
                  parts: [{ type: text, text: "Set k1 to v1", provenance: principal, labels: [] }]
            - $every: { parts: { $count: { of: { provenance: { $regex: "^retrieval:" } }, equals: 0 } } }
      - {}
      # $sRetry
      - messages:
          $contains:
            - role: principal
              parts:
                - { type: text, text: "When do widgets ship?", provenance: principal, labels: [] }
                - { type: text, text: "SYN-KB-RETRY-0001 widgets ship Mondays", provenance: "retrieval:kb", labels: [] }
  stubCalls:
    vectorStore/kb:
      - { arguments: { tenant: t1, text: "Set k1 to v1", limit: 5 } }
      - { arguments: { tenant: t1, text: "When do widgets ship?", limit: 5 } }
      - { arguments: { tenant: t1, text: "When do widgets ship?", limit: 5 } }
    update_record: [{ arguments: { key: k1, value: v1 } }]
