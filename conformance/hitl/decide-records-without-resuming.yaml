schemaVersion: "0.1.0"
id: hitl.decide-records-without-resuming
title: decide() records decisions without resuming; resume() with decisions records them, then resumes
description: >-
  update_record has `approval: always`, so each session's call escalates at
  stage 7 at 2026-01-01T00:00Z.


  $a: at 01:00 reviewer r1 approves with decide(). Nothing resumes: the
  session stays `suspended` with the decision held in its checkpoint's
  escalation, a `decision` audit record is written, and no run starts or
  ends (one `run.started` in all, no `escalation.resolved`, no tool call);
  decide() itself emits no events (HITL-040 as amended 2026-11-01).


  $b: r1 approves with decide() at 01:00; at 02:00 resume() is called with
  no decisions and is accepted, because the decision recorded by decide()
  already decides the action. Its resume run starts at 02:00, not 01:00,
  and `escalation.resolved` lists the decide() decision.


  $c: resume() itself carries the approval (02:00). It is recorded as if
  submitted with decide() first (a `decision` audit record with the same
  shape, listed by `escalation.resolved`), and the session resumes.
requirements: [HITL-040]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k-a, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k-b, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k-c, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Updated k-b." }]
          usage: { inputTokens: 30, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Updated k-c." }]
          usage: { inputTokens: 30, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - ok: { output: { updated: k-b } }
        - ok: { output: { updated: k-c } }
script:
  - action: run
    bind: $a
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k-a to v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $escA, payload.escalation.pendingActions.0.id: $actA }
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $b
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k-b to v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $escB, payload.escalation.pendingActions.0.id: $actB }
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $c
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k-c to v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $escC, payload.escalation.pendingActions.0.id: $actC }
    expect: { ok: true, endReason: escalated }
  - clock: { advance: PT1H }
  - action: decide
    session: $a
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000a01", pendingActionId: $actA, type: approve }
    expect: { ok: true, newEvents: 0 }
  - action: decide
    session: $b
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000b01", pendingActionId: $actB, type: approve }
    expect: { ok: true, newEvents: 0 }
  - clock: { advance: PT1H }
  - action: resume
    session: $b
    reviewer: r1
    decisions: []
    expect: { ok: true, endReason: responded }
  - action: resume
    session: $c
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000c01", pendingActionId: $actC, type: approve }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $a:
      state: suspended
      checkpoint:
        state: suspended
        escalation:
          id: $escA
          decisions:
            - { id: "01900000-0000-7000-8000-000000000a01", pendingActionId: $actA, type: approve }
      absentEvents:
        - { type: run.started, payload: { kind: resume } }
        - { type: run.ended, timestamp: { $regex: "^2026-01-01T01:" } }
        - { type: escalation.resolved }
        - { type: tool.call }
    $b:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: run.ended, timestamp: { $regex: "^2026-01-01T00:" }, payload: { reason: escalated } }
          - { type: run.started, timestamp: { $regex: "^2026-01-01T02:" }, payload: { kind: resume } }
          - { type: escalation.resolved, payload: { escalationId: $escB, decisions: ["01900000-0000-7000-8000-000000000b01"] } }
          - { type: tool.call, payload: { callId: c1, arguments: { key: k-b, value: v1 } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: run.started, timestamp: { $regex: "^2026-01-01T01:" } }
        - { type: run.ended, timestamp: { $regex: "^2026-01-01T01:" } }
    $c:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: run.started, timestamp: { $regex: "^2026-01-01T02:" }, payload: { kind: resume } }
          - { type: escalation.resolved, payload: { escalationId: $escC, decisions: ["01900000-0000-7000-8000-000000000c01"] } }
          - { type: tool.call, payload: { callId: c1, arguments: { key: k-c, value: v1 } } }
          - { type: run.ended, payload: { reason: responded } }
  stubCalls:
    update_record:
      - { arguments: { key: k-b, value: v1 } }
      - { arguments: { key: k-c, value: v1 } }
  ports:
    eventLog:
      t1:
        $a:
          $count: { of: { type: run.started }, equals: 1 }
    auditLog:
      t1:
        $contains:
          - type: decision
            sessionId: $a
            timestamp: { $regex: "^2026-01-01T01:00:00" }
            details: { id: "01900000-0000-7000-8000-000000000a01", escalationId: $escA, pendingActionId: $actA, type: approve, decidedBy: reviewer }
          - type: decision
            sessionId: $b
            timestamp: { $regex: "^2026-01-01T01:00:00" }
            details: { id: "01900000-0000-7000-8000-000000000b01", escalationId: $escB, pendingActionId: $actB, type: approve, decidedBy: reviewer }
          - type: decision
            sessionId: $c
            timestamp: { $regex: "^2026-01-01T02:00:00" }
            details: { id: "01900000-0000-7000-8000-000000000c01", escalationId: $escC, pendingActionId: $actC, type: approve, decidedBy: reviewer }
  providerRequests:
    scripted-a: { count: 5 }
