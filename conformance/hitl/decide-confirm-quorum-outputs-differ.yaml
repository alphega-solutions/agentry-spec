schemaVersion: "0.1.0"
id: hitl.decide-confirm-quorum-outputs-differ
title: Two `succeeded` confirmations with different outputs are not the same outcome; the recovery action stays undecided and the session closes `expired` at suspendedTtl, even under onExpiry `reject`
description: >-
  The org bundle's reviewer rule for `recovery` requires two approvals.
  default@1 sets `onExpiry: reject` and suspendedTtl PT72H.
  update_record (mutating, not idempotent) declares timeoutMs 1000; its
  stub takes 10 s on the virtual clock and honours cancellation. The
  model calls it (c1) at 00:00:00 and the call times out at 00:00:01, so
  its outcome is unknown and a `recovery` action $act is raised
  (TOOL-055) at 00:00:01, with `requiredApprovals: 2` and expiresAt
  2026-01-04T00:00:01Z; the run ends `escalated`.

  - r1 confirms `succeeded` with output {updated: true, rows: 1}. One
    confirmation is not enough, so resume() fails with `conflict`
    (`agentry.hitl.pending`).
  - r2, a distinct reviewer, confirms `succeeded` with output {updated:
    true, rows: 2}. Both state `succeeded`, but the RFC 8785 canonical
    JSON of `{outcome, output}` differs, so they are not the same outcome
    (HITL-051 as amended 2026-11-14). No outcome has two confirmations,
    the action stays undecided, and resume() still fails with
    `agentry.hitl.pending`, persisting nothing.

  No reviewer agrees before the clock reaches the expiry,
  2026-01-04T00:00:01Z (a TTL has elapsed when the current time equals
  its expiry). listPendingEscalations then performs the expiry processing
  that is due and excludes the expired escalation. Because the undecided
  action is a `recovery` action, HITL-082 closes the session `expired`
  even though onExpiry is `reject`: a rejection would establish no
  outcome. `session.closed` (`expired`) is timestamped with the expiry
  time. No expiry rejection is recorded (the only decision records for
  $act are r1's and r2's), the escalation is never resolved, c1 never
  gets a `tool.result` (Area 6 settled readings, TOOL-034), the
  idempotency record stays `started` with no outcome, and update_record
  is never re-dispatched.
requirements: [HITL-051, HITL-082]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        reviewerRules:
          recovery: [{ rule: "'reviewer' in reviewer.roles", requiredApprovals: 2 }]
        sensitivityPolicies:
          pii: { allowedProviders: [scripted-a, scripted-b], redaction: [{ mode: mask }] }
          phi: { allowedProviders: [scripted-a], redaction: [{ mode: mask }] }
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        timeoutMs: 1000
        binding: { kind: native, handler: test.update_record }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        onExpiry: reject
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
        - { id: r2, subject: reviewer-2, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: SYN-k1, value: SYN-v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - { ok: { output: { updated: true } }, delayMs: 10000 }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set SYN-k1 to SYN-v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.pendingActions.0.id: $act, payload.escalation.pendingActions.0.idempotencyKey: $k }
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000591", pendingActionId: $act, type: confirm, outcome: succeeded, output: { updated: true, rows: 1 } }
    expect: { ok: false, error: { category: conflict, code: agentry.hitl.pending }, newEvents: 0 }
  - action: resume
    session: $s
    reviewer: r2
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000592", pendingActionId: $act, type: confirm, outcome: succeeded, output: { updated: true, rows: 2 } }
    expect: { ok: false, error: { category: conflict, code: agentry.hitl.pending }, newEvents: 0 }
  # Exactly the escalation's expiry (raised at 00:00:01 + PT72H).
  - clock: { set: "2026-01-04T00:00:01Z" }
  - action: listPendingEscalations
    tenant: t1
    expect: { ok: true, escalations: [] }
expect:
  sessions:
    $s:
      state: closed
      closeReason: expired
      events:
        mode: subsequence
        items:
          - type: escalation.raised
            payload:
              escalation:
                sources: [recovery]
                expiresAt: { $regex: "^2026-01-04T00:00:01" }
                pendingActions: [{ id: $act, kind: recovery, callId: c1, reviewerRequirements: { requiredApprovals: 2 } }]
          - { type: run.ended, payload: { reason: escalated } }
          - { type: session.closed, runId: { $absent: true }, timestamp: { $regex: "^2026-01-04T00:00:01" }, payload: { reason: expired } }
      absentEvents:
        - { type: escalation.resolved }
        - { type: tool.result }
  stubCalls:
    update_record:
      - { arguments: { key: SYN-k1, value: SYN-v1 }, cancelled: true }
  ports:
    idempotencyStore:
      t1:
        $k: { state: started, outcome: { $absent: true } }
    auditLog:
      t1:
        $all:
          - $count: { of: { type: decision, details: { pendingActionId: $act } }, equals: 2 }
          - $count: { of: { type: decision, details: { decidedBy: expiry } }, equals: 0 }
          - $contains:
              - { type: decision, reviewer: { subject: reviewer-1 }, details: { id: "01900000-0000-7000-8000-000000000591", type: confirm, outcome: succeeded } }
              - { type: decision, reviewer: { subject: reviewer-2 }, details: { id: "01900000-0000-7000-8000-000000000592", type: confirm, outcome: succeeded } }
  providerRequests:
    scripted-a: { count: 1 }
