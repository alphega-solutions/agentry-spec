schemaVersion: "0.1.0"
id: hitl.raise-grouped-one-step
title: Calls escalating in one step form one escalation with a pending action each, in request order, with distinct sources and reason codes
description: >-
  An untrusted lookup result taints the session at step 1. At step 2 one
  model response requests, in this order: c2 set_status (`onTainted:
  allow`, `approval: always` → escalates at stage 7, source `approval`),
  c3 update_record (mutating, default `onTainted: escalate` → escalates at
  stage 5, source `taint`), and c4 set_status (source `approval` again).

  Exactly one escalation is raised (HITL-002), with three pending
  actions with distinct IDs in request order (c2, c3, c4), each with its
  own source and reason code. `sources` and `reasonCodes` are the distinct
  values in order of first appearance: [approval, taint] and
  [agentry.approval.always, agentry.taint.mutating] (Area 6 amendment
  2026-11-01) — not the order of the pipeline stages that raised them, and
  without repeating c4's. The record carries `taintProvenances` because
  one action has source `taint`. One resume() approving all three
  resolves the escalation and every call is dispatched, without a second
  escalation.
requirements: [HITL-002]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: set_status
        version: 1
        schemaVersion: "0.1.0"
        description: Set a record's status.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: mutating
        idempotent: true
        onTainted: allow
        approval: always
        binding: { kind: native, handler: test.set_status }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, set_status@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      capabilities: { parallelToolCalls: true }
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts:
            - { type: tool_call, callId: c2, tool: set_status, arguments: { key: k1 } }
            - { type: tool_call, callId: c3, tool: update_record, arguments: { key: k2, value: v2 } }
            - { type: tool_call, callId: c4, tool: set_status, arguments: { key: k3 } }
          usage: { inputTokens: 30, outputTokens: 15, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "All done." }]
          usage: { inputTokens: 60, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "synthetic untrusted value" } }
      set_status:
        - ok: { output: { status: set } }
        - ok: { output: { status: set } }
      update_record:
        - ok: { output: { updated: true } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1, then update k1, k2 and k3" }]
    capture:
      - event: { type: escalation.raised }
        bind:
          payload.escalation.pendingActions.0.id: $a2
          payload.escalation.pendingActions.1.id: $a3
          payload.escalation.pendingActions.2.id: $a4
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000001", pendingActionId: $a2, type: approve }
      - { decisionId: "01900000-0000-7000-8000-000000000002", pendingActionId: $a3, type: approve }
      - { decisionId: "01900000-0000-7000-8000-000000000003", pendingActionId: $a4, type: approve }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - type: escalation.raised
            runId: $r1
            payload:
              escalation:
                id: $esc
                step: 2
                sources: [approval, taint]
                reasonCodes: [agentry.approval.always, agentry.taint.mutating]
                taintProvenances: ["tool:lookup"]
                pendingActions:
                  - { id: $a2, kind: tool_call, callId: c2, tool: set_status, source: approval, reasonCode: agentry.approval.always }
                  - { id: { $all: [$a3, { $not: $a2 }] }, kind: tool_call, callId: c3, tool: update_record, source: taint, reasonCode: agentry.taint.mutating }
                  - { id: { $all: [$a4, { $not: $a2 }, { $not: $a3 }] }, kind: tool_call, callId: c4, tool: set_status, source: approval, reasonCode: agentry.approval.always }
          - { type: run.ended, runId: $r1, payload: { reason: escalated } }
          - { type: escalation.resolved, runId: $r2, payload: { escalationId: $esc } }
          - { type: model.request, runId: $r2, step: 3 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: tool.call, runId: $r1, payload: { callId: c2 } }
        - { type: tool.call, runId: $r1, payload: { callId: c3 } }
        - { type: tool.call, runId: $r1, payload: { callId: c4 } }
  ports:
    eventLog:
      t1:
        $s:
          $count: { of: { type: escalation.raised }, equals: 1 }
  stubCalls:
    set_status: { $all: [{ $len: 2 }, { $contains: [{ arguments: { key: k1 } }, { arguments: { key: k3 } }] }] }
    update_record: [{ arguments: { key: k2, value: v2 } }]
