schemaVersion: "0.1.0"
id: hitl.effect-reject-tool-call
title: A rejected tool call is not dispatched; the model receives a policy error agentry.hitl.rejected and the turn continues
description: >-
  update_record has `approval: always` and escalates. The reviewer rejects
  it. In the resume run the call is never dispatched (no `tool.call`; the
  stub's empty behaviour list fails the test on any call), its one
  `tool.result` is the error `{category: policy, code:
  agentry.hitl.rejected}`, which the model receives as the call's result in
  its next request, and the same turn continues to a response (no new
  `turn.started`; the session goes `idle`).
requirements: [HITL-060]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "The update was not approved." }]
          usage: { inputTokens: 30, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.pendingActions.0.id: $act }
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000603", pendingActionId: $act, type: reject }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: run.ended, runId: $r1, payload: { reason: escalated } }
          - { type: run.started, runId: $r2, payload: { kind: resume } }
          - { type: escalation.resolved, runId: $r2 }
          - { type: tool.result, runId: $r2, turn: 1, payload: { callId: c1, tool: update_record, result: { error: { category: policy, code: agentry.hitl.rejected } } } }
          - { type: model.request, runId: $r2, turn: 1, step: 2 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: tool.call }
        - { type: turn.started, runId: $r2 }
  ports:
    eventLog:
      t1:
        $s:
          $count: { of: { type: tool.result }, equals: 1 }
  delivered:
    $s: { text: "The update was not approved." }
  stubCalls:
    update_record: { count: 0 }
  providerRequests:
    scripted-a:
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                - { type: tool_result, callId: c1, result: { error: { category: policy, code: agentry.hitl.rejected } } }
