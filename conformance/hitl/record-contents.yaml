schemaVersion: "0.1.0"
id: hitl.record-contents
title: The escalation record carries its identity, position, tenant, snapshot hash, tainting provenances, per-action reviewer requirements, and created and expiry times
description: >-
  The configuration is loaded first, binding the snapshot hash $h. The
  profile's `suspendedTtl` is PT36H (not the baseline PT72H). The bundle
  declares reviewer rules for `taint` (`requiredApprovals: 2`) and
  `approval`, and `allowSelfApproval: {approval: true}`; the persona adds a
  second `taint` rule with the default `requiredApprovals` (1).

  Turn 1 responds. The clock advances one hour. In turn 2, untrusted
  lookup (step 1) and fetch_external (step 2) results enter context; at
  step 3 one response requests c3 update_record (taint escalation) and c4
  set_status (`onTainted: allow`, `approval: always` → approval
  escalation). The single record (HITL-010) has:

  - a UUIDv7 `id`; the session ID; the escalating run's ID; turn 2;
    step 3; tenant t1; the snapshot hash bound at load (equal to the one
    on session.created);
  - `taintProvenances` [tool:lookup, tool:fetch_external], in first-entry
    order;
  - `createdAt` at the virtual time of escalation (01:00) and `expiresAt`
    = createdAt + PT36H;
  - per-action reviewer requirements (Area 6 amendment 2026-11-01): c3
    (`taint`) needs 2 approvals — the highest of the applicable rules
    (HITL-024), not the lower persona value — never allows
    self-approval, even though the bundle allows it for `approval`
    (HITL-023), and lists both taint rules in layer order, the bundle's
    then the persona's (Area 6 amendment 2026-11-01); c4
    (`approval`) needs 1, allows self-approval, and lists only the
    approval rule.
requirements: [HITL-010]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        reviewerRules:
          taint:
            - { rule: "'reviewer' in reviewer.roles", requiredApprovals: 2 }
          approval:
            - { rule: "'approver' in reviewer.roles" }
        allowSelfApproval: { approval: true }
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
      - kind: Tool
        id: fetch_external
        version: 1
        schemaVersion: "0.1.0"
        description: Fetch a record from an external source.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        binding: { kind: native, handler: test.fetch_external }
      - kind: Tool
        id: set_status
        version: 1
        schemaVersion: "0.1.0"
        description: Set a record's status.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: mutating
        idempotent: true
        onTainted: allow
        approval: always
        binding: { kind: native, handler: test.set_status }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, fetch_external@1, update_record@1, set_status@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        reviewerRules:
          taint:
            - { rule: "reviewer.assurance == 'multi_factor'" }
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT36H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
  providers:
    scripted-a:
      capabilities: { parallelToolCalls: true }
      responses:
        - parts: [{ type: text, text: "Hello." }]
          usage: { inputTokens: 20, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: fetch_external, arguments: { key: k2 } }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts:
            - { type: tool_call, callId: c3, tool: update_record, arguments: { key: k1, value: v1 } }
            - { type: tool_call, callId: c4, tool: set_status, arguments: { key: k2 } }
          usage: { inputTokens: 50, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "SYN-UNTRUSTED-0001" } }
      fetch_external:
        - ok: { output: { value: "SYN-UNTRUSTED-0002" } }
      update_record: []
      set_status: []
script:
  - load: {}
    bind: $h
    expect: { ok: true }
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
  - clock: { advance: PT1H }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Look up k1 and k2, then update both" }]
    expect: { ok: true, endReason: escalated }
expect:
  sessions:
    $s:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: session.created, sessionId: $s, snapshotHash: $h }
          - { type: run.started, runId: $r2, timestamp: { $regex: "^2026-01-01T01:00:00" } }
          - { type: turn.started, runId: $r2, turn: 2 }
          - type: escalation.raised
            runId: $r2
            payload:
              escalation:
                id: { $regex: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" }
                sessionId: $s
                runId: $r2
                turn: 2
                step: 3
                tenant: t1
                snapshotHash: $h
                sources: [taint, approval]
                reasonCodes: [agentry.taint.mutating, agentry.approval.always]
                taintProvenances: ["tool:lookup", "tool:fetch_external"]
                createdAt: { $regex: "^2026-01-01T01:00:00(\\.0+)?Z$" }
                expiresAt: { $regex: "^2026-01-02T13:00:00(\\.0+)?Z$" }
                pendingActions:
                  - callId: c3
                    source: taint
                    reviewerRequirements:
                      requiredApprovals: 2
                      selfApprovalAllowed: false
                      rules: ["'reviewer' in reviewer.roles", "reviewer.assurance == 'multi_factor'"]
                  - callId: c4
                    source: approval
                    reviewerRequirements:
                      requiredApprovals: 1
                      selfApprovalAllowed: true
                      rules: ["'approver' in reviewer.roles"]
          - { type: run.ended, runId: $r2, payload: { reason: escalated } }
  stubCalls:
    update_record: { count: 0 }
    set_status: { count: 0 }
