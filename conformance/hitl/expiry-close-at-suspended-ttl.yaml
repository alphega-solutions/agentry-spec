schemaVersion: "0.1.0"
id: hitl.expiry-close-at-suspended-ttl
title: With onExpiry `close`, a suspended session with an undecided action closes `expired` exactly when suspendedTtl elapses; nothing is rejected or approved by expiry
description: >-
  $a uses default@1, which sets no onExpiry (default `close`); $b uses
  explicit@1, which sets `onExpiry: close`. Both have suspendedTtl PT72H.
  $a escalates at 00:00:00 with two actions (c1 update_record, c2
  set_status, both `approval: always`); a reviewer approves $a1 with
  decide() (which emits no events), leaving $a2 undecided. $b escalates one second later. $a's
  escalation records expiresAt = createdAt + suspendedTtl.

  The clock is set to exactly $a's expiry (2026-01-04T00:00:00Z; a TTL has
  elapsed when the current time equals the expiry time, CORE-040/041 as
  amended): resume() on $a fails with `conflict` (CORE-022) and $a's
  session.closed is stamped with that instant; $b, one second younger, is
  still suspended, so resume() on it fails with `conflict` code
  `agentry.hitl.pending` (HITL-070) and $b does not close then. One second
  later $b has reached its expiry too, and nothing accesses it after that.
  Both close `expired` with `session.closed` timestamped at their expiry
  times (HITL-082, close branch; expiry processing is timestamped with the
  expiry time whenever it is detected, Area 6 amendment 2026-11-01): the
  undecided actions get no expiry rejection (no `decidedBy: expiry` record),
  no escalation is resolved, no resume run starts, and neither call is
  dispatched — not even $a1, which was approved.
requirements: [HITL-082]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
      - kind: Tool
        id: set_status
        version: 1
        schemaVersion: "0.1.0"
        description: Set a record's status.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.set_status }
      - kind: HarnessProfile
        id: explicit
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        onExpiry: close
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, set_status@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1, explicit@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      capabilities: { parallelToolCalls: true }
      responses:
        - parts:
            - { type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }
            - { type: tool_call, callId: c2, tool: set_status, arguments: { key: k2 } }
          usage: { inputTokens: 20, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k3, value: v3 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record: []
      set_status: []
script:
  - action: run
    bind: $a
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Update k1 and set the status of k2" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.pendingActions.0.id: $a1 }
    expect: { ok: true, endReason: escalated }
  - action: decide
    session: $a
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-0000000000e1", pendingActionId: $a1, type: approve }
    expect: { ok: true, newEvents: 0 }
  - clock: { advance: PT1S }
  - action: run
    bind: $b
    tenant: t1
    principal: p1
    persona: assistant@1
    profile: explicit@1
    input: [{ type: text, text: "Set k3 to v3" }]
    expect: { ok: true, endReason: escalated }
  # Exactly $a's expiry; $b has one second left.
  - clock: { set: "2026-01-04T00:00:00Z" }
  - action: resume
    session: $a
    reviewer: r1
    decisions: []
    expect: { ok: false, error: { category: conflict } }
  - action: resume
    session: $b
    reviewer: r1
    decisions: []
    expect: { ok: false, error: { category: conflict, code: agentry.hitl.pending } }
  # Exactly $b's expiry.
  - clock: { advance: PT1S }
expect:
  sessions:
    $a:
      state: closed
      closeReason: expired
      events:
        mode: subsequence
        items:
          - type: escalation.raised
            payload:
              escalation:
                createdAt: { $regex: "^2026-01-01T00:00:00" }
                expiresAt: { $regex: "^2026-01-04T00:00:00" }
                pendingActions: [{ id: $a1, callId: c1 }, { callId: c2 }]
          - { type: run.ended, payload: { reason: escalated } }
          - { type: session.closed, runId: { $absent: true }, timestamp: { $regex: "^2026-01-04T00:00:00" }, payload: { reason: expired } }
      absentEvents:
        - { type: escalation.resolved }
        - { type: run.started, payload: { kind: resume } }
        - { type: tool.call }
    $b:
      state: closed
      closeReason: expired
      events:
        mode: subsequence
        items:
          - { type: escalation.raised, payload: { escalation: { expiresAt: { $regex: "^2026-01-04T00:00:01" } } } }
          - { type: run.ended, payload: { reason: escalated } }
          - { type: session.closed, runId: { $absent: true }, timestamp: { $regex: "^2026-01-04T00:00:01" }, payload: { reason: expired } }
      absentEvents:
        - { type: escalation.resolved }
        - { type: run.started, payload: { kind: resume } }
        - { type: tool.call }
  ports:
    auditLog:
      t1:
        $all:
          - $count: { of: { type: decision }, equals: 1 }
          - $count: { of: { type: decision, details: { decidedBy: expiry } }, equals: 0 }
          - $count: { of: { type: decision, sessionId: $a, details: { id: "01900000-0000-7000-8000-0000000000e1", decidedBy: reviewer } }, equals: 1 }
  stubCalls:
    update_record: { count: 0 }
    set_status: { count: 0 }
  providerRequests:
    scripted-a: { count: 2 }
