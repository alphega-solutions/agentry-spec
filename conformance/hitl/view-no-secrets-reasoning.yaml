schemaVersion: "0.1.0"
id: hitl.view-no-secrets-reasoning
title: The reviewer view contains the escalation record and the content under review, but no secret values, credentials or reasoning parts
description: >-
  lookup (trusted by the bundle, so the session is not tainted) and
  update_record (`approval: always`) both take a binding credential from a
  secret reference, resolved by the in-memory secrets provider.

  - $sCall: lookup is dispatched with its credential, then update_record
    escalates (source `approval`). The view's `escalation` equals the
    record carried by `escalation.raised` (deep equality, so it carries no
    extra field), and the action's content is exactly one `tool_call` part
    whose `arguments` equal the pending action's arguments, with no binding
    or credential fields.
  - $sReason: the model answers with a reasoning part and a text part; the
    native afterModelCall hook gate escalates (it answered `continue` for
    $sCall's two model responses). The action's content is exactly the
    text part: the reasoning part does not appear.

  The secret values are never persisted, and no view changes state or
  emits events. The fixture format cannot assert that a string is absent
  from a returned view; the deep equalities and the exact content arrays
  stand in for that.
requirements: [HITL-030, HITL-032]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    remove: [streamed@1]
    artifacts:
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        trustedTools: [lookup@1]
        sensitivityPolicies:
          pii: { allowedProviders: [scripted-a, scripted-b], redaction: [{ mode: mask }] }
          phi: { allowedProviders: [scripted-a], redaction: [{ mode: mask }] }
      - kind: Tool
        id: lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        credentialMode: service
        binding: { kind: native, handler: test.lookup, credentials: { apiKey: "secret://test/lookup-key" } }
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        credentialMode: service
        binding: { kind: native, handler: test.update_record, credentials: { apiKey: "secret://test/update-key" } }
      - kind: Hook
        id: gate
        version: 1
        schemaVersion: "0.1.0"
        points: [afterModelCall]
        results: [escalate]
        timeoutMs: 1000
        source: { kind: native, handler: test.hook.gate }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1]
        requiredHooks: [gate@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        # $sCall
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sReason
        - parts:
            - { type: reasoning, provider: scripted-a, data: "SYN-REASONING-0032 weigh the request", opaque: false }
            - { type: text, text: "SYN-ANSWER-0032" }
          usage: { inputTokens: 20, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 5 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "synthetic value" } }
      update_record: []
    nativeHooks:
      gate:
        - result: continue
        - result: continue
        - result: escalate
          reasonCode: test.hook.review
  secrets:
    "secret://test/lookup-key": "SYN-SECRET-LOOKUP-0032-DO-NOT-SHOW"
    "secret://test/update-key": "SYN-SECRET-UPDATE-0032-DO-NOT-SHOW"
script:
  - action: run
    bind: $sCall
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1 then set it to v1" }]
    capture:
      - event: { type: escalation.raised }
        bind:
          payload.escalation: $escRecord
          payload.escalation.pendingActions.0.id: $actCall
          payload.escalation.pendingActions.0.arguments: $args
    expect: { ok: true, endReason: escalated }
  - action: getReviewerView
    session: $sCall
    tenant: t1
    reviewer: r1
    expect:
      ok: true
      newEvents: 0
      view:
        escalation: $escRecord
        actions:
          - pendingActionId: $actCall
            decided: false
            decisions: []
            content:
              - type: tool_call
                callId: c2
                tool: update_record
                arguments: $args
                binding: { $absent: true }
                credentials: { $absent: true }
                credentialMode: { $absent: true }
  - action: run
    bind: $sReason
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Answer the question" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.pendingActions.0.id: $actReason }
    expect: { ok: true, endReason: escalated }
  - action: getReviewerView
    session: $sReason
    tenant: t1
    reviewer: r1
    expect:
      ok: true
      newEvents: 0
      view:
        escalation: { pendingActions: [{ id: $actReason, kind: content, point: afterModelCall }] }
        actions:
          - pendingActionId: $actReason
            decided: false
            decisions: []
            content:
              - { type: text, text: "SYN-ANSWER-0032" }
expect:
  sessions:
    $sCall:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: lookup } }
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { value: "synthetic value" } } } } }
          - type: escalation.raised
            payload:
              escalation:
                sources: [approval]
                pendingActions: [{ id: $actCall, kind: tool_call, callId: c2, tool: update_record, arguments: { key: k1, value: v1 } }]
    $sReason:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: escalation.raised, payload: { escalation: { sources: [hook], pendingActions: [{ id: $actReason, kind: content, source: hook }] } } }
  stubCalls:
    lookup: { count: 1 }
    update_record: { count: 0 }
    gate: { count: 3 }
  noPersistedContent:
    - "SYN-SECRET-LOOKUP-0032-DO-NOT-SHOW"
    - "SYN-SECRET-UPDATE-0032-DO-NOT-SHOW"
