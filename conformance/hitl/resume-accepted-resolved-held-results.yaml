schemaVersion: "0.1.0"
id: hitl.resume-accepted-resolved-held-results
title: An accepted resume() emits escalation.resolved with every decision in recording order, continues the suspended turn, and delivers all held results together in request order
description: >-
  One model response requests c1 lookup (read; trusted by the bundle, so
  taint plays no part), c2 update_record and c3 set_status (both
  `approval: always`). In the first run c1 is dispatched and its result is
  held; c2 and c3 escalate together as $a2, $a3 (request order) and the
  run ends `escalated` with no second model request.

  The decisions are recorded out of action order: decide() approves $a3
  with DA first (emitting no events), then resume() approves $a2 with DB. The accepted resume
  (HITL-072): emits `escalation.resolved` listing [DA, DB] — every decision
  for the escalation, in recording order, not action order — as the first
  event of the resume run after `run.started`, before any model or tool
  work (HITL-072 as amended 2026-11-01; checked exactly: the two events'
  `seq` values are consecutive, so nothing lies between them); continues turn
  1 (no `turn.started` in the resume run, and its model request is turn 1,
  step 2); dispatches c2 and c3 once each and does not re-dispatch the held
  c1. c2's stub is delayed, so c2 may complete after c3, yet the next model
  request carries exactly one `tool` message whose parts are the results
  of c1, c2 and c3, in that order (TOOL-032, TOOL-033). After the resume no
  escalation remains in the checkpoint.
requirements: [HITL-072]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        trustedTools: [lookup@1]
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
      - kind: Tool
        id: set_status
        version: 1
        schemaVersion: "0.1.0"
        description: Set a record's status.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.set_status }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, set_status@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      capabilities: { parallelToolCalls: true }
      responses:
        - parts:
            - { type: tool_call, callId: c1, tool: lookup, arguments: { key: k0 } }
            - { type: tool_call, callId: c2, tool: update_record, arguments: { key: k1, value: v1 } }
            - { type: tool_call, callId: c3, tool: set_status, arguments: { key: k3 } }
          usage: { inputTokens: 20, outputTokens: 15, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Looked up k0, updated k1, set k3." }]
          usage: { inputTokens: 60, outputTokens: 8, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "found-k0" } }
      update_record:
        - ok: { output: { updated: k1 } }
          delayMs: 50
      set_status:
        - ok: { output: { status: k3 } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k0, update k1 and set the status of k3" }]
    capture:
      - event: { type: escalation.raised }
        bind:
          payload.escalation.id: $esc
          payload.escalation.pendingActions.0.id: $a2
          payload.escalation.pendingActions.1.id: $a3
    expect: { ok: true, endReason: escalated }
  - action: decide
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-0000000000a1", pendingActionId: $a3, type: approve }
    expect: { ok: true, newEvents: 0 }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-0000000000a2", pendingActionId: $a2, type: approve }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      checkpoint: { state: idle, escalation: { $absent: true } }
      events:
        mode: subsequence
        items:
          - { type: run.started, runId: $r1, payload: { kind: run } }
          - { type: turn.started, runId: $r1, turn: 1 }
          - { type: model.request, runId: $r1, turn: 1, step: 1 }
          - { type: tool.result, runId: $r1, turn: 1, step: 1, payload: { callId: c1, result: { ok: { output: { value: "found-k0" } } } } }
          - type: escalation.raised
            runId: $r1
            turn: 1
            step: 1
            payload: { escalation: { id: $esc, pendingActions: [{ id: $a2, callId: c2 }, { id: $a3, callId: c3 }] } }
          - { type: run.ended, runId: $r1, payload: { reason: escalated } }
          - { type: run.started, runId: $r2, seq: $q0, payload: { kind: resume } }
          - type: escalation.resolved
            runId: $r2
            seq: $q1
            payload:
              escalationId: $esc
              decisions: ["01900000-0000-7000-8000-0000000000a1", "01900000-0000-7000-8000-0000000000a2"]
          - { type: model.request, runId: $r2, turn: 1, step: 2 }
          - { type: turn.completed, runId: $r2, turn: 1 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: turn.started, runId: $r2 }
        - { type: turn.started, turn: 2 }
        - { type: model.request, runId: $r1, step: 2 }
        - { type: tool.call, runId: $r1, payload: { callId: c2 } }
        - { type: tool.call, runId: $r1, payload: { callId: c3 } }
        - { type: tool.call, runId: $r2, payload: { callId: c1 } }
        - { type: tool.result, runId: $r2, payload: { callId: c1 } }
  ports:
    eventLog:
      t1:
        $s:
          $all:
            - $count: { of: { type: run.started }, equals: 2 }
            # escalation.resolved immediately follows the resume run's
            # run.started: exactly two events lie in the seq range [$q0, $q1]
            # (seq is gap-free, CORE-160).
            - $count: { of: { seq: { $all: [{ $gte: $q0 }, { $lte: $q1 }] } }, equals: 2 }
            - $count: { of: { type: tool.result, runId: $r2, step: 1, payload: { callId: c2, result: { ok: { output: { updated: k1 } } } } }, equals: 1 }
            - $count: { of: { type: tool.result, runId: $r2, step: 1, payload: { callId: c3, result: { ok: { output: { status: k3 } } } } }, equals: 1 }
  stubCalls:
    lookup: [{ arguments: { key: k0 } }]
    update_record: [{ arguments: { key: k1, value: v1 } }]
    set_status: [{ arguments: { key: k3 } }]
  providerRequests:
    scripted-a:
      - {}
      - messages:
          $all:
            - $count: { of: { role: tool }, equals: 1 }
            - $contains:
                - role: tool
                  parts:
                    - { type: tool_result, callId: c1, result: { ok: { output: { value: "found-k0" } } } }
                    - { type: tool_result, callId: c2, result: { ok: { output: { updated: k1 } } } }
                    - { type: tool_result, callId: c3, result: { ok: { output: { status: k3 } } } }
