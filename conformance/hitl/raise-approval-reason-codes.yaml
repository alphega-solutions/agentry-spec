schemaVersion: "0.1.0"
id: hitl.raise-approval-reason-codes
title: Approval escalations are `tool_call` actions from source `approval`, with a reason code for each way approval can require a decision
description: >-
  `set_status` has `approval: always`; `set_flag` has `approval: policy`
  and an optional `flag` argument. The persona's only approval rule is
  `call.arguments.flag == 'on'`, which is a run-time error when `flag` is
  missing (HOOK-112 amendment, HOOK-132). Every call is the session's
  first step, so no session is tainted (HOOK-120).

  - $sAlways: set_status → `agentry.approval.always`.
  - $sRule: set_flag with flag `on` → the rule is true →
    `agentry.approval.rule`.
  - $sError: set_flag with no flag → evaluation error →
    `agentry.approval.rule_error`.
  - $sOff (control): flag `off` → the rule is false → dispatched, no
    escalation.

  The configuration is then reloaded with the persona declaring no
  approval rules (and the bundle declares none), so a new session uses a
  snapshot with no rules at all:

  - $sNoRules: set_flag with flag `off` — the argument that did not
    escalate under the rule — escalates with `agentry.approval.no_rules`
    (HOOK-131).

  Each escalation has one `tool_call` action from source `approval`,
  allowing exactly approve, reject and edit (HITL-011), with the default
  reviewer requirements (no reviewer rules, self-approval not enabled).
requirements: [HITL-001, HITL-010, HITL-011]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: set_status
        version: 1
        schemaVersion: "0.1.0"
        description: Set a record's status.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: mutating
        idempotent: true
        approval: always
        binding: { kind: native, handler: test.set_status }
      - kind: Tool
        id: set_flag
        version: 1
        schemaVersion: "0.1.0"
        description: Set a flag on a record.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string }, flag: { type: string } }
        effect: mutating
        idempotent: true
        approval: policy
        binding: { kind: native, handler: test.set_flag }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [set_status@1, set_flag@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        approvalRules: ["call.arguments.flag == 'on'"]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
  providers:
    scripted-a:
      responses:
        # $sAlways
        - parts: [{ type: tool_call, callId: c1, tool: set_status, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sRule
        - parts: [{ type: tool_call, callId: c1, tool: set_flag, arguments: { key: k1, flag: "on" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sError
        - parts: [{ type: tool_call, callId: c1, tool: set_flag, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sOff
        - parts: [{ type: tool_call, callId: c1, tool: set_flag, arguments: { key: k1, flag: "off" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Flag set." }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sNoRules
        - parts: [{ type: tool_call, callId: c1, tool: set_flag, arguments: { key: k1, flag: "off" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      set_status: []
      set_flag:
        - ok: { output: { set: true } }
script:
  - action: run
    bind: $sAlways
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set the status of k1" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $sRule
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set the flag on k1 on" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $sError
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set the flag on k1" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $sOff
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set the flag on k1 off" }]
    expect: { ok: true, endReason: responded }
  - load:
      artifacts:
        - kind: Persona
          id: assistant
          version: 1
          schemaVersion: "0.1.0"
          displayName: Test assistant
          instructions: "You are a test assistant."
          tools: [set_status@1, set_flag@1]
          fallbackMessage: "This request was blocked."
          defaultProfile: default@1
          allowedProfiles: [default@1, streamed@1]
          model:
            provider: scripted-a
            name: model-a
            fallbacks:
              - { provider: scripted-b, name: model-b }
    expect: { ok: true }
  - action: run
    bind: $sNoRules
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set the flag on k1 off" }]
    expect: { ok: true, endReason: escalated }
expect:
  sessions:
    $sAlways:
      state: suspended
      events:
        mode: subsequence
        items:
          - type: escalation.raised
            payload:
              escalation:
                sources: [approval]
                reasonCodes: [agentry.approval.always]
                taintProvenances: { $absent: true }
                pendingActions:
                  - kind: tool_call
                    source: approval
                    reasonCode: agentry.approval.always
                    callId: c1
                    tool: set_status
                    arguments: { key: k1 }
                    allowedDecisions: { $all: [{ $len: 3 }, { $contains: [approve, reject, edit] }] }
                    reviewerRequirements: { requiredApprovals: 1, selfApprovalAllowed: false, rules: [] }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call }
        - { type: policy.decision, payload: { kind: taint } }
    $sRule:
      state: suspended
      events:
        mode: subsequence
        items:
          - type: escalation.raised
            payload:
              escalation:
                sources: [approval]
                reasonCodes: [agentry.approval.rule]
                pendingActions:
                  - kind: tool_call
                    source: approval
                    reasonCode: agentry.approval.rule
                    callId: c1
                    tool: set_flag
                    arguments: { key: k1, flag: "on" }
                    allowedDecisions: { $all: [{ $len: 3 }, { $contains: [approve, reject, edit] }] }
                    reviewerRequirements: { requiredApprovals: 1, selfApprovalAllowed: false, rules: [] }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call }
    $sError:
      state: suspended
      events:
        mode: subsequence
        items:
          - type: escalation.raised
            payload:
              escalation:
                sources: [approval]
                reasonCodes: [agentry.approval.rule_error]
                pendingActions:
                  - kind: tool_call
                    source: approval
                    reasonCode: agentry.approval.rule_error
                    callId: c1
                    tool: set_flag
                    arguments: { key: k1 }
                    allowedDecisions: { $all: [{ $len: 3 }, { $contains: [approve, reject, edit] }] }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call }
    $sOff:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: set_flag, arguments: { key: k1, flag: "off" } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: escalation.raised }
    $sNoRules:
      state: suspended
      events:
        mode: subsequence
        items:
          - type: escalation.raised
            payload:
              escalation:
                sources: [approval]
                reasonCodes: [agentry.approval.no_rules]
                pendingActions:
                  - kind: tool_call
                    source: approval
                    reasonCode: agentry.approval.no_rules
                    callId: c1
                    tool: set_flag
                    arguments: { key: k1, flag: "off" }
                    allowedDecisions: { $all: [{ $len: 3 }, { $contains: [approve, reject, edit] }] }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call }
  stubCalls:
    set_status: { count: 0 }
    set_flag: [{ arguments: { key: k1, flag: "off" } }]
