schemaVersion: "0.1.0"
id: hitl.decide-resubmitted-batch-acknowledged
title: Resubmitted decision IDs are acknowledged without effect, while new IDs in the same batch are recorded
description: >-
  One step escalates two update_record calls (`approval: always`): $a1 (c1)
  and $a2 (c2).


  1. decide() with D1 (approve $a1) — recorded.

  2. decide() with D1 again plus D2 (approve $a2) — accepted: D1 is
  acknowledged (not refused, not recorded again) and D2 is recorded.

  3. decide() with D1 restated as a `reject` — acknowledged without
  effect: a resubmitted decision ID is acknowledged without effect even if
  its other fields differ (HITL-042 as amended 2026-11-01), so c1 stays
  approved and is dispatched.

  4. resume() retrying the whole batch D1 + D2 — accepted. Neither ID was
  applied by an earlier accepted resume() (a decision ID is applied once
  an accepted resume() has acted on it; one only recorded by decide() is
  not), so this is not a replay (CORE-053, HITL-071) but a new resume
  whose decisions are all already recorded (HITL-042 as amended
  2026-11-01); the session resumes.

  Each successful decide() emits no events (HITL-040 as amended).


  In all, exactly one `decision` audit record exists per decision ID (two
  in all, both `approve`), `escalation.resolved` lists D1 and D2 once each
  in recording order, and both calls are dispatched.

requirements: [HITL-042]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      capabilities: { parallelToolCalls: true }
      responses:
        - parts:
            - { type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }
            - { type: tool_call, callId: c2, tool: update_record, arguments: { key: k2, value: v2 } }
          usage: { inputTokens: 20, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Both updated." }]
          usage: { inputTokens: 40, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - ok: { output: { updated: true } }
        - ok: { output: { updated: true } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1 and k2 to v2" }]
    capture:
      - event: { type: escalation.raised }
        bind:
          payload.escalation.id: $esc
          payload.escalation.pendingActions.0.id: $a1
          payload.escalation.pendingActions.1.id: $a2
    expect: { ok: true, endReason: escalated }
  - action: decide
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000421", pendingActionId: $a1, type: approve }
    expect: { ok: true, newEvents: 0 }
  - action: decide
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000421", pendingActionId: $a1, type: approve }
      - { decisionId: "01900000-0000-7000-8000-000000000422", pendingActionId: $a2, type: approve }
    expect: { ok: true, newEvents: 0 }
  - action: decide
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000421", pendingActionId: $a1, type: reject }
    expect: { ok: true, newEvents: 0 }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000421", pendingActionId: $a1, type: approve }
      - { decisionId: "01900000-0000-7000-8000-000000000422", pendingActionId: $a2, type: approve }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - type: escalation.resolved
            payload:
              escalationId: $esc
              decisions: ["01900000-0000-7000-8000-000000000421", "01900000-0000-7000-8000-000000000422"]
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.result, payload: { result: { error: { code: agentry.hitl.rejected } } } }
  stubCalls:
    update_record:
      $all:
        - { $len: 2 }
        - $contains:
            - { arguments: { key: k1, value: v1 } }
            - { arguments: { key: k2, value: v2 } }
  ports:
    auditLog:
      t1:
        $all:
          - $count: { of: { type: decision }, equals: 2 }
          - $count: { of: { type: decision, details: { id: "01900000-0000-7000-8000-000000000421" } }, equals: 1 }
          - $count: { of: { type: decision, details: { id: "01900000-0000-7000-8000-000000000422" } }, equals: 1 }
          - $count: { of: { type: decision, details: { type: reject } }, equals: 0 }
