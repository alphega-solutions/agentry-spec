schemaVersion: "0.1.0"
id: hitl.expiry-detected-twice-processed-once
title: Two processes that detect the same expiry at once process it once — one expiry rejection, one audit record
description: >-
  default@1 sets `onExpiry: reject`, suspendedTtl PT72H. $s escalates at
  00:00 with one action $a1 (c1 update_record, `approval: always`). At
  exactly its expiry (2026-01-04T00:00:00Z) two processes sharing the same
  ports access the session at once: one calls getReviewerView on $s, the
  other listPendingEscalations for t1. Each would first perform the expiry
  processing that is due (HITL-082, Area 6 amendment 2026-11-01), which is
  a write outside a run: an expiry rejection of $a1, recorded in the
  checkpoint and audited.


  Under HITL-093 (amendment 2026-11-14) expiry processing takes an
  operation lease and re-reads the session after acquiring it, so it is
  done exactly once, whichever process wins. The other process either
  finds the lease current and leaves the processing to its holder, or
  acquires a later lease, re-reads and finds nothing due. Both reads
  succeed and neither emits an event (expiry rejections emit none). The
  audit log holds exactly one `decision` record with `decidedBy: expiry`.
  $s stays `suspended` and fully decided. A later reviewer view, taken
  once both operations are done, shows exactly one decision on $a1: the
  expiry rejection, timestamped with the expiry time. Nothing is
  dispatched.
requirements: [HITL-093, HITL-082]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        onExpiry: reject
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.pendingActions.0.id: $a1 }
    expect: { ok: true, endReason: escalated }
  - clock: { set: "2026-01-04T00:00:00Z" }
  - separateProcesses: true
    concurrently:
      - action: getReviewerView
        session: $s
        tenant: t1
        reviewer: r1
      - action: listPendingEscalations
        tenant: t1
    expect:
      outcomes:
        - { ok: true, newEvents: 0 }
        - { ok: true, newEvents: 0 }
  - action: getReviewerView
    session: $s
    tenant: t1
    reviewer: r1
    expect:
      ok: true
      newEvents: 0
      view:
        actions:
          - pendingActionId: $a1
            decided: true
            decisions:
              - { pendingActionId: $a1, type: reject, decidedBy: expiry, reviewer: { $absent: true }, timestamp: { $regex: "^2026-01-04T00:00:00" } }
expect:
  sessions:
    $s:
      state: suspended
      absentEvents:
        - { type: session.closed }
        - { type: escalation.resolved }
        - { type: tool.call }
  ports:
    auditLog:
      t1:
        $all:
          - $count: { of: { type: decision, details: { decidedBy: expiry } }, equals: 1 }
          - $count: { of: { type: decision, sessionId: $s, details: { pendingActionId: $a1, type: reject, decidedBy: expiry } }, equals: 1 }
  stubCalls:
    update_record: { count: 0 }
  providerRequests:
    scripted-a: { count: 1 }
