schemaVersion: "0.1.0"
id: hitl.expiry-timeout-recovery-closes
title: A recovery action raised by a timeout and left undecided closes the session `expired` at suspendedTtl, even with onExpiry `reject`
description: >-
  default@1 sets `onExpiry: reject` (suspendedTtl PT72H). update_record
  (mutating, not idempotent) declares timeoutMs 1000; its stub takes 10 s
  on the virtual clock and honours cancellation. The model calls it (c1)
  at 00:00:00 and the call times out at 00:00:01, so its outcome is
  unknown: a `recovery` action $act (`agentry.recovery.unknown_outcome`)
  is raised within the run at 00:00:01, with expiresAt
  2026-01-04T00:00:01Z, and the run ends `escalated` (TOOL-055, amendment
  2026-11-14). This is the same action as after a crash (HITL-001 as
  amended 2026-11-14); `hitl.expiry-recovery-action-closes` covers the
  crash-raised case.

  Nobody decides $act. The clock is set exactly to the expiry (a TTL has
  elapsed when the current time equals its expiry), and
  listPendingEscalations performs the expiry processing that is due and
  excludes the expired escalation. HITL-082: with any undecided
  `recovery` action the session closes `expired`, whatever onExpiry
  says; `reject` never applies to recovery actions, since a rejection
  establishes no outcome. `session.closed` (`expired`) has no `runId` and
  is timestamped with the expiry time. No expiry rejection or other
  decision is recorded for $s, the escalation is never resolved, c1
  never gets a `tool.result`, the idempotency record stays `started` with
  no outcome, and update_record is dispatched only once, the timed-out
  attempt.
requirements: [HITL-082, TOOL-055]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        timeoutMs: 1000
        binding: { kind: native, handler: test.update_record }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        onExpiry: reject
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: SYN-k1, value: SYN-v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - { ok: { output: { updated: true } }, delayMs: 10000 }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set SYN-k1 to SYN-v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.pendingActions.0.id: $act, payload.escalation.pendingActions.0.idempotencyKey: $k }
    expect: { ok: true, endReason: escalated }
  # Exactly the escalation's expiry (raised at 00:00:01 + PT72H).
  - clock: { set: "2026-01-04T00:00:01Z" }
  - action: listPendingEscalations
    tenant: t1
    expect: { ok: true, escalations: [] }
expect:
  sessions:
    $s:
      state: closed
      closeReason: expired
      events:
        mode: subsequence
        items:
          - { type: error, payload: { error: { category: unavailable, code: agentry.tool.timeout, source: harness } } }
          - type: escalation.raised
            payload:
              escalation:
                sources: [recovery]
                reasonCodes: [agentry.recovery.unknown_outcome]
                expiresAt: { $regex: "^2026-01-04T00:00:01" }
                pendingActions: [{ id: $act, kind: recovery, callId: c1, idempotencyKey: $k }]
          - { type: run.ended, payload: { reason: escalated } }
          - { type: session.closed, runId: { $absent: true }, timestamp: { $regex: "^2026-01-04T00:00:01" }, payload: { reason: expired } }
      absentEvents:
        - { type: escalation.resolved }
        - { type: tool.result }
  stubCalls:
    update_record:
      - { arguments: { key: SYN-k1, value: SYN-v1 }, cancelled: true }
  ports:
    idempotencyStore:
      t1:
        $k: { state: started, outcome: { $absent: true } }
    auditLog:
      t1:
        $count: { of: { type: decision, sessionId: $s }, equals: 0 }
  providerRequests:
    scripted-a: { count: 1 }
