schemaVersion: "0.1.0"
id: hitl.edit-self-approval-per-source
title: "Self-approval allowed only for `hook` does not let the session principal dispatch an `approval: always` call by editing its own hook escalation"
description: >-
  The bundle sets `allowSelfApproval: { hook: true }` and leaves
  `approval` at its default, false. It requires one native beforeToolCall
  hook, gate (escalates once, then continues). update_record has
  `approval: always`.


  gate escalates the model's call c1 {k1, v1}; the `hook` action has
  `selfApprovalAllowed: true`. The session principal p1 edits its own
  escalation to {k1, v2}, which is accepted (HITL-023). Because the
  action's source is `hook`, stage 7 runs on the edited arguments
  (HITL-061 as amended 2026-11-07) and raises E2 with source `approval`,
  whose action has `selfApprovalAllowed: false`. p1's approval of E2 is
  refused with `unauthorized` (`agentry.hitl.reviewer_refused`) and
  recorded nowhere; r1 approves, and the call is dispatched once with the
  edited arguments. Exactly two decisions are audited: p1's edit and r1's
  approval.
requirements: [HITL-061, HITL-023]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
      - kind: Hook
        id: gate
        version: 1
        schemaVersion: "0.1.0"
        points: [beforeToolCall]
        results: [escalate]
        timeoutMs: 1000
        source: { kind: native, handler: test.hook.gate }
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        requiredHooks: [gate@1]
        allowSelfApproval: { hook: true }
        sensitivityPolicies:
          pii: { allowedProviders: [scripted-a, scripted-b], redaction: [{ mode: mask }] }
          phi: { allowedProviders: [scripted-a], redaction: [{ mode: mask }] }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Updated as edited." }]
          usage: { inputTokens: 30, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - ok: { output: { updated: true } }
    nativeHooks:
      gate:
        - result: escalate
          reasonCode: test.hook.review
        - result: continue
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $e1, payload.escalation.pendingActions.0.id: $act1 }
    expect: { ok: true, endReason: escalated }
  # p1 may review its own `hook` escalation.
  - action: resume
    session: $s
    reviewer: p1
    decisions:
      - decisionId: "01900000-0000-7000-8000-000000000731"
        pendingActionId: $act1
        type: edit
        replacement: { key: k1, value: v2 }
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $e2, payload.escalation.pendingActions.0.id: $act2 }
    expect: { ok: true, endReason: escalated }
  # ...but not the `approval` escalation the edit leads to.
  - action: decide
    session: $s
    reviewer: p1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000732", pendingActionId: $act2, type: approve }
    expect:
      ok: false
      newEvents: 0
      error: { category: unauthorized, code: agentry.hitl.reviewer_refused, details: { decisionId: "01900000-0000-7000-8000-000000000732" } }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000733", pendingActionId: $act2, type: approve }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - type: escalation.raised
            runId: $r1
            payload:
              escalation:
                id: $e1
                pendingActions:
                  - { id: $act1, source: hook, hook: gate@1, reviewerRequirements: { selfApprovalAllowed: true } }
          - { type: run.ended, runId: $r1, payload: { reason: escalated } }
          - { type: escalation.resolved, runId: $r2, payload: { escalationId: $e1, decisions: ["01900000-0000-7000-8000-000000000731"] } }
          - type: escalation.raised
            runId: $r2
            payload:
              escalation:
                id: { $all: [$e2, { $not: $e1 }] }
                sources: [approval]
                pendingActions:
                  - id: { $all: [$act2, { $not: $act1 }] }
                    source: approval
                    reasonCode: agentry.approval.always
                    arguments: { key: k1, value: v2 }
                    reviewerRequirements: { selfApprovalAllowed: false }
          - { type: run.ended, runId: $r2, payload: { reason: escalated } }
          - { type: escalation.resolved, runId: $r3, payload: { escalationId: $e2, decisions: ["01900000-0000-7000-8000-000000000733"] } }
          - type: tool.call
            runId: $r3
            provenances: [reviewer]
            payload: { callId: c1, arguments: { key: k1, value: v2 } }
          - { type: run.ended, runId: $r3, payload: { reason: responded } }
      absentEvents:
        - { type: tool.call, runId: $r1 }
        - { type: tool.call, runId: $r2 }
  stubCalls:
    update_record: [{ arguments: { key: k1, value: v2 } }]
  ports:
    auditLog:
      t1:
        $all:
          - $count: { of: { type: decision }, equals: 2 }
          - $count: { of: { type: decision, details: { id: "01900000-0000-7000-8000-000000000732" } }, equals: 0 }
          - $contains:
              - { type: decision, sessionId: $s, reviewer: { subject: user-1, tenant: t1 }, details: { id: "01900000-0000-7000-8000-000000000731", type: edit } }
              - { type: decision, sessionId: $s, reviewer: { subject: reviewer-1, tenant: t1 }, details: { id: "01900000-0000-7000-8000-000000000733", type: approve } }
