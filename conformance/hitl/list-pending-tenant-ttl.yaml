schemaVersion: "0.1.0"
id: hitl.list-pending-tenant-ttl
title: listPendingEscalations returns only the calling tenant's open escalations, excluding resolved ones and those whose suspendedTtl has elapsed
description: >-
  update_record has `approval: always`, so every session escalates on its
  first call. `default@1` has `suspendedTtl: PT72H` and the default
  `onExpiry: close`; `rejecting@1` is the same with `onExpiry: reject`, so
  a session using it stays `suspended` after its TTL elapses (HITL-082).

  At 2026-01-01T00:00Z $a (default@1) escalates in t1; one minute later
  $aRej (rejecting@1) escalates, and $d escalates and is resumed with an
  approval (resolved, idle). Two days later (2026-01-03T00:01Z): $b
  escalates in t1 and $c in t2.

  - At 2026-01-03T00:01Z the t1 list is exactly [$a, $aRej, $b] — oldest
    `createdAt` first (Area 6 amendment 2026-11-01; the one-minute step
    keeps the createdAt values distinct, so no tie-break by ID is
    involved) — not $d's resolved escalation, not t2's; the t2 list is
    exactly [$c]. Listing persists no event.
  - At 2026-01-04T01:01Z the TTL of $a and $aRej has elapsed. The t1 list
    is exactly [$b]: $a's session has closed `expired`, and $aRej's is
    still `suspended` but its `suspendedTtl` has elapsed, so it is
    excluded too (HITL-100). The t2 list is still [$c], and persists no
    event, since no expiry is due in t2.

  No event count is asserted for the t1 list after expiry: the list
  performs any due expiry processing first ($a's `session.closed`), but
  an implementation may already have processed it when the clock
  advanced.
requirements: [HITL-100]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
      - kind: HarnessProfile
        id: rejecting
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        onExpiry: reject
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1, rejecting@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
    - id: t2
      principals:
        - { id: q1, subject: user-2, assurance: multi_factor }
  providers:
    scripted-a:
      responses:
        # $a
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: ka, value: va } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $aRej
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: kr, value: vr } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $d
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: kd, value: vd } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Updated kd." }]
          usage: { inputTokens: 30, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
        # $b
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: kb, value: vb } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $c
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: kc, value: vc } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - ok: { output: { updated: true } }
script:
  - action: run
    bind: $a
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set ka to va" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $escA }
    expect: { ok: true, endReason: escalated }
  - clock: { advance: PT1M }
  - action: run
    bind: $aRej
    tenant: t1
    principal: p1
    persona: assistant@1
    profile: rejecting@1
    input: [{ type: text, text: "Set kr to vr" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $escARej }
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $d
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set kd to vd" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $escD, payload.escalation.pendingActions.0.id: $actD }
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $d
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000001", pendingActionId: $actD, type: approve }
    expect: { ok: true, endReason: responded }
  - clock: { advance: PT48H }
  - action: run
    bind: $b
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set kb to vb" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $escB }
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $c
    tenant: t2
    principal: q1
    persona: assistant@1
    input: [{ type: text, text: "Set kc to vc" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $escC }
    expect: { ok: true, endReason: escalated }
  - action: listPendingEscalations
    tenant: t1
    expect:
      ok: true
      newEvents: 0
      escalations:
        - { id: $escA, sessionId: $a, tenant: t1, createdAt: { $regex: "^2026-01-01T00:00:00(\\.0+)?Z$" } }
        - { id: $escARej, sessionId: $aRej, tenant: t1, createdAt: { $regex: "^2026-01-01T00:01:00(\\.0+)?Z$" } }
        - { id: $escB, sessionId: $b, tenant: t1, createdAt: { $regex: "^2026-01-03T00:01:00(\\.0+)?Z$" } }
  - action: listPendingEscalations
    tenant: t2
    expect: { ok: true, newEvents: 0, escalations: [{ id: $escC, sessionId: $c, tenant: t2 }] }
  - clock: { advance: PT25H }
  - action: listPendingEscalations
    tenant: t1
    expect: { ok: true, escalations: [{ id: $escB, sessionId: $b, tenant: t1 }] }
  - action: listPendingEscalations
    tenant: t2
    expect: { ok: true, newEvents: 0, escalations: [{ id: $escC, sessionId: $c, tenant: t2 }] }
expect:
  sessions:
    $a:
      state: closed
      closeReason: expired
    $aRej:
      state: suspended
    $b:
      state: suspended
    $c:
      state: suspended
    $d:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: escalation.resolved, payload: { escalationId: $escD } }
          - { type: run.ended, payload: { reason: responded } }
  stubCalls:
    update_record: [{ arguments: { key: kd, value: vd } }]
