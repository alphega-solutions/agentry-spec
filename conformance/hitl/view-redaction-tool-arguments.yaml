schemaVersion: "0.1.0"
id: hitl.view-redaction-tool-arguments
title: A labelled tool call under review is redacted in the reviewer view for an uncleared reviewer, with its arguments nowhere in the view
description: >-
  The bundle gives the sensitivity label `pci` a policy with the
  reviewerRule `'pci_cleared' in reviewer.roles` and no redaction rules,
  so events carry pci content unredacted. Its native afterModelCall hook
  tagger (annotate only, so the streamed profile stays allowed) labels the
  model's one part, a tool_call c1 to update_record (`approval: always`),
  `pci`. The call escalates (source `approval`): the pending action
  is a `tool_call` action whose `labels` are [pci] and whose
  arguments, carried by `escalation.raised`, are the model's.

  getReviewerView is called for two human reviewers of t1:

  - r-plain (no role) is not cleared: the action's content is exactly one
    `tool_call` part with `type`, `provenance` (`model`) and `labels`
    [pci] and `redacted: true`, and no `callId`, `tool` or
    `arguments`; the view's escalation carries no `arguments` on its
    action either (it never does, Area 6 amendment 2026-11-01), so the
    arguments appear nowhere in the view.
  - r-cleared (`pci_cleared`) satisfies the rule and sees the
    `tool_call` part with its call ID, tool and arguments and no
    `redacted` flag; the view's escalation still carries no `arguments`.

  Neither view changes state or emits events (no expiry is due), and the
  call is not dispatched.
requirements: [HITL-030, HITL-031]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        requiredHooks: [tagger@1]
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
          pci:
            allowedProviders: [scripted-a, scripted-b]
            reviewerRule: "'pci_cleared' in reviewer.roles"
      - kind: Hook
        id: tagger
        version: 1
        schemaVersion: "0.1.0"
        points: [afterModelCall]
        results: [annotate]
        failureMode: failOpen
        timeoutMs: 1000
        source: { kind: native, handler: test.hook.tagger }
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r-plain, subject: reviewer-plain, assurance: multi_factor, roles: [] }
        - { id: r-cleared, subject: reviewer-cleared, assurance: multi_factor, roles: [pci_cleared] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: SYN-RESTRICTED-0031 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record: []
    nativeHooks:
      tagger:
        - result: annotate
          labels:
            - { part: 0, labels: [pci] }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $esc, payload.escalation.pendingActions.0.id: $act }
    expect: { ok: true, endReason: escalated }
  - action: getReviewerView
    session: $s
    tenant: t1
    reviewer: r-plain
    expect:
      ok: true
      newEvents: 0
      view:
        escalation:
          id: $esc
          pendingActions: [{ id: $act, kind: tool_call, labels: [pci], arguments: { $absent: true } }]
        actions:
          - pendingActionId: $act
            decided: false
            decisions: []
            content:
              - type: tool_call
                provenance: model
                labels: [pci]
                redacted: true
                callId: { $absent: true }
                tool: { $absent: true }
                arguments: { $absent: true }
  - action: getReviewerView
    session: $s
    tenant: t1
    reviewer: r-cleared
    expect:
      ok: true
      newEvents: 0
      view:
        escalation:
          id: $esc
          pendingActions: [{ id: $act, kind: tool_call, labels: [pci], arguments: { $absent: true } }]
        actions:
          - pendingActionId: $act
            decided: false
            decisions: []
            content:
              - type: tool_call
                callId: c1
                tool: update_record
                arguments: { key: k1, value: SYN-RESTRICTED-0031 }
                labels: [pci]
                redacted: { $absent: true }
expect:
  sessions:
    $s:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: tagger@1, point: afterModelCall, result: annotate } }
          - type: escalation.raised
            payload:
              escalation:
                id: $esc
                sources: [approval]
                reasonCodes: [agentry.approval.always]
                pendingActions:
                  - id: $act
                    kind: tool_call
                    source: approval
                    reasonCode: agentry.approval.always
                    callId: c1
                    tool: update_record
                    labels: [pci]
                    arguments: { key: k1, value: SYN-RESTRICTED-0031 }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call }
  stubCalls:
    tagger: { count: 1 }
    update_record: { count: 0 }
