schemaVersion: "0.1.0"
id: hitl.operation-lease-contention
title: While close() holds its operation lease on a suspended session, decide(), resume(), run() and cancel() fail with `conflict` and write nothing
description: >-
  update_record is `approval: always`, so $s escalates at 00:00 with one
  undecided `tool_call` action $a1 (c1) and is `suspended`. Processes
  sharing the same ports then act on $s at once. Process A calls close(),
  which on a suspended session is a write outside a run and so takes an
  operation lease (HITL-090, HITL-093, amendment 2026-11-14). A is held
  at `after_operation_lease`: the lease is acquired and the ports fenced,
  and nothing is written yet. While A holds it, the later siblings act on
  $s, each in its own process:

  - decide() by reviewer r1 approving $a1;
  - resume() by reviewer r2 approving $a1 (a different decision ID);
  - run() by the principal;
  - cancel().

  Under HITL-093, while a session holds a current lease of either kind,
  `run()`, `resume()`, `decide()`, `close()` and `cancel()` of a
  non-active session fail with `conflict` (`retryable: true`) and change
  nothing (CORE-031 as amended 2026-11-14 for run() and resume()). Each
  of the four therefore fails with `conflict` and persists no event
  (`newEvents: 0`). Without the lease, decide(), resume() and cancel()
  would all have succeeded, so their refusal is the lease's. The session
  is still `suspended` (A has written nothing), so these are not
  CORE-022 refusals of a closed session.

  A is then released and its close() succeeds. The session ends `closed`
  (`cancelled`, the close reason of a suspended session) with exactly one
  `session.closed`, which has no `runId`. Since the refused operations
  changed nothing: no decision is audited for $s, the escalation is never
  resolved, no resume or second run starts (one `run.started` in all),
  update_record is never dispatched, and the provider receives one
  request.

  Format limit: the step outcome's `error` has no `retryable` field, and
  no `agentry.*` code is registered for lease contention, so the fixture
  asserts the category only.
requirements: [HITL-093, CORE-031]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        binding: { kind: native, handler: test.update_record }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
        - { id: r2, subject: reviewer-2, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: SYN-k1, value: SYN-v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set SYN-k1 to SYN-v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.pendingActions.0.id: $a1 }
    expect: { ok: true, endReason: escalated }
  - separateProcesses: true
    concurrently:
      - action: close
        session: $s
        holdAt: after_operation_lease
        expect: { ok: true }
      - action: decide
        session: $s
        reviewer: r1
        decisions:
          - { decisionId: "01900000-0000-7000-8000-000000000931", pendingActionId: $a1, type: approve }
        expect: { ok: false, error: { category: conflict, code: agentry.session.busy, retryable: true }, newEvents: 0 }
      - action: resume
        session: $s
        reviewer: r2
        decisions:
          - { decisionId: "01900000-0000-7000-8000-000000000932", pendingActionId: $a1, type: approve }
        expect: { ok: false, error: { category: conflict, code: agentry.session.busy, retryable: true }, newEvents: 0 }
      - action: run
        session: $s
        principal: p1
        input: [{ type: text, text: "SYN-also" }]
        expect: { ok: false, error: { category: conflict, code: agentry.session.busy, retryable: true }, newEvents: 0 }
      - action: cancel
        session: $s
        expect: { ok: false, error: { category: conflict, code: agentry.session.busy, retryable: true }, newEvents: 0 }
expect:
  sessions:
    $s:
      state: closed
      closeReason: cancelled
      events:
        mode: subsequence
        items:
          - { type: escalation.raised, payload: { escalation: { pendingActions: [{ id: $a1, kind: tool_call }] } } }
          - { type: run.ended, payload: { reason: escalated } }
          - { type: session.closed, runId: { $absent: true }, payload: { reason: cancelled } }
      absentEvents:
        - { type: escalation.resolved }
        - { type: tool.result }
        - { type: run.started, payload: { kind: resume } }
        - { type: turn.started, turn: 2 }
  ports:
    eventLog:
      t1:
        $s:
          $all:
            - $count: { of: { type: session.closed }, equals: 1 }
            - $count: { of: { type: run.started }, equals: 1 }
    auditLog:
      t1:
        $count: { of: { type: decision, sessionId: $s }, equals: 0 }
  stubCalls:
    update_record: { count: 0 }
  providerRequests:
    scripted-a: { count: 1 }
