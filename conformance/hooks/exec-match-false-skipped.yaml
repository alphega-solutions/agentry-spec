schemaVersion: "0.1.0"
id: hook.exec-match-false-skipped
title: "A hook whose `match` is false does not run: no invocation, no decision; when `match` is true it runs"
description: >-
  record-guard (native, beforeToolCall) matches only update_record and
  would block every call it sees. $sSkip calls lookup: match is false, so
  the hook is not invoked, nothing is recorded and lookup is dispatched.
  $sRun calls update_record: match is true, the hook is invoked once and
  blocks. The hook stub holds exactly one behaviour, so an invocation in
  $sSkip would also exhaust it before $sRun.
requirements: [HOOK-031]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Hook
        id: record-guard
        version: 1
        schemaVersion: "0.1.0"
        points: [beforeToolCall]
        results: [block]
        timeoutMs: 1000
        match: "tool.id == 'update_record'"
        source: { kind: native, handler: test.hook.record-guard }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [record-guard@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Found it." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Not updated." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: v0 } }
      update_record: []
    nativeHooks:
      record-guard:
        - result: block
          reasonCode: test.guard.blocked
script:
  - action: run
    bind: $sSkip
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sRun
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sSkip:
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: lookup } }
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { value: v0 } } } } }
      absentEvents:
        - { type: hook.decision }
        - { type: error }
    $sRun:
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: record-guard@1, point: beforeToolCall, result: block } }
          - { type: tool.result, payload: { callId: c1, result: { error: { category: policy } } } }
  stubCalls:
    record-guard:
      - arguments: { point: beforeToolCall, sessionId: $sRun, tool: { id: update_record } }
    lookup: { count: 1 }
    update_record: { count: 0 }
