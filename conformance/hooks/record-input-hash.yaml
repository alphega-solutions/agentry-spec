schemaVersion: "0.1.0"
id: hook.record-input-hash
title: "A hook decision records a hash of the hook's input: identical input gives the same hash, different input a different one"
description: >-
  The rule hook hasher annotates at sessionStart every time. $sFirst and
  $sSame are separate sessions with the same principal, persona and first
  input; $sOther differs only in its input text. $sFirst and $sSame record
  the same inputHash; $sOther records a different one, so the hash covers
  the hook's view and not the session or run identifiers (HOOK-062 as
  amended 2026-11-01; replay itself, EVAL-063, is Area 11's).


  The exact inputHash of $sFirst (and $sSame) is asserted. It is
  "sha256:" + the hex SHA-256 of the RFC 8785 canonical JSON of the hook's
  view at sessionStart — the `variables` of its HookRequest, without
  schemaVersion, hook, point, tenant, sessionId, runId and traceContext:
  principal {subject: user-1, tenant: t1, roles: [analyst], attributes:
  {dept: ops}, assurance: multi_factor} (roles and attributes are set
  explicitly so no default applies); session {persona: assistant@1,
  tainted: false, turn: 1, step: 0} (step 0 at sessionStart); content [the
  principal's first input as one text part {type: text, text:
  SYN-INPUT-0062-A, provenance: principal, labels: []}]. The canonical
  bytes hashed are exactly:
  {"content":[{"labels":[],"provenance":"principal","text":"SYN-INPUT-0062-A","type":"text"}],"principal":{"assurance":"multi_factor","attributes":{"dept":"ops"},"roles":["analyst"],"subject":"user-1","tenant":"t1"},"session":{"persona":"assistant@1","step":0,"tainted":false,"turn":1}}
  For $sOther the same view with text SYN-INPUT-0062-B gives
  sha256:e9418271524270f018758df879d4f8dca186deca6c13a2c48cf6d6c0c294b8f6.
requirements: [HOOK-062]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Hook
        id: hasher
        version: 1
        schemaVersion: "0.1.0"
        points: [sessionStart]
        results: [annotate]
        timeoutMs: 1000
        source: { kind: rule, when: "true", then: { result: annotate, labels: [pii] } }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [hasher@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, roles: [analyst], attributes: { dept: ops }, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: text, text: "One." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Two." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Three." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
script:
  - action: run
    bind: $sFirst
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "SYN-INPUT-0062-A" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sSame
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "SYN-INPUT-0062-A" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sOther
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "SYN-INPUT-0062-B" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sFirst:
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: hasher@1, point: sessionStart, result: annotate, inputHash: { $all: [$h, "sha256:fddc18b23c93dad8c69f6d0e7eecfdc31ff07037a09758639a4021273af6b4ab"] } } }
    $sSame:
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: hasher@1, point: sessionStart, result: annotate, inputHash: $h } }
    $sOther:
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: hasher@1, point: sessionStart, result: annotate, inputHash: { $all: [{ $not: $h }, "sha256:e9418271524270f018758df879d4f8dca186deca6c13a2c48cf6d6c0c294b8f6"] } } }
