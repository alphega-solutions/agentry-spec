schemaVersion: "0.1.0"
id: hook.exec-one-hook-two-points
title: One hook declared at two points is invoked separately at each, every time each point is reached
description: >-
  A native hook sits at beforeModelCall and afterModelCall. The turn has
  two model calls (a lookup, then a text answer), so the hook is invoked
  four times, alternating beforeModelCall and afterModelCall, each request
  naming its own point. Only the fourth invocation (afterModelCall on the
  final answer) annotates, so exactly one hook.decision is emitted, for
  that point; the beforeModelCall invocations answer continue and record
  nothing.
requirements: [HOOK-004]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Hook
        id: observer
        version: 1
        schemaVersion: "0.1.0"
        points: [beforeModelCall, afterModelCall]
        results: [annotate]
        timeoutMs: 1000
        source: { kind: native, handler: test.hook.observer }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [observer@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "The value is SYN-VALUE-0004." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "SYN-VALUE-0004" } }
    nativeHooks:
      observer:
        - result: continue
        - result: continue
        - result: continue
        - result: annotate
          labels: [{ part: 0, labels: [pii] }]
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: model.request, step: 1 }
          - { type: model.response, step: 1 }
          - { type: tool.result, payload: { callId: c1 } }
          - { type: model.request, step: 2 }
          - { type: model.response, step: 2 }
          - { type: hook.decision, payload: { hook: observer@1, point: afterModelCall, result: annotate, labelsAdded: [pii] } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: hook.decision, payload: { point: beforeModelCall } }
  stubCalls:
    observer:
      - arguments: { hook: observer@1, point: beforeModelCall }
      - arguments: { hook: observer@1, point: afterModelCall }
      - arguments: { hook: observer@1, point: beforeModelCall }
      - arguments: { hook: observer@1, point: afterModelCall }
