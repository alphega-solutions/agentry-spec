schemaVersion: "0.1.0"
id: hook.result-rewrite-provenance-labels
title: Rewritten content keeps the provenance and labels of what it replaces; an inserted part takes the least-trusted provenance and the union of labels
description: >-
  $sReplace: lookup carries sensitivity pii, so its result has provenance
  tool:lookup and labels [pii]. The remote afterToolCall hook redact
  rewrites the result (the replacement part carries no provenance or labels,
  as HookResult requires). The rewritten result keeps provenance tool:lookup
  (trust is not raised) and still carries pii (labels are not dropped), in
  the tool.result event and in what the model receives. $sInsert: the
  principal sends a text part (provenance principal, no labels) and an
  uploaded image (provenance attachment:upload, labels [pii] from the
  profile's defaultAttachmentLabels). The remote sessionStart hook expand
  rewrites the input into the same two parts plus a new text part,
  SYN-INSERTED-0021. Reading: a part with no counterpart in the content the
  hook saw is inserted; whatever the correspondence rule for the other
  parts, the inserted part must take the least-trusted provenance of the
  rewritten content (attachment:upload, an untrusted source, rather than
  principal) and the union of its labels ([pii]).
requirements: [HOOK-021]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        remoteHooks:
          - { id: redact, endpoint: "memory://hook-redact", region: test-region }
          - { id: expand, endpoint: "memory://hook-expand", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Hook
        id: redact
        version: 1
        schemaVersion: "0.1.0"
        points: [afterToolCall]
        results: [rewrite]
        timeoutMs: 1000
        source: { kind: remote, endpoint: redact }
      - kind: Hook
        id: expand
        version: 1
        schemaVersion: "0.1.0"
        points: [sessionStart]
        results: [rewrite]
        timeoutMs: 1000
        source: { kind: remote, endpoint: expand }
      - kind: Tool
        id: lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        sensitivity: [pii]
        binding: { kind: native, handler: test.lookup }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [redact@1, expand@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: [pii]
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { vision: true }
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "The value is redacted." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "A chart." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  ports:
    blobStore:
      t1:
        - id: blob-img-1
          hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7"
          mediaType: image/png
          size: 20
          data: "U1lOVEhFVElDLUlNQUdFLTAwMDE="
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "SYN-RAW-0021" } }
    remoteHooks:
      expand:
        - result: continue
        - result: rewrite
          parts:
            - { type: text, text: "Describe this" }
            - { type: image, mediaType: image/png, blob: { id: blob-img-1, hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7", mediaType: image/png, size: 20 } }
            - { type: text, text: "SYN-INSERTED-0021" }
      redact:
        - result: rewrite
          parts:
            - { type: tool_result, callId: c1, tool: lookup, result: { ok: { output: { value: "[redacted]" } } } }
script:
  - action: run
    bind: $sReplace
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sInsert
    tenant: t1
    principal: p1
    persona: assistant@1
    input:
      - { type: text, text: "Describe this" }
      - { type: image, mediaType: image/png, source: upload, blob: { id: blob-img-1, hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7", mediaType: image/png, size: 20 } }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sReplace:
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: redact@1, point: afterToolCall, result: rewrite } }
          - type: tool.result
            provenances: ["tool:lookup"]
            labels: { $contains: [pii] }
            payload: { callId: c1, result: { ok: { output: { value: "[redacted]" } } } }
    $sInsert:
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: expand@1, point: sessionStart, result: rewrite } }
          - { type: model.request }
  stubCalls:
    redact:
      - arguments: { content: [{ type: tool_result, callId: c1, provenance: "tool:lookup", labels: [pii] }] }
    expand:
      - {}
      - arguments:
          content:
            - { type: text, text: "Describe this", provenance: principal, labels: [] }
            - { type: image, blob: { id: blob-img-1 }, provenance: "attachment:upload", labels: [pii] }
  providerRequests:
    scripted-a:
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                - type: tool_result
                  callId: c1
                  provenance: "tool:lookup"
                  labels: { $contains: [pii] }
                  result: { ok: { output: { value: "[redacted]" } } }
      - messages:
          $contains:
            - parts:
                $contains:
                  - type: text
                    text: "SYN-INSERTED-0021"
                    provenance: "attachment:upload"
                    labels: { $contains: [pii] }
  noPersistedContent: ["SYN-RAW-0021"]
