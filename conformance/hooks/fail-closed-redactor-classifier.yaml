schemaVersion: "0.1.0"
id: hook.fail-closed-redactor-classifier
title: "A failed redactor (rewrite only) or classifier (annotate only) guardrail at afterToolCall withholds the result: it never reaches the model unredacted or unlabelled"
description: >-
  Two required remote afterToolCall guardrails, failClosed by default, each
  matched to one tool so exactly one runs per session. A failed failClosed
  hook is a block whatever results it declares (HOOK-053 as amended
  2026-11-07); at afterToolCall a block withholds the result and the model
  receives a `policy` error (CORE-180), and the turn continues.

  - $sRedactor: redactor declares only rewrite and runs on note_lookup. Its
    endpoint errors, so the failure is a block: an `error` event with code
    agentry.hook.failed, category unavailable, retryable false, source hook,
    and hook.decision {result: block, reasonCode: agentry.hook.failed}. The
    unredacted note is never sent to the model.
  - $sBarred: classifier declares only annotate and runs on lookup, whose
    results carry pii. The bundle's pii policy allows only the redactor
    endpoint (allowedRemoteHooks), so classifier may not receive the
    result: it has failed (HOOK-054), its endpoint receives nothing, and the
    failure is a block: an `error` event with code
    agentry.hook.content_barred, category policy, and hook.decision
    {result: block, reasonCode: agentry.hook.content_barred}.

  In both sessions the tool result is recorded only as its `policy` error
  (TOOL-073), so the raw outputs are in no event, blob, audit record or
  checkpoint.
requirements: [HOOK-053, HOOK-054]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        remoteHooks:
          - { id: redactor, endpoint: "memory://hook-redactor", region: test-region }
          - { id: classifier, endpoint: "memory://hook-classifier", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Hook
        id: redactor
        version: 1
        schemaVersion: "0.1.0"
        points: [afterToolCall]
        results: [rewrite]
        timeoutMs: 1000
        match: "tool.id == 'note_lookup'"
        source: { kind: remote, endpoint: redactor }
      - kind: Hook
        id: classifier
        version: 1
        schemaVersion: "0.1.0"
        points: [afterToolCall]
        results: [annotate]
        timeoutMs: 1000
        match: "tool.id == 'lookup'"
        source: { kind: remote, endpoint: classifier }
      - kind: Tool
        id: lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        sensitivity: [pii]
        binding: { kind: native, handler: test.lookup }
      - kind: Tool
        id: note_lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up an unlabelled note.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        binding: { kind: native, handler: test.note_lookup }
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
            allowedRemoteHooks: [redactor]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, note_lookup@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [redactor@1, classifier@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # $sRedactor
        - parts: [{ type: tool_call, callId: c1, tool: note_lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "The note was withheld." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sBarred
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "The record was withheld." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      note_lookup:
        - ok: { output: { value: "SYN-NOTE-SSN-0053" } }
      lookup:
        - ok: { output: { value: "SYN-PII-0053" } }
    remoteHooks:
      redactor:
        - error: { category: unavailable, code: test.hook.down }
      # Barred: never invoked.
      classifier: []
script:
  - action: run
    bind: $sRedactor
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up the note k1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sBarred
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sRedactor:
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: note_lookup } }
          - { type: error, payload: { error: { code: agentry.hook.failed, category: unavailable, retryable: false, source: hook } } }
          - { type: tool.result, payload: { callId: c1, result: { error: { category: policy } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.result, payload: { result: { ok: { $any: true } } } }
    $sBarred:
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: lookup } }
          - { type: error, payload: { error: { code: agentry.hook.content_barred, category: policy, retryable: false, source: hook } } }
          - { type: tool.result, payload: { callId: c1, result: { error: { category: policy } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.result, payload: { result: { ok: { $any: true } } } }
  ports:
    eventLog:
      t1:
        $sRedactor:
          $all:
            - $count: { of: { type: hook.decision }, equals: 1 }
            - $count: { of: { type: hook.decision, payload: { hook: redactor@1, point: afterToolCall, result: block, reasonCode: agentry.hook.failed } }, equals: 1 }
            - $count: { of: { type: error, payload: { error: { code: test.hook.down } } }, equals: 0 }
        $sBarred:
          $all:
            - $count: { of: { type: hook.decision }, equals: 1 }
            - $count: { of: { type: hook.decision, payload: { hook: classifier@1, point: afterToolCall, result: block, reasonCode: agentry.hook.content_barred } }, equals: 1 }
  stubCalls:
    redactor:
      - arguments: { sessionId: $sRedactor, point: afterToolCall, tool: { id: note_lookup } }
    classifier: { count: 0 }
  providerRequests:
    scripted-a:
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                - { type: tool_result, callId: c1, result: { error: { category: policy } } }
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                - { type: tool_result, callId: c1, result: { error: { category: policy } } }
  noPersistedContent:
    - ports: [eventLog, blobStore, auditLog, checkpointStore]
      strings: ["SYN-NOTE-SSN-0053", "SYN-PII-0053"]
