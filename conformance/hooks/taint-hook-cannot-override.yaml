schemaVersion: "0.1.0"
id: hook.taint-hook-cannot-override
title: A `beforeToolCall` hook is never invoked for a call the taint rule blocked, so it cannot unblock it
description: >-
  `archive_record` is mutating with `onTainted: block`. A required remote
  `beforeToolCall` guardrail hook `pre` (matching only archive_record) is
  scripted to answer `continue` once.

  - $sControl: untainted session → the taint rule does not act, `pre` is
    invoked once (and answers continue), and the call is dispatched. This
    consumes the hook's only scripted answer.
  - $sBlocked: tainted by an untrusted lookup result → taint decision
    `block` at stage 5; the call never reaches stage 6, so `pre` is not
    invoked (a second invocation would also exhaust the stub), no
    `hook.decision` is emitted, the call is not dispatched, and the model
    receives a `policy` error.
requirements: [HOOK-125]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        remoteHooks:
          - { id: pre, endpoint: "memory://hook-pre", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Hook
        id: pre
        version: 1
        schemaVersion: "0.1.0"
        points: [beforeToolCall]
        results: [block]
        timeoutMs: 1000
        match: "tool.id == 'archive_record'"
        source: { kind: remote, endpoint: pre }
      - kind: Tool
        id: archive_record
        version: 1
        schemaVersion: "0.1.0"
        description: Archive a record.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: mutating
        idempotent: true
        onTainted: block
        binding: { kind: native, handler: test.archive_record }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, archive_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [pre@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # $sControl
        - parts: [{ type: tool_call, callId: c1, tool: archive_record, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Archived." }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sBlocked
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: archive_record, arguments: { key: k1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "That record could not be archived." }]
          usage: { inputTokens: 40, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "SYN-UNTRUSTED-0001" } }
      archive_record:
        - ok: { output: { archived: true } }
    remoteHooks:
      pre:
        - result: continue
script:
  - action: run
    bind: $sControl
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Archive k1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sBlocked
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1, then archive it" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sControl:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: archive_record } }
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { archived: true } } } } }
      absentEvents:
        - { type: policy.decision, payload: { kind: taint } }
    $sBlocked:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: policy.decision, payload: { kind: taint, outcome: block, callId: c2, tool: archive_record } }
          - { type: tool.result, payload: { callId: c2, result: { error: { category: policy } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: hook.decision }
        - { type: tool.call, payload: { callId: c2 } }
        - { type: escalation.raised }
  stubCalls:
    pre:
      - { arguments: { point: beforeToolCall, sessionId: $sControl, tool: { id: archive_record } } }
    archive_record: [{ arguments: { key: k1 } }]
    lookup: { count: 1 }
