schemaVersion: "0.1.0"
id: hook.taint-mutating-egress-stricter
title: When a call is both mutating and egress with labelled content in context, the stricter of the two taint outcomes applies
description: >-
  Every session is tainted by the untrusted `fetch_external`. Where noted,
  the trusted `read_contact` adds `pii`-labelled content. All three push
  tools are mutating and egress; strictness order is block > escalate >
  allow.

  - $sA: push_a (onTainted escalate, onTaintedEgress block), labelled →
    both hold → block.
  - $sAMutOnly: push_a, no labelled content → only the mutating condition
    holds → escalate.
  - $sB: push_b (onTainted block, onTaintedEgress escalate), labelled →
    block (the mutating outcome is the stricter one here).
  - $sC: push_c (onTainted allow, onTaintedEgress escalate), labelled →
    escalate (the egress outcome is the stricter one).
  - $sCMutOnly: push_c, no labelled content → only the mutating condition
    holds → allow: a taint decision `allow` and the call is dispatched.

  The controls show each tool's single-condition outcome, so the
  two-condition results cannot come from evaluating only one condition.
requirements: [HOOK-122]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        trustedTools: [read_contact@1]
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
      - kind: Tool
        id: fetch_external
        version: 1
        schemaVersion: "0.1.0"
        description: Fetch a record from an external source.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        binding: { kind: native, handler: test.fetch_external }
      - kind: Tool
        id: read_contact
        version: 1
        schemaVersion: "0.1.0"
        description: Read a contact.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        sensitivity: [pii]
        binding: { kind: native, handler: test.read_contact }
      - kind: Tool
        id: push_a
        version: 1
        schemaVersion: "0.1.0"
        description: Push a record to an external system (variant A).
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: mutating
        egress: true
        idempotent: false
        onTainted: escalate
        onTaintedEgress: block
        binding: { kind: native, handler: test.push_a }
      - kind: Tool
        id: push_b
        version: 1
        schemaVersion: "0.1.0"
        description: Push a record to an external system (variant B).
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: mutating
        egress: true
        idempotent: false
        onTainted: block
        onTaintedEgress: escalate
        binding: { kind: native, handler: test.push_b }
      - kind: Tool
        id: push_c
        version: 1
        schemaVersion: "0.1.0"
        description: Push a record to an external system (variant C).
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: mutating
        egress: true
        idempotent: false
        onTainted: allow
        onTaintedEgress: escalate
        binding: { kind: native, handler: test.push_c }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [fetch_external@1, read_contact@1, push_a@1, push_b@1, push_c@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # $sA
        - parts: [{ type: tool_call, callId: c1, tool: fetch_external, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: read_contact, arguments: { key: k1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c3, tool: push_a, arguments: { key: k1 } }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Not pushed." }]
          usage: { inputTokens: 50, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sAMutOnly
        - parts: [{ type: tool_call, callId: c1, tool: fetch_external, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c3, tool: push_a, arguments: { key: k1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sB
        - parts: [{ type: tool_call, callId: c1, tool: fetch_external, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: read_contact, arguments: { key: k1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c3, tool: push_b, arguments: { key: k1 } }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Not pushed." }]
          usage: { inputTokens: 50, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sC
        - parts: [{ type: tool_call, callId: c1, tool: fetch_external, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: read_contact, arguments: { key: k1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c3, tool: push_c, arguments: { key: k1 } }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sCMutOnly
        - parts: [{ type: tool_call, callId: c1, tool: fetch_external, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c3, tool: push_c, arguments: { key: k1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Pushed." }]
          usage: { inputTokens: 40, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      fetch_external:
        - ok: { output: { value: "SYN-UNTRUSTED-0001" } }
        - ok: { output: { value: "SYN-UNTRUSTED-0001" } }
        - ok: { output: { value: "SYN-UNTRUSTED-0001" } }
        - ok: { output: { value: "SYN-UNTRUSTED-0001" } }
        - ok: { output: { value: "SYN-UNTRUSTED-0001" } }
      read_contact:
        - ok: { output: { contact: "SYN-CONTACT-0001" } }
        - ok: { output: { contact: "SYN-CONTACT-0001" } }
        - ok: { output: { contact: "SYN-CONTACT-0001" } }
      push_a: []
      push_b: []
      push_c:
        - ok: { output: { pushed: true } }
script:
  - action: run
    bind: $sA
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Fetch k1, read contact k1, push with A" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sAMutOnly
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Fetch k1, push with A" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $sB
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Fetch k1, read contact k1, push with B" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sC
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Fetch k1, read contact k1, push with C" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $sCMutOnly
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Fetch k1, push with C" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sA:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c2, tool: read_contact } }
          - { type: policy.decision, payload: { kind: taint, outcome: block, callId: c3, tool: push_a } }
          - { type: tool.result, payload: { callId: c3, result: { error: { category: policy } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: escalation.raised }
        - { type: tool.call, payload: { callId: c3 } }
    $sAMutOnly:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: policy.decision, payload: { kind: taint, outcome: escalate, callId: c3, tool: push_a } }
          - { type: escalation.raised, payload: { escalation: { sources: [taint], pendingActions: [{ callId: c3, source: taint }] } } }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call, payload: { callId: c3 } }
    $sB:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c2, tool: read_contact } }
          - { type: policy.decision, payload: { kind: taint, outcome: block, callId: c3, tool: push_b } }
          - { type: tool.result, payload: { callId: c3, result: { error: { category: policy } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: escalation.raised }
        - { type: tool.call, payload: { callId: c3 } }
    $sC:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c2, tool: read_contact } }
          - { type: policy.decision, payload: { kind: taint, outcome: escalate, callId: c3, tool: push_c } }
          - { type: escalation.raised, payload: { escalation: { sources: [taint], pendingActions: [{ callId: c3, source: taint }] } } }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call, payload: { callId: c3 } }
    $sCMutOnly:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: policy.decision, payload: { kind: taint, outcome: allow, callId: c3, tool: push_c } }
          - { type: tool.call, payload: { callId: c3, tool: push_c } }
          - { type: tool.result, payload: { callId: c3, result: { ok: { output: { pushed: true } } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: escalation.raised }
  stubCalls:
    push_a: { count: 0 }
    push_b: { count: 0 }
    push_c: [{ arguments: { key: k1 } }]
