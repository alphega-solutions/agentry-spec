schemaVersion: "0.1.0"
id: hook.taint-labels-from-annotate
title: A label a hook's annotate adds to principal text enters the session label set and makes a later tainted egress call meet the egress condition
description: >-
  The rule hook `pii-tagger` (sessionStart, results [annotate], required by
  the persona) annotates with `pii` when the principal's first input holds
  a text part containing "SYN-PII-"; a rule's annotate adds its labels to
  every part the point sees, here the one principal text part. Principal
  text is otherwise unlabelled (CORE-127). `fetch_external` is untrusted
  and unlabelled; `send_note` is an egress read tool with the default
  `onTaintedEgress` (block). No tool in this fixture declares or reports a
  label, so the hook is the only source of a label.

  - $sTagged: the input "Send SYN-PII-0001 after fetching k1" matches, so
    the hook annotates it `pii` (HOOK-022: annotate adds labels): the
    hook.decision records the annotate and the model receives the
    principal part labelled `[pii]`. The part entered context labelled, so
    the session label set is `[pii]` (HOOK-127: principal parts labelled by
    hooks count). Step 1 calls fetch_external (c1), whose untrusted result
    taints the session. Step 2 calls send_note (c2): tainted, egress, label
    set non-empty, so the egress condition holds (HOOK-122): taint decision
    `block` with provenances `[tool:fetch_external]` and labels `[pii]`;
    send_note is not dispatched and the model receives a `policy` error.
    The checkpoint records the label set.
  - $sPlain (control): the input "Send SYN-PLAIN-0002 after fetching k2"
    does not match, so nothing is annotated. The same calls follow; the
    session is tainted but its label set is empty, so the egress condition
    does not hold, no taint decision is emitted, and send_note is
    dispatched.
requirements: [HOOK-127, HOOK-022, HOOK-122]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Hook
        id: pii-tagger
        version: 1
        schemaVersion: "0.1.0"
        points: [sessionStart]
        results: [annotate]
        timeoutMs: 1000
        source: { kind: rule, when: "content.exists(p, p.type == 'text' && p.text.contains('SYN-PII-'))", then: { result: annotate, labels: [pii] } }
      - kind: Tool
        id: fetch_external
        version: 1
        schemaVersion: "0.1.0"
        description: Fetch a record from an external source.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        binding: { kind: native, handler: test.fetch_external }
      - kind: Tool
        id: send_note
        version: 1
        schemaVersion: "0.1.0"
        description: Send a note to an external address.
        input:
          type: object
          additionalProperties: false
          required: [text]
          properties: { text: { type: string } }
        effect: read
        egress: true
        binding: { kind: native, handler: test.send_note }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [fetch_external@1, send_note@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [pii-tagger@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # $sTagged
        - parts: [{ type: tool_call, callId: c1, tool: fetch_external, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: send_note, arguments: { text: "SYN-PII-0001" } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "The note could not be sent." }]
          usage: { inputTokens: 40, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sPlain
        - parts: [{ type: tool_call, callId: c1, tool: fetch_external, arguments: { key: k2 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: send_note, arguments: { text: "SYN-PLAIN-0002" } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Sent." }]
          usage: { inputTokens: 40, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      fetch_external:
        - ok: { output: { value: "SYN-UNTRUSTED-0001" } }
        - ok: { output: { value: "SYN-UNTRUSTED-0002" } }
      send_note:
        - ok: { output: { sent: true } }
script:
  - action: run
    bind: $sTagged
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Send SYN-PII-0001 after fetching k1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sPlain
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Send SYN-PLAIN-0002 after fetching k2" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sTagged:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: pii-tagger@1, point: sessionStart, result: annotate } }
          - { type: tool.result, payload: { callId: c1, tool: fetch_external } }
          - { type: policy.decision, payload: { kind: taint, outcome: block, callId: c2, tool: send_note, provenances: ["tool:fetch_external"], labels: [pii] } }
          - { type: tool.result, payload: { callId: c2, result: { error: { category: policy } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.call, payload: { callId: c2 } }
        - { type: escalation.raised }
      checkpoint:
        taint: { tainted: true, provenances: ["tool:fetch_external"], labels: [pii] }
    $sPlain:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1, tool: fetch_external } }
          - { type: tool.call, payload: { callId: c2, tool: send_note } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: hook.decision, payload: { hook: pii-tagger@1, result: annotate } }
        - { type: policy.decision, payload: { kind: taint } }
  stubCalls:
    fetch_external: { count: 2 }
    send_note: [{ arguments: { text: "SYN-PLAIN-0002" } }]
  providerRequests:
    scripted-a:
      # $sTagged, step 1: the principal's text arrives labelled pii
      - messages:
          $contains:
            - role: principal
              parts: [{ type: text, text: "Send SYN-PII-0001 after fetching k1", provenance: principal, labels: [pii] }]
      - {}
      - {}
      # $sPlain, step 1
      - messages:
          $contains:
            - role: principal
              parts: [{ type: text, text: "Send SYN-PLAIN-0002 after fetching k2", provenance: principal, labels: [] }]
      - {}
      - {}
