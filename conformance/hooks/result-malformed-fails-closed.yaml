schemaVersion: "0.1.0"
id: hook.result-malformed-fails-closed
title: A malformed hook response is a failure; a fail-closed hook's failure is a block with an `error` event
description: >-
  gate is a remote beforeModelCall guardrail that declares `block` and no
  failureMode (so failClosed). Its responses are not valid HookResults:
  $sText: a non-JSON body; $sNoReason: `block` without the required
  reasonCode; $sUnknown: an unknown result value. Each is a failure
  (HOOK-050): an `error` event with source hook, then block: no model call,
  run `blocked`, fallback delivered. $sControl: a valid `continue` reaches
  the model.
requirements: [HOOK-050, HOOK-051]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        remoteHooks:
          - { id: gate, endpoint: "memory://hook-gate", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Hook
        id: gate
        version: 1
        schemaVersion: "0.1.0"
        points: [beforeModelCall]
        results: [block]
        timeoutMs: 1000
        source: { kind: remote, endpoint: gate }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [gate@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: text, text: "Hello." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
  stubs:
    remoteHooks:
      gate:
        - raw: "SYN-NOT-JSON-0050 <html>"
        - raw: { result: block }
        - raw: { result: allow }
        - result: continue
script:
  - action: run
    bind: $sText
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: blocked }
  - action: run
    bind: $sNoReason
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: blocked }
  - action: run
    bind: $sUnknown
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: blocked }
  - action: run
    bind: $sControl
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sText:
      events:
        mode: subsequence
        items:
          - { type: error, payload: { error: { source: hook } } }
          - { type: run.ended, payload: { reason: blocked } }
      absentEvents:
        - { type: model.request }
        - { type: hook.decision, payload: { result: { $not: block } } }
    $sNoReason:
      events:
        mode: subsequence
        items:
          - { type: error, payload: { error: { source: hook } } }
          - { type: run.ended, payload: { reason: blocked } }
      absentEvents:
        - { type: model.request }
        - { type: hook.decision, payload: { result: { $not: block } } }
    $sUnknown:
      events:
        mode: subsequence
        items:
          - { type: error, payload: { error: { source: hook } } }
          - { type: run.ended, payload: { reason: blocked } }
      absentEvents:
        - { type: model.request }
        - { type: hook.decision, payload: { result: { $not: block } } }
    $sControl:
      events:
        mode: subsequence
        items:
          - { type: model.request }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: error }
  stubCalls:
    gate: { count: 4 }
  providerRequests:
    scripted-a: { count: 1 }
    scripted-b: { count: 0 }
  delivered:
    $sText: { text: "This request was blocked.", fallback: true }
    $sNoReason: { text: "This request was blocked.", fallback: true }
    $sUnknown: { text: "This request was blocked.", fallback: true }
