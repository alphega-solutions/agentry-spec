schemaVersion: "0.1.0"
id: hook.taint-attachment-source-trust
title: An attachment from a source not in `trustedAttachmentSources` taints the session, which stays tainted in later turns
description: >-
  The deployment declares attachment sources `upload` and `email`; the
  bundle trusts only `upload`. Each session supplies the same synthetic file.

  - $sUpload: the file arrives through `upload` (trusted). A mutating call
    in the same turn is dispatched with no taint decision; the checkpoint is
    not tainted.
  - $sEmail: the file arrives through `email` (untrusted). Turn 1 makes no
    tool call, so no taint decision is emitted. Turn 2 has no attachment and
    no untrusted content of its own; its mutating call still escalates at
    stage 5, and the decision names attachment:email (taint is sticky). The
    checkpoint records the taint and that provenance.
requirements: [HOOK-120, HOOK-121]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        trustedAttachmentSources: [upload]
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { documents: true }
      responses:
        # $sUpload
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done." }]
          usage: { inputTokens: 50, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sEmail, turn 1
        - parts: [{ type: text, text: "I have read the file." }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sEmail, turn 2
        - parts: [{ type: tool_call, callId: c2, tool: update_record, arguments: { key: k1, value: v2 } }]
          usage: { inputTokens: 50, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - ok: { output: { updated: true } }
  ports:
    blobStore:
      t1:
        - id: blob-file-1
          hash: "sha256:488b66a845535f2173fe026ad21ad4238ca6b733b00a24ba332adab6729a0a80"
          mediaType: text/plain
          size: 44
          data: "U1lOVEhFVElDLUZJTEUtMDAwMTogcXVhcnRlcmx5IHdpZGdldCByZXBvcnQ="
script:
  - action: run
    bind: $sUpload
    tenant: t1
    principal: p1
    persona: assistant@1
    input:
      - { type: text, text: "Apply the attached instructions" }
      - type: file
        mediaType: text/plain
        name: instructions.txt
        source: upload
        blob: { id: blob-file-1, hash: "sha256:488b66a845535f2173fe026ad21ad4238ca6b733b00a24ba332adab6729a0a80", mediaType: text/plain, size: 44 }
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sEmail
    tenant: t1
    principal: p1
    persona: assistant@1
    input:
      - { type: text, text: "Read the attached instructions" }
      - type: file
        mediaType: text/plain
        name: instructions.txt
        source: email
        blob: { id: blob-file-1, hash: "sha256:488b66a845535f2173fe026ad21ad4238ca6b733b00a24ba332adab6729a0a80", mediaType: text/plain, size: 44 }
    expect: { ok: true, endReason: responded }
  - action: run
    session: $sEmail
    principal: p1
    input: [{ type: text, text: "Now set k1 to v2" }]
    expect: { ok: true, endReason: escalated }
expect:
  sessions:
    $sUpload:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: update_record } }
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { updated: true } } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: policy.decision, payload: { kind: taint } }
        - { type: escalation.raised }
      checkpoint:
        taint: { tainted: false }
    $sEmail:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: run.ended, runId: $r1, payload: { reason: responded } }
          - { type: turn.started, runId: { $all: [$r2, { $not: $r1 }] }, turn: 2 }
          - { type: policy.decision, runId: $r2, payload: { kind: taint, outcome: escalate, callId: c2, tool: update_record, provenances: ["attachment:email"] } }
          - { type: escalation.raised, runId: $r2, payload: { escalation: { sources: [taint], pendingActions: [{ callId: c2, source: taint }] } } }
          - { type: run.ended, runId: $r2, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call }
        - { type: policy.decision, runId: $r1 }
      checkpoint:
        taint: { tainted: true, provenances: ["attachment:email"] }
  stubCalls:
    update_record: [{ arguments: { key: k1, value: v1 } }]
