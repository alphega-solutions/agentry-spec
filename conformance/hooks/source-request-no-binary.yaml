schemaVersion: "0.1.0"
id: hook.source-request-no-binary
title: A HookRequest carries an image part by blob reference only, never its bytes
description: >-
  The principal sends text and an uploaded image whose blob holds synthetic
  bytes. A remote hook at sessionStart and beforeModelCall answers
  `continue`. In both requests the image part carries its media type and
  blob reference, and no part of the content carries inline `data`.
  (core.hook-binary-in-place-edit-rejected covers rewrites of binary parts;
  this fixture covers what the hook is given.)
requirements: [HOOK-115]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        remoteHooks:
          - { id: viewer, endpoint: "memory://hook-viewer", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Hook
        id: viewer
        version: 1
        schemaVersion: "0.1.0"
        points: [sessionStart, beforeModelCall]
        results: [annotate]
        timeoutMs: 1000
        source: { kind: remote, endpoint: viewer }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [viewer@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { vision: true }
      responses:
        - parts: [{ type: text, text: "I see a chart." }]
          usage: { inputTokens: 200, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  ports:
    blobStore:
      t1:
        - id: blob-img-1
          hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7"
          mediaType: image/png
          size: 20
          data: "U1lOVEhFVElDLUlNQUdFLTAwMDE="
  stubs:
    remoteHooks:
      viewer:
        - { result: continue }
        - { result: continue }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input:
      - { type: text, text: "Describe this" }
      - type: image
        mediaType: image/png
        source: upload
        blob: { id: blob-img-1, hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7", mediaType: image/png, size: 20 }
    expect: { ok: true, endReason: responded }
expect:
  stubCalls:
    viewer:
      - arguments:
          point: sessionStart
          content:
            $all:
              - $contains:
                  - type: image
                    mediaType: image/png
                    blob: { id: blob-img-1, hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7", mediaType: image/png, size: 20 }
              - $every: { data: { $absent: true } }
      - arguments:
          point: beforeModelCall
          content:
            $all:
              - $contains:
                  - type: image
                    mediaType: image/png
                    blob: { id: blob-img-1, hash: "sha256:82e0d9513a9797c3e32e35d6fff5c8648db4b0a8c74ffea2be6d5b827d3c7aa7", mediaType: image/png, size: 20 }
              - $every: { data: { $absent: true } }
  providerRequests:
    scripted-a: { count: 1 }
