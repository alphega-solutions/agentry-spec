schemaVersion: "0.1.0"
id: hook.result-tool-rewrite-redirect-malformed
title: A beforeToolCall rewrite that changes the call's tool or callId is malformed and fails closed; one that changes only the arguments is dispatched
description: >-
  rewriter is a remote beforeToolCall guardrail declaring rewrite and block
  (failClosed by default). At the tool points a rewrite must be exactly
  one part of the same type with the same callId and tool; only the
  arguments may change, so a rewrite cannot redirect a call to another
  tool (HOOK-021 as amended 2026-11-01). In every session the model calls
  lookup {key: k1} with callId c1.

  - $sRedirect: the rewrite keeps c1 but names update_record → malformed
    (HOOK-050): an `error` event with code agentry.hook.invalid_result,
    category fatal, retryable false, source hook; the failure is a block,
    with hook.decision {result: block, reasonCode:
    agentry.hook.invalid_result}; neither lookup nor update_record is
    dispatched, and the model receives the generic hook error.
  - $sCallId: the rewrite keeps lookup but changes the callId to c9 → the
    same failure and block; nothing is dispatched.
  - $sControl: the rewrite changes only the arguments to {key: k2} → valid:
    hook.decision {result: rewrite}, no error, and lookup is dispatched
    with {key: k2} (re-validated, TOOL-031).
requirements: [HOOK-021, HOOK-050, HOOK-051]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        remoteHooks:
          - { id: rewriter, endpoint: "memory://hook-rewriter", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Hook
        id: rewriter
        version: 1
        schemaVersion: "0.1.0"
        points: [beforeToolCall]
        results: [rewrite, block]
        timeoutMs: 1000
        source: { kind: remote, endpoint: rewriter }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [rewriter@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Not looked up." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Still not looked up." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Looked up k2." }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: v2 } }
      update_record: []
    remoteHooks:
      rewriter:
        - result: rewrite
          parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
        - result: rewrite
          parts: [{ type: tool_call, callId: c9, tool: lookup, arguments: { key: k1 } }]
        - result: rewrite
          parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k2 } }]
script:
  - action: run
    bind: $sRedirect
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sCallId
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sControl
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sRedirect:
      events:
        mode: subsequence
        items:
          - { type: error, payload: { error: { code: agentry.hook.invalid_result, category: fatal, retryable: false, source: hook } } }
          - { type: tool.result, payload: { callId: c1, result: { error: { code: agentry.hook.blocked, category: policy } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.call }
    $sCallId:
      events:
        mode: subsequence
        items:
          - { type: error, payload: { error: { code: agentry.hook.invalid_result, category: fatal, retryable: false, source: hook } } }
          - { type: tool.result, payload: { callId: c1, result: { error: { code: agentry.hook.blocked, category: policy } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.call }
        - { type: tool.result, payload: { callId: c9 } }
    $sControl:
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: rewriter@1, point: beforeToolCall, result: rewrite } }
          - { type: tool.call, payload: { callId: c1, tool: lookup, arguments: { key: k2 } } }
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { value: v2 } } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: error }
  ports:
    eventLog:
      t1:
        $sRedirect:
          $all:
            - $count: { of: { type: hook.decision }, equals: 1 }
            - $count: { of: { type: hook.decision, payload: { hook: rewriter@1, point: beforeToolCall, result: block, reasonCode: agentry.hook.invalid_result } }, equals: 1 }
        $sCallId:
          $all:
            - $count: { of: { type: hook.decision }, equals: 1 }
            - $count: { of: { type: hook.decision, payload: { hook: rewriter@1, point: beforeToolCall, result: block, reasonCode: agentry.hook.invalid_result } }, equals: 1 }
        $sControl:
          $count: { of: { type: hook.decision }, equals: 1 }
  stubCalls:
    rewriter: { count: 3 }
    lookup: [{ arguments: { key: k2 } }]
    update_record: { count: 0 }
  providerRequests:
    scripted-a:
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                - type: tool_result
                  callId: c1
                  result:
                    error:
                      code: agentry.hook.blocked
                      category: policy
                      retryable: false
                      source: hook
                      message: "Blocked by policy."
                      details: { $absent: true }
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                - type: tool_result
                  callId: c1
                  result:
                    error:
                      code: agentry.hook.blocked
                      category: policy
                      retryable: false
                      source: hook
                      message: "Blocked by policy."
                      details: { $absent: true }
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                - { type: tool_result, callId: c1, result: { ok: { output: { value: v2 } } } }
  delivered:
    $sRedirect: { text: "Not looked up.", fallback: false }
    $sCallId: { text: "Still not looked up.", fallback: false }
    $sControl: { text: "Looked up k2.", fallback: false }
