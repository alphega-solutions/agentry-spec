$schema: https://json-schema.org/draft/2020-12/schema
$id: https://alphega.io/agentry/schemas/conformance/cel-fixture/v1.json
title: CEL rule fixture
description: A single rule-evaluation case for the agentry CEL subset (EVAL-005, HOOK-110–115).
type: object
additionalProperties: false
required: [schemaVersion, id, requirements, point, expression, expect]
properties:
  schemaVersion: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/contractVersion" }
  id: { type: string, pattern: "^cel\\.[a-z0-9-]+(\\.[a-z0-9-]+)*$" }
  requirements:
    type: array
    minItems: 1
    items: { type: string, pattern: "^[A-Z]+-[0-9]{3}$" }
  point:
    description: Hook point whose variables are in scope (HOOK §9.1).
    enum: [sessionStart, beforeModelCall, afterModelCall, beforeToolCall, afterToolCall, beforeResponse, onError, sessionEnd]
  expression: { type: string, minLength: 1 }
  variables: { type: object }
  expect:
    type: object
    additionalProperties: false
    oneOf:
      - required: [value]
      - required: [failure]
    properties:
      value: {}
      failure: { enum: [compile, type_check, runtime] }
