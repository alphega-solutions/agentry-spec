$schema: https://json-schema.org/draft/2020-12/schema
$id: https://alphega.io/agentry/schemas/conformance/fixture/v1.json
title: Conformance fixture
description: >-
  Format of a conformance fixture (EVAL-001–004). Values beginning with "$"
  followed by an identifier are placeholders that bind on first match and must
  match consistently afterwards (EVAL-002): a placeholder binds the whole value
  it first matches, and later occurrences must equal it exactly (deep
  equality, not partial object matching). Write "$$" for a literal "$".
  Matcher objects may appear anywhere in expectations: {"$any": true},
  {"$absent": true}, {"$regex": "..."}, {"$len": n}, {"$contains": [...]}
  (each listed item matches a distinct element), {"$not": <value or
  matcher>}, {"$every": <matcher applied to each array element>}, {"$gte":
  n}, {"$lte": n}, {"$all": [<matchers that must all hold>]}, and
  {"$count": {"of": <matcher>, "equals"|"gte"|"lte": n}}, applied to an
  array: the number of elements matching `of` (exactly one of `equals`,
  `gte`, `lte`). Write "none matches" and "exactly one matches" with
  `$count`, never as `$not` around `$contains`. Matcher names are reserved
  and are never placeholders; a "$"-key in an expectation is either one of
  these matchers or a placeholder. Placeholders may be bound in `expect`
  or by a step's `capture`; a placeholder used in a step must be bound by an
  earlier step's capture. Placeholders may also be used as map keys (e.g. an
  idempotency key or session ID under `ports`). `expect` is evaluated in
  document order, depth-first; a placeholder key binds where it is first
  matched, and must already be bound (earlier in document order, or by a
  capture) before a matcher such as `$absent` is applied to the value under
  it, since an unbound key cannot be looked up. Arrays in expectations match
  exactly — same length, same order — unless wrapped in {"$contains":
  [...]}; objects match partially.


  Events are persisted when emitted: at any point, including a crash point,
  every event emitted before it is in the event log.


  Virtual clock: time advances only through `clock` steps, with one
  exception (discrete-event simulation): when every piece of pending work is
  waiting on a timer (a stub's `delayMs`, a tool or hook timeout, a run
  lease), the runner advances the virtual clock to the earliest such timer
  and lets that work proceed. `delayMs`, timeouts and leases are measured on
  the virtual clock. A `startAfter` pattern is evaluated before any
  automatic advance, so an action waiting on it starts at the virtual time
  its event was persisted.


  Numbers in expectations (for example `cost.amount`) are compared as
  decimals with an absolute tolerance of 1e-9.


  Scripted provider `capabilities` are merged over the scripted adapter's
  declaration in `conformance/adapters/manifests/scripted.yaml` (every
  boolean capability true, `contextLimit` 1,000,000, `maxOutputTokens`
  4,096), which also lists the generation parameters it accepts. Record shapes
  (stub calls, provider requests, port records) are defined under `expect`.
type: object
additionalProperties: false
required: [schemaVersion, id, title, requirements, contract, setup, script, expect]
properties:
  schemaVersion: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/contractVersion" }
  id:
    type: string
    pattern: "^[a-z0-9]+(\\.[a-z0-9-]+)+$"
  title: { type: string, minLength: 1 }
  description: { type: string }
  requirements:
    type: array
    minItems: 1
    uniqueItems: true
    items: { type: string, pattern: "^[A-Z]+-[0-9]{3}$" }
  contract:
    description: Contract version range, e.g. ">=0.1.0 <1.0.0".
    type: string
  features:
    description: Optional features required; empty means mandatory behaviour (EVAL-022).
    type: array
    items: { type: string, pattern: "^[a-z0-9]+(\\.[a-z0-9_-]+)*$" }
  setup: { $ref: "#/$defs/setup" }
  script:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/step" }
  expect: { $ref: "#/$defs/expect" }

$defs:
  placeholder:
    type: string
    pattern: "^\\$[A-Za-z_][A-Za-z0-9_]*$"

  setup:
    type: object
    additionalProperties: false
    required: [clock, idSeed, config, tenants]
    properties:
      clock: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/timestamp" }
      idSeed: { type: integer, minimum: 0 }
      config:
        type: object
        additionalProperties: false
        required: [base]
        properties:
          base:
            description: Shared configuration set under conformance/shared/.
            type: string
          artifacts:
            description: Artifacts added to, or replacing (same kind, id, version), the base set.
            type: array
            items: { type: object, required: [kind, id, version] }
          remove:
            description: Artifact references to remove from the base set.
            type: array
            items: { type: string }
      tenants:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [id, principals]
          properties:
            id: { type: string }
            principals:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, subject]
                properties:
                  id: { type: string }
                  subject: { type: string }
                  roles: { type: array, items: { type: string } }
                  attributes: { type: object }
                  assurance: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/assuranceLevel" }
                  human: { type: boolean, default: true }
                  service: { type: boolean, default: false }
      providers:
        description: Scripted providers (EVAL-031), keyed by provider ID in the deployment.
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          required: [responses]
          properties:
            capabilities: { type: object }
            tokenCounting:
              description: >-
                How the scripted adapter counts context tokens (PROV-045, Area 7
                amendment 2026-11-01), which the context manager uses for
                compaction and overflow (CTX-050, CTX-090): a text part costs
                one token per whitespace-separated word of its `text`; any
                other part costs `nonTextPart` tokens; messages, roles and
                tool definitions cost nothing. Defaults as below.
              type: object
              additionalProperties: false
              properties:
                nonTextPart: { type: integer, minimum: 0, default: 10 }
            responses:
              type: array
              items: { $ref: "#/$defs/scriptedResponse" }
      handlers:
        description: >-
          Native handlers (TOOL-010). By default the runner registers a stub
          handler for every `native` binding in every configuration the
          fixture loads, except names beginning `unregistered.`, which are
          never registered; a binding naming one is unresolved, a
          configuration error at load. Set this only to restrict
          registration to exactly the listed names. A registered native tool
          with no `stubs.tools` entry gets the default stub: it records its
          calls and returns `ok` with output `{}` on every call.
        type: array
        uniqueItems: true
        items: { type: string, pattern: "^(?!unregistered\\.)[A-Za-z0-9_.-]{1,128}$" }
      stubs:
        description: >-
          Scripted stand-ins (EVAL-032). Behaviours are consumed in order,
          one per call (a retry is a call). A call made after a stub's
          behaviour list has run out fails the test (the fixture is wrong,
          not the implementation under test); this does not apply to the
          default native stub (`handlers`). Calls are recorded under
          `expect.stubCalls`.
        type: object
        additionalProperties: false
        properties:
          tools:
            description: >-
              Native tool stubs, keyed by tool ID: the behaviours of the tool's
              registered handler (`handlers`). Every key must be the ID of a
              native-bound tool in some configuration the fixture loads. A
              registered handler whose tool has no entry gets the default stub
              (records its calls, returns `ok` with output `{}`); an entry
              with an empty list fails the test on the tool's first call.
            type: object
            additionalProperties:
              type: array
              items: { $ref: "#/$defs/toolBehaviour" }
          mcpServers:
            description: >-
              MCP server stubs, keyed by the server ID declared in the
              deployment (TOOL-093). A stub that the deployment does not
              declare is never reachable.
            type: object
            additionalProperties: { $ref: "#/$defs/mcpServerStub" }
          httpEndpoints:
            description: >-
              HTTP endpoint stubs, keyed by the endpoint ID declared in the
              deployment, then by operation ID: the behaviours of that
              operation (TOOL-010 as amended 2026-11-01). A call's recorded
              `arguments` are the tool's arguments, as validated (and as
              hooks left them), not an HTTP request.
            type: object
            propertyNames: { pattern: "^[A-Za-z0-9_.-]{1,128}$" }
            additionalProperties:
              type: object
              propertyNames: { pattern: "^[A-Za-z0-9_.-]{1,128}$" }
              additionalProperties:
                type: array
                items: { $ref: "#/$defs/toolBehaviour" }
          remoteHooks:
            description: >-
              Scripted remote hook endpoints, keyed by the remote hook ID
              declared in the deployment: behaviours consumed in order, one
              per request (HOOK-091). Each request is recorded under
              `expect.stubCalls.<remote hook ID>` as `{ arguments }`, where
              `arguments` is the `HookRequest`.
            type: object
            additionalProperties:
              type: array
              items: { $ref: "#/$defs/hookBehaviour" }
          vectorStores:
            description: >-
              Vector store sources, keyed by a source ID in the deployment's
              `ports.vectorStore.sources`: behaviours consumed in order, one
              per query (automatic retrieval or a retrieval tool call). A
              behaviour's `results` are the records an unfiltering backend
              returns for that query, in rank order; the implementation's
              vector store port **MUST** filter them by tenant and access
              before anything else sees them (PORT-080, CTX-041), and
              apply the query's limit after filtering. Queries are recorded
              under `expect.stubCalls.vectorStore/<sourceId>` as `{ arguments:
              { tenant, principal: { subject, tenant, roles }, text, limit } }`.
            type: object
            propertyNames: { pattern: "^[A-Za-z0-9_.-]{1,128}$" }
            additionalProperties:
              type: array
              items: { $ref: "#/$defs/vectorBehaviour" }
          nativeHooks:
            description: >-
              Native hook stubs, keyed by the `Hook` artifact ID whose source
              is `native`: the behaviours of its registered handler
              (`handlers`), consumed in order, one per invocation. A
              registered native hook with no entry gets the default hook
              stub, which records its invocations and answers `continue`
              every time. Invocations are recorded under
              `expect.stubCalls.<hook ID>` as `{ arguments }`, where
              `arguments` is the `HookRequest` the handler was given.
            type: object
            additionalProperties:
              type: array
              items: { $ref: "#/$defs/hookBehaviour" }
      ports:
        description: >-
          Initial contents of in-memory ports, keyed by port name, then
          tenant, using the record shapes given under `expect.ports`.
        type: object
      secrets:
        description: Synthetic secret values served by the in-memory secrets provider, keyed by secret reference.
        type: object
        additionalProperties: { type: string }
      limits:
        description: Implementation limits the runner configures for this fixture.
        type: object
        additionalProperties: false
        properties:
          inlinePayloadBytes:
            description: Payloads larger than this are stored in the BlobStore and referenced (CORE-154, TOOL-072).
            type: integer
            minimum: 1
          leaseTtl:
            description: >-
              Length of the run lease the runner configures (HITL-090), as an
              ISO 8601 duration. Default PT5M. A run whose lease is not renewed
              within this time on the virtual clock is orphaned.
            type: string
            pattern: "^P(?!$)(\\d+D)?(T(?=\\d)(\\d+H)?(\\d+M)?(\\d+(\\.\\d+)?S)?)?$"
            default: PT5M

  scriptedResponse:
    type: object
    additionalProperties: false
    properties:
      parts:
        description: Content parts the model returns; provenance and labels may be omitted (the harness assigns them). `image` and `file` parts reference blobs seeded in `setup.ports.blobStore`.
        type: array
        items: { type: object, required: [type] }
      deltas:
        description: Deltas to emit before the final response, when streaming.
        type: array
        items: { type: string }
      usage:
        description: >-
          The usage the provider reports for this call, success or error.
          A field left out is one the provider does not report (normalized
          to 0, PROV-070); no `usage` at all means none is reported (on an
          error, the `error` event then carries no usage).
        type: object
      error:
        type: object
        required: [category]
        properties:
          category: { type: string }
          code: { type: string }
          retryable: { type: boolean }
      failAfterDeltas:
        description: Emit the deltas, then fail with `error`.
        type: boolean
    oneOf:
      - required: [parts]
      - required: [error]

  mcpServerStub:
    description: >-
      An MCP server stub. `tools` are the tools the server advertises, keyed
      by the tool's name on the server, each with its advertised input schema
      and annotations, and the behaviours of calls to it. `changes`
      re-advertise tools while sessions run (TOOL-092): once the server has
      received `afterCalls` calls in all (to any of its tools, completed or
      not), each tool named in the change replaces the advertised definition
      of that name (a tool not yet advertised is added); behaviours not
      restated continue where they were. Changes apply in listed order.
    type: object
    additionalProperties: false
    required: [tools]
    properties:
      tools:
        type: object
        additionalProperties: { $ref: "#/$defs/mcpToolStub" }
      changes:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [afterCalls, tools]
          properties:
            afterCalls: { type: integer, minimum: 0 }
            tools:
              type: object
              additionalProperties: { $ref: "#/$defs/mcpToolStub" }

  mcpToolStub:
    type: object
    additionalProperties: false
    required: [inputSchema]
    properties:
      description: { type: string }
      inputSchema: { description: The advertised input schema., type: object }
      annotations:
        description: Advertised MCP tool annotations (read-only, destructive, idempotent, open-world hints).
        type: object
      behaviours:
        type: array
        items: { $ref: "#/$defs/toolBehaviour" }

  toolBehaviour:
    description: >-
      One call's scripted behaviour: exactly one of `ok` (succeed with
      `output`), `error` (fail), or `hang` (never complete unless
      cancelled). `delayMs` delays `ok` or `error` on the virtual clock.
    type: object
    additionalProperties: false
    oneOf:
      - required: [ok]
      - required: [error]
      - required: [hang]
    properties:
      ok: { type: object, properties: { output: {} } }
      error:
        type: object
        required: [category]
        properties:
          category: { type: string }
          code: { type: string }
          retryable: { type: boolean }
          message: { type: string }
      delayMs: { type: integer, minimum: 0 }
      hang: { const: true, description: Never completes unless cancelled. }
      ignoreCancel:
        description: >-
          When false (the default), a delayed or hanging stub honours the
          cancellation signal: it stops at once without producing its
          scripted result, and its call record has `cancelled: true` and
          `completed: false`. When true,
          the stub records `cancelled: true` but carries on, completing after
          `delayMs` (never, if `hang`).
        type: boolean
        default: false

  vectorBehaviour:
    type: object
    additionalProperties: false
    oneOf:
      - required: [results]
      - required: [error]
    properties:
      results:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [id, text, tenant]
          properties:
            id: { type: string, minLength: 1 }
            text: { type: string }
            tenant: { type: string, minLength: 1 }
            labels:
              description: Stored labels. Absent means stored without labels (CTX-042).
              type: array
              items: { type: string }
            access:
              description: >-
                Who in `tenant` may read the record: principal subjects and/or
                roles; a principal matching either may read it. Absent: every
                principal of the tenant.
              type: object
              additionalProperties: false
              properties:
                subjects: { type: array, items: { type: string } }
                roles: { type: array, items: { type: string } }
      error:
        type: object
        required: [category]
        properties:
          category: { type: string }
          code: { type: string }
          retryable: { type: boolean }
      delayMs: { type: integer, minimum: 0 }

  hookBehaviour:
    description: >-
      One invocation's scripted behaviour for a remote or native hook stub:
      exactly one of `answer` (return this `HookResult`, validated against
      `schemas/core/v1/hook.yaml#/$defs/result`; it may still be a result the
      hook did not declare, HOOK-020), `raw` (return this value verbatim as
      the response body, which need not be a valid `HookResult`, to test
      HOOK-050), `error` (the hook errors), or `hang` (never answers; the
      hook's `timeoutMs` then applies). `delayMs` delays `answer`, `raw` or
      `error` on the virtual clock. For brevity, the `HookResult` fields may
      instead be given directly (`result` with `reasonCode`, `labels` or
      `parts`), meaning the same as `answer`.
    type: object
    additionalProperties: false
    oneOf:
      - required: [answer]
      - required: [result]
      - required: [raw]
      - required: [error]
      - required: [hang]
    properties:
      answer: { $ref: "https://alphega.io/agentry/schemas/core/hook/v1.json#/$defs/hookResult" }
      result: { $ref: "https://alphega.io/agentry/schemas/core/hook/v1.json#/$defs/resultType" }
      reasonCode: { type: string }
      labels:
        description: For annotate — labels to add, per part index.
        type: array
        items: { $ref: "https://alphega.io/agentry/schemas/core/hook/v1.json#/$defs/annotation" }
      parts:
        description: For rewrite — replacement parts.
        type: array
        items: { $ref: "https://alphega.io/agentry/schemas/core/hook/v1.json#/$defs/rewritePart" }
      raw:
        description: A response body returned verbatim (any JSON value, or a string for non-JSON output).
      error:
        description: The hook fails instead of answering.
        type: object
        properties:
          category: { type: string }
          code: { type: string }
          message: { type: string }
      hang: { const: true, description: Never answers. }
      delayMs: { type: integer, minimum: 0 }
    dependentSchemas:
      result:
        description: The shorthand must itself be a valid `HookResult`.
        $ref: "https://alphega.io/agentry/schemas/core/hook/v1.json#/$defs/hookResult"

  capture:
    description: >-
      Binds placeholders from events persisted by the step, so later steps can use
      them. `event` selects the first matching event in the step's session;
      `bind` maps dotted paths in that event to placeholders.
    type: object
    additionalProperties: false
    required: [event, bind]
    properties:
      session: { $ref: "#/$defs/placeholder" }
      event: { type: object }
      bind:
        type: object
        additionalProperties: { $ref: "#/$defs/placeholder" }

  step:
    type: object
    oneOf:
      - $ref: "#/$defs/actionStep"
      - $ref: "#/$defs/clockStep"
      - $ref: "#/$defs/crashStep"
      - $ref: "#/$defs/restartStep"
      - $ref: "#/$defs/abandonStep"
      - $ref: "#/$defs/concurrentStep"
      - $ref: "#/$defs/loadStep"
      - $ref: "#/$defs/retentionStep"

  actionStep:
    type: object
    additionalProperties: false
    required: [action]
    properties:
      action:
        description: >-
          Host operation. `getReviewerView` (HITL-030) returns the reviewer
          view of the session's open escalation for the step's `reviewer`,
          called as `tenant`; `listPendingEscalations` (HITL-100) returns the
          open escalations of `tenant`. Neither changes state or emits
          events. Area 11 tooling actions:
          `exportBundle` (`session`, `tenant`) returns the session's trace
          bundle (EVAL-025, `schemas/eval/v1/bundle.yaml`) to
          `expect.bundle`; `replay` (`bundle` — a file path or a placeholder
          bound by `bindResult` — `snapshot`, `hookMode`, `tenant`) replays it
          as a new session (`bind`), whose events are matched like any
          session's, with divergences in `expect.divergences` (EVAL-060–063);
          `convert` (`session`, `tenant`, `as`) returns a draft eval case or
          fixture to `expect.draft`, or is refused (EVAL-070–072); `evalRun`
          (`run`, `cases`, inline) runs an eval and returns its report to
          `expect.report` (EVAL-040–052, EVAL-080–082).
        enum: [run, resume, decide, close, cancel, getReviewerView, listPendingEscalations, exportBundle, replay, convert, evalRun]
      bind:
        description: Placeholder bound to the session the action creates or targets.
        $ref: "#/$defs/placeholder"
      session: { $ref: "#/$defs/placeholder" }
      tenant: { type: string }
      principal: { type: string }
      persona: { type: string }
      profile: { type: string }
      input:
        description: Parts of the principal's message.
        type: array
        items: { type: object, required: [type] }
      runtimeScope:
        type: array
        items: { type: string }
      overrides:
        description: "Run-request values (CFG-101), using harness profile field paths, e.g. {budget: {tokens: 500}}."
        type: object
      reviewer: { type: string, description: Principal ID of the reviewer for decide/resume. }
      bundle:
        description: For `replay`, a bundle file path relative to `conformance/` (e.g. `golden/x.yaml`), or a placeholder bound by an earlier `bindResult`.
        type: string
      snapshot:
        description: "For `replay`: `recorded` (the bundle's snapshot, bound to the current deployment's providers, ports and endpoints) or `candidate` (the fixture's current configuration) (EVAL-060 as amended 2026-11-14)."
        enum: [recorded, candidate]
      hookMode: { enum: [reEvaluate, replayDecisions] }
      as: { enum: [case, fixture], description: For `convert`. }
      run: { $ref: "https://alphega.io/agentry/schemas/eval/run/v1.json" }
      cases:
        type: array
        items: { $ref: "https://alphega.io/agentry/schemas/eval/case/v1.json" }
      bindResult:
        description: Placeholder bound to the operation's whole result (e.g. an exported bundle), for use in later steps.
        $ref: "#/$defs/placeholder"
      decisions:
        description: Decisions submitted with `decide` or `resume` (HITL-040), on the session's open escalation.
        type: array
        items: { $ref: "#/$defs/decision" }
      capture:
        type: array
        items: { $ref: "#/$defs/capture" }
      startAfter:
        description: >-
          Inside `concurrently` only — start this action once an event
          matching this pattern has been persisted. Evaluated before any
          automatic clock advance (see the virtual clock rule above).
        type: object
      expect:
        description: Not checked, and may be omitted, when an earlier `crash` step armed a crash for this action.
        $ref: "#/$defs/stepOutcome"

  decision:
    description: >-
      A decision (HITL-041). The escalation is the one holding the pending
      action; the reviewer is the step's `reviewer`; the timestamp is the
      virtual clock. `replacement` (for `edit`) holds the replacement
      arguments of a `tool_call` action, or the replacement parts of a
      `content` action. `outcome` (for `confirm`) is the stated outcome of a
      `recovery` action, with `output` the stated `ok` output when it
      succeeded.
    type: object
    additionalProperties: false
    required: [decisionId, pendingActionId, type]
    properties:
      decisionId: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/uuidv7" }
      pendingActionId:
        description: A pending action ID, usually a placeholder captured from `escalation.raised`.
        type: string
        minLength: 1
      type: { enum: [approve, reject, edit, confirm] }
      replacement: {}
      outcome: { enum: [succeeded, failed] }
      output: {}
    allOf:
      - if: { properties: { type: { const: edit } } }
        then: { required: [replacement] }
      - if: { properties: { type: { const: confirm } } }
        then: { required: [outcome] }
      - if: { properties: { type: { not: { const: confirm } } } }
        then: { not: { anyOf: [{ required: [outcome] }, { required: [output] }] } }
      - if: { properties: { type: { not: { const: edit } } } }
        then: { not: { required: [replacement] } }

  loadStep:
    description: >-
      Load configuration. A load starts from the configuration of the last
      successful load (initially setup.config), adds or replaces the given
      artifacts (same kind, id, version), removes the listed references, applies
      any overlay, and produces a new snapshot. `load: {}` reloads unchanged. A
      failed load leaves the previous snapshot in force. `bind` binds the new
      snapshot hash.
    type: object
    additionalProperties: false
    required: [load]
    properties:
      load:
        type: object
        additionalProperties: false
        properties:
          artifacts: { type: array, items: { type: object } }
          raw:
            description: >-
              Artifacts as raw YAML text, parsed by the implementation exactly as its
              config source would, for testing values that only exist in YAML
              (dates, yes/no) — CFG amendment on JSON-compatible values.
            type: array
            items: { type: string }
          remove: { type: array, items: { type: string } }
          overlay:
            description: >-
              Environment overlay (CFG-021, CFG-112 as amended 2026-11-01).
              `deployment` gives partial deployment values: it may change
              endpoints, adapters, regions (subject to `dataResidency`) and
              port bindings, but must not loosen deployment governance — it
              may only append to `policyBundles`, only remove
              `attachmentSources`, only add `legalHolds`, and only lengthen
              `retention` periods. `tighten` maps artifact references
              (id@version) to partial behavioural field values applied last,
              after all layers, which must only tighten under each field's
              merge rule.
            type: object
            additionalProperties: false
            required: [environment]
            properties:
              environment: { type: string }
              deployment: { type: object }
              tighten:
                type: object
                additionalProperties: { type: object }
      bind: { $ref: "#/$defs/placeholder" }
      expect: { $ref: "#/$defs/stepOutcome" }

  clockStep:
    description: >-
      The only way fixtures move the virtual clock, apart from the runner's
      automatic advance to the earliest timer when all pending work is
      waiting on timers (see the top-level description).
    type: object
    additionalProperties: false
    required: [clock]
    properties:
      clock:
        type: object
        additionalProperties: false
        oneOf:
          - required: [advance]
          - required: [set]
        properties:
          advance: { type: string, description: ISO 8601 duration, e.g. PT1H. }
          set:
            description: Set the virtual clock, possibly backwards, to test that order never depends on timestamps (CORE-003).
            $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/timestamp"

  crashStep:
    description: >-
      Arms a crash for the next action step on `session` (or, without
      `session`, the next action step). That action runs until the
      implementation first reaches the named point, where the
      implementation stops abruptly: in-process state is lost, port
      contents written so far are kept (including every event emitted
      before the point, since events are persisted when emitted), the lease
      is not renewed, and the host receives no outcome. The action's own
      `expect` is not checked and may be omitted. If the action completes
      without reaching the point, the fixture fails. The crashed action
      must be followed, later in the script, by a `restart` step before the
      next action step; `restart` restarts the implementation against the
      same ports. Crash points (EVAL-035):
      `after_started_record` — the call's started record is in the
      idempotency store; the call is not dispatched.
      `after_dispatch` — the stub ran: its behaviour is consumed and its
      side effect happened, but its result never reached the
      implementation; no outcome is recorded, and the stub-call record has
      `completed: false`.
      `after_outcome_recorded` — the call's outcome is in the idempotency
      store; its `tool.result` is not appended.
      `after_event_append` — immediately after the event-log append that
      contains the next `tool.call` event; the checkpoint is not saved.
      `after_model_request` — immediately after the next `model.request`
      event is appended, before the provider answers: no scripted
      response is consumed and no tool call is in flight.


      Recovery after a restart follows HITL-091 as amended 2026-11-01. An
      orphaned run that continues keeps its `runId` and emits no new
      `run.started`. The host call that triggered recovery (HITL-092) then
      runs its own run, with its own `run.started`, and that step's
      `expect` is matched against the triggering call's own outcome, not
      the orphaned run's.
    type: object
    additionalProperties: false
    required: [crash]
    properties:
      crash:
        type: object
        additionalProperties: false
        required: [at]
        properties:
          at:
            description: Named crash points (EVAL-035).
            enum: [after_started_record, after_dispatch, after_outcome_recorded, after_event_append, after_model_request]
          session: { $ref: "#/$defs/placeholder" }

  retentionStep:
    description: >-
      Runs the implementation's retention processing at the current virtual
      time (PORT-110–115): everything due for deletion under the
      deployment's retention periods and legal holds is deleted, in an order
      that keeps dependent data (PORT-112); processing repeats until nothing
      more is due, so deletions cascade within the step. Implementations may also delete
      on their own schedule; fixtures assert only the state after this step.
    type: object
    additionalProperties: false
    required: [retention]
    properties:
      retention: { type: object, additionalProperties: false }
      expect: { $ref: "#/$defs/stepOutcome" }

  restartStep:
    type: object
    additionalProperties: false
    required: [restart]
    properties:
      restart:
        type: object
        additionalProperties: false
        properties:
          ports:
            description: Port contents to replace before restarting, keyed by port name; an empty object empties the port.
            type: object

  abandonStep:
    type: object
    additionalProperties: false
    required: [abandon]
    properties:
      abandon:
        type: object
        additionalProperties: false
        required: [session]
        properties:
          session: { $ref: "#/$defs/placeholder" }
          afterEvents: { type: integer, minimum: 0 }

  concurrentStep:
    type: object
    additionalProperties: false
    required: [concurrently]
    properties:
      concurrently:
        description: Actions started in listed order, each after the previous has begun and before it completes.
        type: array
        minItems: 2
        items: { $ref: "#/$defs/actionStep" }
      separateProcesses: { type: boolean }
      expect:
        type: object
        additionalProperties: false
        properties:
          outcomes:
            description: Matched against the actions' outcomes as an unordered multiset.
            type: array
            items: { $ref: "#/$defs/stepOutcome" }

  stepOutcome:
    type: object
    additionalProperties: false
    properties:
      ok:
        description: The host operation was accepted (no error returned to the host), whatever the run's end reason.
        type: boolean
      error:
        type: object
        additionalProperties: false
        required: [category]
        properties:
          category: { type: string }
          code: { type: string }
          details:
            description: >-
              Partial match on the error's structured `details`. For a
              configuration error (CFG-032 as amended 2026-11-01): `artifact`
              (id@version), `field` — a JSON Pointer (RFC 6901) into that
              artifact, e.g. `/budget/tokens` — and `layer` (`policyBundle`,
              `persona`, `harnessProfile` or `overlay`). For a run-request
              violation (CFG-101, `invalid_input`): `field`, a JSON Pointer
              into the profile.
            type: object
            properties:
              artifact: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/artifactRef" }
              field:
                description: JSON Pointer (RFC 6901).
                type: string
                pattern: "^(/([^~/]|~[01])*)*$"
              layer: { enum: [policyBundle, persona, harnessProfile, overlay] }
      endReason: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/runEndReason" }
      sameAs:
        description: Index of an earlier step whose outcome this one must equal.
        type: integer
        minimum: 0
      newEvents:
        description: Number of events persisted as a result of this step (0 = none).
        type: integer
        minimum: 0
      bundle:
        description: For `exportBundle`, a pattern over the returned bundle, which must also validate against `schemas/eval/v1/bundle.yaml`.
        type: object
      divergences:
        description: For `replay`, the divergences reported, matched like an array expectation (EVAL-062, EVAL-063).
        type: array
      draft:
        description: "For `convert`, a pattern over the returned draft, which must carry `review: required` (EVAL-072)."
        type: object
      report:
        description: For `evalRun`, a pattern over the returned report, which must also validate against `schemas/eval/v1/report.yaml`.
        type: object
      view:
        description: >-
          For `getReviewerView`: a pattern matched against the returned
          `ReviewerView` (schemas/core/v1/hitl.yaml), objects partially,
          arrays exactly unless wrapped in `$contains`.
        type: object
      escalations:
        description: >-
          For `listPendingEscalations`: a pattern matched against the
          returned array of escalation records.

  eventPattern:
    description: >-
      Event expectations for one session (EVAL-004); each item is a partial
      match on an event's fields. `sequence`: the session's persisted
      events, in log order, match the items one-to-one (same number, same
      order). `unordered`: the same one-to-one match in any order (e.g.
      parallel tool calls in one step). `subsequence`: the items match
      distinct events in log order, with other events allowed in between.
      `contains`: the items match distinct events in any order, with other
      events allowed. In `sequence` and `unordered` mode, `checkpoint.saved`
      events, whose number is implementation-defined, are left out before
      matching unless an item has `type: checkpoint.saved`. Absence is
      asserted with `absentEvents`.
    type: object
    additionalProperties: false
    required: [mode, items]
    properties:
      mode: { enum: [sequence, subsequence, unordered, contains] }
      items:
        type: array
        items: { type: object, description: Partial match on event fields. }

  expect:
    type: object
    additionalProperties: false
    properties:
      sessions:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            state: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/sessionState" }
            closeReason: { $ref: "https://alphega.io/agentry/schemas/common/defs/v1.json#/$defs/closeReason" }
            events: { $ref: "#/$defs/eventPattern" }
            absentEvents:
              type: array
              items: { type: object }
            eventCount: { type: integer, minimum: 0 }
            checkpoint:
              description: >-
                Partial match on checkpoint contents (PORT-030), with fields
                `state`, `principalRef`, `tenant`, `persona`, `snapshotHash`,
                `taint` (`{ tainted, provenances }`), `budget` (remaining
                turn budget), `counters` (content-size counters),
                `reasoning` (reasoning parts kept for continuation),
                `escalation` (the open escalation, with `decisions` and
                partial approvals), `heldResults` (results held while
                suspended), `lease` (`{ holder, token, expiresAt }`),
                `parentSessionId` and `childSessionIds`: the `checkpoint`
                record of `schemas/ports/v1/records.yaml`.
              type: object
      providerRequests:
        description: >-
          Requests captured by scripted providers, keyed by provider ID,
          matched in order (partial match). Each record is `{ provider,
          model, messages, tools, outputSchema, params, singleToolCall }`
          (`params` the generation parameters sent, PROV-002;
          `singleToolCall` true when the request permits at most one tool
          call, PROV-043): `messages` is the
          assembled context as content messages, in which a step's tool
          results are ONE message with role `tool` holding every
          `tool_result` part of that step, in request order (TOOL-032);
          `tools` lists the visible
          tool definitions as `{ name, description, input }`, where `name` is
          the tool ID and `input` its input schema (nothing else of the
          definition is sent); `outputSchema` is the output schema requested,
          if any. `{count: n}` asserts only the number of requests.
        type: object
        additionalProperties:
          oneOf:
            - type: array
              items: { type: object }
            - type: object
              properties: { count: { type: integer, minimum: 0 } }
      stubCalls:
        description: >-
          Calls recorded by stubs, in call order, keyed by: the tool ID for
          native tools (calls to a registered handler are recorded whether
          or not the tool has a `stubs.tools` entry); `<serverId>/<toolName>`
          for MCP server stubs;
          `<endpointId>/<operationId>` for HTTP endpoint stubs; the remote
          hook ID for remote hook stubs; the Hook artifact ID for native
          hook stubs (registered native hooks are recorded whether or not
          they have a `stubs.nativeHooks` entry). A tool call record is `{ arguments,
          context: { sessionId, runId, principal, idempotencyKey, deadline,
          traceContext }, cancelled, completed }`: `arguments` are the
          tool's arguments (for HTTP endpoint stubs too, not an HTTP
          request); `context` is the tool context (TOOL-040), with
          `principal` the principal as the host supplied it and `deadline` a
          UTC timestamp; `cancelled` is whether the cancellation signal was
          received; `completed` is whether the stub's result reached the
          implementation (`false` for a hang, a cancellation honoured, or a
          crash at `after_dispatch`). A remote hook call record is `{
          arguments }`, holding the hook request. `{count: n}` asserts only
          the number of calls.
        type: object
        additionalProperties:
          oneOf:
            - type: array
              items: { type: object }
            - type: object
              properties: { count: { type: integer, minimum: 0 } }
      ports:
        description: >-
          Expected port contents (partial match), keyed by port name, then
          tenant. Record shapes: `eventLog: {t1: {<sessionId>: [events]}}`;
          `idempotencyStore: {t1: {<key>: { state: started|completed,
          outcome, childSessionId? }}}`, where `outcome` (present once
          completed) is the tool result and `childSessionId` is held by
          agent-bound calls (ORCH-002); `auditLog: {t1: [records]}`, each
          record `{ timestamp, tenant, sessionId, principalRef, snapshotHash,
          type, reviewer?, eventIds, details }` (PORT-071), with `type` one of
          `hook_decision`, `policy_decision`, `escalation`, `decision`,
          `tool_call` (a mutating call and its outcome, TOOL-074, whose
          `details` are `{ callId, tool, arguments, outcome }`), `reviewer`
          present for decisions, and `eventIds` the IDs of the events the
          record links to; `blobStore: {t1: [{ id, hash, mediaType, size,
          data }]}`; `checkpointStore: {t1: {<sessionId>: checkpoint}}`,
          using the field names in `sessions.*.checkpoint`.
        type: object
      delivered:
        description: What the host received, per session.
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            text: {}
            parts: {}
            deltas:
              description: Ephemeral deltas received, in order.
            fallback: { type: boolean, description: The response was the fixed fallback message. }
      noPersistedContent:
        description: >-
          Strings that must not appear anywhere — in any field, at any depth,
          as a substring — in any port's stored records: events, checkpoints,
          idempotency records, audit records, blobs, configuration snapshots.
          An item `{ports, strings}` limits the check to the named ports.
        type: array
        items:
          oneOf:
            - type: string
            - type: object
              additionalProperties: false
              required: [ports, strings]
              properties:
                ports:
                  type: array
                  items: { enum: [eventLog, checkpointStore, idempotencyStore, snapshotStore, blobStore, auditLog] }
                strings: { type: array, items: { type: string } }
      telemetrySpanCount:
        description: >-
          Number of spans the in-memory exporter captured, or a matcher over
          it (e.g. `{"$gte": 1}`), so `noTelemetryContent` cannot pass
          vacuously.
      noTelemetryContent:
        description: >-
          Strings that must not appear in any span exported through the
          deployment's telemetry binding (PORT-101). Applies to fixtures
          whose deployment binds `telemetry`; the runner captures exported
          spans with an in-memory exporter.
        type: array
        items: { type: string }
      noTransmittedContent:
        description: >-
          Strings that must not appear anywhere in what the implementation
          sends out: recorded stub calls (tool, MCP, HTTP and hook requests,
          including `HookRequest`s) and provider requests. Use it for secret
          values that may reach a backend only through its transport
          credentials, never through arguments or requests (HOOK-115,
          CFG-061).
        type: array
        items: { type: string }
      schemaValid:
        description: Every emitted event validates against the event schema. Implicitly true.
        type: boolean
