schemaVersion: "0.1.0"
id: port.secrets.other-tenant-not-found
title: A principal-mode secret of one tenant does not resolve for the same subject in another tenant
description: >-
  A principal-mode value is seeded for subject user-1 of t1. Resolving the
  same reference for subject user-1 of t2 fails with `not_found`, exactly
  as for a principal with nothing seeded (the control), never with t1's
  value (PORT-090, keyed per tenant and principal as PORT-091 requires of
  any cache). t1's principal still resolves its value afterwards, so a
  failed lookup by t2 neither leaks nor disturbs it. Reading: as in
  port.secrets.resolve-per-principal, `principal` is `{subject, tenant}`;
  the format's `seed` takes no tenant, so tenant scoping of service
  credentials is not tested.
requirements: [PORT-090]
port: secrets
steps:
  - op: seed
    args: { reference: "secret://test/crm-user-token", value: "SYN-SECRET-T1-USER1-0011", principal: { subject: user-1, tenant: t1 } }
    expect: { ok: true }
  - op: resolve
    args: { tenant: t2, reference: "secret://test/crm-user-token", principal: { subject: user-5, tenant: t2 } }
    expect: { ok: false, error: { category: not_found } }
  - op: resolve
    args: { tenant: t2, reference: "secret://test/crm-user-token", principal: { subject: user-1, tenant: t2 } }
    expect: { ok: false, error: { category: not_found } }
  - op: resolve
    args: { tenant: t1, reference: "secret://test/crm-user-token", principal: { subject: user-1, tenant: t1 } }
    expect: { ok: true, result: "SYN-SECRET-T1-USER1-0011" }
