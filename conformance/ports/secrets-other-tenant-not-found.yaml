schemaVersion: "0.1.0"
id: port.secrets.other-tenant-not-found
title: Neither a service credential nor a principal-mode secret of one tenant resolves in another tenant
description: >-
  t1 is seeded with a service credential and with a principal-mode value
  for subject user-1. A `resolve` by t2 of a reference never seeded binds
  $missingCode.

  - t2 resolving t1's service credential (no principal) fails exactly as
    the control (`not_found`, same code), never with t1's value: service
    credentials are resolved per tenant (PORT-090: `resolve` takes the
    tenant).
  - t2 resolving the principal-mode reference for subject user-5 of t2
    (nothing seeded) and for subject user-1 of t2 (same subject as t1's
    principal) both fail exactly as the control: values are keyed by
    tenant and principal (PORT-090, as PORT-091 requires of any cache).
  - t1 still resolves both its values afterwards, so failed lookups by t2
    neither leak nor disturb them.

  Reading: as in port.secrets.resolve-per-principal, `principal` is
  `{subject, tenant}`.
requirements: [PORT-090]
port: secrets
steps:
  - op: seed
    args: { tenant: t1, reference: "secret://test/lookup-api-key", value: "SYN-SECRET-T1-SERVICE-0012" }
    expect: { ok: true }
  - op: seed
    args: { tenant: t1, reference: "secret://test/crm-user-token", value: "SYN-SECRET-T1-USER1-0011", principal: { subject: user-1, tenant: t1 } }
    expect: { ok: true }
  - op: resolve
    args: { tenant: t2, reference: "secret://test/never-seeded" }
    expect: { ok: false, error: { category: not_found, code: $missingCode } }
  - op: resolve
    args: { tenant: t2, reference: "secret://test/lookup-api-key" }
    expect: { ok: false, error: { category: not_found, code: $missingCode } }
  - op: resolve
    args: { tenant: t2, reference: "secret://test/crm-user-token", principal: { subject: user-5, tenant: t2 } }
    expect: { ok: false, error: { category: not_found, code: $missingCode } }
  - op: resolve
    args: { tenant: t2, reference: "secret://test/crm-user-token", principal: { subject: user-1, tenant: t2 } }
    expect: { ok: false, error: { category: not_found, code: $missingCode } }
  - op: resolve
    args: { tenant: t1, reference: "secret://test/lookup-api-key" }
    expect: { ok: true, result: "SYN-SECRET-T1-SERVICE-0012" }
  - op: resolve
    args: { tenant: t1, reference: "secret://test/crm-user-token", principal: { subject: user-1, tenant: t1 } }
    expect: { ok: true, result: "SYN-SECRET-T1-USER1-0011" }
