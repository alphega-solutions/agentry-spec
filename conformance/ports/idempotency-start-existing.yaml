schemaVersion: "0.1.0"
id: port.idempotency.start-existing
title: start creates a started record only when none exists for the key, and otherwise returns the existing record unchanged
description: >-
  Session S (…00b0) in tenant t1, lease token 1. Keys are
  "<session>/<callId>" strings (synthetic; key format is the
  implementation's).

  - `get` of K1 before any start is `not_found`.
  - The first `start` of K1 stores and returns the given started record
    (with `schemaVersion`, no `outcome`, no `completedAt`).
  - A second `start` of K1 a minute later, with a record carrying a later
    `createdAt`, returns the existing record (createdAt 10:00) and does
    not replace it: `get` still shows the original.
  - Other keys get their own records, including an agent call's
    `childSessionId` (ORCH-002).
  - After K1 is completed, `start` of K1 returns the completed record
    with its outcome, so a resumed call is not dispatched again (TOOL-061);
    K2 is unaffected.
requirements: [PORT-040, PORT-007]
port: idempotencyStore
clock: "2026-03-01T10:00:00Z"
steps:
  - op: get
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-0000000000b0/call_1
    expect: { error: { category: not_found } }
  - op: start
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-0000000000b0/call_1
      record: { schemaVersion: "0.1.0", tenant: t1, key: 01900000-0000-7000-8000-0000000000b0/call_1, sessionId: 01900000-0000-7000-8000-0000000000b0, callId: call_1, tool: update_record, state: started, createdAt: "2026-03-01T10:00:00Z" }
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
    expect: { result: { schemaVersion: "0.1.0", tenant: t1, key: 01900000-0000-7000-8000-0000000000b0/call_1, sessionId: 01900000-0000-7000-8000-0000000000b0, callId: call_1, tool: update_record, state: started, createdAt: "2026-03-01T10:00:00Z", outcome: { $absent: true }, completedAt: { $absent: true } } }
  - clock: { advance: PT1M }
  - op: start
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-0000000000b0/call_1
      record: { schemaVersion: "0.1.0", tenant: t1, key: 01900000-0000-7000-8000-0000000000b0/call_1, sessionId: 01900000-0000-7000-8000-0000000000b0, callId: call_1, tool: update_record, state: started, createdAt: "2026-03-01T10:01:00Z" }
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
    expect: { result: { key: 01900000-0000-7000-8000-0000000000b0/call_1, state: started, callId: call_1, createdAt: "2026-03-01T10:00:00Z" } }
  - op: get
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-0000000000b0/call_1
    expect: { result: { schemaVersion: "0.1.0", tenant: t1, key: 01900000-0000-7000-8000-0000000000b0/call_1, state: started, createdAt: "2026-03-01T10:00:00Z" } }
  - op: start
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-0000000000b0/call_2
      record: { schemaVersion: "0.1.0", tenant: t1, key: 01900000-0000-7000-8000-0000000000b0/call_2, sessionId: 01900000-0000-7000-8000-0000000000b0, callId: call_2, tool: send_email, state: started, createdAt: "2026-03-01T10:01:00Z" }
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
    expect: { result: { key: 01900000-0000-7000-8000-0000000000b0/call_2, callId: call_2, tool: send_email, state: started, createdAt: "2026-03-01T10:01:00Z" } }
  - op: start
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-0000000000b0/call_3
      record: { schemaVersion: "0.1.0", tenant: t1, key: 01900000-0000-7000-8000-0000000000b0/call_3, sessionId: 01900000-0000-7000-8000-0000000000b0, callId: call_3, tool: research_agent, state: started, childSessionId: 01900000-0000-7000-8000-0000000000b3, createdAt: "2026-03-01T10:01:00Z" }
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
    expect: { result: { schemaVersion: "0.1.0", key: 01900000-0000-7000-8000-0000000000b0/call_3, callId: call_3, tool: research_agent, childSessionId: 01900000-0000-7000-8000-0000000000b3, state: started } }
  - op: complete
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-0000000000b0/call_1
      outcome: { ok: { output: { recordId: r-17, updated: true } } }
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
    expect: { ok: true }
  - clock: { advance: PT1M }
  - op: start
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-0000000000b0/call_1
      record: { schemaVersion: "0.1.0", tenant: t1, key: 01900000-0000-7000-8000-0000000000b0/call_1, sessionId: 01900000-0000-7000-8000-0000000000b0, callId: call_1, tool: update_record, state: started, createdAt: "2026-03-01T10:02:00Z" }
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
    expect: { result: { schemaVersion: "0.1.0", key: 01900000-0000-7000-8000-0000000000b0/call_1, state: completed, outcome: { ok: { output: { recordId: r-17, updated: true } } }, completedAt: { $any: true }, createdAt: "2026-03-01T10:00:00Z" } }
  - op: get
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-0000000000b0/call_2
    expect: { result: { key: 01900000-0000-7000-8000-0000000000b0/call_2, callId: call_2, state: started, outcome: { $absent: true } } }
