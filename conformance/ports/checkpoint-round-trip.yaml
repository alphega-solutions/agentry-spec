schemaVersion: "0.1.0"
id: port.checkpoint.round-trip
title: Checkpoint contents round-trip exactly, every field included; a save replaces the whole record
description: >-
  Two checkpoints in tenant t1, each loaded back field for field:

  - S1 (…0060), a suspended child session (parent …0062): tainted, with
    both tainting provenances in order; remaining budget (tokens and cost)
    and the session-size counter; a reasoning part; the open escalation,
    unredacted, with two pending actions (arguments included, a `pii`
    label, reviewer requirements) and one recorded decision — a partial
    approval of an action that needs two (HITL-051); and two results held
    while suspended, one `ok` and one `error`, in request order.
  - S2 (…0061), an active root session with two children: its run lease
    (holder, fencing token, expiry), an opaque reasoning part, and
    adapter `extensions`.

  Every value written is expected back unchanged, including
  `schemaVersion` (PORT-007) and the order of arrays. Then S1 is saved
  again as v2 after the escalation was resolved: no `escalation`, no
  `heldResults`, state `active`, with a lease. Loading it shows those
  fields absent — `save` replaces the stored record rather than merging
  into it — and S2 is unaffected.
requirements: [PORT-030, PORT-007]
port: checkpointStore
clock: "2026-03-01T09:00:00Z"
steps:
  - op: save
    args:
      tenant: t1
      session: 01900000-0000-7000-8000-000000000060
      expectedVersion: 0
      lease: { holder: worker-a, token: 4, expiresAt: "2026-03-01T09:05:00Z" }
      checkpoint:
        schemaVersion: "0.1.0"
