schemaVersion: "0.1.0"
id: port.secrets.resolve-per-principal
title: Secrets resolve per reference, and per principal for principal-mode credentials
description: >-
  The test hook `seed` stores synthetic values for tenant t1: a service
  credential (no principal) and, under one principal-mode reference, a separate value
  for each of two principals of t1. `resolve` returns the service value
  without a principal, and for the principal-mode reference returns each
  principal's own value, never another's (PORT-090, CFG-062). A principal
  with no value seeded, and a reference never seeded, fail with
  `not_found` (PORT-004). Reading: `principal` in `seed` and `resolve` is a
  principal reference `{subject, tenant}` (CORE-150), so a per-principal
  value is also per tenant. Whether resolved values are persisted or
  cached beyond the call (PORT-091) is not observable through the port and
  is verified by harness fixtures.
requirements: [PORT-090]
port: secrets
steps:
  - op: seed
    args: { tenant: t1, reference: "secret://test/lookup-api-key", value: "SYN-SECRET-SERVICE-0001" }
    expect: { ok: true }
  - op: seed
    args: { tenant: t1, reference: "secret://test/crm-user-token", value: "SYN-SECRET-USER1-0002", principal: { subject: user-1, tenant: t1 } }
    expect: { ok: true }
  - op: seed
    args: { tenant: t1, reference: "secret://test/crm-user-token", value: "SYN-SECRET-USER2-0003", principal: { subject: user-2, tenant: t1 } }
    expect: { ok: true }
  - op: resolve
    args: { tenant: t1, reference: "secret://test/lookup-api-key" }
    expect: { ok: true, result: "SYN-SECRET-SERVICE-0001" }
  - op: resolve
    args: { tenant: t1, reference: "secret://test/crm-user-token", principal: { subject: user-1, tenant: t1 } }
    expect: { ok: true, result: "SYN-SECRET-USER1-0002" }
  - op: resolve
    args: { tenant: t1, reference: "secret://test/crm-user-token", principal: { subject: user-2, tenant: t1 } }
    expect: { ok: true, result: "SYN-SECRET-USER2-0003" }
  - op: resolve
    args: { tenant: t1, reference: "secret://test/crm-user-token", principal: { subject: user-1, tenant: t1 } }
    expect: { ok: true, result: "SYN-SECRET-USER1-0002" }
  - op: resolve
    args: { tenant: t1, reference: "secret://test/crm-user-token", principal: { subject: user-4, tenant: t1 } }
    expect: { ok: false, error: { category: not_found } }
  - op: resolve
    args: { tenant: t1, reference: "secret://test/never-seeded" }
    expect: { ok: false, error: { category: not_found } }
