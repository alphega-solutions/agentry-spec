schemaVersion: "0.1.0"
id: port.audit.other-tenant-invisible
title: Another tenant's audit records behave as missing for get, are invisible to every query, and are untouched by its retention deletion
description: >-
  t1 appends a record for session A. A `get` in t1 of an ID never
  appended (…013f) gives `not_found`, binding $missingCode.

  - t2's `get` of t1's record ID fails exactly as the control (same
    category and code; PORT-002, CORE-193).
  - Queries by t2 (all, by t1's session ID, by its time range, by its
    type) return no records, exactly as for a tenant with an empty log (a
    query has no not_found; it returns nothing).
  - `deleteBefore` has no per-record target, so the deletion control is
    a tenant whose log was never written (t3): its result binds
    $emptyDelete. t2's `deleteBefore` with a bound after t1's record
    returns exactly the same result, so it reveals nothing, and deletes
    nothing of t1's: t1 still reads its record.
requirements: [PORT-002]
port: auditLog
steps:
  - op: append
    args:
      tenant: t1
      record:
        schemaVersion: "0.1.0"
        id: "01900000-0000-7000-8000-000000000131"
        timestamp: "2026-01-01T01:00:00Z"
        tenant: "t1"
        sessionId: "01900000-0000-7000-8000-0000000000a1"
        principalRef: { subject: "user-1", tenant: "t1" }
        snapshotHash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648"
        type: "tool_call"
        eventIds: ["01900000-0000-7000-8000-000000000231", "01900000-0000-7000-8000-000000000232"]
        details: { callId: "c1", tool: "update_record", arguments: { key: "k1", status: "closed" }, outcome: { ok: { output: { updated: true } } } }
    expect:
      ok: true
      result:
        id: "01900000-0000-7000-8000-000000000131"
  - op: get
    args: { tenant: t1, id: "01900000-0000-7000-8000-00000000013f" }
    expect: { ok: false, error: { category: not_found, code: $missingCode } }
  - op: get
    args: { tenant: t2, id: "01900000-0000-7000-8000-000000000131" }
    expect: { ok: false, error: { category: not_found, code: $missingCode } }
  - op: query
    args: { tenant: t2 }
    expect: { ok: true, result: { $len: 0 } }
  - op: query
    args: { tenant: t2, session: "01900000-0000-7000-8000-0000000000a1" }
    expect: { ok: true, result: { $len: 0 } }
  - op: query
    args: { tenant: t2, from: "2026-01-01T00:00:00Z", to: "2026-01-01T02:00:00Z" }
    expect: { ok: true, result: { $len: 0 } }
  - op: query
    args: { tenant: t2, type: tool_call }
    expect: { ok: true, result: { $len: 0 } }
  - op: deleteBefore
    args: { tenant: t3, before: "2026-01-02T00:00:00Z" }
    bind: { "": $emptyDelete }
    expect: { ok: true }
  - op: deleteBefore
    args: { tenant: t2, before: "2026-01-02T00:00:00Z" }
    expect: { ok: true, result: $emptyDelete }
  - op: query
    args: { tenant: "t1" }
    expect: { ok: true, result: [{ id: "01900000-0000-7000-8000-000000000131" }] }
  - op: get
    args: { tenant: t1, id: "01900000-0000-7000-8000-000000000131" }
    expect: { ok: true, result: { id: "01900000-0000-7000-8000-000000000131", tenant: t1 } }
