schemaVersion: "0.1.0"
id: port.snapshot.secret-references-only
title: A snapshot of configuration with secret references holds the references, never resolved values
description: >-
  The snapshot's deployment declares a provider credential and an event-log
  password, and its tool binding an API key, all as secret references
  (CFG-060). The store keeps and returns exactly those references: it
  never resolves them, and the record it returns holds no other value in
  their place (PORT-052, CFG-063). That the implementation hands the store
  a snapshot with references unresolved is checked by harness fixtures
  (cfg.secret-resolved-value-not-persisted); this case checks the store
  side.
requirements: [PORT-052]
port: snapshotStore
steps:
  - op: put
    args:
      tenant: t1
      snapshot:
        schemaVersion: "0.1.0"
        tenant: t1
        hash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648"
        createdAt: "2026-01-01T00:00:00Z"
        artifacts:
          Deployment:
            - kind: Deployment
              id: test
              version: 1
              schemaVersion: "0.1.0"
              environment: test
              policyBundles: [org@1]
              attachmentSources: [upload]
              providers:
                - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false, credentials: { apiKey: "secret://test/provider-a-key" } }
              ports:
                eventLog: { adapter: memory, region: test-region, credentials: { password: "secret://test/event-log-password" } }
                checkpointStore: { adapter: memory, region: test-region }
                idempotencyStore: { adapter: memory, region: test-region }
                snapshotStore: { adapter: memory, region: test-region }
                blobStore: { adapter: memory, region: test-region }
                auditLog: { adapter: memory, region: test-region }
                secrets: { adapter: memory, region: test-region }
              retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
          Tool:
            - kind: Tool
              id: lookup
              version: 1
              schemaVersion: "0.1.0"
              description: Look up a record by key.
              input: { type: object, additionalProperties: false, required: [key], properties: { key: { type: string } } }
              effect: read
              credentialMode: service
              binding: { kind: native, handler: test.lookup, credentials: { apiKey: "secret://test/lookup-api-key" } }
    expect: { ok: true }
  - op: get
    args: { tenant: t1, hash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648" }
    expect:
      ok: true
      result:
        artifacts:
          Deployment:
            - providers:
                - { id: scripted-a, credentials: { apiKey: "secret://test/provider-a-key" } }
              ports:
                eventLog: { credentials: { password: "secret://test/event-log-password" } }
          Tool:
            - binding: { kind: native, credentials: { apiKey: "secret://test/lookup-api-key" } }
