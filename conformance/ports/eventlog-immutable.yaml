    expect: { ok: true }
  - op: read
    args: { tenant: t1, session: 01900000-0000-7000-8000-000000000020, fromSeq: 1, toSeq: 4 }
    expect:
      result:
        - { eventId: 01900000-0000-7000-8000-000000000021, seq: 1, payload: { persona: assistant@1 } }
        - { eventId: 01900000-0000-7000-8000-000000000022, seq: 2, payload: { kind: run } }
        - { eventId: 01900000-0000-7000-8000-000000000023, seq: 3, type: turn.started }
        - { eventId: 01900000-0000-7000-8000-000000000027, seq: 4, type: turn.completed }
