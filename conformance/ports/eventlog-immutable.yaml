        - { schemaVersion: "0.1.0", eventId: 01900000-0000-7000-8000-000000000022, sessionId: 01900000-0000-7000-8000-000000000020, runId: 01900000-0000-7000-8000-00000000002f, seq: 2, type: run.started, timestamp: "2026-03-01T09:00:00Z", tenantId: t1, principalRef: { subject: user-1, tenant: t1 }, snapshotHash: "sha256:2222222222222222222222222222222222222222222222222222222222222222", traceContext: { traceparent: "00-1bf7651916cd43dd8448eb211c80319c-c7ad6b7169203331-01" }, payload: { kind: run } }
        - { schemaVersion: "0.1.0", eventId: 01900000-0000-7000-8000-000000000023, sessionId: 01900000-0000-7000-8000-000000000020, runId: 01900000-0000-7000-8000-00000000002f, seq: 3, turn: 1, type: turn.started, timestamp: "2026-03-01T09:00:00Z", tenantId: t1, principalRef: { subject: user-1, tenant: t1 }, snapshotHash: "sha256:2222222222222222222222222222222222222222222222222222222222222222", traceContext: { traceparent: "00-1bf7651916cd43dd8448eb211c80319c-c7ad6b7169203331-01" }, payload: {} }
  - op: append
    args:
      tenant: t1
      session: 01900000-0000-7000-8000-000000000020
