schemaVersion: "0.1.0"
id: port.audit.retention-prefix
title: deleteBefore deletes only the longest append-order prefix before the bound, so an out-of-order record blocks deletion of the records after it
description: >-
  t1 appends three records, the second out of timestamp order: R1 at
  01:00, R2 at 03:00, R3 at 02:00 (as when two sessions' records arrive
  out of order).

  - `deleteBefore` 02:30 deletes the longest prefix, in append order, of
    records whose timestamp is before 02:30 (format,
    `conformance/schema/port-case.yaml`): only R1. R2 is not before the
    bound, so it ends the prefix and R3 is kept although its own
    timestamp is before the bound (PORT-073 as amended, "Further readings
    settled in review": a record that is not yet due keeps every later
    record, so a tamper-evident chain never has a hole). `query` returns
    R2 and R3, in append order.
  - `deleteBefore` 03:30 then deletes both: the whole log is before the
    bound.

  The operation is defined this way for every adapter; for a
  tamper-evident one it is what keeps the chain whole
  (port.audit.chain-after-retention).
requirements: [PORT-073, PORT-070]
port: auditLog
steps:
  - op: append
    args:
      tenant: t1
      record:
        schemaVersion: "0.1.0"
        id: "01900000-0000-7000-8000-000000000611"
        timestamp: "2026-01-01T01:00:00Z"
        tenant: "t1"
        sessionId: "01900000-0000-7000-8000-0000000000a1"
        principalRef: { subject: "user-1", tenant: "t1" }
        snapshotHash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648"
        type: "tool_call"
        eventIds: ["01900000-0000-7000-8000-000000000621", "01900000-0000-7000-8000-000000000622"]
        details: { callId: "c1", tool: "update_record", arguments: { key: "k1", status: "closed" }, outcome: { ok: { output: { updated: true } } } }
    expect: { ok: true, result: { id: "01900000-0000-7000-8000-000000000611" } }
  - op: append
    args:
      tenant: t1
      record:
        schemaVersion: "0.1.0"
        id: "01900000-0000-7000-8000-000000000612"
        timestamp: "2026-01-01T03:00:00Z"
        tenant: "t1"
        sessionId: "01900000-0000-7000-8000-0000000000b1"
        principalRef: { subject: "user-1", tenant: "t1" }
        snapshotHash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648"
        type: "tool_call"
        eventIds: ["01900000-0000-7000-8000-000000000623", "01900000-0000-7000-8000-000000000624"]
        details: { callId: "c2", tool: "update_record", arguments: { key: "k2", status: "closed" }, outcome: { ok: { output: { updated: true } } } }
    expect: { ok: true, result: { id: "01900000-0000-7000-8000-000000000612" } }
  - op: append
    args:
      tenant: t1
      record:
        schemaVersion: "0.1.0"
        id: "01900000-0000-7000-8000-000000000613"
        timestamp: "2026-01-01T02:00:00Z"
        tenant: "t1"
        sessionId: "01900000-0000-7000-8000-0000000000a1"
        principalRef: { subject: "user-1", tenant: "t1" }
        snapshotHash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648"
        type: "tool_call"
        eventIds: ["01900000-0000-7000-8000-000000000625", "01900000-0000-7000-8000-000000000626"]
        details: { callId: "c3", tool: "update_record", arguments: { key: "k3", status: "closed" }, outcome: { ok: { output: { updated: true } } } }
    expect: { ok: true, result: { id: "01900000-0000-7000-8000-000000000613" } }
  - op: deleteBefore
    args: { tenant: t1, before: "2026-01-01T02:30:00Z" }
    expect: { ok: true }
  - op: query
    args: { tenant: t1 }
    expect:
      ok: true
      result:
        - { id: "01900000-0000-7000-8000-000000000612", timestamp: "2026-01-01T03:00:00Z" }
        - { id: "01900000-0000-7000-8000-000000000613", timestamp: "2026-01-01T02:00:00Z" }
  - op: deleteBefore
    args: { tenant: t1, before: "2026-01-01T03:30:00Z" }
    expect: { ok: true }
  - op: query
    args: { tenant: t1 }
    expect: { ok: true, result: { $len: 0 } }
