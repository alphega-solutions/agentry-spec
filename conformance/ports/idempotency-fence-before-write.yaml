schemaVersion: "0.1.0"
id: port.idempotency.fence-before-write
title: A lease fenced at the idempotency store rejects starts and completions under a lower token before its holder has written anything
description: >-
  Session S (…0600) in tenant t1. worker-a holds the run lease with
  fencing token 1 and starts K1 (call_1). worker-b then takes a new lease
  (token 2) and fences it at the idempotency store with `fence` before
  writing anything (Area 10 amendment 2026-11-02, "Further readings
  settled in review": a new lease is fenced at every port that takes
  leases before its holder reads state for recovery or dispatches
  anything). No write by token 2 happens until the controls.

  A `get` of a key never started binds $missingCode.

  - worker-a's `start` of a new key K2 (call_2) with token 1 fails
    `conflict` and creates nothing: `get` of K2 fails exactly as for a
    missing key (PORT-040, PORT-004).
  - worker-a's `complete` of K1 with token 1 fails `conflict`; K1 is still
    `started` with no outcome (PORT-041).
  - Controls: worker-b completes K1 and starts K2 with token 2; both
    succeed.
requirements: [PORT-040, PORT-041, PORT-004]
port: idempotencyStore
clock: "2026-03-01T10:00:00Z"
steps:
  - op: get
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-000000000600/call_9
    expect: { ok: false, error: { category: not_found, code: $missingCode } }
  - op: start
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-000000000600/call_1
      record: { schemaVersion: "0.1.0", tenant: t1, key: 01900000-0000-7000-8000-000000000600/call_1, sessionId: 01900000-0000-7000-8000-000000000600, callId: call_1, tool: update_record, state: started, createdAt: "2026-03-01T10:00:00Z" }
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
    expect: { ok: true, result: { key: 01900000-0000-7000-8000-000000000600/call_1, state: started } }
  - clock: { advance: PT5M }
  - op: fence
    args:
      tenant: t1
      session: 01900000-0000-7000-8000-000000000600
      lease: { holder: worker-b, token: 2, expiresAt: "2026-03-01T10:10:00Z" }
    expect: { ok: true }
  - op: start
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-000000000600/call_2
      record: { schemaVersion: "0.1.0", tenant: t1, key: 01900000-0000-7000-8000-000000000600/call_2, sessionId: 01900000-0000-7000-8000-000000000600, callId: call_2, tool: update_record, state: started, createdAt: "2026-03-01T10:05:00Z" }
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
    expect: { ok: false, error: { category: conflict } }
  - op: get
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-000000000600/call_2
    expect: { ok: false, error: { category: not_found, code: $missingCode } }
  - op: complete
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-000000000600/call_1
      outcome: { ok: { output: { updated: true } } }
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
    expect: { ok: false, error: { category: conflict } }
  - op: get
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-000000000600/call_1
    expect: { ok: true, result: { state: started, outcome: { $absent: true }, completedAt: { $absent: true } } }
  - op: complete
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-000000000600/call_1
      outcome: { ok: { output: { updated: true } } }
      lease: { holder: worker-b, token: 2, expiresAt: "2026-03-01T10:10:00Z" }
    expect: { ok: true }
  - op: start
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-000000000600/call_2
      record: { schemaVersion: "0.1.0", tenant: t1, key: 01900000-0000-7000-8000-000000000600/call_2, sessionId: 01900000-0000-7000-8000-000000000600, callId: call_2, tool: update_record, state: started, createdAt: "2026-03-01T10:05:00Z" }
      lease: { holder: worker-b, token: 2, expiresAt: "2026-03-01T10:10:00Z" }
    expect: { ok: true, result: { key: 01900000-0000-7000-8000-000000000600/call_2, state: started } }
  - op: get
    args:
      tenant: t1
      key: 01900000-0000-7000-8000-000000000600/call_1
    expect: { ok: true, result: { state: completed, outcome: { ok: { output: { updated: true } } } } }
