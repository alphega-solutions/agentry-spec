    expect: { ok: true }
  - op: save
    args:
      tenant: t1
      session: 01900000-0000-7000-8000-000000000071
      expectedVersion: 0
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
      checkpoint: { schemaVersion: "0.1.0", tenant: t1, sessionId: 01900000-0000-7000-8000-000000000071, version: 1, lastSeq: 6, state: suspended, expiresAt: "2026-03-02T08:00:00Z", principalRef: { subject: user-1, tenant: t1 }, persona: assistant@1, profile: default@1, snapshotHash: "sha256:9999999999999999999999999999999999999999999999999999999999999999", taint: { tainted: false, provenances: [] }, budget: { tokens: 50000 }, counters: { sessionSize: 512 }, escalation: { id: 01900000-0000-7000-8000-000000000074, sessionId: 01900000-0000-7000-8000-000000000071, runId: 01900000-0000-7000-8000-00000000007c, turn: 1, step: 1, tenant: t1, snapshotHash: "sha256:9999999999999999999999999999999999999999999999999999999999999999", sources: [approval], reasonCodes: [agentry.approval.always], pendingActions: [{ id: pa-1, kind: tool_call, source: approval, reasonCode: agentry.approval.always, callId: call_1, tool: update_record, arguments: { key: k1, value: v1 }, labels: [], allowedDecisions: [approve, reject, edit], reviewerRequirements: { requiredApprovals: 1, selfApprovalAllowed: false, rules: [] } }], createdAt: "2026-03-01T08:00:00Z", expiresAt: "2026-03-02T08:00:00Z", decisions: [] }, parentSessionId: 01900000-0000-7000-8000-000000000070 }
    expect: { ok: true }
  - op: save
    args:
      tenant: t1
      session: 01900000-0000-7000-8000-000000000072
      expectedVersion: 0
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
      checkpoint: { schemaVersion: "0.1.0", tenant: t1, sessionId: 01900000-0000-7000-8000-000000000072, version: 1, lastSeq: 7, state: suspended, expiresAt: "2026-03-04T08:10:00Z", principalRef: { subject: user-2, tenant: t1 }, persona: assistant@1, profile: default@1, snapshotHash: "sha256:9999999999999999999999999999999999999999999999999999999999999999", taint: { tainted: false, provenances: [] }, budget: { tokens: 50000 }, counters: { sessionSize: 512 }, escalation: { id: 01900000-0000-7000-8000-000000000075, sessionId: 01900000-0000-7000-8000-000000000072, runId: 01900000-0000-7000-8000-00000000007d, turn: 1, step: 1, tenant: t1, snapshotHash: "sha256:9999999999999999999999999999999999999999999999999999999999999999", sources: [approval], reasonCodes: [agentry.approval.always], pendingActions: [{ id: pa-1, kind: tool_call, source: approval, reasonCode: agentry.approval.always, callId: call_1, tool: update_record, arguments: { key: k1, value: v1 }, labels: [], allowedDecisions: [approve, reject, edit], reviewerRequirements: { requiredApprovals: 1, selfApprovalAllowed: false, rules: [] } }], createdAt: "2026-03-01T08:10:00Z", expiresAt: "2026-03-04T08:10:00Z", decisions: [] } }
    expect: { ok: true }
  - op: save
    args:
      tenant: t1
      session: 01900000-0000-7000-8000-000000000076
      expectedVersion: 0
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
      checkpoint: { schemaVersion: "0.1.0", tenant: t1, sessionId: 01900000-0000-7000-8000-000000000076, version: 1, lastSeq: 4, state: idle, expiresAt: "2026-03-01T11:00:00Z", principalRef: { subject: user-2, tenant: t1 }, persona: assistant@1, profile: default@1, snapshotHash: "sha256:9999999999999999999999999999999999999999999999999999999999999999", taint: { tainted: false, provenances: [] }, budget: { tokens: 50000 }, counters: { sessionSize: 512 } }
    expect: { ok: true }
  - op: save
    args:
      tenant: t1
      session: 01900000-0000-7000-8000-000000000077
      expectedVersion: 0
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
      checkpoint: { schemaVersion: "0.1.0", tenant: t1, sessionId: 01900000-0000-7000-8000-000000000077, version: 1, lastSeq: 7, state: suspended, expiresAt: "2026-02-28T08:00:00Z", principalRef: { subject: user-3, tenant: t1 }, persona: assistant@1, profile: default@1, snapshotHash: "sha256:9999999999999999999999999999999999999999999999999999999999999999", taint: { tainted: false, provenances: [] }, budget: { tokens: 50000 }, counters: { sessionSize: 512 }, escalation: { id: 01900000-0000-7000-8000-000000000078, sessionId: 01900000-0000-7000-8000-000000000077, runId: 01900000-0000-7000-8000-00000000007e, turn: 1, step: 1, tenant: t1, snapshotHash: "sha256:9999999999999999999999999999999999999999999999999999999999999999", sources: [approval], reasonCodes: [agentry.approval.always], pendingActions: [{ id: pa-1, kind: tool_call, source: approval, reasonCode: agentry.approval.always, callId: call_1, tool: update_record, arguments: { key: k1, value: v1 }, labels: [], allowedDecisions: [approve, reject, edit], reviewerRequirements: { requiredApprovals: 1, selfApprovalAllowed: false, rules: [] } }], createdAt: "2026-02-25T08:00:00Z", expiresAt: "2026-02-28T08:00:00Z", decisions: [] } }
    expect: { ok: true }
  - op: save
    args:
      tenant: t2
      session: 01900000-0000-7000-8000-000000000079
      expectedVersion: 0
      lease: { holder: worker-a, token: 1, expiresAt: "2026-03-01T10:05:00Z" }
      checkpoint: { schemaVersion: "0.1.0", tenant: t2, sessionId: 01900000-0000-7000-8000-000000000079, version: 1, lastSeq: 7, state: suspended, expiresAt: "2026-03-04T08:05:00Z", principalRef: { subject: user-9, tenant: t2 }, persona: assistant@1, profile: default@1, snapshotHash: "sha256:9999999999999999999999999999999999999999999999999999999999999999", taint: { tainted: false, provenances: [] }, budget: { tokens: 50000 }, counters: { sessionSize: 512 }, escalation: { id: 01900000-0000-7000-8000-00000000007a, sessionId: 01900000-0000-7000-8000-000000000079, runId: 01900000-0000-7000-8000-00000000007f, turn: 1, step: 1, tenant: t2, snapshotHash: "sha256:9999999999999999999999999999999999999999999999999999999999999999", sources: [approval], reasonCodes: [agentry.approval.always], pendingActions: [{ id: pa-1, kind: tool_call, source: approval, reasonCode: agentry.approval.always, callId: call_1, tool: update_record, arguments: { key: k1, value: v1 }, labels: [], allowedDecisions: [approve, reject, edit], reviewerRequirements: { requiredApprovals: 1, selfApprovalAllowed: false, rules: [] } }], createdAt: "2026-03-01T08:05:00Z", expiresAt: "2026-03-04T08:05:00Z", decisions: [] } }
    expect: { ok: true }

  - op: listPendingEscalations
    args: { tenant: t1, now: $now }
    expect:
      result:
        - { id: 01900000-0000-7000-8000-000000000073, sessionId: 01900000-0000-7000-8000-000000000070, tenant: t1, expiresAt: "2026-03-02T08:00:00Z", pendingActions: [{ id: pa-1, delegated: true, chain: [01900000-0000-7000-8000-000000000071] }] }
        - { id: 01900000-0000-7000-8000-000000000075, sessionId: 01900000-0000-7000-8000-000000000072, tenant: t1 }
  - op: listPendingEscalations
    args: { tenant: t2, now: $now }
    expect:
      result:
        - { id: 01900000-0000-7000-8000-00000000007a, sessionId: 01900000-0000-7000-8000-000000000079, tenant: t2 }
  - clock: { advance: PT21H59M }
  - op: listPendingEscalations
    args: { tenant: t1, now: $now }
    expect:
      result:
        - { id: 01900000-0000-7000-8000-000000000073 }
        - { id: 01900000-0000-7000-8000-000000000075 }
  - clock: { advance: PT1M }
