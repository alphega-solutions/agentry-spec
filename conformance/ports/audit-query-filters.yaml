schemaVersion: "0.1.0"
id: port.audit.query-filters
title: The audit log is read by tenant, filtered by session, time range and type, in append order
description: >-
  Tenant t1 appends five records across sessions A and B; t2 appends
  one. Record 4 (session B, 01:20) is appended after record 3 (01:30),
  as when two sessions' records arrive slightly out of timestamp order:
  results are in append order, not timestamp order (format: query
  returns records in append order). Queries: all of t1; session A; the
  time range 01:05 to 01:40; type decision; session B and type tool_call
  together; and t2's log. Each returns exactly the matching records of
  its tenant, in order (PORT-072). No record's timestamp falls on a
  range bound, so the case does not depend on whether `from` and `to`
  are inclusive (unspecified).
requirements: [PORT-072]
port: auditLog
steps:
  - op: append
    args:
      tenant: t1
      record:
        schemaVersion: "0.1.0"
        id: "01900000-0000-7000-8000-000000000101"
        timestamp: "2026-01-01T01:00:00Z"
        tenant: "t1"
        sessionId: "01900000-0000-7000-8000-0000000000a1"
        principalRef: { subject: "user-1", tenant: "t1" }
        snapshotHash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648"
        type: "tool_call"
        eventIds: ["01900000-0000-7000-8000-000000000201", "01900000-0000-7000-8000-000000000202"]
        details: { callId: "c1", tool: "update_record", arguments: { key: "k1", status: "closed" }, outcome: { ok: { output: { updated: true } } } }
    expect:
      ok: true
      result:
        id: "01900000-0000-7000-8000-000000000101"
  - op: append
    args:
      tenant: t1
      record:
        schemaVersion: "0.1.0"
        id: "01900000-0000-7000-8000-000000000102"
        timestamp: "2026-01-01T01:10:00Z"
        tenant: "t1"
        sessionId: "01900000-0000-7000-8000-0000000000a1"
        principalRef: { subject: "user-1", tenant: "t1" }
        snapshotHash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648"
        type: "decision"
        reviewer: { subject: "reviewer-1", tenant: "t1" }
        eventIds: ["01900000-0000-7000-8000-000000000203"]
        details: { id: "01900000-0000-7000-8000-000000000301", escalationId: "01900000-0000-7000-8000-000000000302", pendingActionId: "a1", type: "approve", decidedBy: "reviewer", reviewer: { subject: "reviewer-1", tenant: "t1" }, timestamp: "2026-01-01T01:10:00Z" }
    expect:
      ok: true
      result:
        id: "01900000-0000-7000-8000-000000000102"
  - op: append
    args:
      tenant: t1
      record:
        schemaVersion: "0.1.0"
        id: "01900000-0000-7000-8000-000000000103"
        timestamp: "2026-01-01T01:30:00Z"
        tenant: "t1"
        sessionId: "01900000-0000-7000-8000-0000000000b1"
        principalRef: { subject: "user-1", tenant: "t1" }
        snapshotHash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648"
        type: "tool_call"
        eventIds: ["01900000-0000-7000-8000-000000000204", "01900000-0000-7000-8000-000000000205"]
        details: { callId: "c7", tool: "update_record", arguments: { key: "k2", status: "closed" }, outcome: { ok: { output: { updated: true } } } }
    expect:
      ok: true
      result:
        id: "01900000-0000-7000-8000-000000000103"
  - op: append
    args:
      tenant: t1
      record:
        schemaVersion: "0.1.0"
        id: "01900000-0000-7000-8000-000000000104"
        timestamp: "2026-01-01T01:20:00Z"
        tenant: "t1"
        sessionId: "01900000-0000-7000-8000-0000000000b1"
        principalRef: { subject: "user-1", tenant: "t1" }
        snapshotHash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648"
        type: "decision"
        reviewer: { subject: "reviewer-2", tenant: "t1" }
        eventIds: ["01900000-0000-7000-8000-000000000206"]
        details: { id: "01900000-0000-7000-8000-000000000303", escalationId: "01900000-0000-7000-8000-000000000304", pendingActionId: "a1", type: "reject", decidedBy: "reviewer", reviewer: { subject: "reviewer-2", tenant: "t1" }, timestamp: "2026-01-01T01:20:00Z" }
    expect:
      ok: true
      result:
        id: "01900000-0000-7000-8000-000000000104"
  - op: append
    args:
      tenant: t2
      record:
        schemaVersion: "0.1.0"
        id: "01900000-0000-7000-8000-0000000001f1"
        timestamp: "2026-01-01T01:15:00Z"
        tenant: "t2"
        sessionId: "01900000-0000-7000-8000-0000000000c1"
        principalRef: { subject: "user-3", tenant: "t2" }
        snapshotHash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648"
        type: "tool_call"
        eventIds: ["01900000-0000-7000-8000-0000000002f1", "01900000-0000-7000-8000-0000000002f2"]
        details: { callId: "c1", tool: "update_record", arguments: { key: "k1", status: "closed" }, outcome: { ok: { output: { updated: true } } } }
    expect:
      ok: true
      result:
        id: "01900000-0000-7000-8000-0000000001f1"
  - op: append
    args:
      tenant: t1
      record:
        schemaVersion: "0.1.0"
        id: "01900000-0000-7000-8000-000000000105"
        timestamp: "2026-01-01T02:00:00Z"
        tenant: "t1"
        sessionId: "01900000-0000-7000-8000-0000000000a1"
        principalRef: { subject: "user-1", tenant: "t1" }
        snapshotHash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648"
        type: "tool_call"
        eventIds: ["01900000-0000-7000-8000-000000000207", "01900000-0000-7000-8000-000000000208"]
        details: { callId: "c9", tool: "update_record", arguments: { key: "k3", status: "closed" }, outcome: { ok: { output: { updated: true } } } }
    expect:
      ok: true
      result:
        id: "01900000-0000-7000-8000-000000000105"
  - op: query
    args: { tenant: "t1" }
    expect: { ok: true, result: [{ id: "01900000-0000-7000-8000-000000000101" }, { id: "01900000-0000-7000-8000-000000000102" }, { id: "01900000-0000-7000-8000-000000000103" }, { id: "01900000-0000-7000-8000-000000000104" }, { id: "01900000-0000-7000-8000-000000000105" }] }
  - op: query
    args: { tenant: "t1", session: "01900000-0000-7000-8000-0000000000a1" }
    expect: { ok: true, result: [{ id: "01900000-0000-7000-8000-000000000101" }, { id: "01900000-0000-7000-8000-000000000102" }, { id: "01900000-0000-7000-8000-000000000105" }] }
  - op: query
    args: { tenant: "t1", from: "2026-01-01T01:05:00Z", to: "2026-01-01T01:40:00Z" }
    expect: { ok: true, result: [{ id: "01900000-0000-7000-8000-000000000102" }, { id: "01900000-0000-7000-8000-000000000103" }, { id: "01900000-0000-7000-8000-000000000104" }] }
  - op: query
    args: { tenant: "t1", type: "decision" }
    expect: { ok: true, result: [{ id: "01900000-0000-7000-8000-000000000102" }, { id: "01900000-0000-7000-8000-000000000104" }] }
  - op: query
    args: { tenant: "t1", session: "01900000-0000-7000-8000-0000000000b1", type: "tool_call" }
    expect: { ok: true, result: [{ id: "01900000-0000-7000-8000-000000000103" }] }
  - op: query
    args: { tenant: "t2" }
    expect: { ok: true, result: [{ id: "01900000-0000-7000-8000-0000000001f1" }] }
