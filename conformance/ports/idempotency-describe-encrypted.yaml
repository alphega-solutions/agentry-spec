schemaVersion: "0.1.0"
id: port.idempotency.describe-encrypted
title: The idempotencyStore adapter reports encryption at rest configured
description: >-
  `describe` reports `encryptedAtRest: true` (Area 10 amendment
  2026-11-02). Every idempotencyStore adapter must encrypt stored data at rest, with
  platform or customer-managed keys as the deployment configures
  (PORT-006); this includes the in-memory adapters of the conformance
  suite (EVAL-033), which must report it too. `keyRef`, present only for
  customer-managed keys, is not asserted. The case checks the adapter's
  report, not the encryption itself, which no data-only case can observe.
requirements: [PORT-006]
port: idempotencyStore
steps:
  - op: describe
    args: {}
    expect:
      result: { encryptedAtRest: true }
