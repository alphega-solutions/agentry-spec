schemaVersion: "0.1.0"
id: port.audit.chain-after-retention
title: Retention deletion keeps the hash of the last deleted record, so the remaining chain verifies
description: >-
  For tamper-evident adapters only. t1 appends four chained records
  (01:00 to 04:00). `deleteBefore` 02:30 deletes the first two; the
  remaining records are unchanged, the first of them still links to the
  deleted second record's hash, and `verify` reports the log valid. A
  fifth record links to the fourth. `deleteBefore` 06:00 then deletes
  every record; the log is empty and still valid, and the next appended
  record's `prevHash` is the hash of the last deleted record (the
  fifth), which the log must have kept (PORT-073 as amended). Its chain
  verifies. Expected hashes are computed from the records as given.
requirements: [PORT-073]
port: auditLog
features: [audit.tamper-evident]
steps:
  - op: append
    args:
      tenant: t1
      record:
        schemaVersion: "0.1.0"
        id: "01900000-0000-7000-8000-000000000161"
        timestamp: "2026-01-01T01:00:00Z"
        tenant: "t1"
        sessionId: "01900000-0000-7000-8000-0000000000a1"
        principalRef: { subject: "user-1", tenant: "t1" }
        snapshotHash: "sha256:a988755824d7aa28b08a62583e86b7642aef4270ab5bad26c3c8a50f2e26e648"
        type: "tool_call"
        eventIds: ["01900000-0000-7000-8000-000000000261", "01900000-0000-7000-8000-000000000262"]
        details: { callId: "c1", tool: "update_record", arguments: { key: "k1", status: "closed" }, outcome: { ok: { output: { updated: true } } } }
    expect:
      ok: true
      result:
        id: "01900000-0000-7000-8000-000000000161"
        hash: "sha256:11a54a75945b6a6741186aaa64b5e126fd7024f4a53ec7ceabfd1b1c405665c1"
        prevHash: { $absent: true }
  - op: append
