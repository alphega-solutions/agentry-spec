schemaVersion: "0.1.0"
id: eval.replay-golden-approval-resume
title: Replaying the approval golden bundle raises the same escalation, reapplies the recorded approval and reproduces the resumed run's call, result and response
description: >-
  `golden/approval-resume.yaml` (EVAL-026) records, under a snapshot in
  which update_record@1 has `approval: always`: run 1 — the model calls
  update_record (c1, {key: k1, value: SYN-VALUE-0002}), stage 7 escalates
  (source approval, agentry.approval.always) and the run ends `escalated`;
  reviewer-1 approves; run 2 (kind resume) — escalation.resolved, the call
  is dispatched and answers {updated: true}, the model responds "Record k1
  is updated." and the run ends `responded`.


  Replayed with `snapshot: recorded` in t1 (EVAL-060–063 as amended
  2026-11-02), the new session carries the bundle's snapshot hash, so
  update_record escalates again exactly as recorded — the fixture's own
  configuration (baseline, `approval: never`) would not escalate, which
  shows the recorded snapshot is the one in force. The recorded decision is
  reapplied, so the replayed session resumes in a second run with
  `escalation.resolved`, and the call (matched to the recorded call,
  EVAL-062) gets the recorded result without dispatch: update_record's stub
  has no behaviours and is asserted uncalled. No provider is called. The
  replayed session is left `idle`; no divergence is reported.


  reviewer-1 exists in t1 as a human principal, so the reapplied decision's
  reviewer is valid in the tenant (HITL-020).
requirements: [EVAL-026]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-04-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a: { responses: [] }
    scripted-b: { responses: [] }
  stubs:
    tools:
      lookup: []
      update_record: []
script:
  - action: replay
    bind: $rp
    tenant: t1
    bundle: golden/approval-resume.yaml
    snapshot: recorded
    hookMode: reEvaluate
    expect: { ok: true, divergences: [] }
expect:
  sessions:
    $rp:
      state: idle
      events:
        mode: subsequence
        items:
          - type: session.created
            seq: 1
            sessionId: { $all: [$rp, { $not: 019cadc6-9a80-7001-8000-002200000001 }] }
            snapshotHash: "sha256:44b2a8a97c722c5824002a95a0a5fb38b5720ceb4bb3c533ef64248ca9b2da3f"
            payload: { persona: assistant@1 }
          - { type: run.started, runId: $r1, payload: { kind: run } }
          - type: model.response
            runId: $r1
            step: 1
            payload: { message: { parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: SYN-VALUE-0002 } }] } }
          - type: escalation.raised
            runId: $r1
            payload:
              escalation:
                sources: [approval]
                reasonCodes: [agentry.approval.always]
                pendingActions:
                  - { kind: tool_call, source: approval, reasonCode: agentry.approval.always, callId: c1, tool: update_record, arguments: { key: k1, value: SYN-VALUE-0002 } }
          - { type: run.ended, runId: $r1, payload: { reason: escalated } }
          - { type: run.started, runId: { $all: [$r2, { $not: $r1 }] }, payload: { kind: resume } }
          - { type: escalation.resolved, runId: $r2 }
          - { type: tool.call, runId: $r2, payload: { callId: c1, tool: update_record, arguments: { key: k1, value: SYN-VALUE-0002 } } }
          - { type: tool.result, runId: $r2, payload: { callId: c1, tool: update_record, result: { ok: { output: { updated: true } } } } }
          - type: model.response
            runId: $r2
            step: 2
            payload: { message: { parts: [{ type: text, text: "Record k1 is updated." }] } }
          - { type: turn.completed, runId: $r2, turn: 1 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: tool.call, runId: $r1 }
        - { type: error }
  ports:
    eventLog:
      t1:
        $rp:
          $all:
            - $count: { of: { type: escalation.raised }, equals: 1 }
            - $count: { of: { type: tool.call }, equals: 1 }
            - $count: { of: { type: run.ended }, equals: 2 }
  stubCalls:
    lookup: { count: 0 }
    update_record: { count: 0 }
  providerRequests:
    scripted-a: { count: 0 }
    scripted-b: { count: 0 }
