schemaVersion: "0.1.0"
id: eval.run-matrix-repeats
title: Each case runs once per matrix cell per repeat, each run its own session, with governance in force
description: >-
  Two cells — scripted-a/model-a and scripted-b/model-b, both default@1 —
  `repeats: 2` and two cases: 2 × 2 × 2 = 8 results, each with its own
  session (EVAL-044 as amended 2026-11-02). Runs execute cell, then
  repeat, then case, so each provider's responses are consumed in that
  order and results are listed in execution order. Every run starts from
  its case's stub behaviours afresh, so the only thing that varies is the
  cell's model: its scripted responses. Deployment: the baseline copy
  with `environment: eval`; the bundle trusts no tools.


  - c-taint: graders escalated from `taint`; lookup called, update_record
    not called. When the model calls lookup (untrusted, so its result
    taints the session) and then update_record, the taint rule applies in
    the eval run as in production: a `policy.decision` (taint, escalate)
    and an escalation from source `taint`, no dispatch; the case's
    scripted decision rejects it (reviewer `eval-reviewer-1`) and the
    model answers. model-a does this in both repeats; model-b does it in
    repeat 1, but in repeat 2 it answers right after lookup, so nothing
    escalates and the escalation grader fails (the trajectory grader
    passes; no result `code`).

  - c-plain: one grader, the final text equals `SYN-DONE`. model-a
    answers `SYN-DONE` (pass); model-b answers `SYN-OTHER` (fail) in both
    repeats.


  Cell 0: all four results pass: `passRate` 1, `variance` 0. Cell 1:
  c-taint passes 1 of 2 (p = 0.5, p(1−p) = 0.25), c-plain 0 of 2 (0):
  `passRate` 1/4 = 0.25, `variance` (0.25 + 0) / 2 = 0.125 (EVAL-080
  reading: population variance per case, averaged over cases).


  Each session's model calls go to its cell's provider only. Scripted
  provider responses: scripted-a 8 (c-taint 3 + c-plain 1, per repeat),
  scripted-b 7 (repeat 1: 3 + 1; repeat 2: 2 + 1). Stubs: lookup 4 calls
  (one per c-taint run, one behaviour in the case); update_record none.
requirements: [EVAL-044]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: eval
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
  tenants:
    - id: eval-1
      principals:
        - { id: ep1, subject: eval-user-1, assurance: multi_factor }
        - { id: er1, subject: eval-reviewer-1, assurance: multi_factor }
  providers:
    scripted-a:
      responses:
        # cell 0, repeat 1, c-taint
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "SYN-NOT-UPDATED" }]
          usage: { inputTokens: 40, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        # cell 0, repeat 1, c-plain
        - parts: [{ type: text, text: "SYN-DONE" }]
          usage: { inputTokens: 10, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
        # cell 0, repeat 2, c-taint
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "SYN-NOT-UPDATED" }]
          usage: { inputTokens: 40, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        # cell 0, repeat 2, c-plain
        - parts: [{ type: text, text: "SYN-DONE" }]
          usage: { inputTokens: 10, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b:
      responses:
        # cell 1, repeat 1, c-taint
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "SYN-NOT-UPDATED" }]
          usage: { inputTokens: 40, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        # cell 1, repeat 1, c-plain
        - parts: [{ type: text, text: "SYN-OTHER" }]
          usage: { inputTokens: 10, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
        # cell 1, repeat 2, c-taint: answers after lookup, no update_record call
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "SYN-LOOKED-UP" }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        # cell 1, repeat 2, c-plain
        - parts: [{ type: text, text: "SYN-OTHER" }]
          usage: { inputTokens: 10, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
script:
  - action: evalRun
    run:
      schemaVersion: "0.1.0"
      id: eval-matrix
      tenant: eval-1
      deployment: test@1
      cases: [c-taint, c-plain]
      matrix:
        cells:
          - { model: { provider: scripted-a, name: model-a }, profile: default@1 }
          - { model: { provider: scripted-b, name: model-b }, profile: default@1 }
      repeats: 2
    cases:
      - schemaVersion: "0.1.0"
        id: c-taint
        persona: assistant@1
        principal: { subject: eval-user-1 }
        inputs:
          - [{ type: text, text: "Look up k1 and set it to v1" }]
        stubs:
          tools:
            lookup:
              - ok: { output: { value: "SYN-VALUE-0001" } }
        decisions:
          - { match: { source: taint }, type: reject, reviewer: eval-reviewer-1 }
        graders:
          - { kind: escalation, escalates: true, source: taint }
          - { kind: trajectory, called: [lookup], notCalled: [update_record] }
      - schemaVersion: "0.1.0"
        id: c-plain
        persona: assistant@1
        principal: { subject: eval-user-1 }
        inputs:
          - [{ type: text, text: "Say done" }]
        graders:
          - { kind: schema, equals: "SYN-DONE" }
    expect:
      ok: true
      report:
        runId: eval-matrix
        cells:
          - model: { provider: scripted-a, name: model-a }
            profile: default@1
            passRate: 1
            variance: 0
            results:
              - { caseId: c-taint, repeat: 1, passed: true, sessionId: $a1, graders: [{ kind: escalation, passed: true }, { kind: trajectory, passed: true }] }
              - { caseId: c-plain, repeat: 1, passed: true, sessionId: $ap1, graders: [{ kind: schema, passed: true }] }
              - { caseId: c-taint, repeat: 2, passed: true, sessionId: $a2, graders: [{ kind: escalation, passed: true }, { kind: trajectory, passed: true }] }
              - { caseId: c-plain, repeat: 2, passed: true, sessionId: $ap2, graders: [{ kind: schema, passed: true }] }
          - model: { provider: scripted-b, name: model-b }
            profile: default@1
            passRate: 0.25
            variance: 0.125
            results:
              - { caseId: c-taint, repeat: 1, passed: true, sessionId: $b1, graders: [{ kind: escalation, passed: true }, { kind: trajectory, passed: true }] }
              - { caseId: c-plain, repeat: 1, passed: false, sessionId: $bp1, graders: [{ kind: schema, passed: false }] }
              - caseId: c-taint
                repeat: 2
                passed: false
                code: { $absent: true }
                sessionId: $b2
                graders: [{ kind: escalation, passed: false }, { kind: trajectory, passed: true }]
              - { caseId: c-plain, repeat: 2, passed: false, sessionId: $bp2, graders: [{ kind: schema, passed: false }] }
expect:
  sessions:
    $a1:
      events:
        mode: contains
        items:
          - { type: model.request, payload: { provider: scripted-a, model: model-a } }
          - { type: policy.decision, payload: { kind: taint, outcome: escalate, callId: c2 } }
          - { type: escalation.raised, payload: { escalation: { sources: [taint] } } }
      absentEvents:
        - { type: model.request, payload: { provider: scripted-b } }
        - { type: tool.call, payload: { tool: update_record } }
    $a2:
      events:
        mode: contains
        items:
          - { type: model.request, payload: { provider: scripted-a, model: model-a } }
          - { type: policy.decision, payload: { kind: taint, outcome: escalate, callId: c2 } }
          - { type: escalation.raised, payload: { escalation: { sources: [taint] } } }
      absentEvents:
        - { type: model.request, payload: { provider: scripted-b } }
        - { type: tool.call, payload: { tool: update_record } }
    $b1:
      events:
        mode: contains
        items:
          - { type: model.request, payload: { provider: scripted-b, model: model-b } }
          - { type: policy.decision, payload: { kind: taint, outcome: escalate, callId: c2 } }
          - { type: escalation.raised, payload: { escalation: { sources: [taint] } } }
      absentEvents:
        - { type: model.request, payload: { provider: scripted-a } }
        - { type: tool.call, payload: { tool: update_record } }
    $b2:
      events:
        mode: subsequence
        items:
          - { type: model.request, payload: { provider: scripted-b, model: model-b } }
          - { type: tool.result, payload: { callId: c1, tool: lookup } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: model.request, payload: { provider: scripted-a } }
        - { type: escalation.raised }
        - { type: tool.call, payload: { tool: update_record } }
    $ap1: { absentEvents: [{ type: model.request, payload: { provider: scripted-b } }] }
    $ap2: { absentEvents: [{ type: model.request, payload: { provider: scripted-b } }] }
    $bp1: { absentEvents: [{ type: model.request, payload: { provider: scripted-a } }] }
    $bp2: { absentEvents: [{ type: model.request, payload: { provider: scripted-a } }] }
  ports:
    eventLog:
      eval-1:
        $a1: { $count: { of: { type: escalation.raised }, equals: 1 } }
        $a2: { $count: { of: { type: escalation.raised }, equals: 1 } }
        $b1: { $count: { of: { type: escalation.raised }, equals: 1 } }
  stubCalls:
    lookup: { count: 4 }
    update_record: { count: 0 }
  providerRequests:
    scripted-a: { count: 8 }
    scripted-b: { count: 7 }
