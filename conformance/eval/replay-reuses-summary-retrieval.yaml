schemaVersion: "0.1.0"
id: eval.replay-reuses-summary-retrieval
title: On replay, recorded summaries and automatically retrieved content are reused — no summarizer call and no vector store query
description: >-
  `golden/retrieval-summary.yaml` records two turns under a snapshot with
  automatic retrieval from kb (limit 1) and `summarize` compaction by
  scripted-sum/sum-1. Each turn has a `context.retrieved` with one result;
  in turn 2 the context exceeds the trigger and turn 1 is summarized
  (`context.compacted`: summarize, units [{turn: 1}]). The fixture's
  configuration is the same, and scripted-a and scripted-b declare the
  recorded capabilities (contextLimit 120, maxOutputTokens 20), so the
  replayed context reaches the same compaction point.


  The bundle is replayed with `snapshot: recorded` (EVAL-061, CTX-083,
  CTX-032): retrieval and summaries are reused from the recording. The
  vector store source kb has an empty behaviour list and scripted-sum an
  empty script, so a query or a summarizer call fails the fixture; both are
  also asserted unused. The replayed session still records, per turn, its
  `context.retrieved` with one result (unlabelled, as recorded) and, in
  turn 2 before its model request, the `context.compacted` that reuses
  the recorded summary (mode summarize, units [{turn: 1}]). Both runs end
  `responded` and no divergence is reported.
requirements: [EVAL-061]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-04-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          - { id: scripted-sum, adapter: scripted, endpoint: "memory://scripted-sum", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
          vectorStore: { adapter: memory, region: test-region, sources: [kb] }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context:
          compaction: { mode: summarize, model: { provider: scripted-sum, name: sum-1 } }
          retrieval: { auto: true, source: kb, limit: 1 }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      responses: []
    scripted-b:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      responses: []
    scripted-sum:
      responses: []
  stubs:
    vectorStores:
      kb: []
script:
  - action: replay
    bind: $rp
    tenant: t1
    bundle: golden/retrieval-summary.yaml
    snapshot: recorded
    hookMode: reEvaluate
    expect: { ok: true, divergences: [] }
expect:
  sessions:
    $rp:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: session.created, snapshotHash: "sha256:58377fc12ea3d3f3b79afafab7ff0a33697897584fa23adf0dbfb1c2912ec98e" }
          - { type: turn.started, turn: 1 }
          - { type: context.retrieved, turn: 1, payload: { source: kb, results: [{ labels: [] }] } }
          - { type: model.response, turn: 1, payload: { message: { parts: [{ type: text, text: "SYN-AR-01 SYN-AR-02 SYN-AR-03 SYN-AR-04 SYN-AR-05 SYN-AR-06 SYN-AR-07 SYN-AR-08 SYN-AR-09 SYN-AR-10 SYN-AR-11 SYN-AR-12 SYN-AR-13 SYN-AR-14 SYN-AR-15 SYN-AR-16 SYN-AR-17 SYN-AR-18 SYN-AR-19 SYN-AR-20" }] } } }
          - { type: run.ended, payload: { reason: responded } }
          - { type: turn.started, turn: 2 }
          - { type: context.retrieved, turn: 2, payload: { source: kb, results: [{ labels: [] }] } }
          - { type: context.compacted, turn: 2, step: 1, payload: { mode: summarize, units: [{ turn: 1 }], summary: { $any: true } } }
          - { type: model.request, turn: 2, step: 1 }
          - { type: model.response, turn: 2, payload: { message: { parts: [{ type: text, text: "SYN-BR-01 SYN-BR-02 SYN-BR-03 SYN-BR-04 SYN-BR-05" }] } } }
          - { type: run.ended, payload: { reason: responded } }
  ports:
    eventLog:
      t1:
        $rp:
          $all:
            - $count: { of: { type: context.retrieved }, equals: 2 }
            - $count: { of: { type: context.compacted }, equals: 1 }
            - $count: { of: { type: run.ended }, equals: 2 }
  stubCalls:
    vectorStore/kb: { count: 0 }
  providerRequests:
    scripted-sum: { count: 0 }
    scripted-a: { count: 0 }
    scripted-b: { count: 0 }
