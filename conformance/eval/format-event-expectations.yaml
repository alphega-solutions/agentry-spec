schemaVersion: "0.1.0"
id: eval.format-event-expectations
title: Event expectations support exact sequences, ordered subsequences, unordered sets for parallel tool calls, absence, and field matching
description: >-
  Three sessions on the baseline, each matched with a different mode
  (`schema/fixture.yaml` `eventPattern`); every item is a partial match on
  event fields, with matchers where values vary.


  - $s1, `sequence`: a text-only run. Its persisted events, in log order,
    are exactly session.created, run.started, turn.started (carrying the
    principal's message), model.request, model.response, turn.completed
    and run.ended (`responded`) — nothing more, nothing in between
    (`checkpoint.saved` events, whose number is implementation-defined,
    are left out because no item names them).

  - $s2, `unordered`: one model response requests two lookups in one step
    (c1 key k1, c2 key k2). c1's stub is delayed by 1000 ms, so the two
    calls may be dispatched and complete in either order; the 13 items
    match the session's 13 events (again without `checkpoint.saved`)
    one-to-one in any order. `absentEvents` asserts no `error` event, no
    update_record call and no third step.

  - $s3, `subsequence`: the same two-call step again (both stubs
    immediate); the listed events occur in this order, with other events
    (c2's call and result among them) anywhere in between.
    `absentEvents` asserts no escalation.


  Scripted provider responses: scripted-a 5 ($s1 1, $s2 2, $s3 2). Stubs:
  lookup 4 calls.
requirements: [EVAL-004]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 4
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { parallelToolCalls: true }
      responses:
        # $s1
        - parts: [{ type: text, text: "SYN-HELLO" }]
          usage: { inputTokens: 10, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
        # $s2
        - parts:
            - { type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }
            - { type: tool_call, callId: c2, tool: lookup, arguments: { key: k2 } }
          usage: { inputTokens: 10, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "SYN-BOTH" }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        # $s3
        - parts:
            - { type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }
            - { type: tool_call, callId: c2, tool: lookup, arguments: { key: k2 } }
          usage: { inputTokens: 10, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "SYN-BOTH-AGAIN" }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - { ok: { output: { value: "SYN-VALUE-K1" } }, delayMs: 1000 }
        - { ok: { output: { value: "SYN-VALUE-K2" } } }
        - { ok: { output: { value: "SYN-VALUE-K1" } } }
        - { ok: { output: { value: "SYN-VALUE-K2" } } }
script:
  - action: run
    bind: $s1
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Say hello" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $s2
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1 and k2" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $s3
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1 and k2 again" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s1:
      state: idle
      events:
        mode: sequence
        items:
          - { type: session.created, sessionId: $s1 }
          - { type: run.started, runId: $r1, payload: { kind: run } }
          - type: turn.started
            runId: $r1
            turn: 1
            payload: { message: { role: principal, parts: [{ type: text, text: "Say hello" }] } }
          - { type: model.request, runId: $r1, turn: 1, step: 1 }
          - { type: model.response, runId: $r1, turn: 1, step: 1, payload: { provider: scripted-a, model: model-a } }
          - { type: turn.completed, runId: $r1, turn: 1 }
          - { type: run.ended, runId: $r1, payload: { reason: responded } }
    $s2:
      state: idle
      events:
        mode: unordered
        items:
          - { type: session.created }
          - { type: run.started }
          - { type: turn.started, payload: { message: { parts: [{ text: { $regex: "^Look up k1" } }] } } }
          - { type: model.request, step: 1 }
          - { type: model.response, step: 1, payload: { message: { parts: { $len: 2 } } } }
          - { type: tool.call, step: 1, payload: { callId: c1, tool: lookup, arguments: { key: k1 } } }
          - { type: tool.call, step: 1, payload: { callId: c2, tool: lookup, arguments: { key: k2 } } }
          - { type: tool.result, step: 1, payload: { callId: c1, result: { ok: { output: { value: "SYN-VALUE-K1" } } } } }
          - { type: tool.result, step: 1, payload: { callId: c2, result: { ok: { output: { value: "SYN-VALUE-K2" } } } } }
          - { type: model.request, step: 2 }
          - { type: model.response, step: 2 }
          - { type: turn.completed }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: error }
        - { type: tool.call, payload: { tool: update_record } }
        - { type: model.request, step: 3 }
    $s3:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: turn.started, payload: { message: { parts: [{ text: "Look up k1 and k2 again" }] } } }
          - { type: model.response, step: 1 }
          - { type: tool.result, step: 1, payload: { callId: c1 } }
          - { type: model.request, step: 2 }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: escalation.raised }
  stubCalls:
    lookup: { count: 4 }
  providerRequests:
    scripted-a: { count: 5 }
