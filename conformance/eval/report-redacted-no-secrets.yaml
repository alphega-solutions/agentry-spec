schemaVersion: "0.1.0"
id: eval.report-redacted-no-secrets
title: An eval report carries no labelled content and no secret value, even when the case's session handled both
description: >-
  Deployment: the baseline copy with `environment: eval` and an HTTP
  endpoint `crm` whose credential is the synthetic secret
  `secret://test/crm-key`. `read_contact` (native, `sensitivity: [pii]`,
  masked under org@1) and `crm_lookup` (bound to `crm/getContact`) are
  answered from the case's stubs. One cell (scripted-a/model-a,
  default@1), one repeat.


  The session reads the contact `SYN-PII-NAME-0001` (its `tool.result` is
  labelled `pii`), calls crm_lookup, and answers with text containing the
  name. The case passes (trajectory, and `equals` on the final text).


  The report is matched in full: every string-valued field the report
  schema allows (run ID, snapshot hash, model, profile, case ID, session
  and evidence IDs) is pinned, and every array is matched exactly
  (`divergences: []`, `failures: []`). Since the report must also
  validate against the closed `schemas/eval/v1/report.yaml`, neither the
  masked pii value, the case's input or output text, nor the secret value
  can appear anywhere in it (EVAL-082).


  Format gap: there is no matcher asserting that a string is absent at
  any depth of a step result (as `noPersistedContent` does for ports), so
  absence from the report is shown by pinning it whole rather than by
  searching it for `SYN-PII-NAME-0001` and the secret value. Scripted
  provider responses: scripted-a 3. Stubs: read_contact 1, crm/getContact
  1 (in the case).
requirements: [EVAL-082]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: eval
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        httpEndpoints:
          - id: crm
            endpoint: "memory://crm"
            region: test-region
            credentials: { apiKey: "secret://test/crm-key" }
            operations:
              getContact: { method: GET, path: "/contacts/{key}" }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Tool
        id: read_contact
        version: 1
        schemaVersion: "0.1.0"
        description: Read a contact.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        sensitivity: [pii]
        binding: { kind: native, handler: test.read_contact }
      - kind: Tool
        id: crm_lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a contact in the CRM.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        credentialMode: service
        binding: { kind: http, endpoint: crm, operation: getContact }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, read_contact@1, crm_lookup@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: eval-1
      principals:
        - { id: ep1, subject: eval-user-1, assurance: multi_factor }
  secrets:
    "secret://test/crm-key": "SYN-SECRET-CRM-0001-DO-NOT-REPORT"
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: read_contact, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: crm_lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Contact SYN-PII-NAME-0001 found" }]
          usage: { inputTokens: 40, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
script:
  - action: evalRun
    run:
      schemaVersion: "0.1.0"
      id: eval-redacted
      tenant: eval-1
      deployment: test@1
      cases: [c-contact]
      matrix:
        cells:
          - { model: { provider: scripted-a, name: model-a }, profile: default@1 }
      repeats: 1
    cases:
      - schemaVersion: "0.1.0"
        id: c-contact
        persona: assistant@1
        principal: { subject: eval-user-1 }
        inputs:
          - [{ type: text, text: "Find contact k1" }]
        stubs:
          tools:
            read_contact:
              - ok: { output: { name: "SYN-PII-NAME-0001" } }
          httpEndpoints:
            crm:
              getContact:
                - ok: { output: { status: "SYN-CRM-ACTIVE" } }
        graders:
          - { kind: trajectory, called: [read_contact, crm_lookup] }
          - { kind: schema, equals: "Contact SYN-PII-NAME-0001 found" }
    expect:
      ok: true
      report:
        schemaVersion: "0.1.0"
        runId: eval-redacted
        snapshot: { $regex: "^sha256:[0-9a-f]{64}$" }
        baseline: { $absent: true }
        cells:
          - model: { provider: scripted-a, name: model-a, params: { $absent: true } }
            profile: default@1
            passRate: 1
            tokens: 104
            divergences: []
            results:
              - caseId: c-contact
                repeat: 1
                passed: true
                sessionId: $s
                graders:
                  - { kind: trajectory, passed: true }
                  - { kind: schema, passed: true }
        gate: { passed: true, failures: [] }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: tool.result, labels: [pii], payload: { callId: c1, tool: read_contact } }
          - { type: tool.result, payload: { callId: c2, tool: crm_lookup, result: { ok: { output: { status: "SYN-CRM-ACTIVE" } } } } }
          - { type: run.ended, payload: { reason: responded } }
  providerRequests:
    scripted-a: { count: 3 }
