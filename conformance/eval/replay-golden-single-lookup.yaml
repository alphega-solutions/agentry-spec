schemaVersion: "0.1.0"
id: eval.replay-golden-single-lookup
title: Replaying the single-lookup golden bundle against its recorded snapshot reproduces its tool call, tool result, final response and end reason, with no divergence
description: >-
  `golden/single-lookup.yaml` (EVAL-026) records one turn: the model calls
  lookup (c1, {key: k1}), the tool answers {key: k1, value:
  SYN-VALUE-0001}, the model responds "Record k1 holds SYN-VALUE-0001." and
  the run ends `responded`.


  The bundle is replayed in tenant t1 with `snapshot: recorded` (EVAL-060
  as amended 2026-11-02): a new session, pinned to the bundle's snapshot,
  whose `session.created` carries exactly the bundle's snapshot hash. The
  principal is the bundle's principal reference (user-1 in t1). Model calls
  are answered from the recorded responses and the tool call from the
  recorded result (EVAL-062), so nothing is sent anywhere: scripted-a and
  scripted-b have empty scripts (a request fails the fixture) and lookup's
  stub has an empty behaviour list (a dispatch fails the fixture), and both
  are asserted unused. The replayed session reproduces the recorded
  outcomes: the same tool call with the same arguments, the recorded tool
  result, the recorded final text, one run ending `responded`; its turn
  starts from the bundle's recorded principal message (`turn.started`); the
  session is a new one (not the recorded session ID) and is left `idle`. No
  divergence is reported.


  Reading: the replayed session emits the ordinary event types
  (`model.response`, `tool.call`, `tool.result`) for answers taken from the
  recording; checkpoint and model request events are not asserted.
requirements: [EVAL-026]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-04-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a: { responses: [] }
    scripted-b: { responses: [] }
  stubs:
    tools:
      lookup: []
      update_record: []
script:
  - action: replay
    bind: $rp
    tenant: t1
    bundle: golden/single-lookup.yaml
    snapshot: recorded
    hookMode: reEvaluate
    expect: { ok: true, divergences: [] }
expect:
  sessions:
    $rp:
      state: idle
      events:
        mode: subsequence
        items:
          - type: session.created
            seq: 1
            sessionId: { $all: [$rp, { $not: 019ca8a0-3e80-7001-8000-001100000001 }] }
            tenantId: t1
            principalRef: { subject: user-1, tenant: t1 }
            snapshotHash: "sha256:21bb1a6f202b5d6973f96f904b341eebe6e0d867c5d4ab66b71d4ec7c1eb7996"
            payload: { persona: assistant@1, profile: default@1 }
          - { type: run.started, runId: $r1, payload: { kind: run } }
          - type: turn.started
            runId: $r1
            turn: 1
            provenances: [principal]
            payload: { message: { role: principal, parts: [{ type: text, text: "Look up record k1.", provenance: principal }] } }
          - type: model.response
            runId: $r1
            step: 1
            payload: { message: { parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }] } }
          - { type: tool.call, runId: $r1, step: 1, payload: { callId: c1, tool: lookup, arguments: { key: k1 } } }
          - type: tool.result
            runId: $r1
            step: 1
            payload: { callId: c1, tool: lookup, result: { ok: { output: { key: k1, value: SYN-VALUE-0001 } } } }
          - type: model.response
            runId: $r1
            step: 2
            payload: { message: { parts: [{ type: text, text: "Record k1 holds SYN-VALUE-0001." }] } }
          - { type: turn.completed, runId: $r1, turn: 1 }
          - { type: run.ended, runId: $r1, payload: { reason: responded } }
      absentEvents:
        - { type: error }
        - { type: session.closed }
  ports:
    eventLog:
      t1:
        $rp:
          $all:
            - $count: { of: { type: run.started }, equals: 1 }
            - $count: { of: { type: tool.call }, equals: 1 }
            - $count: { of: { type: run.ended }, equals: 1 }
  stubCalls:
    lookup: { count: 0 }
    update_record: { count: 0 }
  providerRequests:
    scripted-a: { count: 0 }
    scripted-b: { count: 0 }
