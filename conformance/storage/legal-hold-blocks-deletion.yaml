        "01900000-0000-7000-8000-000000000a02": { schemaVersion: "0.1.0", tenant: t1, sessionId: "01900000-0000-7000-8000-000000000a02", version: 3, lastSeq: 6, state: closed, closeReason: completed, principalRef: { subject: "user-1", tenant: t1 }, persona: "assistant@1", profile: "default@1", snapshotHash: "sha256:5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed", turn: 1, step: 1, taint: { tainted: false, provenances: [] }, budget: { tokens: 99950 }, counters: { sessionSize: 64 } }
    idempotencyStore:
      t1:
        "01900000-0000-7000-8000-000000000a01/c1": { schemaVersion: "0.1.0", tenant: t1, key: "01900000-0000-7000-8000-000000000a01/c1", sessionId: "01900000-0000-7000-8000-000000000a01", callId: c1, tool: update_record, state: completed, outcome: { ok: { output: { updated: true } } }, createdAt: "2025-12-01T00:00:02Z", completedAt: "2025-12-01T00:00:03Z" }
        "01900000-0000-7000-8000-000000000a02/c1": { schemaVersion: "0.1.0", tenant: t1, key: "01900000-0000-7000-8000-000000000a02/c1", sessionId: "01900000-0000-7000-8000-000000000a02", callId: c1, tool: update_record, state: completed, outcome: { ok: { output: { updated: true } } }, createdAt: "2025-12-01T00:00:02Z", completedAt: "2025-12-01T00:00:03Z" }
    auditLog:
      t1:
        - { schemaVersion: "0.1.0", id: "01900000-0000-7000-8000-0000000f0101", timestamp: "2025-12-01T00:00:03Z", tenant: t1, sessionId: "01900000-0000-7000-8000-000000000a01", principalRef: { subject: "user-1", tenant: t1 }, snapshotHash: "sha256:5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed", type: tool_call, eventIds: ["01900000-0000-7000-8000-0000000e0103", "01900000-0000-7000-8000-0000000e0104"], details: { callId: c1, tool: update_record, arguments: { key: k1, value: v1 }, outcome: { ok: { output: { updated: true } } } } }
        - { schemaVersion: "0.1.0", id: "01900000-0000-7000-8000-0000000f0201", timestamp: "2025-12-01T00:00:03Z", tenant: t1, sessionId: "01900000-0000-7000-8000-000000000a02", principalRef: { subject: "user-1", tenant: t1 }, snapshotHash: "sha256:5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed5eed", type: tool_call, eventIds: ["01900000-0000-7000-8000-0000000e0203", "01900000-0000-7000-8000-0000000e0204"], details: { callId: c1, tool: update_record, arguments: { key: k1, value: v1 }, outcome: { ok: { output: { updated: true } } } } }
script:
  - action: run
    bind: $t1s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    expect: { ok: true, endReason: responded }
  - action: close
    session: $t1s
    expect: { ok: true }
  - action: run
    bind: $t2s
    tenant: t2
    principal: q1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v2" }]
    expect: { ok: true, endReason: responded }
  - action: close
    session: $t2s
    expect: { ok: true }
  - clock: { advance: P2D }
  - retention: {}
expect:
  stubCalls:
    update_record:
      - { context: { sessionId: $t1s, idempotencyKey: $k1 } }
      - { context: { sessionId: $t2s, idempotencyKey: $k2 } }
  ports:
    eventLog:
      t1:
        "01900000-0000-7000-8000-000000000a01":
          $all:
            - { $len: 6 }
            - $contains: [{ seq: 1, type: session.created }, { seq: 6, type: session.closed }]
        "01900000-0000-7000-8000-000000000a02": { $absent: true }
        $t1s: { $absent: true }
      t2:
        $t2s:
          $contains:
            - { seq: 1, type: session.created }
            - { type: session.closed }
    checkpointStore:
      t1:
        "01900000-0000-7000-8000-000000000a01": { state: closed, lastSeq: 6 }
        "01900000-0000-7000-8000-000000000a02": { $absent: true }
        $t1s: { $absent: true }
      t2:
        $t2s: { state: closed }
    idempotencyStore:
      t1:
        "01900000-0000-7000-8000-000000000a01/c1": { state: completed }
        "01900000-0000-7000-8000-000000000a02/c1": { $absent: true }
        $k1: { $absent: true }
      t2:
        $k2: { state: completed }
    auditLog:
      t1:
        $all:
          - $count: { of: { sessionId: "01900000-0000-7000-8000-000000000a01", type: tool_call }, equals: 1 }
          - $count: { of: { sessionId: "01900000-0000-7000-8000-000000000a02" }, equals: 0 }
          - $count: { of: { sessionId: $t1s }, equals: 0 }
      t2:
        $count: { of: { sessionId: $t2s, type: tool_call }, equals: 1 }
  providerRequests:
    scripted-a: { count: 4 }
