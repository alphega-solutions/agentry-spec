schemaVersion: "0.1.0"
id: storage.secrets-never-persisted
title: Resolved secret values reach no port and no outbound request, for principal-mode and service-mode bindings, two principals, and across a restart
description: >-
  The in-memory secrets provider serves synthetic values for four secret
  references: scripted-a's API key, the blob store binding's token,
  my_records' credential (`credentialMode: principal`, resolved for the
  session's principal, CFG-062, PORT-090), and update_team's credential
  (`credentialMode: service`, a mutating, non-idempotent tool, so its
  calls have idempotency records and `tool_call` audit records).

  Principals user-1 ($s1) and user-2 ($s2) each call my_records, then
  update_team, in their own session. The implementation is restarted
  (in-process state, including any cache, is lost) and $s1 calls
  my_records again, so the references are resolved again rather than read
  back from anywhere.

  No resolved value appears in any persisted event, checkpoint, audit
  record, blob or snapshot (PORT-091: values are never persisted), nor in
  any tool, hook or provider request the implementation sends
  (TOOL-011). Every call's tool context names its own session's principal
  (the principal a principal-mode credential is resolved for).

  Not asserted, for lack of a fixture form: that the idempotency store
  holds no resolved value (`noPersistedContent` does not name it), that
  each principal receives its own value for a principal-mode reference
  (`setup.secrets` holds one value per reference, and the value a binding
  receives is not recorded), and the cache's keying and lifetime.
requirements: [PORT-091]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false, credentials: { apiKey: "secret://test/provider-a-key" } }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region, credentials: { token: "secret://test/blob-token" } }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Tool
        id: my_records
        version: 1
        schemaVersion: "0.1.0"
        description: List the principal's own records.
        input: { type: object, additionalProperties: false, properties: {} }
        effect: read
        credentialMode: principal
        binding: { kind: native, handler: test.my_records, credentials: { apiKey: "secret://test/my-records-key" } }
      - kind: Tool
        id: update_team
        version: 1
        schemaVersion: "0.1.0"
        description: Update the team's record with a shared service credential.
        input:
          type: object
          additionalProperties: false
          required: [value]
          properties: { value: { type: string } }
        effect: mutating
        idempotent: false
        credentialMode: service
        binding: { kind: native, handler: test.update_team, credentials: { apiKey: "secret://test/team-key" } }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [my_records@1, update_team@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: p2, subject: user-2, assurance: multi_factor }
  providers:
    scripted-a:
      responses:
        # $s1, turn 1
        - parts: [{ type: tool_call, callId: c1, tool: my_records, arguments: {} }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: update_team, arguments: { value: from-user-1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done for user-1." }]
          usage: { inputTokens: 40, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
        # $s2, turn 1
        - parts: [{ type: tool_call, callId: c1, tool: my_records, arguments: {} }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: update_team, arguments: { value: from-user-2 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done for user-2." }]
          usage: { inputTokens: 40, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
        # $s1, turn 2, after the restart
        - parts: [{ type: tool_call, callId: c3, tool: my_records, arguments: {} }]
          usage: { inputTokens: 50, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Still yours." }]
          usage: { inputTokens: 60, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
  stubs:
    tools:
      my_records:
        - ok: { output: { records: ["u1-r1"] } }
        - ok: { output: { records: ["u2-r1"] } }
        - ok: { output: { records: ["u1-r1"] } }
      update_team:
        - ok: { output: { updated: true } }
        - ok: { output: { updated: true } }
  secrets:
    "secret://test/provider-a-key": "SYN-SECRET-PROVIDER-0091-DO-NOT-PERSIST"
    "secret://test/blob-token": "SYN-SECRET-BLOB-0091-DO-NOT-PERSIST"
    "secret://test/my-records-key": "SYN-SECRET-MYRECORDS-0091-DO-NOT-PERSIST"
    "secret://test/team-key": "SYN-SECRET-TEAM-0091-DO-NOT-PERSIST"
script:
  - action: run
    bind: $s1
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Show my records, then update the team" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $s2
    tenant: t1
    principal: p2
    persona: assistant@1
    input: [{ type: text, text: "Show my records, then update the team" }]
    expect: { ok: true, endReason: responded }
  - restart: {}
  - action: run
    session: $s1
    principal: p1
    input: [{ type: text, text: "Show them again" }]
    expect: { ok: true, endReason: responded }
expect:
  stubCalls:
    my_records:
      - { context: { sessionId: $s1, principal: { subject: user-1 } } }
      - { context: { sessionId: $s2, principal: { subject: user-2 } } }
      - { context: { sessionId: $s1, principal: { subject: user-1 } } }
    update_team:
      - { arguments: { value: from-user-1 }, context: { sessionId: $s1, principal: { subject: user-1 }, idempotencyKey: $k1 } }
      - { arguments: { value: from-user-2 }, context: { sessionId: $s2, principal: { subject: user-2 }, idempotencyKey: $k2 } }
  sessions:
    $s1:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.result, turn: 1, payload: { callId: c1, result: { ok: { output: { records: ["u1-r1"] } } } } }
          - { type: tool.result, turn: 1, payload: { callId: c2, result: { ok: { output: { updated: true } } } } }
          - { type: tool.result, turn: 2, payload: { callId: c3, result: { ok: { output: { records: ["u1-r1"] } } } } }
    $s2:
      state: idle
  ports:
    idempotencyStore:
      t1:
        $k1: { state: completed }
        $k2: { state: completed }
    auditLog:
      t1:
        $all:
          - $count: { of: { type: tool_call, sessionId: $s1, details: { callId: c2, tool: update_team } }, equals: 1 }
          - $count: { of: { type: tool_call, sessionId: $s2, details: { callId: c2, tool: update_team } }, equals: 1 }
  providerRequests:
    scripted-a: { count: 8 }
    scripted-b: { count: 0 }
  noPersistedContent:
    - "SYN-SECRET-PROVIDER-0091-DO-NOT-PERSIST"
    - "SYN-SECRET-BLOB-0091-DO-NOT-PERSIST"
    - "SYN-SECRET-MYRECORDS-0091-DO-NOT-PERSIST"
    - "SYN-SECRET-TEAM-0091-DO-NOT-PERSIST"
  noTransmittedContent:
    - "SYN-SECRET-PROVIDER-0091-DO-NOT-PERSIST"
    - "SYN-SECRET-BLOB-0091-DO-NOT-PERSIST"
    - "SYN-SECRET-MYRECORDS-0091-DO-NOT-PERSIST"
    - "SYN-SECRET-TEAM-0091-DO-NOT-PERSIST"
