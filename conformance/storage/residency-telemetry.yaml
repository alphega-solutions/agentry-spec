schemaVersion: "0.1.0"
id: storage.residency-telemetry
title: A telemetry exporter bound outside `dataResidency` is a configuration error; one inside it loads
description: >-
  org@1 sets `dataResidency: [test-region, test-region-2]`, and every
  storage port and the secrets provider are in test-region. The first load
  binds the optional telemetry exporter in `other-region` and is rejected
  with `configuration` (PORT-005: telemetry destinations declare their
  region and are checked like storage). The control binds it in
  `test-region-2`, loads, and a session runs. Requires the optional
  `telemetry` feature (PORT-100).
requirements: [PORT-005]
contract: ">=0.1.0 <1.0.0"
features: [telemetry]
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        dataResidency: [test-region, test-region-2]
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: text, text: "Exported in region." }]
          usage: { inputTokens: 20, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
script:
  - load:
      artifacts:
        - { kind: Deployment, id: test, version: 1, schemaVersion: "0.1.0", environment: test, policyBundles: [org@1], attachmentSources: [upload, email], providers: [{ id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }, { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }], ports: { eventLog: { adapter: memory, region: test-region }, checkpointStore: { adapter: memory, region: test-region }, idempotencyStore: { adapter: memory, region: test-region }, snapshotStore: { adapter: memory, region: test-region }, blobStore: { adapter: memory, region: test-region }, auditLog: { adapter: memory, region: test-region }, secrets: { adapter: memory, region: test-region }, telemetry: { adapter: memory, region: other-region } }, retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D } }
    expect: { ok: false, error: { category: configuration } }
  # Control: the exporter inside dataResidency.
  - load:
      artifacts:
        - { kind: Deployment, id: test, version: 1, schemaVersion: "0.1.0", environment: test, policyBundles: [org@1], attachmentSources: [upload, email], providers: [{ id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }, { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }], ports: { eventLog: { adapter: memory, region: test-region }, checkpointStore: { adapter: memory, region: test-region }, idempotencyStore: { adapter: memory, region: test-region }, snapshotStore: { adapter: memory, region: test-region }, blobStore: { adapter: memory, region: test-region }, auditLog: { adapter: memory, region: test-region }, secrets: { adapter: memory, region: test-region }, telemetry: { adapter: memory, region: test-region-2 } }, retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D } }
    expect: { ok: true }
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: run.ended, payload: { reason: responded } }
  providerRequests:
    scripted-a: { count: 1 }
