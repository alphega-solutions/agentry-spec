schemaVersion: "0.1.0"
id: storage.crash-after-append-rebuilt
title: After a crash between an event-log append and the checkpoint save, the session is rebuilt from the events beyond the checkpoint and nothing is lost or repeated
description: >-
  Turn 1 (run $r1) responds. During turn 2 (run $r2) the model asks for
  lookup c1 (a read tool), and the implementation is crashed at
  `after_event_append`: the append holding c1's `tool.call` is in the event
  log, the checkpoint is not saved after it, and c1 is not yet dispatched
  (TOOL-034: `tool.call` precedes dispatch). The implementation restarts
  and the clock is advanced exactly to the lease's expiry, so run $r2 is
  orphaned.

  The checkpoint does not account for c1, so only the events beyond its
  `lastSeq` tell the implementation that c1 is in flight (PORT-034). The
  next run() therefore recovers $r2 as for a read call with no recorded
  outcome (HITL-091 as amended 2026-11-01, step 2): c1 is dispatched once
  and its result is c1's only `tool.result`; $r2 continues to its step-2
  model request and responds, with no new `run.started`, no second
  `tool.call` for c1, no second model call for step 1 (the scripted
  provider is called exactly four times) and no `failed` run. Then the
  triggering run() runs its own run $r3. close() ends the session.

  Sequence numbers continue from the log, not the stale checkpoint: the
  log holds exactly $n events, numbered 1..$n, where $n is
  `session.closed`'s seq (CORE-160, PORT-020). At the end the checkpoint
  accounts only for sequence numbers in the log (PORT-035).
requirements: [PORT-034, PORT-035]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # turn 1 ($r1)
        - parts: [{ type: text, text: "Hello." }]
          usage: { inputTokens: 20, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        # turn 2 ($r2), step 1: crashed after the tool.call append
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # turn 2 ($r2), step 2, after recovery
        - parts: [{ type: text, text: "k1 is v1." }]
          usage: { inputTokens: 40, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
        # turn 3 ($r3)
        - parts: [{ type: text, text: "You're welcome." }]
          usage: { inputTokens: 50, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: v1 } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
  - crash: { at: after_event_append, session: $s }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Look up k1" }]
  - restart: {}
  # Exactly the lease expiry (00:00 + PT5M).
  - clock: { advance: PT5M }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Thanks" }]
    expect: { ok: true, endReason: responded }
  - action: close
    session: $s
    capture:
      - event: { type: session.closed }
        bind: { seq: $n }
    expect: { ok: true }
expect:
  sessions:
    $s:
      state: closed
      events:
        mode: subsequence
        items:
          - { seq: 1, type: session.created }
          - { type: run.ended, runId: $r1, turn: 1, payload: { reason: responded } }
          - { type: run.started, runId: { $all: [$r2, { $not: $r1 }] }, payload: { kind: run } }
          - { type: model.response, runId: $r2, turn: 2, step: 1 }
          - { type: tool.call, runId: $r2, turn: 2, step: 1, payload: { callId: c1, tool: lookup, arguments: { key: k1 } } }
          - { type: tool.result, runId: $r2, turn: 2, step: 1, payload: { callId: c1, result: { ok: { output: { value: v1 } } } } }
          - { type: model.request, runId: $r2, turn: 2, step: 2 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
          - { type: run.started, runId: { $all: [$r3, { $not: $r2 }] }, payload: { kind: run } }
          - { type: run.ended, runId: $r3, turn: 3, payload: { reason: responded } }
          - { seq: $n, type: session.closed }
      absentEvents:
        - { type: escalation.raised }
        - { type: run.ended, payload: { reason: failed } }
      checkpoint:
        lastSeq: $last
  ports:
    eventLog:
      t1:
        $s:
          $all:
            - { $len: $n }
            - $every:
                seq: { $all: [{ $gte: 1 }, { $lte: $n }] }
            - $contains: [{ seq: $last }]
            - $count: { of: { type: run.started }, equals: 3 }
            - $count: { of: { type: tool.call, payload: { callId: c1 } }, equals: 1 }
            - $count: { of: { type: tool.result, payload: { callId: c1 } }, equals: 1 }
            - $count: { of: { type: model.response, turn: 2, step: 1 }, equals: 1 }
  providerRequests:
    scripted-a:
      - {}
      - {}
      - messages:
          $contains:
            - role: assistant
              parts:
                $contains:
                  - { type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }
            - role: tool
              parts:
                $contains:
                  - { type: tool_result, callId: c1, result: { ok: { output: { value: v1 } } } }
      - {}
    scripted-b: { count: 0 }
  stubCalls:
    lookup:
      - { arguments: { key: k1 }, completed: true, context: { sessionId: $s, runId: $r2 } }
