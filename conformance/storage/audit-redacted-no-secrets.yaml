schemaVersion: "0.1.0"
id: storage.audit-redacted-no-secrets
title: Audit records apply the redaction of the sensitivity policies in force and hold no secret values, while the idempotency store keeps the raw outcome
description: >-
  The bundle's `pii` policy masks content. update_record (`approval:
  always`, `sensitivity: [pii]`, `credentialMode: service`) takes an API
  key through its binding; scripted-a and the audit log binding take
  credentials too. The bundle's native afterModelCall hook tagger labels
  the first response's only part, tool_call c1 to update_record with value
  SYN-PII-AUDIT-ARG-0074, `pii`, and answers `continue` on the second
  response. c1 escalates; reviewer r1 approves; c1 is dispatched and
  returns SYN-PII-AUDIT-OUT-0074 (labelled pii by the tool); the turn
  responds.

  The audit log holds the escalation, the decision (with its reviewer)
  and the mutating call's `tool_call` record (PORT-071, TOOL-074), and
  (PORT-074):

  - no `escalation` record carries the pending action's raw argument
    value (the event-redacted form, Area 6 amendment 2026-11-01);
  - no `tool_call` record carries the raw argument value or the raw
    output value;
  - no audit record, or anything else persisted, holds a resolved
    secret value.

  Controls (redaction at the boundary only, PORT-008): the tool received
  the raw arguments, and the idempotency store keeps the raw outcome
  (Area 4 amendment, TOOL-073). The pii values cannot be listed under
  noPersistedContent, since blobs and the idempotency store hold them.
requirements: [PORT-074]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false, credentials: { apiKey: "secret://test/provider-a-key" } }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region, credentials: { token: "secret://test/audit-token" } }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        requiredHooks: [tagger@1]
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
      - kind: Hook
        id: tagger
        version: 1
        schemaVersion: "0.1.0"
        points: [afterModelCall]
        results: [annotate]
        timeoutMs: 1000
        source: { kind: native, handler: test.hook.tagger }
      - kind: Tool
        id: update_record
        version: 1
        schemaVersion: "0.1.0"
        description: Update a record.
        input:
          type: object
          additionalProperties: false
          required: [key, value]
          properties: { key: { type: string }, value: { type: string } }
        effect: mutating
        idempotent: false
        approval: always
        sensitivity: [pii]
        credentialMode: service
        binding: { kind: native, handler: test.update_record, credentials: { apiKey: "secret://test/update-api-key" } }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: "SYN-PII-AUDIT-ARG-0074" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Updated." }]
          usage: { inputTokens: 30, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
  stubs:
    tools:
      update_record:
        - ok: { output: { previous: "SYN-PII-AUDIT-OUT-0074" } }
    nativeHooks:
      tagger:
        - result: annotate
          labels:
            - { part: 0, labels: [pii] }
        - result: continue
  secrets:
    "secret://test/provider-a-key": "SYN-SECRET-PROVIDER-0074-DO-NOT-AUDIT"
    "secret://test/update-api-key": "SYN-SECRET-UPDATE-0074-DO-NOT-AUDIT"
    "secret://test/audit-token": "SYN-SECRET-AUDITLOG-0074-DO-NOT-AUDIT"
  limits:
    inlinePayloadBytes: 65536
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $esc, payload.escalation.pendingActions.0.id: $act }
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000074", pendingActionId: $act, type: approve }
    expect: { ok: true, endReason: responded }
expect:
  stubCalls:
    update_record:
      - { arguments: { key: k1, value: "SYN-PII-AUDIT-ARG-0074" }, context: { sessionId: $s, idempotencyKey: $k } }
    tagger: { count: 2 }
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: escalation.raised, labels: { $contains: [pii] }, payload: { escalation: { id: $esc } } }
          - { type: tool.result, labels: { $contains: [pii] }, payload: { callId: c1 } }
          - { type: run.ended, payload: { reason: responded } }
  ports:
    auditLog:
      t1:
        $all:
          - $contains:
              - { type: escalation, sessionId: $s, details: { id: $esc } }
              - { type: decision, sessionId: $s, reviewer: { subject: reviewer-1, tenant: t1 }, details: { id: "01900000-0000-7000-8000-000000000074" } }
              - { type: tool_call, sessionId: $s, details: { callId: c1, tool: update_record } }
          - $count: { of: { type: escalation, details: { pendingActions: { $contains: [{ arguments: { value: "SYN-PII-AUDIT-ARG-0074" } }] } } }, equals: 0 }
          - $count: { of: { type: tool_call, details: { arguments: { value: "SYN-PII-AUDIT-ARG-0074" } } }, equals: 0 }
          - $count: { of: { type: tool_call, details: { outcome: { ok: { output: { previous: "SYN-PII-AUDIT-OUT-0074" } } } } }, equals: 0 }
    idempotencyStore:
      t1:
        $k: { state: completed, outcome: { ok: { output: { previous: "SYN-PII-AUDIT-OUT-0074" } } } }
  noPersistedContent:
    - "SYN-SECRET-PROVIDER-0074-DO-NOT-AUDIT"
    - "SYN-SECRET-UPDATE-0074-DO-NOT-AUDIT"
    - "SYN-SECRET-AUDITLOG-0074-DO-NOT-AUDIT"
