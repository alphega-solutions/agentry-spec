          usage: { inputTokens: 300, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: huge } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: shrink } }]
