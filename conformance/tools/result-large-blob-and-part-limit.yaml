schemaVersion: "0.1.0"
id: tool.result-large-blob-and-part-limit
title: After afterToolCall hooks, a result above the inline limit is passed as a blob reference; above `limits.partSize` it is replaced by a `limit` error
description: >-
  The inline limit is 256 bytes; a remote afterToolCall hook runs on every
  result. Session 1: lookup returns about 1 KiB, the hook continues, and
  the result is stored in the BlobStore and reaches the model and the event
  log as a blob reference, never inline. Session 2: the run request
  tightens limits.partSize to 2048 bytes and lookup returns about 3 KiB:
  the result is replaced by `limit` (`agentry.tool.result_too_large`), the
  oversized content is persisted nowhere (not even as a blob), and the run
  ends `context_limit` without a further model call, leaving the session
  idle (TOOL-072 as amended 2026-11-01). Session 3: lookup returns about 1 KiB
  but the hook rewrites it to a short value; size is judged after hooks, so
  the short result is passed inline and no blob holds the original.
requirements: [TOOL-072]
contract: ">=0.1.0 <1.0.0"
features: []
