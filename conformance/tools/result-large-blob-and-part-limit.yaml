script:
  - action: run
    bind: $s1
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up big" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $s2
    tenant: t1
    principal: p1
    persona: assistant@1
    overrides: { limits: { partSize: 2048 } }
    input: [{ type: text, text: "Look up huge" }]
    expect: { ok: true, endReason: context_limit }
  - action: run
    bind: $s3
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up shrink" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s1:
      events:
        mode: subsequence
        items:
          - type: tool.result
            payload:
              callId: c1
              result:
                ok:
                  blob: { id: $big, hash: { $regex: "^sha256:[0-9a-f]{64}$" }, mediaType: { $any: true }, size: { $gte: 257 } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.result, payload: { result: { ok: { output: { $any: true } } } } }
    $s2:
      state: idle
      events:
        mode: subsequence
        items:
          - type: tool.result
            payload:
              callId: c1
              result: { error: { category: limit, code: agentry.tool.result_too_large } }
          - { type: run.ended, payload: { reason: context_limit } }
      absentEvents:
        - { type: model.request, step: 2 }
        - { type: tool.result, payload: { result: { ok: { $any: true } } } }
    $s3:
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { text: "short" }, blob: { $absent: true } } } } }
          - { type: run.ended, payload: { reason: responded } }
  stubCalls:
    lookup: { count: 3 }
  providerRequests:
    scripted-a:
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                $contains:
                  - { type: tool_result, callId: c1, result: { ok: { blob: { id: $big }, output: { $absent: true } } } }
      - {}
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                $contains:
                  - { type: tool_result, callId: c1, result: { ok: { output: { text: "short" } } } }
  ports:
    blobStore:
      t1:
        $contains:
          - { id: $big }
  noPersistedContent:
    - "SYN-OVERSIZE-0072"
    - "SYN-PRESHRINK-0072"
