schemaVersion: "0.1.0"
id: tool.exec-retries-exhausted-fails
title: When retries of a retryable error are exhausted, the error is treated as `fatal` and the run ends `failed`
description: >-
  The profile allows two retries of `unavailable`. The read tool lookup
  fails with a retryable `unavailable` error on the first attempt and on
  both retries. A fourth, successful behaviour is scripted but must never be
  consumed: the stub is dispatched exactly three times. The run then ends
  `failed`, no further model call is made, and the session closes `failed`.
requirements: [TOOL-053]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - error: { category: unavailable, code: test.backend.busy, retryable: true, message: "Backend busy." }
        - error: { category: unavailable, code: test.backend.busy, retryable: true, message: "Backend busy." }
        - error: { category: unavailable, code: test.backend.busy, retryable: true, message: "Backend busy." }
        - ok: { output: { value: "synthetic-value" } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: failed }
expect:
  sessions:
    $s:
      state: closed
      closeReason: failed
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1, result: { error: { $any: true } } } }
          - { type: run.ended, payload: { reason: failed } }
          - { type: session.closed, payload: { reason: failed } }
      absentEvents:
        - { type: model.request, step: 2 }
        - { type: tool.result, payload: { result: { ok: { $any: true } } } }
  stubCalls:
    lookup: { count: 3 }
  providerRequests:
    scripted-a: { count: 1 }
