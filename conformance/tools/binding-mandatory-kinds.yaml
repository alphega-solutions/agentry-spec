schemaVersion: "0.1.0"
id: tool.binding-mandatory-kinds
title: An implementation supports native, mcp, http and agent bindings
description: >-
  One persona has a tool of each mandatory binding kind. The model calls
  each in turn and each is dispatched through its binding: the native stub,
  the `get_note` tool on the `notes-mcp` server stub, the `getRecord`
  operation on the `records-api` endpoint stub, and a nested session of the
  `helper` persona, whose single scripted response becomes the agent tool's
  result. The fixture declares no feature, so every implementation must pass
  it; `langchain` is optional and not exercised.

  Assumed runner conventions (not yet fixed by the fixture format): an MCP
  server stub lists advertised tools under `tools`, each with `input` and a
  `behaviours` list consumed in order; an HTTP endpoint stub is keyed by the
  deployment's endpoint ID and holds a list of behaviours; stub calls are
  recorded under the server or endpoint ID.
requirements: [TOOL-013]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        mcpServers:
          - { id: notes-mcp, endpoint: "memory://notes-mcp", identity: notes-mcp.test, region: test-region }
        httpEndpoints:
          - id: records-api
            endpoint: "memory://records-api"
            region: test-region
            operations:
              getRecord: { method: GET, path: "/records/{key}" }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Tool
        id: get_note
        version: 1
        schemaVersion: "0.1.0"
        description: Get a note from the notes server.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        binding: { kind: mcp, server: notes-mcp, tool: get_note }
      - kind: Tool
        id: get_record
        version: 1
        schemaVersion: "0.1.0"
        description: Get a record from the records API.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        binding: { kind: http, endpoint: records-api, operation: getRecord }
      - kind: Tool
        id: ask_helper
        version: 1
        schemaVersion: "0.1.0"
        description: Ask the helper persona a question.
        input:
          type: object
          additionalProperties: false
          required: [question]
          properties: { question: { type: string } }
        effect: read
        binding: { kind: agent, persona: helper@1 }
      - kind: Persona
        id: helper
        version: 1
        schemaVersion: "0.1.0"
        displayName: Helper
        instructions: "You are a helper."
        tools: [lookup@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, get_note@1, get_record@1, ask_helper@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: get_note, arguments: { key: n1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c3, tool: get_record, arguments: { key: r1 } }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c4, tool: ask_helper, arguments: { question: "What is r1?" } }]
          usage: { inputTokens: 50, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # nested helper session
        - parts: [{ type: text, text: "Synthetic helper answer." }]
          usage: { inputTokens: 20, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "All four answered." }]
          usage: { inputTokens: 60, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "native value" } }
    mcpServers:
      notes-mcp:
        tools:
          get_note:
            input:
              type: object
              required: [key]
              properties: { key: { type: string } }
            behaviours:
              - ok: { output: { note: "mcp value" } }
    httpEndpoints:
      records-api:
        - ok: { output: { record: "http value" } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Use every tool" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: lookup } }
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { value: "native value" } } } } }
          - { type: tool.call, payload: { callId: c2, tool: get_note } }
          - { type: tool.result, payload: { callId: c2, result: { ok: { output: { note: "mcp value" } } } } }
          - { type: tool.call, payload: { callId: c3, tool: get_record } }
          - { type: tool.result, payload: { callId: c3, result: { ok: { output: { record: "http value" } } } } }
          - { type: tool.call, payload: { callId: c4, tool: ask_helper, childSessionId: { $any: true } } }
          - { type: tool.result, payload: { callId: c4, result: { ok: { $any: true } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.result, payload: { result: { error: { $any: true } } } }
  stubCalls:
    lookup: { count: 1 }
    notes-mcp: { count: 1 }
    records-api: { count: 1 }
  providerRequests:
    scripted-a: { count: 6 }
