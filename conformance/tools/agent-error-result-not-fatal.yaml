schemaVersion: "0.1.0"
id: tool.agent-error-result-not-fatal
title: A delegation error result is delivered to the parent model and does not end the parent run
description: >-
  The child persona's only tool fails with category `fatal`, so the child
  run ends `failed`. The parent receives ask_helper's result as
  `unavailable`, `retryable: false` (`agentry.delegation.failed`). A
  non-retryable tool error is delivered to the model as the call's result
  (TOOL-053 as amended 2026-11-01, which amends CORE-191's `unavailable`
  row for tool errors), and a delegation error never ends the parent run by
  itself (ORCH-051): the parent model receives the error and the parent run
  responds, leaving the parent session idle.
requirements: [TOOL-053, ORCH-050, ORCH-051]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Persona
        id: helper
        version: 1
        schemaVersion: "0.1.0"
        instructions: "You look things up."
        tools: [lookup@1]
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Tool
        id: ask_helper
        version: 1
        schemaVersion: "0.1.0"
        description: Ask the helper persona to look something up.
        input: { type: object, additionalProperties: false, required: [task], properties: { task: { type: string } } }
        effect: read
        binding: { kind: agent, persona: helper@1 }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, ask_helper@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # parent, step 1
        - parts: [{ type: tool_call, callId: c1, tool: ask_helper, arguments: { task: "Find record a" } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # child, step 1
        - parts: [{ type: tool_call, callId: h1, tool: lookup, arguments: { key: a } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # parent, step 2
        - parts: [{ type: text, text: "The helper failed; please try later." }]
          usage: { inputTokens: 30, outputTokens: 8, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - error: { category: fatal, code: test.lookup.broken, retryable: false, message: "Lookup is broken." }
      update_record: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Ask the helper to find record a" }]
    capture:
      - event: { type: tool.call, payload: { tool: ask_helper } }
        bind: { payload.childSessionId: $child }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - type: tool.result
            payload:
              callId: c1
              tool: ask_helper
              result: { error: { category: unavailable, code: agentry.delegation.failed, retryable: false } }
          - { type: model.request, step: 2 }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: run.ended, payload: { reason: failed } }
    $child:
      state: closed
      closeReason: failed
      events:
        mode: subsequence
        items:
          - { type: run.ended, payload: { reason: failed } }
  providerRequests:
    scripted-a:
      - {}
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                $contains:
                  - { type: tool_result, callId: c1, result: { error: { category: unavailable, code: agentry.delegation.failed } } }
