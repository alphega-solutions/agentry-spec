schemaVersion: "0.1.0"
id: tool.exec-cancel-records-mutating-outcome
title: Cancelling a run signals in-flight mutating calls; an outcome the call produces is recorded, and a call stopped by cancellation is never recorded as completed
description: >-
  update_record takes 5 s on the virtual clock. In each session, cancel()
  starts once the run's tool.call for c1 has been persisted, so the call is
  in flight, and the stub records that it received the cancellation signal.

  - $sStopped: the stub honours cancellation and stops without a result
    (`completed: false`), so the call has no outcome. Its started record
    stays without an outcome (`state: started`): nothing claims the call
    completed, so a later recovery of such a call would escalate rather
    than assume an outcome (TOOL-062, HITL-091 step 4). The call still has
    exactly one tool.result (TOOL-034), which is not an `ok` result, before
    run.ended (`cancelled`).
  - $sCompleted: the stub ignores cancellation and completes after its
    delay (`completed: true`), so the call has an outcome. TOOL-080 and
    CORE-072 require it to be recorded before the run ends: its tool.result
    is persisted before run.ended (`cancelled`), and the same result is the
    outcome recorded in the tenant's idempotency store under the call's
    idempotency key (`state: completed`).
requirements: [TOOL-080]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k2, value: v2 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - { ok: { output: { updated: true, key: k1 } }, delayMs: 5000 }
        - { ok: { output: { updated: true, key: k2 } }, delayMs: 5000, ignoreCancel: true }
script:
  - concurrently:
      - action: run
        bind: $sStopped
        tenant: t1
        principal: p1
        persona: assistant@1
        input: [{ type: text, text: "Set k1 to v1" }]
        expect: { ok: true, endReason: cancelled }
      - action: cancel
        session: $sStopped
        startAfter: { type: tool.call, payload: { callId: c1 } }
        expect: { ok: true }
  - concurrently:
      - action: run
        bind: $sCompleted
        tenant: t1
        principal: p1
        persona: assistant@1
        input: [{ type: text, text: "Set k2 to v2" }]
        expect: { ok: true, endReason: cancelled }
      - action: cancel
        session: $sCompleted
        startAfter: { type: tool.call, payload: { callId: c1 } }
        expect: { ok: true }
expect:
  sessions:
    $sStopped:
      state: closed
      closeReason: cancelled
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: update_record } }
          - { type: tool.result, payload: { callId: c1, tool: update_record, result: { ok: { $absent: true } } } }
          - { type: run.ended, payload: { reason: cancelled } }
      absentEvents:
        - { type: model.request, step: 2 }
        - { type: tool.result, payload: { result: { ok: { $any: true } } } }
    $sCompleted:
      state: closed
      closeReason: cancelled
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: update_record } }
          - { type: tool.result, payload: { callId: c1, tool: update_record, result: { $all: [$res, { ok: { output: { updated: true, key: k2 } } }] } } }
          - { type: run.ended, payload: { reason: cancelled } }
      absentEvents:
        - { type: model.request, step: 2 }
  stubCalls:
    update_record:
      - { arguments: { key: k1, value: v1 }, cancelled: true, completed: false, context: { sessionId: $sStopped, idempotencyKey: $kStopped } }
      - { arguments: { key: k2, value: v2 }, cancelled: true, completed: true, context: { sessionId: $sCompleted, idempotencyKey: $kCompleted } }
  ports:
    eventLog:
      t1:
        $sStopped:
          $count: { of: { type: tool.result, payload: { callId: c1 } }, equals: 1 }
    idempotencyStore:
      t1:
        $kStopped: { state: started, outcome: { $absent: true } }
        $kCompleted: { state: completed, outcome: $res }
