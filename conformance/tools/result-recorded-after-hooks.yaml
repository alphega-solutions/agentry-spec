schemaVersion: "0.1.0"
id: tool.result-recorded-after-hooks
title: Events and blobs record a tool result as it stands after `afterToolCall` hooks; a withheld result is recorded only as its `policy` error
description: >-
  A remote afterToolCall hook may rewrite or block. Session 1: lookup
  returns a value holding a synthetic marker; the hook rewrites the result
  to a redacted value. The tool.result event and the model both carry the
  rewritten result, keeping provenance tool:lookup; the raw value is
  persisted nowhere (events, checkpoints, blobs, audit). Session 2: the
  hook blocks the result; the tool.result event records only the `policy`
  error, and the raw value is persisted nowhere.
requirements: [TOOL-073]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        remoteHooks:
          - { id: redactor, endpoint: "memory://hook-redactor", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Hook
        id: redactor
        version: 1
        schemaVersion: "0.1.0"
        points: [afterToolCall]
        results: [rewrite, block]
        purpose: guardrail
        failureMode: failClosed
        timeoutMs: 1000
        source: { kind: remote, endpoint: redactor }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [redactor@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "The value is redacted." }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k2 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "That result was withheld." }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "SYN-RAW-RESULT-0073-A" } }
        - ok: { output: { value: "SYN-RAW-RESULT-0073-B" } }
    remoteHooks:
      redactor:
        - result: rewrite
          parts:
            - { type: tool_result, callId: c1, tool: lookup, result: { ok: { output: { value: "[redacted]" } } } }
        - result: block
          reasonCode: test.redactor.withheld
script:
  - action: run
    bind: $s1
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $s2
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k2" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s1:
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: redactor@1, point: afterToolCall, result: rewrite } }
          - { type: tool.result, provenances: ["tool:lookup"], payload: { callId: c1, result: { ok: { output: { value: "[redacted]" } } } } }
          - { type: run.ended, payload: { reason: responded } }
    $s2:
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: redactor@1, point: afterToolCall, result: block } }
          - { type: tool.result, payload: { callId: c1, result: { error: { category: policy } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.result, payload: { result: { ok: { $any: true } } } }
  stubCalls:
    lookup: { count: 2 }
  providerRequests:
    scripted-a:
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                $contains:
                  - { type: tool_result, callId: c1, provenance: "tool:lookup", result: { ok: { output: { value: "[redacted]" } } } }
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                $contains:
                  - { type: tool_result, callId: c1, result: { error: { category: policy } } }
  noPersistedContent:
    - "SYN-RAW-RESULT-0073-A"
    - "SYN-RAW-RESULT-0073-B"
