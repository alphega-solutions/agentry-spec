schemaVersion: "0.1.0"
id: tool.binding-credentials-secret-refs
title: Binding credentials come only from secret references and never enter model context or events
description: >-
  A binding whose `credentials` entry is a literal value is rejected at load
  time. With references, the native, MCP and HTTP bindings below each take a
  credential resolved by the in-memory secrets provider. The calls succeed,
  and none of the resolved values appears in anything persisted — events,
  the assembled model context stored for each `model.request` (CORE-154),
  checkpoints, audit records, blobs or snapshots — and the tool definitions
  sent to the model carry no binding or credential fields.

  Traces (the optional telemetry exporter) cannot be inspected by the
  current fixture format; that part of TOOL-011 is not asserted here.
requirements: [TOOL-011]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        mcpServers:
          - { id: notes-mcp, endpoint: "memory://notes-mcp", identity: notes-mcp.test, region: test-region }
        httpEndpoints:
          - id: records-api
            endpoint: "memory://records-api"
            region: test-region
            operations:
              getRecord: { method: GET, path: "/records/{key}" }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Tool
        id: lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        credentialMode: service
        binding: { kind: native, handler: test.lookup, credentials: { apiKey: "secret://test/native-key" } }
      - kind: Tool
        id: get_note
        version: 1
        schemaVersion: "0.1.0"
        description: Get a note from the notes server.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        credentialMode: service
        binding: { kind: mcp, server: notes-mcp, tool: get_note, credentials: { token: "secret://test/mcp-token" } }
      - kind: Tool
        id: get_record
        version: 1
        schemaVersion: "0.1.0"
        description: Get a record from the records API.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        credentialMode: service
        binding: { kind: http, endpoint: records-api, operation: getRecord, credentials: { apiKey: "secret://test/http-key" } }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, get_note@1, get_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: get_note, arguments: { key: n1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c3, tool: get_record, arguments: { key: r1 } }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Done." }]
          usage: { inputTokens: 50, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "native value" } }
    mcpServers:
      notes-mcp:
        tools:
          get_note:
            input:
              type: object
              required: [key]
              properties: { key: { type: string } }
            behaviours:
              - ok: { output: { note: "mcp value" } }
    httpEndpoints:
      records-api:
        - ok: { output: { record: "http value" } }
  secrets:
    "secret://test/native-key": "SYN-SECRET-NATIVE-0011-DO-NOT-PERSIST"
    "secret://test/mcp-token": "SYN-SECRET-MCP-0011-DO-NOT-PERSIST"
    "secret://test/http-key": "SYN-SECRET-HTTP-0011-DO-NOT-PERSIST"
script:
  - load:
      artifacts:
        - kind: Tool
          id: lookup
          version: 1
          schemaVersion: "0.1.0"
          description: Look up a record by key.
          input:
            type: object
            additionalProperties: false
            required: [key]
            properties: { key: { type: string } }
          effect: read
          credentialMode: service
          binding: { kind: native, handler: test.lookup, credentials: { apiKey: "SYN-LITERAL-CREDENTIAL-0011" } }
    expect: { ok: false, error: { category: configuration, details: { artifact: lookup@1 } } }
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1, n1 and r1" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { value: "native value" } } } } }
          - { type: tool.result, payload: { callId: c2, result: { ok: { output: { note: "mcp value" } } } } }
          - { type: tool.result, payload: { callId: c3, result: { ok: { output: { record: "http value" } } } } }
          - { type: run.ended, payload: { reason: responded } }
  stubCalls:
    lookup: { count: 1 }
    notes-mcp: { count: 1 }
    records-api: { count: 1 }
  providerRequests:
    scripted-a:
      - tools: { $every: { binding: { $absent: true }, credentials: { $absent: true } } }
      - tools: { $every: { binding: { $absent: true }, credentials: { $absent: true } } }
      - tools: { $every: { binding: { $absent: true }, credentials: { $absent: true } } }
      - tools: { $every: { binding: { $absent: true }, credentials: { $absent: true } } }
  noPersistedContent:
    - "SYN-SECRET-NATIVE-0011-DO-NOT-PERSIST"
    - "SYN-SECRET-MCP-0011-DO-NOT-PERSIST"
    - "SYN-SECRET-HTTP-0011-DO-NOT-PERSIST"
    - "SYN-LITERAL-CREDENTIAL-0011"
