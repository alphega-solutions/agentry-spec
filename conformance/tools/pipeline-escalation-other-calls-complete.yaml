schemaVersion: "0.1.0"
id: tool.pipeline-escalation-other-calls-complete
title: When one parallel call escalates, the others complete and are recorded; all results reach the model together after the decision, with no governance re-run
description: >-
  One model response requests c1 update_record, c2 set_status
  (`approval: always`) and c3 update_record. A remote beforeToolCall hook
  that continues is required for every call.

  In the first run, c2 escalates at stage 7 while c1 and c3 are still
  dispatched and their results recorded; the run ends `escalated` with no
  further model request. The implementation then restarts (in-process state
  is lost). On resume with c2 approved, the step continues: c1 and c3 have
  recorded outcomes (stage 3), so they are neither dispatched again (the
  update_record stub holds a third behaviour a re-dispatch would consume)
  nor governed again (the hook stub is called exactly three times in all,
  once per call). c2 is dispatched, and the next model request carries the
  results of c1, c2 and c3 together, in request order, in one tool message
  (assumed message shape, as in tool.pipeline-parallel-independent).
requirements: [TOOL-033, TOOL-030]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        remoteHooks:
          - { id: pre, endpoint: "memory://hook-pre", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Hook
        id: pre
        version: 1
        schemaVersion: "0.1.0"
        points: [beforeToolCall]
        results: [block]
        timeoutMs: 1000
        source: { kind: remote, endpoint: pre }
      - kind: Tool
        id: set_status
        version: 1
        schemaVersion: "0.1.0"
        description: Set a record's status.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: mutating
        approval: always
        binding: { kind: native, handler: test.set_status }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, set_status@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [pre@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      capabilities: { parallelToolCalls: true }
      responses:
        - parts:
            - { type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }
            - { type: tool_call, callId: c2, tool: set_status, arguments: { key: k2 } }
            - { type: tool_call, callId: c3, tool: update_record, arguments: { key: k3, value: v3 } }
          usage: { inputTokens: 20, outputTokens: 15, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "All three done." }]
          usage: { inputTokens: 60, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - ok: { output: { updated: true, attempt: "first" } }
        - ok: { output: { updated: true, attempt: "first" } }
        - ok: { output: { updated: true, attempt: "redispatched" } }
      set_status:
        - ok: { output: { status: set } }
    remoteHooks:
      pre:
        - { result: continue }
        - { result: continue }
        - { result: continue }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Update k1 and k3 and set the status of k2" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $esc, payload.escalation.pendingActions.0.id: $act }
    expect: { ok: true, endReason: escalated }
  - restart: {}
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000001", pendingActionId: $act, type: approve }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: contains
        items:
          - { type: tool.call, runId: $r1, step: 1, payload: { callId: c1 } }
          - { type: tool.result, runId: $r1, step: 1, payload: { callId: c1, result: { ok: { output: { attempt: "first" } } } } }
          - { type: tool.call, runId: $r1, step: 1, payload: { callId: c3 } }
          - { type: tool.result, runId: $r1, step: 1, payload: { callId: c3, result: { ok: { output: { attempt: "first" } } } } }
          - { type: escalation.raised, runId: $r1, payload: { escalation: { sources: [approval], pendingActions: [{ callId: c2, tool: set_status }] } } }
          - { type: run.ended, runId: $r1, payload: { reason: escalated } }
          - { type: tool.call, runId: $r2, step: 1, payload: { callId: c2 } }
          - { type: tool.result, runId: $r2, step: 1, payload: { callId: c2, result: { ok: { output: { status: set } } } } }
          - { type: model.request, runId: $r2, step: 2 }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: model.request, runId: $r1, step: 2 }
        - { type: tool.call, runId: $r1, payload: { callId: c2 } }
        - { type: tool.call, runId: $r2, payload: { callId: c1 } }
        - { type: tool.call, runId: $r2, payload: { callId: c3 } }
        - { type: tool.result, runId: $r2, payload: { callId: c1 } }
        - { type: tool.result, runId: $r2, payload: { callId: c3 } }
        - { type: tool.result, payload: { result: { ok: { output: { attempt: "redispatched" } } } } }
  stubCalls:
    update_record: { $all: [{ $len: 2 }, { $contains: [{ arguments: { key: k1, value: v1 } }, { arguments: { key: k3, value: v3 } }] }] }
    set_status: [{ arguments: { key: k2 } }]
    pre: { count: 3 }
  providerRequests:
    scripted-a:
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                - { type: tool_result, callId: c1, result: { ok: { output: { attempt: "first" } } } }
                - { type: tool_result, callId: c2, result: { ok: { output: { status: set } } } }
                - { type: tool_result, callId: c3, result: { ok: { output: { attempt: "first" } } } }
