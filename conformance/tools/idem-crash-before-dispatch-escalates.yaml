schemaVersion: "0.1.0"
id: tool.idem-crash-before-dispatch-escalates
title: A crash after the started record of a non-idempotent call leads to a `recovery` escalation, never a dispatch
description: >-
  The first run responds. The implementation is then crashed at
  `after_started_record` during the second run, whose model response
  requests update_record (mutating, not idempotent): the started record has
  been written but the call has not been dispatched. Reaching the crash
  point shows the started record is written before dispatch (TOOL-060).
  After a restart and a clock advance past any run lease, resume() on the
  session first performs recovery (HITL-092): the call has a started record
  and no outcome, so it is not dispatched; a `recovery` escalation is raised
  and the orphaned run ends `escalated`. Because the escalation's action is
  undecided, that resume() itself is refused with `conflict` (HITL-070). A
  reviewer then confirms the call as succeeded; the stated outcome is
  delivered to the model and recorded, the turn continues to `responded`,
  and the stub is never called.
requirements: [TOOL-060, TOOL-062]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: text, text: "Hello." }]
          usage: { inputTokens: 20, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Updated." }]
          usage: { inputTokens: 40, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - ok: { output: { updated: true, source: "stub" } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
  - crash: { at: after_started_record, session: $s }
  - action: run
    session: $s
    principal: p1
    input: [{ type: text, text: "Set k1 to v1" }]
  - restart: {}
  - clock: { advance: PT1H }
  - action: resume
    session: $s
    reviewer: r1
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $esc, payload.escalation.pendingActions.0.id: $act }
    expect: { ok: false, error: { category: conflict } }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - decisionId: "01900000-0000-7000-8000-000000000001"
        escalationId: $esc
        actionId: $act
        type: confirm
        outcome: succeeded
        output: { updated: true, source: "reviewer" }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: run.started, runId: $r2, payload: { kind: run } }
          - { type: turn.started, runId: $r2, turn: 2 }
          - type: escalation.raised
            payload:
              escalation:
                id: $esc
                sources: [recovery]
                pendingActions:
                  - { id: $act, kind: recovery, source: recovery, tool: update_record, allowedDecisions: [confirm] }
          - { type: run.ended, runId: $r2, payload: { reason: escalated } }
          - { type: escalation.resolved, payload: { escalationId: $esc } }
          - { type: tool.result, turn: 2, payload: { callId: c1, tool: update_record, result: { ok: { output: { updated: true, source: "reviewer" } } } } }
          - { type: model.request, turn: 2, step: 2 }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.result, payload: { result: { ok: { output: { source: "stub" } } } } }
  stubCalls:
    update_record: { count: 0 }
  providerRequests:
    scripted-a: { count: 3 }
