schemaVersion: "0.1.0"
id: tool.pipeline-approved-dispatched-unchanged
title: An approved call resumes after the approval stage and is dispatched with exactly the arguments the reviewer approved
description: >-
  The session is tainted by an untrusted lookup result. `set_status` is
  mutating with `onTainted: allow` and `approval: always`. A remote
  beforeToolCall hook rewrites the model's arguments (note `raw` → `clean`)
  before the approval stage, so the escalation is for the rewritten
  arguments. On approval, processing resumes at stage 8: the taint rule and
  the hook are not evaluated again (one taint decision, one hook call in
  all), and the call is dispatched once with the approved arguments.
requirements: [TOOL-036]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        remoteHooks:
          - { id: pre, endpoint: "memory://hook-pre", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Hook
        id: pre
        version: 1
        schemaVersion: "0.1.0"
        points: [beforeToolCall]
        results: [rewrite]
        timeoutMs: 1000
        match: "tool.id == 'set_status'"
        source: { kind: remote, endpoint: pre }
      - kind: Tool
        id: set_status
        version: 1
        schemaVersion: "0.1.0"
        description: Set a record's status.
        input:
          type: object
          additionalProperties: false
          required: [key, note]
          properties: { key: { type: string }, note: { type: string } }
        effect: mutating
        onTainted: allow
        approval: always
        binding: { kind: native, handler: test.set_status }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, set_status@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [pre@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: set_status, arguments: { key: k1, note: raw } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Status set." }]
          usage: { inputTokens: 40, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "synthetic untrusted value" } }
      set_status:
        - ok: { output: { status: set } }
    remoteHooks:
      pre:
        - result: rewrite
          parts: [{ type: tool_call, callId: c2, tool: set_status, arguments: { key: k1, note: clean } }]
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1 then set its status" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.id: $esc, payload.escalation.pendingActions.0.id: $act }
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $s
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000001", pendingActionId: $act, type: approve }
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: policy.decision, runId: $r1, payload: { kind: taint, outcome: allow, callId: c2 } }
          - { type: hook.decision, runId: $r1, payload: { hook: pre@1, point: beforeToolCall, result: rewrite } }
          - { type: escalation.raised, runId: $r1, payload: { escalation: { sources: [approval], pendingActions: [{ callId: c2, tool: set_status }] } } }
          - { type: run.ended, runId: $r1, payload: { reason: escalated } }
          - { type: tool.call, runId: $r2, payload: { callId: c2, arguments: { key: k1, note: clean } } }
          - { type: tool.result, runId: $r2, payload: { callId: c2, result: { ok: { output: { status: set } } } } }
          - { type: run.ended, runId: $r2, payload: { reason: responded } }
      absentEvents:
        - { type: policy.decision, runId: $r2 }
        - { type: hook.decision, runId: $r2 }
        - { type: escalation.raised, runId: $r2 }
  stubCalls:
    pre: { count: 1 }
    set_status: [{ arguments: { key: k1, note: clean } }]
