schemaVersion: "0.1.0"
id: tool.binding-credential-per-principal
title: A principal-mode binding's secret reference is resolved for each session's own principal, and the resolved values never leave the binding
description: >-
  `my_records` uses `credentialMode: principal`, and its binding takes one
  credential, `secret://test/records-token`. The in-memory secrets provider
  resolves that reference per principal (`byPrincipal`): p1 and p2 each have
  their own synthetic value, and p3 has none (and there is no `default`), so
  resolving it for p3 gives `not_found`. Each principal calls `my_records`
  once in their own session.

  - $s1 (p1) and $s2 (p2): the reference is resolved at bind time for the
    session's principal (CFG-062; PORT-090, `resolve(tenant, reference,
    principal)`), so each call's stub record names the credential it
    received as the same reference with that session's principal's
    subject, user-1 and user-2 respectively, never the other's (TOOL-012). Each call's tool context
    names the same principal.
  - $s3 (p3): no credential exists for p3. A principal-mode binding must
    obtain credentials for the session's own principal (TOOL-012), so the
    call is never made with another principal's credential, or without
    one: the stub is called only twice in all, and $s3's call still
    produces its one `tool.result` (TOOL-034): `unauthorized`,
    `agentry.tool.credential_unavailable`, not retryable, delivered to the
    model (Area 4 reading settled with the coverage fixtures, 2026-11-14).

  Neither resolved value appears in anything persisted (PORT-091, CFG-063)
  or in anything sent out: stub-call records hold the reference, never the
  value, and the provider requests never carry it.
requirements: [TOOL-012, CFG-062, PORT-090]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: my_records
        version: 1
        schemaVersion: "0.1.0"
        description: List the principal's own records.
        input: { type: object, additionalProperties: false, properties: {} }
        effect: read
        credentialMode: principal
        binding: { kind: native, handler: test.my_records, credentials: { token: "secret://test/records-token" } }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [my_records@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: p2, subject: user-2, assurance: multi_factor }
        - { id: p3, subject: user-3, assurance: multi_factor }
  providers:
    scripted-a:
      responses:
        # $s1 (p1)
        - parts: [{ type: tool_call, callId: c1, tool: my_records, arguments: {} }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Here are your records." }]
          usage: { inputTokens: 30, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
        # $s2 (p2)
        - parts: [{ type: tool_call, callId: c1, tool: my_records, arguments: {} }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Here are your records." }]
          usage: { inputTokens: 30, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
        # $s3 (p3); the second response is used only if the run continues after the failed call.
        - parts: [{ type: tool_call, callId: c1, tool: my_records, arguments: {} }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Your records are unavailable." }]
          usage: { inputTokens: 30, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
  stubs:
    tools:
      my_records:
        - ok: { output: { records: ["u1-r1"] } }
        - ok: { output: { records: ["u2-r1"] } }
  secrets:
    "secret://test/records-token":
      byPrincipal:
        p1: "SYN-SECRET-P1-0012-DO-NOT-PERSIST"
        p2: "SYN-SECRET-P2-0012-DO-NOT-PERSIST"
script:
  - action: run
    bind: $s1
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Show my records" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $s2
    tenant: t1
    principal: p2
    persona: assistant@1
    input: [{ type: text, text: "Show my records" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $s3
    tenant: t1
    principal: p3
    persona: assistant@1
    input: [{ type: text, text: "Show my records" }]
    expect: { ok: true }
expect:
  sessions:
    $s1:
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { records: ["u1-r1"] } } } } }
    $s2:
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { records: ["u2-r1"] } } } } }
    $s3:
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1, result: { error: { category: unauthorized, code: agentry.tool.credential_unavailable, retryable: false } } } }
      absentEvents:
        - { type: tool.result, payload: { result: { ok: { $any: true } } } }
  stubCalls:
    my_records:
      - context: { sessionId: $s1, principal: { subject: user-1 } }
        credential: { reference: "secret://test/records-token", principal: user-1 }
      - context: { sessionId: $s2, principal: { subject: user-2 } }
        credential: { reference: "secret://test/records-token", principal: user-2 }
  noPersistedContent:
    - "SYN-SECRET-P1-0012-DO-NOT-PERSIST"
    - "SYN-SECRET-P2-0012-DO-NOT-PERSIST"
  noTransmittedContent:
    - "SYN-SECRET-P1-0012-DO-NOT-PERSIST"
    - "SYN-SECRET-P2-0012-DO-NOT-PERSIST"
