schemaVersion: "0.1.0"
id: tool.result-reported-labels
title: Labels a tool result reports add to the tool's declared labels and then govern the session; a reported label without a sensitivity policy is invalid output
description: >-
  `recall` is a native read tool that declares no labels, standing for a
  host-provided memory or record store whose records vary in sensitivity.
  `records` declares `phi`. Neither is trusted, so each result taints the
  session. `send_note` is a read tool with `egress: true` and the default
  `onTaintedEgress` (block). The baseline bundle has sensitivity policies
  for `pii` and `phi` only.

  - $sReported: recall's `ok` result reports `labels: [pii]`, so the
    result carries [pii] (TOOL-071 as amended 2026-11-14): on its
    tool.result event and on the tool_result part the model receives. The
    session is tainted and its label set holds pii (HOOK-127), so the
    following send_note meets the egress condition and is blocked, with a
    taint decision listing labels [pii].
  - $sUnion: records (declares phi) reports [pii], so the result carries
    both labels and no others. A tool can add labels but never remove
    them.
  - $sNone: recall reports no labels, so the result carries none (the
    declared set is empty). Tainted but with an empty label set, send_note
    is dispatched. This is the control for $sReported.
  - $sUnmapped: recall reports `com.example:unmapped`, which has no
    sensitivity policy. The harness cannot govern the label and must not
    drop it, so the result is invalid output (TOOL-070): a `fatal`
    `agentry.tool.invalid_output` result, the run ends `failed`, the
    session closes, and the reported content never reaches the model.
requirements: [TOOL-071, TOOL-070, HOOK-127, HOOK-122]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: recall
        version: 1
        schemaVersion: "0.1.0"
        description: Recall a stored note by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        binding: { kind: native, handler: test.recall }
      - kind: Tool
        id: records
        version: 1
        schemaVersion: "0.1.0"
        description: Read a clinical record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        sensitivity: [phi]
        binding: { kind: native, handler: test.records }
      - kind: Tool
        id: send_note
        version: 1
        schemaVersion: "0.1.0"
        description: Send a note to an external address.
        input:
          type: object
          additionalProperties: false
          required: [text]
          properties: { text: { type: string } }
        effect: read
        egress: true
        binding: { kind: native, handler: test.send_note }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [recall@1, records@1, send_note@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # $sReported
        - parts: [{ type: tool_call, callId: c1, tool: recall, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: send_note, arguments: { text: "SYN-NOTE-0001" } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "The note could not be sent." }]
          usage: { inputTokens: 40, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sUnion
        - parts: [{ type: tool_call, callId: c1, tool: records, arguments: { key: k2 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Read." }]
          usage: { inputTokens: 30, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sNone
        - parts: [{ type: tool_call, callId: c1, tool: recall, arguments: { key: k3 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: send_note, arguments: { text: "SYN-NOTE-0003" } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Sent." }]
          usage: { inputTokens: 40, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sUnmapped
        - parts: [{ type: tool_call, callId: c1, tool: recall, arguments: { key: k4 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      recall:
        - ok: { output: { note: "SYN-NOTE-PII-0001" }, labels: [pii] }
        - ok: { output: { note: "SYN-NOTE-PLAIN-0003" } }
        - ok: { output: { note: "SYN-NOTE-UNMAPPED-0004" }, labels: ["com.example:unmapped"] }
      records:
        - ok: { output: { record: "SYN-RECORD-0002" }, labels: [pii] }
      send_note:
        - ok: { output: { sent: true } }
script:
  - action: run
    bind: $sReported
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Recall k1, then send it as a note" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sUnion
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Read record k2" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sNone
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Recall k3, then send it as a note" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sUnmapped
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Recall k4" }]
    expect: { ok: true, endReason: failed }
expect:
  sessions:
    $sReported:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.result, provenances: ["tool:recall"], labels: [pii], payload: { callId: c1, tool: recall, result: { ok: { labels: [pii] } } } }
          - { type: policy.decision, payload: { kind: taint, outcome: block, callId: c2, tool: send_note, labels: [pii] } }
          - { type: tool.result, payload: { callId: c2, result: { error: { category: policy } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.call, payload: { callId: c2 } }
      checkpoint:
        taint: { tainted: true, provenances: ["tool:recall"], labels: [pii] }
    $sUnion:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.result, provenances: ["tool:records"], labels: { $all: [{ $len: 2 }, { $contains: [phi, pii] }] }, payload: { callId: c1, tool: records } }
          - { type: run.ended, payload: { reason: responded } }
    $sNone:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.result, provenances: ["tool:recall"], labels: [], payload: { callId: c1, tool: recall } }
          - { type: tool.call, payload: { callId: c2, tool: send_note } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: policy.decision, payload: { kind: taint } }
    $sUnmapped:
      state: closed
      closeReason: failed
      events:
        mode: subsequence
        items:
          - type: tool.result
            payload:
              callId: c1
              tool: recall
              result: { error: { category: fatal, code: agentry.tool.invalid_output, source: harness } }
          - { type: run.ended, payload: { reason: failed } }
          - { type: session.closed, payload: { reason: failed } }
      absentEvents:
        - { type: model.request, step: 2 }
        - { type: tool.result, payload: { result: { ok: { $any: true } } } }
  stubCalls:
    recall: { count: 3 }
    records: { count: 1 }
    send_note: [{ arguments: { text: "SYN-NOTE-0003" } }]
  providerRequests:
    scripted-a:
      - {}
      - messages:
          $contains:
            - role: tool
              parts: [{ type: tool_result, callId: c1, provenance: "tool:recall", labels: [pii] }]
      - {}
      - {}
      - messages:
          $contains:
            - role: tool
              parts: [{ type: tool_result, callId: c1, provenance: "tool:records", labels: { $all: [{ $len: 2 }, { $contains: [phi, pii] }] } }]
      - {}
      - {}
      - {}
      - {}
  noPersistedContent:
    - "SYN-NOTE-UNMAPPED-0004"
