schemaVersion: "0.1.0"
id: tool.pipeline-parallel-independent
title: Parallel calls in one step pass through the pipeline independently, and their results reach the model together in request order
description: >-
  One model response requests four calls: c1 lookup (valid; its stub
  behaviour is delayed, so it may complete last), c2 lookup with invalid
  arguments, c3 an unknown tool, and c4 lookup (valid). c2 is stopped at
  stage 2 and c3 at stage 1 without affecting the others; c1 and c4 are
  dispatched. The next model request carries all four results in one tool
  message, ordered c1, c2, c3, c4 as requested, whatever order they
  completed in; there is no model request in between.

  That the results arrive as a single `tool`-role message is assumed here;
  the message shape for a step's results is not yet fixed by a schema.
requirements: [TOOL-032]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { parallelToolCalls: true }
      responses:
        - parts:
            - { type: tool_call, callId: c1, tool: lookup, arguments: { key: a } }
            - { type: tool_call, callId: c2, tool: lookup, arguments: { id: b } }
            - { type: tool_call, callId: c3, tool: ghost_tool, arguments: { key: c } }
            - { type: tool_call, callId: c4, tool: lookup, arguments: { key: d } }
          usage: { inputTokens: 20, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Two of four worked." }]
          usage: { inputTokens: 60, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - { ok: { output: { value: "first dispatched" } }, delayMs: 1000 }
        - ok: { output: { value: "second dispatched" } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up a, b, c and d" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: contains
        items:
          - { type: tool.call, step: 1, payload: { callId: c1 } }
          - { type: tool.call, step: 1, payload: { callId: c4 } }
          - { type: tool.result, step: 1, payload: { callId: c1, result: { ok: { $any: true } } } }
          - { type: tool.result, step: 1, payload: { callId: c2, result: { error: { category: invalid_input, code: agentry.tool.invalid_arguments } } } }
          - { type: tool.result, step: 1, payload: { callId: c3, result: { error: { category: policy, code: agentry.tool.unavailable } } } }
          - { type: tool.result, step: 1, payload: { callId: c4, result: { ok: { $any: true } } } }
          - { type: model.request, step: 2 }
      absentEvents:
        - { type: tool.call, payload: { callId: c2 } }
        - { type: tool.call, payload: { callId: c3 } }
        - { type: model.request, step: 3 }
  stubCalls:
    lookup: { $all: [{ $len: 2 }, { $contains: [{ arguments: { key: a } }, { arguments: { key: d } }] }] }
  providerRequests:
    scripted-a:
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                - { type: tool_result, callId: c1, result: { ok: { $any: true } } }
                - { type: tool_result, callId: c2, result: { error: { category: invalid_input } } }
                - { type: tool_result, callId: c3, result: { error: { category: policy } } }
                - { type: tool_result, callId: c4, result: { ok: { $any: true } } }
