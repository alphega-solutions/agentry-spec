schemaVersion: "0.1.0"
id: tool.mcp-tool-requires-artifact
title: An MCP tool without its own `Tool` artifact is never offered to the model, even though the server advertises it
description: >-
  The deployment declares MCP server `crm`, which advertises two tools,
  `get_contact` and `delete_contact`. Only `get_contact` has a `Tool`
  artifact (in the persona's allowlist). The model is offered exactly the
  persona's three artifact-backed tools — lookup, update_record and
  get_contact — and never delete_contact. When the model nevertheless
  requests delete_contact, the call is stopped at the availability check
  with `policy` (`agentry.tool.unavailable`), recorded as a scope decision
  with `reason: unknown` (server discovery does not put it in the catalog),
  and the server never receives it. The artifact-backed get_contact is dispatched to the server normally.
requirements: [TOOL-090]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
        mcpServers:
          - { id: crm, endpoint: "memory://mcp-crm", identity: "crm.mcp.test.invalid", region: test-region }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: Tool
        id: get_contact
        version: 1
        schemaVersion: "0.1.0"
        description: Get a CRM contact.
        input:
          type: object
          additionalProperties: false
          required: [contactId]
          properties: { contactId: { type: string } }
        effect: read
        binding: { kind: mcp, server: crm, tool: get_contact }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1, get_contact@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: tool_call, callId: c1, tool: get_contact, arguments: { contactId: ct-1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: delete_contact, arguments: { contactId: ct-1 } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "I cannot delete contacts." }]
          usage: { inputTokens: 40, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    mcpServers:
      crm:
        tools:
          get_contact:
            description: Get a contact.
            inputSchema: { type: object, additionalProperties: false, required: [contactId], properties: { contactId: { type: string } } }
            annotations: { readOnlyHint: true }
            behaviours:
              - ok: { output: { name: "Synthetic Contact" } }
          delete_contact:
            description: Delete a contact.
            inputSchema: { type: object, additionalProperties: false, required: [contactId], properties: { contactId: { type: string } } }
            annotations: { destructiveHint: true }
            behaviours: []
    tools:
      lookup: []
      update_record: []
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Get contact ct-1, then delete it" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: get_contact } }
          - { type: tool.result, provenances: ["tool:get_contact"], payload: { callId: c1, result: { ok: { output: { name: "Synthetic Contact" } } } } }
          - { type: policy.decision, payload: { kind: scope, outcome: block, callId: c2, reason: unknown } }
          - { type: tool.result, payload: { callId: c2, result: { error: { category: policy, code: agentry.tool.unavailable } } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: tool.call, payload: { callId: c2 } }
  stubCalls:
    crm/get_contact:
      - { arguments: { contactId: ct-1 } }
    crm/delete_contact: { count: 0 }
  providerRequests:
    scripted-a:
      $every:
        tools:
          $all:
            - { $len: 3 }
            - { $contains: [{ name: lookup }, { name: update_record }, { name: get_contact }] }
            - { $count: { of: { name: delete_contact }, equals: 0 } }
