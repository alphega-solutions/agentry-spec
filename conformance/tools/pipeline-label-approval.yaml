schemaVersion: "0.1.0"
id: tool.pipeline-label-approval
title: Effective approval is the strictest of the tool's `approval` and the approval of its labels' sensitivity policies
description: >-
  The bundle sets `approval: always` for label `phi` and `approval: policy`
  for label `pii`, with one approval rule (key is `escalate-me`). No session
  has labelled content in context when a labelled tool is first called, so
  each outcome comes from the tool's own labels (TOOL-035).

  - $sAlways: `read_chart` (approval never, labels phi) → effective
    `always` → escalates.
  - $sAlwaysOverPolicy: `read_chart_policy` (approval policy, labels phi),
    with arguments no approval rule matches → effective `always` →
    escalates anyway.
  - $sPolicy: `read_contact` (approval never, labels pii) → effective
    `policy`: with key k1 no rule matches and it is dispatched (the
    bundle sets `approvalDefault: continue`, HOOK-133); with key
    escalate-me the rule matches and it escalates.
  - $sUnlabelled: lookup (approval never, no labels) with key escalate-me
    is dispatched: the approval rule applies only where the effective
    approval is `policy`.
requirements: [TOOL-035]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        approvalRules: ["call.arguments.key == 'escalate-me'"]
        approvalDefault: continue
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
            approval: policy
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
            approval: always
      - kind: Tool
        id: read_chart
        version: 1
        schemaVersion: "0.1.0"
        description: Read a chart.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        approval: never
        sensitivity: [phi]
        binding: { kind: native, handler: test.read_chart }
      - kind: Tool
        id: read_chart_policy
        version: 1
        schemaVersion: "0.1.0"
        description: Read a chart under the approval policy.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        approval: policy
        sensitivity: [phi]
        binding: { kind: native, handler: test.read_chart_policy }
      - kind: Tool
        id: read_contact
        version: 1
        schemaVersion: "0.1.0"
        description: Read a contact.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        approval: never
        sensitivity: [pii]
        binding: { kind: native, handler: test.read_contact }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, read_chart@1, read_chart_policy@1, read_contact@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # $sAlways
        - parts: [{ type: tool_call, callId: c1, tool: read_chart, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sAlwaysOverPolicy
        - parts: [{ type: tool_call, callId: c1, tool: read_chart_policy, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sPolicy
        - parts: [{ type: tool_call, callId: c1, tool: read_contact, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: read_contact, arguments: { key: escalate-me } }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sUnlabelled
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: escalate-me } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Found it." }]
          usage: { inputTokens: 30, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      read_chart: []
      read_chart_policy: []
      read_contact:
        - ok: { output: { contact: "Synthetic Contact" } }
      lookup:
        - ok: { output: { value: "synthetic value" } }
script:
  - action: run
    bind: $sAlways
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Read chart k1" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $sAlwaysOverPolicy
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Read chart k1" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $sPolicy
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Read contacts k1 and escalate-me" }]
    expect: { ok: true, endReason: escalated }
  - action: run
    bind: $sUnlabelled
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up escalate-me" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sAlways:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: escalation.raised, payload: { escalation: { sources: [approval], pendingActions: [{ callId: c1, tool: read_chart }] } } }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call }
    $sAlwaysOverPolicy:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: escalation.raised, payload: { escalation: { sources: [approval], pendingActions: [{ callId: c1, tool: read_chart_policy }] } } }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: tool.call }
    $sPolicy:
      state: suspended
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: read_contact } }
          - { type: tool.result, payload: { callId: c1 } }
          - { type: escalation.raised, payload: { escalation: { sources: [approval], pendingActions: [{ callId: c2, tool: read_contact }] } } }
          - { type: run.ended, payload: { reason: escalated } }
      absentEvents:
        - { type: escalation.raised, payload: { escalation: { pendingActions: [{ callId: c1 }] } } }
        - { type: tool.call, payload: { callId: c2 } }
    $sUnlabelled:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.call, payload: { callId: c1, tool: lookup } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: escalation.raised }
  stubCalls:
    read_chart: { count: 0 }
    read_chart_policy: { count: 0 }
    read_contact: [{ arguments: { key: k1 } }]
    lookup: [{ arguments: { key: escalate-me } }]
