schemaVersion: "0.1.0"
id: tool.binding-credential-mode
title: A principal-mode binding acts for the session's principal; a service-mode binding receives the principal so it can refuse one without rights
description: >-
  `my_records` uses `credentialMode: principal`; `team_records` uses
  `credentialMode: service` with a shared credential from a secret
  reference. Two principals each call both tools in their own session.

  - Every call's tool context names the session's own principal, never the
    other session's, so a principal-mode binding obtains credentials for
    that principal and a service-mode binding has what it needs to enforce
    the principal's rights.
  - The service binding refuses user-2 (`unauthorized`); the refusal is
    returned to the model as that call's tool result, the call is not
    retried, and the turn continues.

  How a principal's own credential is obtained from the host is not
  observable through the fixture format, and the service binding's rights
  check is the binding's own logic (here, the stub's scripted refusal); the
  fixture asserts what the harness must provide and do around them.
requirements: [TOOL-012]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Tool
        id: my_records
        version: 1
        schemaVersion: "0.1.0"
        description: List the principal's own records.
        input: { type: object, additionalProperties: false, properties: {} }
        effect: read
        credentialMode: principal
        binding: { kind: native, handler: test.my_records }
      - kind: Tool
        id: team_records
        version: 1
        schemaVersion: "0.1.0"
        description: List the team's records with a shared service credential.
        input: { type: object, additionalProperties: false, properties: {} }
        effect: read
        credentialMode: service
        binding: { kind: native, handler: test.team_records, credentials: { apiKey: "secret://test/team-records-key" } }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [my_records@1, team_records@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor, roles: [team-member] }
        - { id: p2, subject: user-2, assurance: multi_factor }
  providers:
    scripted-a:
      responses:
        # $s1 (user-1)
        - parts: [{ type: tool_call, callId: c1, tool: my_records, arguments: {} }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: team_records, arguments: {} }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Here are both lists." }]
          usage: { inputTokens: 40, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
        # $s2 (user-2)
        - parts: [{ type: tool_call, callId: c1, tool: my_records, arguments: {} }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: team_records, arguments: {} }]
          usage: { inputTokens: 30, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "You can see only your own records." }]
          usage: { inputTokens: 40, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      my_records:
        - ok: { output: { records: ["u1-r1"] } }
        - ok: { output: { records: ["u2-r1"] } }
      team_records:
        - ok: { output: { records: ["team-r1"] } }
        - error: { category: unauthorized, code: test.team_records.not_member, retryable: false, message: "Not permitted." }
  secrets:
    "secret://test/team-records-key": "SYN-SECRET-TEAM-0012-DO-NOT-PERSIST"
script:
  - action: run
    bind: $s1
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Show my records and the team's" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $s2
    tenant: t1
    principal: p2
    persona: assistant@1
    input: [{ type: text, text: "Show my records and the team's" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s1:
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { records: ["u1-r1"] } } } } }
          - { type: tool.result, payload: { callId: c2, result: { ok: { output: { records: ["team-r1"] } } } } }
    $s2:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: tool.result, payload: { callId: c1, result: { ok: { output: { records: ["u2-r1"] } } } } }
          - { type: tool.result, payload: { callId: c2, result: { error: { category: unauthorized } } } }
          - { type: model.request, step: 3 }
          - { type: run.ended, payload: { reason: responded } }
  stubCalls:
    my_records:
      - { context: { sessionId: $s1, principal: { subject: user-1 } } }
      - { context: { sessionId: $s2, principal: { subject: user-2 } } }
    team_records:
      - { context: { sessionId: $s1, principal: { subject: user-1 } } }
      - { context: { sessionId: $s2, principal: { subject: user-2 } } }
  providerRequests:
    scripted-a:
      - {}
      - {}
      - {}
      - {}
      - {}
      - messages:
          $contains:
            - role: tool
              parts:
                $contains:
                  - { type: tool_result, callId: c2, result: { error: { category: unauthorized } } }
  noPersistedContent:
    - "SYN-SECRET-TEAM-0012-DO-NOT-PERSIST"
