schemaVersion: 0.1.0
id: cel.op-logical-short-circuit
description: >-
  A false operand of `&&` determines the result; the other operand's runtime
  error (division by zero through a variable, session.step - 2 = 0) is ignored
  (langdef, logical operators).
requirements:
- HOOK-110
point: beforeModelCall
expression: false && (session.turn / (session.step - 2) == 1)
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value: false
