schemaVersion: 0.1.0
id: cel.point-session-start
requirements:
- HOOK-110
point: sessionStart
expression: principal.assurance == 'multi_factor' && 'clinician' in principal.roles && principal.tenant
  == 't1' && session.turn >= 0
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value: true
