schemaVersion: 0.1.0
id: cel.point-session-start
description: >-
  sessionStart runs once, before the first turn's first model call, with the
  principal's first input: `session.turn` is 1 and `session.step` is 0
  (HOOK-091).
requirements:
- HOOK-110
point: sessionStart
expression: principal.assurance == 'multi_factor' && 'clinician' in principal.roles && principal.tenant
  == 't1' && session.turn == 1 && session.step == 0 && content[0].provenance == 'principal'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 1
    step: 0
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value: true
