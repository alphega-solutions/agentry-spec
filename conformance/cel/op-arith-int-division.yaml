schemaVersion: 0.1.0
id: cel.op-arith-int-division
description: >-
  Integer division truncates toward zero (as in the cel-spec conformance suite,
  integer_math); it never floors and never yields a double.
requirements:
- HOOK-110
point: beforeModelCall
expression: '[7 / 2, -7 / 2, 7 / -2, session.turn / session.step]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - 3
  - -3
  - -3
  - 1
