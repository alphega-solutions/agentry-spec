schemaVersion: 0.1.0
id: cel.op-arith-basic
description: >-
  Integer +, -, *, unary minus and precedence; double arithmetic with values
  that are exact in binary floating point.
requirements:
- HOOK-110
point: beforeModelCall
expression: '[2 + 3 * 4 - 10, -session.turn, session.turn * session.step, 7.0 / 2.0, 0.5 + 0.25]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - 4
  - -3
  - 6
  - 3.5
  - 0.75
