# Selecting an absent key of a map is a no-such-key error at run time.
# Guarded form: op-logical-guarded-missing-key.
schemaVersion: 0.1.0
id: cel.runtime-missing-map-key
requirements:
- HOOK-113
point: beforeModelCall
expression: principal.attributes.region == 'SYN-us'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  failure: runtime
