schemaVersion: 0.1.0
id: cel.ext-replace
description: >-
  Replaces every occurrence, or the first n with the optional count.
requirements:
- HOOK-110
point: beforeModelCall
expression: '[''SYN-a-SYN-b''.replace(''SYN-'', ''X-''), ''aaa''.replace(''a'', ''b'', 2)]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - X-a-X-b
  - bba
