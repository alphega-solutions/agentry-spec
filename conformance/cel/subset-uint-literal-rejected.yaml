schemaVersion: 0.1.0
id: cel.subset-uint-literal-rejected
description: >-
  Stage: `compile` is parsing plus the syntactic subset checks; `type_check` is
  every other load-time check (HOOK-112). Both are load-time configuration
  errors. The subset has no `uint` literals. `1u` parses and standard CEL types
  it as uint, so only the syntactic subset check can reject it: `compile`.
requirements:
- HOOK-111
- HOOK-112
point: beforeModelCall
expression: 1u + 2u == 3u
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  failure: compile
