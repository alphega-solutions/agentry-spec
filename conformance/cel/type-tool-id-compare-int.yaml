schemaVersion: 0.1.0
id: cel.type-tool-id-compare-int
description: >-
  `tool.id` is declared string (§9.1); `_>_` has no (string, int) overload.
  Variables are typed with exactly the fields of §9.1; `principal.attributes`,
  `call.arguments`, `result.output` and a part's `value` are dyn (HOOK-112).
  Contrast type-dyn-mismatch-runtime.
requirements:
- HOOK-112
point: beforeToolCall
expression: tool.id > 3
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: tool_call
    callId: SYN-call-1
    tool: update_record
    arguments:
      recordId: SYN-1001
      status: closed
    provenance: model
    labels: []
  tool:
    id: update_record
    effect: mutating
    egress: false
    idempotent: false
    sensitivity:
    - pii
  call:
    arguments:
      recordId: SYN-1001
      status: closed
expect:
  failure: type_check
