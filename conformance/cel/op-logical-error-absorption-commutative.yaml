# CEL `&&` and `||` are commutative with respect to errors: an operand that
# determines the result absorbs an error in the other, on either side. This is
# not left-to-right short-circuiting.
schemaVersion: 0.1.0
id: cel.op-logical-error-absorption-commutative
requirements:
- HOOK-110
point: beforeModelCall
expression: '[(1 / 0 == 1) && false, (1 / 0 == 1) || true, true || (1 / 0 == 1), !session.tainted]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - false
  - true
  - true
  - true
