schemaVersion: 0.1.0
id: cel.point-session-end
description: >-
  At sessionEnd `session` holds the last turn and step reached (HOOK-091).
  `summary` is present in the request but is not a CEL variable; see
  type-var-summary-not-cel-rejected.
requirements:
- HOOK-110
point: sessionEnd
expression: session.turn == 3 && session.step == 2 && principal.subject == 'user-1' && session.persona
  == 'assistant@1'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  summary:
    closeReason: completed
    turns: 3
    usage:
      inputTokens: 10
      outputTokens: 5
      cachedInputTokens: 0
      reasoningTokens: 0
expect:
  value: true
