schemaVersion: 0.1.0
id: cel.macro-exists
description: >-
  `exists` over parts; false on an empty list.
requirements:
- HOOK-110
point: beforeModelCall
expression: '[content.exists(p, ''pii'' in p.labels), content.exists(p, ''phi'' in p.labels), [].exists(x,
  true)]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - true
  - false
  - false
