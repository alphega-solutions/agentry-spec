schemaVersion: 0.1.0
id: cel.secret-image-data-rejected
description: >-
  An image part carries a blob reference, never bytes (CORE-112), and CEL sees a
  part only as type, text (text parts), value (structured parts), labels and
  provenance (HOOK-112). `data` is not a field of the part type, so the checker
  rejects it: the part fields are fixed, so the error is knowable at load.
  Control: secret-image-part-metadata-visible.
requirements:
- HOOK-112
- HOOK-115
point: beforeModelCall
expression: size(content[1].data) > 0
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
  - type: image
    mediaType: image/png
    blob:
      id: SYN-blob-1
      hash: sha256:a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
      mediaType: image/png
      size: 2048
    provenance: attachment:SYN-scan-1
    labels:
    - phi
expect:
  failure: type_check
