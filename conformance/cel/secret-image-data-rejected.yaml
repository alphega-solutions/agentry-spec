# An image part carries a blob reference, never bytes (CORE-112), and CEL sees a
# part only as type, text, labels and provenance (§9.1). `data` is not a declared
# field of the part type, so the checker rejects it. Chosen over a run-time
# no-such-field: §9.1 fixes the part fields, so the error is knowable at load.
# Control: secret-image-part-metadata-visible.
schemaVersion: 0.1.0
id: cel.secret-image-data-rejected
requirements:
- HOOK-112
- HOOK-115
point: beforeModelCall
expression: size(content[1].data) > 0
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
  - type: image
    mediaType: image/png
    blob:
      id: SYN-blob-1
      hash: sha256:a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
      mediaType: image/png
      size: 2048
    provenance: attachment:SYN-scan-1
    labels:
    - phi
expect:
  failure: type_check
