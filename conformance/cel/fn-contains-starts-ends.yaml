schemaVersion: 0.1.0
id: cel.fn-contains-starts-ends
description: >-
  `contains`, `startsWith` and `endsWith` on strings, each with a non-matching
  control.
requirements:
- HOOK-110
point: beforeModelCall
expression: '[content[0].text.contains(''SYN-''), ''abc''.contains(''d''), ''SYN-1001''.startsWith(''SYN-''),
  ''SYN-1001''.startsWith(''1001''), ''SYN-1001''.endsWith(''01''), ''SYN-1001''.endsWith(''SYN'')]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - true
  - false
  - true
  - false
  - true
  - false
