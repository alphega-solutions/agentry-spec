schemaVersion: 0.1.0
id: cel.runtime-division-by-zero
description: >-
  Integer division by zero (step - 2 = 0).
requirements:
- HOOK-113
point: beforeModelCall
expression: session.turn / (session.step - 2) > 0
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  failure: runtime
