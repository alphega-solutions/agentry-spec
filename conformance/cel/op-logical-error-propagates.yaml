# Control for the absorption cases: when the other operand does not decide the
# result, the division-by-zero error is the result.
schemaVersion: 0.1.0
id: cel.op-logical-error-propagates
requirements:
- HOOK-110
- HOOK-113
point: beforeModelCall
expression: true && (1 / 0 == 1)
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  failure: runtime
