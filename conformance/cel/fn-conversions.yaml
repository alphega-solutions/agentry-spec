# `int(double)` rounds toward zero (langdef). `string()` is applied only to ints:
# the text of string(double) is not fixed tightly enough to assert.
schemaVersion: 0.1.0
id: cel.fn-conversions
requirements:
- HOOK-110
point: beforeModelCall
expression: '[int(''42''), int(''-12''), int(3.9), int(-3.9), double(session.turn) == 3.0, double(''2.5'')
  == 2.5, string(session.turn), string(-7), bool(''true''), bool(''false'')]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - 42
  - -12
  - 3
  - -3
  - true
  - true
  - '3'
  - '-7'
  - true
  - false
