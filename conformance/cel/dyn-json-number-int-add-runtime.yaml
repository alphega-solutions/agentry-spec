schemaVersion: 0.1.0
id: cel.dyn-json-number-int-add-runtime
description: >-
  `call.arguments.count` is a JSON number, so a double at run time (HOOK-112);
  `_+_` has no (double, int) overload. The operand is dyn, so the checker
  accepts the expression and the failure is at run time (HOOK-113). Contrast
  dyn-json-number-double.
requirements:
- HOOK-112
- HOOK-113
point: beforeToolCall
expression: call.arguments.count + 1 == 4
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: tool_call
    callId: SYN-call-1
    tool: update_record
    arguments:
      recordId: SYN-1001
      count: 3
    provenance: model
    labels: []
  tool:
    id: update_record
    effect: mutating
    egress: false
    idempotent: false
    sensitivity:
    - pii
  call:
    arguments:
      recordId: SYN-1001
      count: 3
expect:
  failure: runtime
