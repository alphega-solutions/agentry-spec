# `all` over lists (vacuously true when empty) and over a map, where it ranges
# over the keys.
schemaVersion: 0.1.0
id: cel.macro-all
requirements:
- HOOK-110
point: beforeModelCall
expression: '[[1, 2, 3].all(x, x > 0), [1, 2, 3].all(x, x > 1), [].all(x, x > 0), principal.attributes.all(k,
  k.size() >= 4)]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - true
  - false
  - true
  - true
