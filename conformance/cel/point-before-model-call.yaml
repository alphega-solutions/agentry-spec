schemaVersion: 0.1.0
id: cel.point-before-model-call
description: >-
  beforeModelCall at step 2 sees the step-1 tool result. The baseline bundle
  trusts no tools, so that delivered result has tainted the session (HOOK-120,
  HOOK-126).
requirements:
- HOOK-110
point: beforeModelCall
expression: content.exists(p, p.provenance.startsWith('tool:') && 'pii' in p.labels) && session.tainted
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: true
    turn: 3
    step: 2
  content:
  - type: text
    text: Summarise SYN-1001
    provenance: principal
    labels: []
  - type: tool_result
    callId: SYN-call-1
    tool: lookup
    result:
      ok:
        output:
          status: open
    provenance: tool:lookup
    labels:
    - pii
expect:
  value: true
