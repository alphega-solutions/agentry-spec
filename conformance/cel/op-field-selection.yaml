schemaVersion: 0.1.0
id: cel.op-field-selection
description: >-
  Field selection on declared variables and on a map-valued field
  (`attributes`).
requirements:
- HOOK-110
point: beforeModelCall
expression: '[session.persona, principal.attributes.department, content[0].provenance]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - assistant@1
  - SYN-cardiology
  - principal
