# Integer modulo is the remainder of truncating division: its sign follows the
# dividend (cel-spec conformance suite, integer_math).
schemaVersion: 0.1.0
id: cel.op-arith-int-modulo
requirements:
- HOOK-110
point: beforeModelCall
expression: '[7 % 3, -7 % 3, 7 % -3, session.turn % session.step]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - 1
  - -1
  - 1
  - 1
