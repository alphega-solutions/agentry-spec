schemaVersion: 0.1.0
id: cel.op-in-list
description: >-
  `in` on a list tests element membership.
requirements:
- HOOK-110
point: beforeModelCall
expression: '[''clinician'' in principal.roles, ''admin'' in principal.roles, ''pii'' in content[0].labels]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - true
  - false
  - true
