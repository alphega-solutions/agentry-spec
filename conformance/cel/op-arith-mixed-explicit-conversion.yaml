schemaVersion: 0.1.0
id: cel.op-arith-mixed-explicit-conversion
description: >-
  Control for op-arith-mixed-int-double-rejected: with an explicit `double()`
  conversion the same comparison type-checks and evaluates (4.5 > 4.0).
requirements:
- HOOK-110
point: beforeModelCall
expression: double(session.turn) * 1.5 > 4.0
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value: true
