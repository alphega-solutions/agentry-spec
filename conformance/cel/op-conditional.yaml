schemaVersion: 0.1.0
id: cel.op-conditional
description: >-
  Value cases only: langdef calls not evaluating the untaken branch "an
  implementation detail", so no fixture asserts an error in that branch.
requirements:
- HOOK-110
point: beforeToolCall
expression: '[session.tainted ? ''review'' : ''allow'', tool.effect == ''mutating'' ? 2 : 1]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: tool_call
    callId: SYN-call-1
    tool: update_record
    arguments:
      recordId: SYN-1001
      status: closed
    provenance: model
    labels: []
  tool:
    id: update_record
    effect: mutating
    egress: false
    idempotent: false
    sensitivity:
    - pii
  call:
    arguments:
      recordId: SYN-1001
      status: closed
expect:
  value:
  - allow
  - 2
