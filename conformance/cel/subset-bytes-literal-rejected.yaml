schemaVersion: 0.1.0
id: cel.subset-bytes-literal-rejected
description: >-
  Stage: `compile` is parsing plus the syntactic subset check (needs no
  declarations); `type_check` is checking against the point's declarations. Both
  are load-time configuration errors (HOOK-112). A bytes literal parses, and the
  standard checker would type it as bytes, so only the syntactic subset check
  can reject it: `compile`.
requirements:
- HOOK-111
- HOOK-112
point: beforeModelCall
expression: b'SYN' == b'SYN'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  failure: compile
