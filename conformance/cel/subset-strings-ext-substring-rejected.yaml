schemaVersion: 0.1.0
id: cel.subset-strings-ext-substring-rejected
description: >-
  Stage: `compile` is parsing plus the syntactic subset check (needs no
  declarations); `type_check` is checking against the point's declarations. Both
  are load-time configuration errors (HOOK-112). Only six strings-extension
  functions are in the subset (HOOK-110); `substring` is not, even where the
  library's full extension offers it.
requirements:
- HOOK-110
- HOOK-112
point: beforeModelCall
expression: content[0].text.substring(0, 4) == 'Look'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  failure: type_check
