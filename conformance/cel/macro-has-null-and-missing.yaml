schemaVersion: 0.1.0
id: cel.macro-has-null-and-missing
description: >-
  `has(m.f)` on a map tests whether key f is present (langdef). A key whose
  value is JSON null is present and equals null; an absent key is not present.
  Null and missing are distinct.
requirements:
- HOOK-110
point: beforeModelCall
expression: '[has(principal.attributes.department), has(principal.attributes.region), has(principal.attributes.manager),
  principal.attributes.manager == null]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - true
  - false
  - true
  - true
