schemaVersion: 0.1.0
id: cel.point-before-tool-call
requirements:
- HOOK-110
point: beforeToolCall
expression: session.tainted && tool.effect == 'mutating' && !tool.idempotent && 'pii' in tool.sensitivity
  && call.arguments.recordId.startsWith('SYN-')
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: true
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
  tool:
    id: update_record
    effect: mutating
    egress: false
    idempotent: false
    sensitivity:
    - pii
  call:
    arguments:
      recordId: SYN-1001
      status: closed
expect:
  value: true
