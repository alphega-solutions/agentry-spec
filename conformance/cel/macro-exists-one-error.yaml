schemaVersion: 0.1.0
id: cel.macro-exists-one-error
description: >-
  Unlike `all`/`exists`, any predicate error makes `exists_one` raise (langdef).
  The first element is 0 (session.step - 2) and divides by zero.
requirements:
- HOOK-110
- HOOK-113
point: beforeModelCall
expression: '[(session.step - 2), 1].exists_one(x, 1 / x == 1)'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  failure: runtime
