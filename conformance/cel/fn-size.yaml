# `size` on strings, lists and maps, global and receiver form. String size
# counts Unicode code points, not bytes or UTF-16 units (langdef).
schemaVersion: 0.1.0
id: cel.fn-size
requirements:
- HOOK-110
point: beforeModelCall
expression: '[size(''abc''), size(principal.roles), size({''a'': 1}), content.size(), size([]), size(''héllo''),
  size(''日本'')]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - 3
  - 2
  - 1
  - 1
  - 0
  - 5
  - 2
