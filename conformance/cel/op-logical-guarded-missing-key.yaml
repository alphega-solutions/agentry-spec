# The idiomatic guard for an optional attribute: `has()` is false, so the
# missing-key error on the right is absorbed. Unguarded form: runtime-missing-map-key.
schemaVersion: 0.1.0
id: cel.op-logical-guarded-missing-key
requirements:
- HOOK-110
point: beforeModelCall
expression: has(principal.attributes.region) && principal.attributes.region == 'SYN-us'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value: false
