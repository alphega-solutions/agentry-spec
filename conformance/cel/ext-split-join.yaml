# `split` keeps empty fields between separators; `join` with and without a
# separator.
schemaVersion: 0.1.0
id: cel.ext-split-join
requirements:
- HOOK-110
point: beforeModelCall
expression: '[''a,b,,c''.split('',''), principal.attributes.site.split(''-''), principal.roles.join('',
  ''), principal.roles.join()]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - - a
    - b
    - ''
    - c
  - - SYN
    - site
    - '7'
  - clinician, reviewer
  - clinicianreviewer
