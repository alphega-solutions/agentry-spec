schemaVersion: 0.1.0
id: cel.op-indexing
description: >-
  List indexing by int and map indexing by string key.
requirements:
- HOOK-110
point: beforeModelCall
expression: '[principal.roles[1], principal.attributes[''site''], content[0].labels[0]]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - reviewer
  - SYN-site-7
  - pii
