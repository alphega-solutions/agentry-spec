# `in` on a map tests key membership, never value membership.
schemaVersion: 0.1.0
id: cel.op-in-map
requirements:
- HOOK-110
point: beforeModelCall
expression: '[''department'' in principal.attributes, ''region'' in principal.attributes, ''SYN-cardiology''
  in principal.attributes]'
variables:
  principal:
    subject: user-1
    tenant: t1
    roles:
    - clinician
    - reviewer
    attributes:
      department: SYN-cardiology
      site: SYN-site-7
      manager: null
    assurance: multi_factor
  session:
    persona: assistant@1
    tainted: false
    turn: 3
    step: 2
  content:
  - type: text
    text: Look up record SYN-1001 please
    provenance: principal
    labels:
    - pii
expect:
  value:
  - true
  - false
  - false
