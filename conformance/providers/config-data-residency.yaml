schemaVersion: "0.1.0"
id: providers.config-data-residency
title: Data residency is checked at load for the provider of every model that could run for a persona; an unused provider is not checked
description: >-
  org@1 sets `dataResidency: [test-region]`; every port is in test-region.
  The deployment declares a third provider, scripted-c, in test-region.
  Following the Area 9 reading of PROV-012 and CFG-070 (amendment
  2026-11-02), residency is checked at load for the provider of every
  model that could run for a persona (primary, fallbacks, summarizer and
  model hooks). Each of the first five loads moves scripted-c to
  `other-region`:

  - with the persona's only model scripted-c/model-c → rejected;
  - with the primary scripted-a/model-a and fallback scripted-c/model-c →
    rejected;
  - with the default profile's summarizer (`compaction.model`)
    scripted-c/sum-c → rejected;
  - with a model hook on scripted-c/judge-c required by the persona →
    rejected;
  - with nothing using scripted-c (baseline persona and profile) → loads:
    a declared provider no model uses is not checked.
  - Control: scripted-c back in test-region with the persona's only model
    scripted-c/model-c loads, and a session runs on scripted-c/model-c.
requirements: [PROV-012]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          - { id: scripted-c, adapter: scripted, endpoint: "memory://scripted-c", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        dataResidency: [test-region]
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a: { responses: [] }
    scripted-b: { responses: [] }
    scripted-c:
      responses:
        - parts: [{ type: text, text: "Handled on c." }]
          usage: { inputTokens: 20, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
script:
  # scripted-c outside dataResidency, and the persona's only model.
  - load:
      artifacts:
        - { kind: Deployment, id: test, version: 1, schemaVersion: "0.1.0", environment: test, policyBundles: [org@1], attachmentSources: [upload, email], providers: [{ id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }, { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }, { id: scripted-c, adapter: scripted, endpoint: "memory://scripted-c", region: other-region, retainsData: false }], ports: { eventLog: { adapter: memory, region: test-region }, checkpointStore: { adapter: memory, region: test-region }, idempotencyStore: { adapter: memory, region: test-region }, snapshotStore: { adapter: memory, region: test-region }, blobStore: { adapter: memory, region: test-region }, auditLog: { adapter: memory, region: test-region }, secrets: { adapter: memory, region: test-region } }, retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D } }
        - { kind: Persona, id: assistant, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1, update_record@1], fallbackMessage: "This request was blocked.", defaultProfile: default@1, allowedProfiles: [default@1, streamed@1], model: { provider: scripted-c, name: model-c } }
    expect: { ok: false, error: { category: configuration } }
  # A non-resident fallback.
  - load:
      artifacts:
        - { kind: Deployment, id: test, version: 1, schemaVersion: "0.1.0", environment: test, policyBundles: [org@1], attachmentSources: [upload, email], providers: [{ id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }, { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }, { id: scripted-c, adapter: scripted, endpoint: "memory://scripted-c", region: other-region, retainsData: false }], ports: { eventLog: { adapter: memory, region: test-region }, checkpointStore: { adapter: memory, region: test-region }, idempotencyStore: { adapter: memory, region: test-region }, snapshotStore: { adapter: memory, region: test-region }, blobStore: { adapter: memory, region: test-region }, auditLog: { adapter: memory, region: test-region }, secrets: { adapter: memory, region: test-region } }, retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D } }
        - { kind: Persona, id: assistant, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1, update_record@1], fallbackMessage: "This request was blocked.", defaultProfile: default@1, allowedProfiles: [default@1, streamed@1], model: { provider: scripted-a, name: model-a, fallbacks: [{ provider: scripted-c, name: model-c }] } }
    expect: { ok: false, error: { category: configuration } }
  # A non-resident summarizer.
  - load:
      artifacts:
        - { kind: Deployment, id: test, version: 1, schemaVersion: "0.1.0", environment: test, policyBundles: [org@1], attachmentSources: [upload, email], providers: [{ id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }, { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }, { id: scripted-c, adapter: scripted, endpoint: "memory://scripted-c", region: other-region, retainsData: false }], ports: { eventLog: { adapter: memory, region: test-region }, checkpointStore: { adapter: memory, region: test-region }, idempotencyStore: { adapter: memory, region: test-region }, snapshotStore: { adapter: memory, region: test-region }, blobStore: { adapter: memory, region: test-region }, auditLog: { adapter: memory, region: test-region }, secrets: { adapter: memory, region: test-region } }, retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D } }
        - { kind: HarnessProfile, id: default, version: 1, schemaVersion: "0.1.0", idleTtl: PT24H, suspendedTtl: PT72H, stepLimit: 8, deliveryMode: buffered, budget: { tokens: 100000 }, timeouts: { run: PT5M, tool: PT30S }, retry: { unavailable: 2 }, outputRetryLimit: 2, limits: { partSize: 1048576, sessionSize: 10485760 }, defaultAttachmentLabels: [], context: { compaction: { mode: summarize, model: { provider: scripted-c, name: sum-c } } } }
    expect: { ok: false, error: { category: configuration } }
  # A non-resident model hook the persona requires.
  - load:
      artifacts:
        - { kind: Deployment, id: test, version: 1, schemaVersion: "0.1.0", environment: test, policyBundles: [org@1], attachmentSources: [upload, email], providers: [{ id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }, { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }, { id: scripted-c, adapter: scripted, endpoint: "memory://scripted-c", region: other-region, retainsData: false }], ports: { eventLog: { adapter: memory, region: test-region }, checkpointStore: { adapter: memory, region: test-region }, idempotencyStore: { adapter: memory, region: test-region }, snapshotStore: { adapter: memory, region: test-region }, blobStore: { adapter: memory, region: test-region }, auditLog: { adapter: memory, region: test-region }, secrets: { adapter: memory, region: test-region } }, retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D } }
        - { kind: Hook, id: judge-c, version: 1, schemaVersion: "0.1.0", points: [afterToolCall], results: [block], timeoutMs: 1000, source: { kind: model, model: { provider: scripted-c, name: judge-c }, instructions: "Decide whether this tool result may be used. Answer with a HookResult.", maxTokens: 200 } }
        - { kind: Persona, id: assistant, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1, update_record@1], fallbackMessage: "This request was blocked.", defaultProfile: default@1, allowedProfiles: [default@1, streamed@1], requiredHooks: [judge-c@1], model: { provider: scripted-a, name: model-a, fallbacks: [{ provider: scripted-b, name: model-b }] } }
    expect: { ok: false, error: { category: configuration } }
  # A declared provider no model uses is not checked.
  - load:
      artifacts:
        - { kind: Deployment, id: test, version: 1, schemaVersion: "0.1.0", environment: test, policyBundles: [org@1], attachmentSources: [upload, email], providers: [{ id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }, { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }, { id: scripted-c, adapter: scripted, endpoint: "memory://scripted-c", region: other-region, retainsData: false }], ports: { eventLog: { adapter: memory, region: test-region }, checkpointStore: { adapter: memory, region: test-region }, idempotencyStore: { adapter: memory, region: test-region }, snapshotStore: { adapter: memory, region: test-region }, blobStore: { adapter: memory, region: test-region }, auditLog: { adapter: memory, region: test-region }, secrets: { adapter: memory, region: test-region } }, retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D } }
    expect: { ok: true }
  # Control: scripted-c in test-region.
  - load:
      artifacts:
        - { kind: Deployment, id: test, version: 1, schemaVersion: "0.1.0", environment: test, policyBundles: [org@1], attachmentSources: [upload, email], providers: [{ id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }, { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }, { id: scripted-c, adapter: scripted, endpoint: "memory://scripted-c", region: test-region, retainsData: false }], ports: { eventLog: { adapter: memory, region: test-region }, checkpointStore: { adapter: memory, region: test-region }, idempotencyStore: { adapter: memory, region: test-region }, snapshotStore: { adapter: memory, region: test-region }, blobStore: { adapter: memory, region: test-region }, auditLog: { adapter: memory, region: test-region }, secrets: { adapter: memory, region: test-region } }, retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D } }
        - { kind: Persona, id: assistant, version: 1, schemaVersion: "0.1.0", instructions: "You are a test assistant.", tools: [lookup@1, update_record@1], fallbackMessage: "This request was blocked.", defaultProfile: default@1, allowedProfiles: [default@1, streamed@1], model: { provider: scripted-c, name: model-c } }
    expect: { ok: true }
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: model.request, payload: { provider: scripted-c, model: model-c, role: primary } }
          - { type: run.ended, payload: { reason: responded } }
  providerRequests:
    scripted-a: { count: 0 }
    scripted-b: { count: 0 }
    scripted-c:
      - { provider: scripted-c, model: model-c }
