schemaVersion: "0.1.0"
id: providers.usage-budget-failed-calls
title: The token budget counts failed calls, sums input and output tokens only, and is reached when the total equals it
description: >-
  Persona `assistant@1` on scripted-a/model-a. Each run request sets a
  per-turn token budget of 100 (CFG-101). The turn's total is
  `inputTokens + outputTokens` over every model call in the turn,
  including failed calls (PROV-071), and the budget is reached when the
  total is equal to or greater than it (2026-11-02 amendment).


  - $sFailed: step 1's first call fails (retryable `unavailable`) and
    reports 40 + 10 = 50 tokens; the retry asks for a lookup and uses
    40 + 10 = 50. The turn is at exactly 100: the budget is reached, the
    run ends `budget_exhausted`, and no step-2 call is made. Without the
    failed call the turn would be at 50 and would continue.
  - $sBelow (control): the same shape with 39 + 10 and 39 + 10 (98): the
    budget is not reached, step 2 is called (1 + 0, total 99) and the run
    responds.
  - $sCached: step 1 asks for a lookup and reports 60 input (50 of them
    cached) and 30 output (20 of them reasoning): 90 counted, since cached
    tokens are inside input and reasoning inside output (PROV-070). Step 2
    uses 5 + 4 (total 99) and the run responds. Counting cached or
    reasoning tokens again would reach the budget after step 1.


  The call that reaches the budget completes, including dispatching its
  lookup; the run ends at the check before the next call (PROV-071
  reading, amendment 2026-11-02), so all three lookups run. An `error`
  response's `usage` is the usage the provider reported for the failed
  call (fixture format, `scriptedResponse.usage`).
requirements: [PROV-071]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # $sFailed: failed call (50), retry (50) → 100
        - error: { category: unavailable, code: agentry.provider.unavailable, retryable: true }
          usage: { inputTokens: 40, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 40, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sBelow: failed call (49), retry (49) → 98; step 2 (1) → 99
        - error: { category: unavailable, code: agentry.provider.unavailable, retryable: true }
          usage: { inputTokens: 39, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k2 } }]
          usage: { inputTokens: 39, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "SYN-BELOW reply." }]
          usage: { inputTokens: 1, outputTokens: 0, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sCached: step 1 (90), step 2 (9) → 99
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k3 } }]
          usage: { inputTokens: 60, outputTokens: 30, cachedInputTokens: 50, reasoningTokens: 20 }
        - parts: [{ type: text, text: "SYN-CACHED reply." }]
          usage: { inputTokens: 5, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
script:
  - action: run
    bind: $sFailed
    tenant: t1
    principal: p1
    persona: assistant@1
    overrides: { budget: { tokens: 100 } }
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: budget_exhausted }
  - action: run
    bind: $sBelow
    tenant: t1
    principal: p1
    persona: assistant@1
    overrides: { budget: { tokens: 100 } }
    input: [{ type: text, text: "Look up k2" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sCached
    tenant: t1
    principal: p1
    persona: assistant@1
    overrides: { budget: { tokens: 100 } }
    input: [{ type: text, text: "Look up k3" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sFailed:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.request, step: 1 }
          - { type: error, payload: { error: { category: unavailable } } }
          - { type: model.request, step: 1 }
          - { type: model.response, step: 1 }
          - { type: run.ended, payload: { reason: budget_exhausted } }
      absentEvents:
        - { type: model.request, step: 2 }
    $sBelow:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.response, step: 1 }
          - { type: model.request, step: 2 }
          - { type: run.ended, payload: { reason: responded } }
    $sCached:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.response, step: 1 }
          - { type: model.request, step: 2 }
          - { type: run.ended, payload: { reason: responded } }
  providerRequests:
    scripted-a: { count: 7 }
    scripted-b: { count: 0 }
  stubCalls:
    lookup: { count: 3 }
