schemaVersion: "0.1.0"
id: providers.failover-recorded
title: A failover emits an `error` event for the failed call, then a `model.request` recording the fallback and the reason
description: >-
  As settled in the 2026-11-02 amendment (PROV-060–063, PROV-065): each
  failover emits an `error` event carrying the provider and model called
  and the failure's category and code, before the next `model.request`,
  which records `role: fallback`, `fallbackReason: failover` and the
  fallback's provider and model.


  - $sCross (persona `assistant@1`): the turn's first call, to
    scripted-a/model-a, fails with an authentication error; the harness
    fails over to scripted-b/model-b.
  - $sSame (persona `dual@1`: fallbacks [scripted-a/model-a2,
    scripted-b/model-b]): step 1 asks for a lookup; step 2's call to
    model-a fails with a retryable `unavailable` three times (the call and
    `retry.unavailable` 2 retries); the harness fails over mid-turn to
    model-a2. Every failed attempt, retries included, emits its own
    `error` event naming model-a and agentry.provider.unavailable (PROV-065
    reading, amendment 2026-11-02): exactly three at step 2, the last
    before the fallback's request.
requirements: [PROV-065, EVAL-031]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Persona
        id: dual
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant with two fallbacks
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-a, name: model-a2 }
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # $sCross, step 1 (model-a)
        - error: { category: unavailable, code: agentry.provider.auth, retryable: false }
        # $sSame, step 1 (model-a)
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sSame, step 2 (model-a): the call and two retries
        - error: { category: unavailable, code: agentry.provider.unavailable, retryable: true }
        - error: { category: unavailable, code: agentry.provider.unavailable, retryable: true }
        - error: { category: unavailable, code: agentry.provider.unavailable, retryable: true }
        # $sSame, step 2 (model-a2)
        - parts: [{ type: text, text: "SYN-SAME reply." }]
          usage: { inputTokens: 40, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b:
      responses:
        # $sCross, step 1 (model-b)
        - parts: [{ type: text, text: "SYN-CROSS reply." }]
          usage: { inputTokens: 20, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "SYN-VALUE-1" } }
script:
  - action: run
    bind: $sCross
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sSame
    tenant: t1
    principal: p1
    persona: dual@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sCross:
      events:
        mode: subsequence
        items:
          - { type: model.request, turn: 1, step: 1, payload: { provider: scripted-a, model: model-a, role: primary } }
          - type: error
            payload:
              provider: scripted-a
              model: model-a
              error: { category: unavailable, code: agentry.provider.auth, retryable: false, source: provider }
          - { type: model.request, turn: 1, step: 1, payload: { provider: scripted-b, model: model-b, role: fallback, fallbackReason: failover } }
          - { type: model.response, turn: 1, step: 1, payload: { provider: scripted-b, model: model-b } }
          - { type: run.ended, payload: { reason: responded } }
    $sSame:
      events:
        mode: subsequence
        items:
          - { type: model.request, turn: 1, step: 2, payload: { provider: scripted-a, model: model-a, role: primary } }
          - type: error
            payload:
              provider: scripted-a
              model: model-a
              error: { category: unavailable, code: agentry.provider.unavailable, retryable: true, source: provider }
          - { type: model.request, turn: 1, step: 2, payload: { provider: scripted-a, model: model-a, role: primary } }
          - type: error
            payload:
              provider: scripted-a
              model: model-a
              error: { category: unavailable, code: agentry.provider.unavailable, retryable: true, source: provider }
          - { type: model.request, turn: 1, step: 2, payload: { provider: scripted-a, model: model-a, role: primary } }
          - type: error
            payload:
              provider: scripted-a
              model: model-a
              error: { category: unavailable, code: agentry.provider.unavailable, retryable: true, source: provider }
          - { type: model.request, turn: 1, step: 2, payload: { provider: scripted-a, model: model-a2, role: fallback, fallbackReason: failover } }
          - { type: model.response, turn: 1, step: 2, payload: { provider: scripted-a, model: model-a2 } }
          - { type: run.ended, payload: { reason: responded } }
  ports:
    eventLog:
      t1:
        $sSame:
          $count: { of: { type: error, turn: 1, step: 2, payload: { provider: scripted-a, model: model-a } }, equals: 3 }
  providerRequests:
    scripted-a:
      - { model: model-a }
      - { model: model-a }
      - { model: model-a }
      - { model: model-a }
      - { model: model-a }
      - { model: model-a2 }
    scripted-b:
      - { model: model-b }
