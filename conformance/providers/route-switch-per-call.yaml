schemaVersion: "0.1.0"
id: providers.route-switch-per-call
title: A routing switch applies to one model call; the next step is routed afresh and returns to the primary once the label has left context
description: >-
  The bundle adds the label example.test:b-only, allowed only on
  scripted-b; `lookup` declares it. The profile compacts by truncation at
  80%. scripted-a and scripted-b declare contextLimit 120 and
  maxOutputTokens 20 (available space 100, trigger 80, PROV-044) and count
  0 tokens per non-text part, so only words of text parts count (PROV-045):
  system content is 8 ("Follow organisational policy." 3 + "You are a test
  assistant." 5); the principal text is 3.

  - Step 1 (scripted-a, primary): 11 tokens. scripted-a answers a 30-word
    text and a lookup call; the result is labelled b-only.
  - Step 2: 41 tokens, no compaction. The b-only result is in context, so
    routing switches to scripted-b (policy.decision routing/switch, details
    scripted-b/model-b; model.request fallback/routing). scripted-b
    answers a 45-word text and a note_lookup call (unlabelled).
  - Step 3: 86 > 80, so step 1 (30 words, holding the b-only result) is
    dropped: 56. No b-only part remains, so routing starts again from the
    primary (PROV-054): scripted-a, role primary, no second routing
    decision. Its request holds exactly the system content, the principal
    message and step 2.

  Exactly one routing decision is emitted in the session, and scripted-b
  receives exactly one request.
requirements: [PROV-054]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: PolicyBundle
        id: org
        version: 1
        schemaVersion: "0.1.0"
        policyInstructions: "Follow organisational policy."
        defaultFallbackMessage: "I can't help with that request."
        sensitivityPolicies:
          pii:
            allowedProviders: [scripted-a, scripted-b]
            redaction: [{ mode: mask }]
          phi:
            allowedProviders: [scripted-a]
            redaction: [{ mode: mask }]
          "example.test:b-only":
            allowedProviders: [scripted-b]
            redaction: [{ mode: mask }]
      - kind: Tool
        id: lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up a record by key.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        sensitivity: ["example.test:b-only"]
        binding: { kind: native, handler: test.lookup }
      - kind: Tool
        id: note_lookup
        version: 1
        schemaVersion: "0.1.0"
        description: Look up an unlabelled note.
        input:
          type: object
          additionalProperties: false
          required: [key]
          properties: { key: { type: string } }
        effect: read
        binding: { kind: native, handler: test.note_lookup }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, note_lookup@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
      - kind: HarnessProfile
        id: default
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { compaction: { mode: truncate, triggerPercent: 80 } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      tokenCounting: { nonTextPart: 0 }
      responses:
        # Step 1
        - parts:
            - { type: text, text: "SYN-S1-01 SYN-S1-02 SYN-S1-03 SYN-S1-04 SYN-S1-05 SYN-S1-06 SYN-S1-07 SYN-S1-08 SYN-S1-09 SYN-S1-10 SYN-S1-11 SYN-S1-12 SYN-S1-13 SYN-S1-14 SYN-S1-15 SYN-S1-16 SYN-S1-17 SYN-S1-18 SYN-S1-19 SYN-S1-20 SYN-S1-21 SYN-S1-22 SYN-S1-23 SYN-S1-24 SYN-S1-25 SYN-S1-26 SYN-S1-27 SYN-S1-28 SYN-S1-29 SYN-S1-30" }
            - { type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }
          usage: { inputTokens: 11, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
        # Step 3
        - parts: [{ type: text, text: "Done." }]
          usage: { inputTokens: 56, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      tokenCounting: { nonTextPart: 0 }
      responses:
        # Step 2
        - parts:
            - { type: text, text: "SYN-S2-01 SYN-S2-02 SYN-S2-03 SYN-S2-04 SYN-S2-05 SYN-S2-06 SYN-S2-07 SYN-S2-08 SYN-S2-09 SYN-S2-10 SYN-S2-11 SYN-S2-12 SYN-S2-13 SYN-S2-14 SYN-S2-15 SYN-S2-16 SYN-S2-17 SYN-S2-18 SYN-S2-19 SYN-S2-20 SYN-S2-21 SYN-S2-22 SYN-S2-23 SYN-S2-24 SYN-S2-25 SYN-S2-26 SYN-S2-27 SYN-S2-28 SYN-S2-29 SYN-S2-30 SYN-S2-31 SYN-S2-32 SYN-S2-33 SYN-S2-34 SYN-S2-35 SYN-S2-36 SYN-S2-37 SYN-S2-38 SYN-S2-39 SYN-S2-40 SYN-S2-41 SYN-S2-42 SYN-S2-43 SYN-S2-44 SYN-S2-45" }
            - { type: tool_call, callId: c2, tool: note_lookup, arguments: { key: k2 } }
          usage: { inputTokens: 41, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      lookup:
        - ok: { output: { value: "SYN-BONLY-0054" } }
      note_lookup:
        - ok: { output: { value: "SYN-NOTE-0054" } }
script:
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.request, turn: 1, step: 1, payload: { provider: scripted-a, model: model-a, role: primary } }
          - { type: tool.result, labels: { $contains: ["example.test:b-only"] }, payload: { callId: c1 } }
          - { type: policy.decision, payload: { kind: routing, outcome: switch, details: { provider: scripted-b, model: model-b } } }
          - { type: model.request, turn: 1, step: 2, payload: { provider: scripted-b, model: model-b, role: fallback, fallbackReason: routing } }
          - { type: tool.result, payload: { callId: c2 } }
          - { type: context.compacted, turn: 1, step: 3, payload: { mode: truncate, units: [{ turn: 1, step: 1 }] } }
          - { type: model.request, turn: 1, step: 3, payload: { provider: scripted-a, model: model-a, role: primary, fallbackReason: { $absent: true } } }
          - { type: run.ended, payload: { reason: responded } }
  ports:
    eventLog:
      t1:
        $s:
          $count: { of: { type: policy.decision }, equals: 1 }
  providerRequests:
    scripted-a:
      - {}
      - messages:
          - role: system
            parts:
              - { type: text, text: "Follow organisational policy." }
              - { type: text, text: "You are a test assistant." }
          - role: principal
            parts: [{ type: text, text: "Look up k1" }]
          - role: assistant
            parts:
              - { type: text }
              - { type: tool_call, callId: c2, tool: note_lookup }
          - role: tool
            parts: [{ type: tool_result, callId: c2, labels: [] }]
    scripted-b:
      - messages:
          $contains:
            - role: tool
              parts: [{ type: tool_result, callId: c1, labels: ["example.test:b-only"] }]
  delivered:
    $s: { text: "Done.", fallback: false }
