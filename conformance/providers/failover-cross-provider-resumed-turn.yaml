schemaVersion: "0.1.0"
id: providers.failover-cross-provider-resumed-turn
title: In a resumed turn, failover to another provider stays allowed until a session model call of the turn has succeeded, whichever run made it
description: >-
  Per the PROV-062 reading (amendment 2026-11-02), failover to a different
  provider is allowed until a session model call of the turn has
  succeeded, including in a resumed turn whose earlier runs made no
  successful session model call. Persona assistant: scripted-a/model-a,
  only fallback scripted-b/model-b (another provider). Two required rule
  hooks escalate: gate-ss at sessionStart when the input holds
  SYN-SS-0062, and gate-tool at beforeToolCall on update_record. Every
  model failure below is an authentication error (`unavailable`, not
  retryable), so it is eligible for failover at once (PROV-060).

  - $sStart: gate-ss escalates before any model call; the first run ends
    `escalated` with no `model.request`. The reviewer approves and the
    resume run continues turn 1: its first session model call (model-a)
    fails, and the harness fails over to scripted-b/model-b (role
    fallback, fallbackReason failover), which answers. No session model
    call of the turn had succeeded, so cross-provider failover is allowed.
  - $sMid (contrast): step 1 (model-a) succeeds with an update_record call
    and gate-tool escalates; the first run ends `escalated`. After
    approval the resume run dispatches update_record, and step 2's call to
    model-a fails. A session model call of this turn (step 1, in the
    earlier run) has succeeded, so scripted-b is not eligible and there is
    no same-provider fallback: the error is `fatal`, the run ends
    `failed` and the session closes. scripted-b is never called.
requirements: [PROV-062]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Hook
        id: gate-ss
        version: 1
        schemaVersion: "0.1.0"
        points: [sessionStart]
        results: [escalate]
        timeoutMs: 1000
        source: { kind: rule, when: "content.exists(p, p.type == 'text' && p.text.contains('SYN-SS-0062'))", then: { result: escalate, reasonCode: test.hook.review } }
      - kind: Hook
        id: gate-tool
        version: 1
        schemaVersion: "0.1.0"
        points: [beforeToolCall]
        results: [escalate]
        timeoutMs: 1000
        source: { kind: rule, when: "tool.id == 'update_record'", then: { result: escalate, reasonCode: test.hook.review } }
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1]
        requiredHooks: [gate-ss@1, gate-tool@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals:
        - { id: p1, subject: user-1, assurance: multi_factor }
        - { id: r1, subject: reviewer-1, assurance: multi_factor, roles: [reviewer] }
  providers:
    scripted-a:
      responses:
        # $sStart, resume run, step 1 (model-a): fails
        - error: { category: unavailable, code: agentry.provider.auth, retryable: false }
        # $sMid, first run, step 1 (model-a)
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 20, outputTokens: 5, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sMid, resume run, step 2 (model-a): fails
        - error: { category: unavailable, code: agentry.provider.auth, retryable: false }
    scripted-b:
      responses:
        # $sStart, resume run, step 1 (model-b)
        - parts: [{ type: text, text: "SYN-RESUMED-START reply." }]
          usage: { inputTokens: 20, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record:
        - ok: { output: { updated: true } }
script:
  - action: run
    bind: $sStart
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "SYN-SS-0062 hello" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.pendingActions.0.id: $actStart }
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $sStart
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000621", pendingActionId: $actStart, type: approve }
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sMid
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Set k1 to v1" }]
    capture:
      - event: { type: escalation.raised }
        bind: { payload.escalation.pendingActions.0.id: $actMid }
    expect: { ok: true, endReason: escalated }
  - action: resume
    session: $sMid
    reviewer: r1
    decisions:
      - { decisionId: "01900000-0000-7000-8000-000000000622", pendingActionId: $actMid, type: approve }
    expect: { ok: true, endReason: failed }
expect:
  sessions:
    $sStart:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: run.ended, payload: { reason: escalated } }
          - { type: escalation.resolved }
          - { type: model.request, turn: 1, step: 1, payload: { provider: scripted-a, model: model-a, role: primary } }
          - { type: error, payload: { provider: scripted-a, model: model-a, error: { category: unavailable, code: agentry.provider.auth } } }
          - { type: model.request, turn: 1, step: 1, payload: { provider: scripted-b, model: model-b, role: fallback, fallbackReason: failover } }
          - { type: model.response, turn: 1, step: 1, payload: { provider: scripted-b, model: model-b } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: turn.started, turn: 2 }
    $sMid:
      state: closed
      closeReason: failed
      events:
        mode: subsequence
        items:
          - { type: model.response, turn: 1, step: 1, payload: { provider: scripted-a, model: model-a } }
          - { type: run.ended, payload: { reason: escalated } }
          - { type: escalation.resolved }
          - { type: tool.result, payload: { callId: c1 } }
          - { type: model.request, turn: 1, step: 2, payload: { provider: scripted-a, model: model-a, role: primary } }
          - { type: error, payload: { provider: scripted-a, model: model-a, error: { category: unavailable, code: agentry.provider.auth } } }
          - { type: run.ended, payload: { reason: failed } }
          - { type: session.closed, payload: { reason: failed } }
      absentEvents:
        - { type: model.request, payload: { provider: scripted-b } }
        - { type: model.request, payload: { role: fallback } }
  providerRequests:
    scripted-a:
      - { model: model-a }
      - { model: model-a }
      - { model: model-a }
    scripted-b:
      - { model: model-b }
  stubCalls:
    update_record: { count: 1 }
  delivered:
    $sStart: { text: "SYN-RESUMED-START reply.", fallback: false }
