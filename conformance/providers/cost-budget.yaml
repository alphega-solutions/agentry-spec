schemaVersion: "0.1.0"
id: providers.cost-budget
title: A cost budget counts every model call in the turn except model hooks, and is reached when the cost equals it
description: >-
  Same deployment, price table, personas and hook as
  providers.cost-recorded (USD per million tokens: scripted-a/model-a
  2000, 500, 10000, 20000; scripted-judge/judge-1 2000, 2000, 4000, 4000;
  scripted-c/model-c 15625 each; scripted-sum/sum-1 15625, 15625, 31250,
  31250). Every model that could run for either persona is priced
  (PROV-073). Each run request sets `budget.cost` (CFG-101). Per the
  2026-11-02 amendment, `budget.cost` counts the cost of every model call
  in the turn except model hooks — failed calls and the summarizer
  included (PROV-074) — and is reached when the turn's cost is equal to or
  greater than it; the run then ends `budget_exhausted`.


  - $sEqual (assistant, budget 1): step 1 asks for a lookup with 250 + 50
    tokens → 0.5 + 0.5 = 1 USD. The budget is reached exactly: no step-2
    call.
  - $sBelow (control, assistant, budget 1): step 1 uses 125 + 50 → 0.75;
    step 2 (62 + 0 → 0.124) answers; the run responds.
  - $sFailed (assistant, budget 3): step 1's first call fails (retryable)
    reporting 1000 input tokens → 2 USD; the retry asks for a lookup → 1
    USD. The turn is at 3: reached, no step-2 call. Without the failed
    call it would be at 1.
  - $sHook (assistant, budget 1): step 1 asks to update k1 (0.5); the
    model hook `judge` blocks it at a cost of 1 USD, recorded on its
    decision but not counted; step 2 asks for a lookup (0.124), step 3
    answers (0.124): 0.748 in all, and the run responds. Counting the
    hook's cost would reach the budget before step 3.
  - $sSum (compactor, budget 3 on both runs): turn 1 costs 0.75. In turn 2
    the summarizer costs 2 (recorded on `context.compacted`) and step 1
    asks for a lookup with 57 + 7 tokens → 1: the turn is at 3, reached,
    no step-2 call. Without the summarizer's cost it would be at 1.


  Not asserted: whether a lookup requested by the last call runs before
  the run ends. Format reading as in providers.usage-recorded for the
  failed call's usage.
requirements: [PROV-074]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          - { id: scripted-c, adapter: scripted, endpoint: "memory://scripted-c", region: test-region, retainsData: false }
          - { id: scripted-sum, adapter: scripted, endpoint: "memory://scripted-sum", region: test-region, retainsData: false }
          - { id: scripted-judge, adapter: scripted, endpoint: "memory://scripted-judge", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
        priceTable:
          currency: USD
          models:
            - { provider: scripted-a, name: model-a, input: 2000, cachedInput: 500, output: 10000, reasoning: 20000 }
            - { provider: scripted-b, name: model-b, input: 1000, cachedInput: 250, output: 5000, reasoning: 15000 }
            - { provider: scripted-c, name: model-c, input: 15625, cachedInput: 15625, output: 15625, reasoning: 15625 }
            - { provider: scripted-sum, name: sum-1, input: 15625, cachedInput: 15625, output: 31250, reasoning: 31250 }
            - { provider: scripted-judge, name: judge-1, input: 2000, cachedInput: 2000, output: 4000, reasoning: 4000 }
      - kind: Hook
        id: judge
        version: 1
        schemaVersion: "0.1.0"
        points: [beforeToolCall]
        results: [block]
        timeoutMs: 1000
        match: "tool.id == 'update_record'"
        source:
          kind: model
          model: { provider: scripted-judge, name: judge-1 }
          instructions: "Decide whether this tool call is allowed. Answer with a HookResult."
          maxTokens: 1000
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1, update_record@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        requiredHooks: [judge@1]
        model:
          provider: scripted-a
          name: model-a
          fallbacks:
            - { provider: scripted-b, name: model-b }
      - kind: HarnessProfile
        id: compact
        version: 1
        schemaVersion: "0.1.0"
        idleTtl: PT24H
        suspendedTtl: PT72H
        stepLimit: 8
        deliveryMode: buffered
        budget: { tokens: 100000 }
        timeouts: { run: PT5M, tool: PT30S }
        retry: { unavailable: 2 }
        outputRetryLimit: 2
        limits: { partSize: 1048576, sessionSize: 10485760 }
        defaultAttachmentLabels: []
        context: { compaction: { mode: summarize, model: { provider: scripted-sum, name: sum-1 } } }
      - kind: Persona
        id: compactor
        version: 1
        schemaVersion: "0.1.0"
        displayName: Compacting assistant
        instructions: "You are a test assistant."
        tools: [lookup@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: compact@1
        allowedProfiles: [compact@1]
        model: { provider: scripted-c, name: model-c }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        # $sEqual, step 1 → 1
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }]
          usage: { inputTokens: 250, outputTokens: 50, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sBelow, step 1 → 0.75; step 2 → 0.124
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k2 } }]
          usage: { inputTokens: 125, outputTokens: 50, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "SYN-BELOW reply." }]
          usage: { inputTokens: 62, outputTokens: 0, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sFailed, step 1: failed call → 2; retry → 1
        - error: { category: unavailable, code: agentry.provider.unavailable, retryable: true }
          usage: { inputTokens: 1000, outputTokens: 0, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k3 } }]
          usage: { inputTokens: 250, outputTokens: 50, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sHook, step 1 → 0.5; step 2 → 0.124; step 3 → 0.124
        - parts: [{ type: tool_call, callId: c1, tool: update_record, arguments: { key: k1, value: v1 } }]
          usage: { inputTokens: 125, outputTokens: 25, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: tool_call, callId: c2, tool: lookup, arguments: { key: k4 } }]
          usage: { inputTokens: 62, outputTokens: 0, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "SYN-HOOK reply." }]
          usage: { inputTokens: 62, outputTokens: 0, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
    scripted-c:
      capabilities: { contextLimit: 120, maxOutputTokens: 20 }
      responses:
        # $sSum, turn 1 → 0.75
        - parts: [{ type: text, text: "SYN-CR-01 SYN-CR-02 SYN-CR-03 SYN-CR-04 SYN-CR-05 SYN-CR-06 SYN-CR-07 SYN-CR-08 SYN-CR-09 SYN-CR-10 SYN-CR-11 SYN-CR-12 SYN-CR-13 SYN-CR-14 SYN-CR-15 SYN-CR-16 SYN-CR-17 SYN-CR-18 SYN-CR-19 SYN-CR-20" }]
          usage: { inputTokens: 28, outputTokens: 20, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sSum, turn 2, step 1 → 1 (with the summarizer's 2 → 3)
        - parts: [{ type: tool_call, callId: c1, tool: lookup, arguments: { key: k5 } }]
          usage: { inputTokens: 57, outputTokens: 7, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-sum:
      responses:
        # $sSum, turn 2 → 2
        - parts: [{ type: text, text: "SYN-SUMMARY-0001 SYN-SUMMARY-0002 SYN-SUMMARY-0003 SYN-SUMMARY-0004" }]
          usage: { inputTokens: 64, outputTokens: 32, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-judge:
      responses:
        # $sHook → 1 (not counted)
        - parts: [{ type: structured, value: { result: block, reasonCode: test.guard.blocked } }]
          usage: { inputTokens: 250, outputTokens: 125, cachedInputTokens: 0, reasoningTokens: 0 }
  stubs:
    tools:
      update_record: []
script:
  - action: run
    bind: $sEqual
    tenant: t1
    principal: p1
    persona: assistant@1
    overrides: { budget: { cost: 1 } }
    input: [{ type: text, text: "Look up k1" }]
    expect: { ok: true, endReason: budget_exhausted }
  - action: run
    bind: $sBelow
    tenant: t1
    principal: p1
    persona: assistant@1
    overrides: { budget: { cost: 1 } }
    input: [{ type: text, text: "Look up k2" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sFailed
    tenant: t1
    principal: p1
    persona: assistant@1
    overrides: { budget: { cost: 3 } }
    input: [{ type: text, text: "Look up k3" }]
    expect: { ok: true, endReason: budget_exhausted }
  - action: run
    bind: $sHook
    tenant: t1
    principal: p1
    persona: assistant@1
    overrides: { budget: { cost: 1 } }
    input: [{ type: text, text: "Set k1 to v1" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sSum
    tenant: t1
    principal: p1
    persona: compactor@1
    overrides: { budget: { cost: 3 } }
    input: [{ type: text, text: "SYN-CP-01 SYN-CP-02 SYN-CP-03 SYN-CP-04 SYN-CP-05 SYN-CP-06 SYN-CP-07 SYN-CP-08 SYN-CP-09 SYN-CP-10 SYN-CP-11 SYN-CP-12 SYN-CP-13 SYN-CP-14 SYN-CP-15 SYN-CP-16 SYN-CP-17 SYN-CP-18 SYN-CP-19 SYN-CP-20" }]
    expect: { ok: true, endReason: responded }
  - action: run
    session: $sSum
    principal: p1
    overrides: { budget: { cost: 3 } }
    input: [{ type: text, text: "SYN-CQ-01 SYN-CQ-02 SYN-CQ-03 SYN-CQ-04 SYN-CQ-05 SYN-CQ-06 SYN-CQ-07 SYN-CQ-08 SYN-CQ-09 SYN-CQ-10 SYN-CQ-11 SYN-CQ-12 SYN-CQ-13 SYN-CQ-14 SYN-CQ-15 SYN-CQ-16 SYN-CQ-17 SYN-CQ-18 SYN-CQ-19 SYN-CQ-20 SYN-CQ-21 SYN-CQ-22 SYN-CQ-23 SYN-CQ-24 SYN-CQ-25 SYN-CQ-26 SYN-CQ-27 SYN-CQ-28 SYN-CQ-29 SYN-CQ-30 SYN-CQ-31 SYN-CQ-32 SYN-CQ-33 SYN-CQ-34 SYN-CQ-35 SYN-CQ-36 SYN-CQ-37 SYN-CQ-38 SYN-CQ-39 SYN-CQ-40 SYN-CQ-41 SYN-CQ-42 SYN-CQ-43 SYN-CQ-44 SYN-CQ-45" }]
    expect: { ok: true, endReason: budget_exhausted }
expect:
  sessions:
    $sEqual:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.response, step: 1, payload: { cost: { amount: 1, currency: USD } } }
          - { type: run.ended, payload: { reason: budget_exhausted } }
      absentEvents:
        - { type: model.request, step: 2 }
    $sBelow:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.response, step: 1 }
          - { type: model.request, step: 2 }
          - { type: run.ended, payload: { reason: responded } }
    $sFailed:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: error, payload: { provider: scripted-a, model: model-a, cost: { amount: 2, currency: USD } } }
          - { type: model.response, step: 1, payload: { cost: { amount: 1, currency: USD } } }
          - { type: run.ended, payload: { reason: budget_exhausted } }
      absentEvents:
        - { type: model.request, step: 2 }
    $sHook:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: hook.decision, payload: { hook: judge@1, result: block, cost: { amount: 1, currency: USD } } }
          - { type: model.request, step: 2 }
          - { type: model.request, step: 3 }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: run.ended, payload: { reason: budget_exhausted } }
    $sSum:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: run.ended, payload: { reason: responded } }
          - { type: context.compacted, turn: 2, step: 1, payload: { mode: summarize, cost: { amount: 2, currency: USD } } }
          - { type: model.response, turn: 2, step: 1, payload: { cost: { amount: 1, currency: USD } } }
          - { type: run.ended, payload: { reason: budget_exhausted } }
      absentEvents:
        - { type: model.request, turn: 2, step: 2 }
  providerRequests:
    scripted-a: { count: 8 }
    scripted-b: { count: 0 }
    scripted-c: { count: 2 }
    scripted-sum: { count: 1 }
    scripted-judge: { count: 1 }
  stubCalls:
    update_record: { count: 0 }
