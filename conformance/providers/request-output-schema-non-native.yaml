schemaVersion: "0.1.0"
id: providers.request-output-schema-non-native
title: An output schema on a model without native structured output is accepted, and the harness validates, corrects or fails the output itself
description: >-
  scripted-a declares `structuredOutput: false`. Persona extractor (primary
  scripted-a, no fallbacks, no tools) declares an output schema; the
  configuration loads (PROV-041: an output schema does not require
  `structuredOutput`). outputRetryLimit is 2.

  - $sCorrected: the first answer is text only (no structured value), so
    validation fails and the harness requests a correction (step 2, CORE-132);
    the second answer is a structured value with quantity 0, which fails the
    schema's minimum, so a second correction is requested (step 3); the
    third is valid and the run responds with it.
  - $sFailed: three invalid answers; the retry limit is reached and the
    run ends `failed` with agentry.output.schema_mismatch (fatal), the
    session closed (CORE-133). No fourth call is made.

  Every request still carries the output schema (PROV-002; how a
  non-native adapter conveys it, e.g. in its instructions, is
  adapter-specific and checked by adapter cases).


  Reading chosen: the scripted adapter returns parts as scripted, so a
  valid answer is given as a `structured` part. The spec does not say
  whether, for a model without `structuredOutput`, JSON text is turned into
  a `structured` part by the adapter or by the harness (the Area 5 reading
  for model hooks parses response text only for hooks, HOOK-101); this
  fixture does not depend on it.
requirements: [PROV-041]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Persona
        id: extractor
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test extractor
        instructions: "Extract the order as JSON."
        tools: []
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1]
        model: { provider: scripted-a, name: model-a }
        outputSchema:
          type: object
          additionalProperties: false
          required: [item, quantity]
          properties:
            item: { type: string }
            quantity: { type: integer, minimum: 1 }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { structuredOutput: false }
      responses:
        # $sCorrected
        - parts: [{ type: text, text: "Two widgets." }]
          usage: { inputTokens: 20, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: structured, value: { item: widget, quantity: 0 } }]
          usage: { inputTokens: 30, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: structured, value: { item: widget, quantity: 2 } }]
          usage: { inputTokens: 40, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sFailed
        - parts: [{ type: text, text: "Some widgets." }]
          usage: { inputTokens: 20, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: structured, value: { item: widget, quantity: "two" } }]
          usage: { inputTokens: 30, outputTokens: 6, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: structured, value: { item: widget } }]
          usage: { inputTokens: 40, outputTokens: 4, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
script:
  - action: run
    bind: $sCorrected
    tenant: t1
    principal: p1
    persona: extractor@1
    input: [{ type: text, text: "Two widgets, please" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sFailed
    tenant: t1
    principal: p1
    persona: extractor@1
    input: [{ type: text, text: "Some widgets, please" }]
    expect: { ok: true, endReason: failed }
expect:
  sessions:
    $sCorrected:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.request, turn: 1, step: 1, payload: { provider: scripted-a, model: model-a, role: primary } }
          - { type: model.request, turn: 1, step: 2, payload: { provider: scripted-a, model: model-a, role: primary } }
          - { type: model.request, turn: 1, step: 3, payload: { provider: scripted-a, model: model-a, role: primary } }
          - type: model.response
            turn: 1
            step: 3
            payload: { message: { parts: { $contains: [{ type: structured, value: { item: widget, quantity: 2 } }] } } }
          - { type: run.ended, payload: { reason: responded } }
      absentEvents:
        - { type: model.request, step: 4 }
    $sFailed:
      state: closed
      closeReason: failed
      events:
        mode: subsequence
        items:
          - { type: model.request, step: 3 }
          - type: run.ended
            payload:
              reason: failed
              error: { code: agentry.output.schema_mismatch, category: fatal }
      absentEvents:
        - { type: model.request, step: 4 }
  providerRequests:
    scripted-a:
      # $sCorrected, steps 1-3
      - { outputSchema: { required: [item, quantity], properties: { quantity: { type: integer, minimum: 1 } } } }
      - { outputSchema: { required: [item, quantity], properties: { quantity: { type: integer, minimum: 1 } } } }
      - { outputSchema: { required: [item, quantity], properties: { quantity: { type: integer, minimum: 1 } } } }
      # $sFailed, steps 1-3
      - { outputSchema: { required: [item, quantity], properties: { quantity: { type: integer, minimum: 1 } } } }
      - { outputSchema: { required: [item, quantity], properties: { quantity: { type: integer, minimum: 1 } } } }
      - { outputSchema: { required: [item, quantity], properties: { quantity: { type: integer, minimum: 1 } } } }
    scripted-b: { count: 0 }
  delivered:
    $sCorrected:
      parts:
        $contains:
          - { type: structured, value: { item: widget, quantity: 2 } }
