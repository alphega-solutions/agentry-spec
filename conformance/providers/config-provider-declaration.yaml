schemaVersion: "0.1.0"
id: providers.config-provider-declaration
title: A provider declaration needs an ID, adapter, endpoint, region and retainsData; one missing any of them is rejected
description: >-
  Each failing load replaces the deployment with one whose scripted-b
  declaration omits exactly one required member (region, retainsData,
  endpoint, adapter); everything else equals the baseline. Each is a
  configuration error, and a failed load leaves the previous snapshot in
  force. The control declares scripted-b in full, with `retainsData: true`
  and a further data-handling attribute, and loads; a session created
  after it runs on the primary scripted-a/model-a.
requirements: [PROV-010]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config: { base: baseline }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: text, text: "Hello." }]
          usage: { inputTokens: 20, outputTokens: 1, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
script:
  # No region.
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
    expect: { ok: false, error: { category: configuration } }
  # No retainsData.
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region }
          ports:
            eventLog: { adapter: memory, region: test-region }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
    expect: { ok: false, error: { category: configuration } }
  # No endpoint.
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
            - { id: scripted-b, adapter: scripted, region: test-region, retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
    expect: { ok: false, error: { category: configuration } }
  # No adapter.
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
            - { id: scripted-b, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          ports:
            eventLog: { adapter: memory, region: test-region }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
    expect: { ok: false, error: { category: configuration } }
  # Control: complete declaration with data-handling attributes.
  - load:
      artifacts:
        - kind: Deployment
          id: test
          version: 1
          schemaVersion: "0.1.0"
          environment: test
          policyBundles: [org@1]
          attachmentSources: [upload, email]
          providers:
            - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
            - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: true, attributes: { zeroDataRetention: false } }
          ports:
            eventLog: { adapter: memory, region: test-region }
            checkpointStore: { adapter: memory, region: test-region }
            idempotencyStore: { adapter: memory, region: test-region }
            snapshotStore: { adapter: memory, region: test-region }
            blobStore: { adapter: memory, region: test-region }
            auditLog: { adapter: memory, region: test-region }
            secrets: { adapter: memory, region: test-region }
          retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
    expect: { ok: true }
  - action: run
    bind: $s
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Hi" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $s:
      events:
        mode: subsequence
        items:
          - { type: model.request, payload: { provider: scripted-a, model: model-a, role: primary } }
          - { type: run.ended, payload: { reason: responded } }
  providerRequests:
    scripted-a: { count: 1 }
    scripted-b: { count: 0 }
