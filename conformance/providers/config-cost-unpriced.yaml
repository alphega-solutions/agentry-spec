schemaVersion: "0.1.0"
id: providers.config-cost-unpriced
title: A cost budget requires a price for every model that could run for the persona; otherwise load is rejected and a run request is invalid_input
description: >-
  The deployment declares scripted-a, scripted-b, scripted-sum and
  scripted-judge and prices, in USD, the assistant's primary
  (scripted-a/model-a), its fallback (scripted-b/model-b), its summarizer
  (`compaction.model` scripted-sum/sum-1, with `mode: summarize`) and its
  required model hook judge@1 (scripted-judge/judge-1). The hook runs at
  beforeToolCall and no run here calls a tool, so it is never invoked. No
  layer sets `budget.cost` in setup.

  - Control: with every candidate priced, a run request setting
    `budget.cost` is accepted and responds.
  - For each candidate in turn (primary, fallback, summarizer, model
    hook): a deployment pricing every candidate but that one loads (no
    cost budget is set); a run request setting `budget.cost` is then
    rejected with `invalid_input` and persists nothing; and loading
    default@1 with `budget.cost` is a configuration error.
  - Finally the complete price table with default@1 setting `budget.cost`
    loads, and a session runs.
requirements: [PROV-073]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Deployment
        id: test
        version: 1
        schemaVersion: "0.1.0"
        environment: test
        policyBundles: [org@1]
        attachmentSources: [upload, email]
        providers:
          - { id: scripted-a, adapter: scripted, endpoint: "memory://scripted-a", region: test-region, retainsData: false }
          - { id: scripted-b, adapter: scripted, endpoint: "memory://scripted-b", region: test-region, retainsData: false }
          - { id: scripted-sum, adapter: scripted, endpoint: "memory://scripted-sum", region: test-region, retainsData: false }
          - { id: scripted-judge, adapter: scripted, endpoint: "memory://scripted-judge", region: test-region, retainsData: false }
        ports:
          eventLog: { adapter: memory, region: test-region }
          checkpointStore: { adapter: memory, region: test-region }
          idempotencyStore: { adapter: memory, region: test-region }
          snapshotStore: { adapter: memory, region: test-region }
          blobStore: { adapter: memory, region: test-region }
          auditLog: { adapter: memory, region: test-region }
          secrets: { adapter: memory, region: test-region }
        retention: { events: P30D, checkpoints: P30D, idempotency: P30D, blobs: P30D, snapshots: P30D, audit: P365D }
        priceTable:
          currency: USD
          models:
            - { provider: scripted-a, name: model-a, input: 2, cachedInput: 1, output: 4, reasoning: 8 }
            - { provider: scripted-b, name: model-b, input: 2, cachedInput: 1, output: 4, reasoning: 8 }
            - { provider: scripted-sum, name: sum-1, input: 2, cachedInput: 1, output: 4, reasoning: 8 }
            - { provider: scripted-judge, name: judge-1, input: 2, cachedInput: 1, output: 4, reasoning: 8 }
      - { kind: HarnessProfile, id: default, version: 1, schemaVersion: "0.1.0", idleTtl: PT24H, suspendedTtl: PT72H, stepLimit: 8, deliveryMode: buffered, budget: { tokens: 100000 }, timeouts: { run: PT5M, tool: PT30S }, retry: { unavailable: 2 }, outputRetryLimit: 2, limits: { partSize: 1048576, sessionSize: 10485760 }, defaultAttachmentLabels: [], context: { compaction: { mode: summarize, model: { provider: scripted-sum, name: sum-1 } } } }
      - { kind: Hook, id: judge, version: 1, schemaVersion: "0.1.0", points: [beforeToolCall], results: [annotate], timeoutMs: 5000, source: { kind: model, model: { provider: scripted-judge, name: judge-1 }, instructions: "Classify the call. Answer with a HookResult.", maxTokens: 200 } }
      - { kind: Persona, id: assistant, version: 1, schemaVersion: "0.1.0", displayName: Test assistant, instructions: "You are a test assistant.", tools: [lookup@1, update_record@1], fallbackMessage: "This request was blocked.", defaultProfile: default@1, allowedProfiles: [default@1, streamed@1], requiredHooks: [judge@1], model: { provider: scripted-a, name: model-a, fallbacks: [{ provider: scripted-b, name: model-b }] } }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      responses:
        - parts: [{ type: text, text: "Priced one." }]
          usage: { inputTokens: 20, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
        - parts: [{ type: text, text: "Priced two." }]
          usage: { inputTokens: 20, outputTokens: 2, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b: { responses: [] }
    scripted-sum: { responses: [] }
    scripted-judge: { responses: [] }
