schemaVersion: "0.1.0"
id: providers.request-single-tool-call
title: A model without parallelToolCalls is sent single-tool-call requests; extra tool calls it returns anyway are answered with an error and never dispatched
description: >-
  scripted-a declares `parallelToolCalls: false`; scripted-b keeps the
  default (true). Persona assistant runs on scripted-a/model-a; persona
  parallel on scripted-b/model-b. Both list lookup.

  - $sSingle: every request to model-a permits at most one tool call
    (`singleToolCall: true`, PROV-043). model-a returns two lookup calls
    anyway (c1, c2). Per the PROV-043 reading (amendment 2026-11-02), the
    harness processes the first: c1 is dispatched. c2 is never dispatched
    and gets exactly one `tool.result`, the error `invalid_input`
    (agentry.provider.parallel_not_allowed). Step 2 answers.
  - $sParallel (control): model-b supports parallel tool calls, so its
    request does not set `singleToolCall` (absent or false), and both of
    its calls (p1, p2) are dispatched.

  lookup is therefore called exactly three times, with keys k1, p1 and
  p2, and never with k2.
requirements: [PROV-043]
contract: ">=0.1.0 <1.0.0"
features: []
setup:
  clock: "2026-01-01T00:00:00Z"
  idSeed: 1
  config:
    base: baseline
    artifacts:
      - kind: Persona
        id: assistant
        version: 1
        schemaVersion: "0.1.0"
        displayName: Test assistant
        instructions: "You are a test assistant."
        tools: [lookup@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model: { provider: scripted-a, name: model-a }
      - kind: Persona
        id: parallel
        version: 1
        schemaVersion: "0.1.0"
        displayName: Parallel assistant
        instructions: "You are a test assistant."
        tools: [lookup@1]
        fallbackMessage: "This request was blocked."
        defaultProfile: default@1
        allowedProfiles: [default@1, streamed@1]
        model: { provider: scripted-b, name: model-b }
  tenants:
    - id: t1
      principals: [{ id: p1, subject: user-1, assurance: multi_factor }]
  providers:
    scripted-a:
      capabilities: { parallelToolCalls: false }
      responses:
        # $sSingle, step 1: two calls despite singleToolCall
        - parts:
            - { type: tool_call, callId: c1, tool: lookup, arguments: { key: k1 } }
            - { type: tool_call, callId: c2, tool: lookup, arguments: { key: k2 } }
          usage: { inputTokens: 20, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sSingle, step 2
        - parts: [{ type: text, text: "SYN-SINGLE reply." }]
          usage: { inputTokens: 40, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
    scripted-b:
      responses:
        # $sParallel, step 1
        - parts:
            - { type: tool_call, callId: p1, tool: lookup, arguments: { key: p1 } }
            - { type: tool_call, callId: p2, tool: lookup, arguments: { key: p2 } }
          usage: { inputTokens: 20, outputTokens: 10, cachedInputTokens: 0, reasoningTokens: 0 }
        # $sParallel, step 2
        - parts: [{ type: text, text: "SYN-PARALLEL reply." }]
          usage: { inputTokens: 40, outputTokens: 3, cachedInputTokens: 0, reasoningTokens: 0 }
script:
  - action: run
    bind: $sSingle
    tenant: t1
    principal: p1
    persona: assistant@1
    input: [{ type: text, text: "Look up k1 and k2" }]
    expect: { ok: true, endReason: responded }
  - action: run
    bind: $sParallel
    tenant: t1
    principal: p1
    persona: parallel@1
    input: [{ type: text, text: "Look up p1 and p2" }]
    expect: { ok: true, endReason: responded }
expect:
  sessions:
    $sSingle:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.response, turn: 1, step: 1 }
          - { type: model.request, turn: 1, step: 2 }
          - { type: run.ended, payload: { reason: responded } }
    $sParallel:
      state: idle
      events:
        mode: subsequence
        items:
          - { type: model.response, turn: 1, step: 1 }
          - { type: model.request, turn: 1, step: 2 }
          - { type: run.ended, payload: { reason: responded } }
  ports:
    eventLog:
      t1:
        $sSingle:
          $all:
            - $count: { of: { type: tool.call, payload: { callId: c2 } }, equals: 0 }
            - $count: { of: { type: tool.result, payload: { callId: c2 } }, equals: 1 }
            - $contains:
                - { type: tool.result, payload: { callId: c2, result: { error: { category: invalid_input, code: agentry.provider.parallel_not_allowed } } } }
                - { type: tool.result, payload: { callId: c1, result: { ok: { $any: true } } } }
        $sParallel:
          $all:
            - $count: { of: { type: tool.result, payload: { callId: p1, result: { ok: { $any: true } } } }, equals: 1 }
            - $count: { of: { type: tool.result, payload: { callId: p2, result: { ok: { $any: true } } } }, equals: 1 }
  providerRequests:
    scripted-a:
      - { provider: scripted-a, model: model-a, singleToolCall: true }
      - { provider: scripted-a, model: model-a, singleToolCall: true }
    scripted-b:
      - { provider: scripted-b, model: model-b, singleToolCall: { $not: true } }
      - { provider: scripted-b, model: model-b, singleToolCall: { $not: true } }
  stubCalls:
    lookup:
      - { arguments: { key: k1 } }
      - { arguments: { key: p1 } }
      - { arguments: { key: p2 } }
