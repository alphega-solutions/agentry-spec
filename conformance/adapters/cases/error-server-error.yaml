schemaVersion: "0.1.0"
id: adapter.error-server-error
title: A transient server error maps to unavailable, retryable
description: >-
  The provider returns a transient internal server error. The adapter
  returns the mapped error (PROV-080 row 1). The vendor's own status and
  error code must not appear in `code` or `category`; they may be kept only
  in `details`, subject to redaction (PROV-083, CORE-194). Keeping them
  is optional (PROV-083 is a MAY), so `details` is not asserted.
requirements: [PROV-007, PROV-080, PROV-083, PROV-009]
condition: server_error
request:
  model: model-a
  messages:
    - role: system
      parts:
        - { type: text, text: "You are a records assistant.", provenance: system, labels: [] }
    - role: principal
      parts:
        - { type: text, text: "What is the status of record A-100?", provenance: principal, labels: [] }
expect:
  error: { category: unavailable, retryable: true, code: agentry.provider.unavailable, source: provider }
