schemaVersion: "0.1.0"
id: adapter.error-network-failure
title: A network failure maps to unavailable, retryable
description: >-
  The connection fails before any provider response (reset or timeout at the
  transport). The adapter returns the mapped error (PROV-080 row 1) rather
  than raising a transport exception, and reports no usage, since the
  provider reported none.
requirements: [PROV-007, PROV-080]
condition: network_failure
request:
  model: model-a
  messages:
    - role: system
      parts:
        - { type: text, text: "You are a records assistant.", provenance: system, labels: [] }
    - role: principal
      parts:
        - { type: text, text: "What is the status of record A-100?", provenance: principal, labels: [] }
expect:
  error: { category: unavailable, retryable: true, code: agentry.provider.unavailable, source: provider }
