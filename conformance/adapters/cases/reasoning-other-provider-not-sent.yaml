schemaVersion: "0.1.0"
id: adapter.reasoning-other-provider-not-sent
title: Reasoning produced by another provider is not sent on the wire
description: >-
  The request's history contains a `reasoning` part whose `provider` field
  names another provider (`other-provider`, an ID no adapter under test is
  declared as). The producing provider is identified only by that field. The
  adapter leaves the part out of its provider request
  (`noReasoningFromOtherProviders`): the transcript's matchers confirm that
  neither its data nor any reasoning block derived from it appears, while the
  tool call, tool result and other parts of the same messages are sent. The
  harness also excludes such parts (PROV-055, CTX-060); this case checks the
  adapter's own guard. Reasoning the adapter's own provider produced is
  sent instead (adapter.reasoning-own-provider-sent).
requirements: [PROV-005, PROV-009]
condition: ok_text
request:
  model: model-a
  messages:
    - role: system
      parts:
        - { type: text, text: "You are a records assistant.", provenance: system, labels: [] }
    - role: principal
      parts:
        - { type: text, text: "What is the status of A-100?", provenance: principal, labels: [] }
    - role: assistant
      parts:
        - { type: reasoning, provider: other-provider, data: "OTHER-PROVIDER-REASONING-7f3a: the user wants a status; call lookup.", opaque: false, provenance: model, labels: [] }
        - { type: tool_call, callId: call-1, tool: lookup, arguments: { key: "A-100" }, provenance: model, labels: [] }
    - role: tool
      parts:
        - { type: tool_result, callId: call-1, tool: lookup, result: { ok: { output: { key: "A-100", status: active } } }, provenance: "tool:lookup", labels: [] }
  tools:
    - name: lookup
      description: Look up a record by key.
      input:
        type: object
        additionalProperties: false
        required: [key]
        properties:
          key: { type: string }
expect:
  parts:
    - { type: text, text: { "$regex": "\\S" } }
  wire:
    noReasoningFromOtherProviders: true
