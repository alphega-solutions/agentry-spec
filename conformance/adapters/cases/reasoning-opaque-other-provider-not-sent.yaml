schemaVersion: "0.1.0"
id: adapter.reasoning-opaque-other-provider-not-sent
title: Opaque reasoning from another provider is not sent, even as the only assistant content besides text
description: >-
  An assistant message holds an opaque `reasoning` part from `other-provider`
  followed by model text. The adapter sends the model text and drops the
  reasoning part (`noReasoningFromOtherProviders`); it does not try to pass
  the opaque data through as an encrypted or signed block of its own vendor.
requirements: [PROV-005, PROV-009]
condition: ok_text
request:
  model: model-a
  messages:
    - role: principal
      parts:
        - { type: text, text: "Name a prime number.", provenance: principal, labels: [] }
    - role: assistant
      parts:
        - { type: reasoning, provider: other-provider, data: "b3BhcXVlLXJlYXNvbmluZy1ibG9i", opaque: true, provenance: model, labels: [] }
        - { type: text, text: "7 is a prime number.", provenance: model, labels: [] }
    - role: principal
      parts:
        - { type: text, text: "Name another.", provenance: principal, labels: [] }
expect:
  parts:
    - { type: text, text: { "$regex": "\\S" } }
  wire:
    noReasoningFromOtherProviders: true
