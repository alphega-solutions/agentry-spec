schemaVersion: "0.1.0"
id: adapter.single-tool-call-requested
title: A single-tool-call request permits at most one tool call on the wire
description: >-
  The harness sets `singleToolCall` because the model lacks
  `parallelToolCalls` (PROV-043). The principal asks about two records, which
  a parallel-capable model would answer with two calls. The adapter's
  provider request permits at most one tool call per response
  (`atMostOneToolCall`, e.g. by disabling parallel tool calls), and the
  adapter returns the one call the provider made.
requirements: [PROV-043, PROV-001]
condition: ok_tool_calls
request:
  model: model-a
  messages:
    - role: principal
      parts:
        - { type: text, text: "Look up records A-100 and B-200.", provenance: principal, labels: [] }
  tools:
    - name: lookup
      description: Look up a record by key.
      input:
        type: object
        additionalProperties: false
        required: [key]
        properties:
          key: { type: string }
  singleToolCall: true
expect:
  parts:
    - type: tool_call
      callId: { "$regex": "^.+$" }
      tool: lookup
      arguments: { key: { "$regex": "^(A-100|B-200)$" } }
  wire:
    atMostOneToolCall: true
    noBuiltinToolExecution: true
