schemaVersion: "0.1.0"
id: adapter.tool-call-after-tool-result
title: A follow-up tool call after a tool result is returned, not executed
description: >-
  The request carries a completed `lookup` call and its result; the provider
  answers with a call to `update_record`. The adapter translates the history
  (tool call and matching result) into one provider call and returns the new
  call as a `tool_call` part. It does not execute `update_record` and does not
  loop back to the provider with a result of its own.
requirements: [PROV-001, PROV-009]
condition: ok_tool_calls
request:
  model: model-a
  messages:
    - role: system
      parts:
        - { type: text, text: "You are a records assistant. Use tools to answer.", provenance: system, labels: [] }
    - role: principal
      parts:
        - { type: text, text: "Mark record A-100 as closed.", provenance: principal, labels: [] }
    - role: assistant
      parts:
        - { type: tool_call, callId: call-1, tool: lookup, arguments: { key: "A-100" }, provenance: model, labels: [] }
    - role: tool
      parts:
        - type: tool_result
          callId: call-1
          tool: lookup
          result: { ok: { output: { key: "A-100", status: active } } }
          provenance: "tool:lookup"
          labels: []
  tools:
    - name: lookup
      description: Look up a record by key.
      input:
        type: object
        additionalProperties: false
        required: [key]
        properties:
          key: { type: string }
    - name: update_record
      description: Set the status of a record.
      input:
        type: object
        additionalProperties: false
        required: [key, status]
        properties:
          key: { type: string }
          status: { enum: [active, closed] }
expect:
  parts:
    - type: tool_call
      callId: { "$not": "call-1" }
      tool: update_record
      arguments: { key: "A-100", status: closed }
  wire:
    noBuiltinToolExecution: true
