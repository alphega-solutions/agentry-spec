schemaVersion: "0.1.0"
id: adapter.error-bad-request
title: A request rejected as malformed maps to fatal, not retryable
description: >-
  The provider rejects the request as malformed. The adapter returns the
  mapped error (PROV-080 row 3). The vendor's validation message is original
  provider detail: an adapter may keep it in `details`, redacted (PROV-083),
  but is not required to, and `details` is not asserted.
requirements: [PROV-007, PROV-080, PROV-083, PROV-009]
condition: bad_request
request:
  model: model-a
  messages:
    - role: system
      parts:
        - { type: text, text: "You are a records assistant.", provenance: system, labels: [] }
    - role: principal
      parts:
        - { type: text, text: "What is the status of record A-100?", provenance: principal, labels: [] }
expect:
  error: { category: fatal, retryable: false, code: agentry.provider.bad_request, source: provider }
