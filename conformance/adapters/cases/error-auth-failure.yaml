schemaVersion: "0.1.0"
id: adapter.error-auth-failure
title: An authentication failure maps to unavailable, not retryable
description: >-
  The provider rejects the credentials. The adapter returns the mapped error
  (PROV-080 row 2); not retryable, so the harness fails over instead of
  retrying. Credential material never appears in the error, including
  `details` (CORE-194).
requirements: [PROV-007, PROV-080]
condition: auth_failure
request:
  model: model-a
  messages:
    - role: system
      parts:
        - { type: text, text: "You are a records assistant.", provenance: system, labels: [] }
    - role: principal
      parts:
        - { type: text, text: "What is the status of record A-100?", provenance: principal, labels: [] }
expect:
  error: { category: unavailable, retryable: false, code: agentry.provider.auth, source: provider }
