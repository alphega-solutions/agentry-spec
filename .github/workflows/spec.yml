name: spec

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Validate schemas, examples, fixtures
        run: python tools/validate.py
      - name: Requirement coverage
        run: python tools/coverage.py
      - name: Spec-CI self-tests (EVAL-002, EVAL-010, EVAL-024)
        run: python tools/selftest.py
      - name: Golden trace bundles (EVAL-025, EVAL-026)
        run: python tools/check_golden.py
      - name: Build JSON
        run: python tools/build.py
      - uses: actions/upload-artifact@v6
        with:
          name: agentry-spec-json
          path: dist/

  dco:
    # Every commit in a pull request carries a DCO sign-off by its author (README, "Contributions").
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format='%ae' "$c")
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qiF "<$email>"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no Signed-off-by trailer for its author <$email> (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
